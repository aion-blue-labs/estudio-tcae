etal (decúbito lateral con máxima flexión) o sentado inclinado."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "65", "q": "Tras la punción lumbar, el paciente debe permanecer:", "opts": ["Sentado en el sillón 2 horas", "En decúbito (habitualmente supino sin almohada) el tiempo indicado por protocolo", "Deambulando de inmediato para evitar trombosis", "En posición de Fowler alta"], "correct": 1, "expl": "Tras punción lumbar: decúbito el tiempo protocolizado para evitar cefalea post-punción."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "66", "q": "Una paciente en ayunas para cirugía le pide agua a las 7:00; la intervención es a las 9:00. Usted debe:", "opts": ["Darle solo medio vaso", "Explicarle que no puede ingerir nada y comunicarlo a la enfermera si insiste o refiere malestar", "Darle agua con azúcar por la hipoglucemia", "Darle una infusión caliente, que no cuenta como líquido"], "correct": 1, "expl": "Ayuno prequirúrgico estricto: nada por boca; informar y avisar a enfermería si hay problemas."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "67", "q": "En la preparación prequirúrgica inmediata, ¿cuál de las siguientes tareas corresponde al TCAE?", "opts": ["Administrar la premedicación anestésica intravenosa", "Higiene del paciente, retirada de prótesis, joyas y esmalte de uñas, y colocación de bata quirúrgica", "Firmar el consentimiento informado en nombre del paciente", "Realizar la anamnesis médica preoperatoria"], "correct": 1, "expl": "Corresponde al TCAE la preparación física: higiene, retirada de prótesis/joyas/esmalte, bata. La premedicación IV es de enfermería; el consentimiento, del paciente con el médico."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "68", "q": "Recibe en la unidad a un paciente postoperado somnoliento que comienza a vomitar. Para evitar una broncoaspiración usted debe:", "opts": ["Colocarlo en decúbito supino con almohada", "Lateralizar la cabeza/colocarlo en decúbito lateral y avisar a enfermería", "Sentarlo bruscamente en el borde de la cama", "Darle agua para limpiar la boca"], "correct": 1, "expl": "Vómito en paciente con bajo nivel de conciencia: lateralizar para proteger la vía aérea + avisar."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "69", "q": "A la Sra. Carmen le han prescrito una dieta túrmix (triturada) por disfagia. Durante la comida, la postura correcta es:", "opts": ["Decúbito supino con la cabeza extendida hacia atrás", "Sentada o Fowler alta, con ligera flexión cervical anterior al tragar", "Decúbito lateral izquierdo", "Semisentada con el cuello en hiperextensión"], "correct": 1, "expl": "Disfagia: sedestación/Fowler alta, flexión cervical anterior (barbilla al pecho) al tragar. La hiperextensión favorece el atragantamiento."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "70", "q": "Para espesar los líquidos de la Sra. Carmen utilizará:", "opts": ["Azúcar común", "Espesante comercial hasta la textura prescrita (néctar, miel o pudin)", "Harina de trigo cruda", "No se pueden espesar los líquidos"], "correct": 1, "expl": "Líquidos en disfagia: espesante comercial a la textura pautada."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "71", "q": "Un lactante ingresado debe recibir biberón. Antes de administrarlo, usted comprueba la temperatura de la leche:", "opts": ["Probándola directamente de la tetina", "Vertiendo unas gotas en la cara interna de su muñeca/antebrazo", "Con la palma de la mano sobre el biberón", "No es necesario comprobarla si se calentó en microondas"], "correct": 1, "expl": "Temperatura del biberón: gotas en cara interna de muñeca/antebrazo. El microondas calienta de forma desigual."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "72", "q": "Al aspirar secreciones a un paciente traqueostomizado (colaborando con enfermería), la aspiración no debe superar:", "opts": ["10-15 segundos por episodio", "30-45 segundos por episodio", "1 minuto por episodio", "El tiempo es indiferente"], "correct": 0, "expl": "Aspiración de secreciones: episodios breves, máx. 10-15 segundos."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "73", "q": "Debe recoger un exudado de una herida para cultivo. El material a utilizar es:", "opts": ["Hisopo/torunda estéril con medio de transporte", "Gasa limpia no estéril", "Depresor lingual", "Jeringa sin aguja no estéril"], "correct": 0, "expl": "Cultivo de exudado: torunda/hisopo estéril con medio de transporte."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "74", "q": "Mientras prepara la medicación oral, una compañera le pide que le acerque un fármaco de otro paciente ya fuera de su blíster y sin identificar. Usted debe:", "opts": ["Entregarlo, pues lo pide una compañera", "Negarse: la medicación no identificada debe desecharse según protocolo y volver a prepararse correctamente", "Olerlo para identificarlo", "Administrarlo usted directamente"], "correct": 1, "expl": "Seguridad del medicamento: fármaco no identificado = se desecha. Nunca administrar medicación sin identificar."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "75", "q": "Un paciente en aislamiento de contacto por bacteria multirresistente precisa que le acerquen la cuña. Antes de entrar usted se pondrá:", "opts": ["Solo mascarilla FFP3", "Guantes y bata (según protocolo de contacto)", "Únicamente calzas y gorro", "No se precisa ninguna medida especial"], "correct": 1, "expl": "Aislamiento de contacto: guantes + bata. FFP3 es para aislamiento aéreo."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "76", "q": "Al salir de la habitación del paciente anterior, el orden correcto de retirada del EPI es:", "opts": ["Primero mascarilla, después guantes", "Guantes y bata dentro de la habitación, higiene de manos; la mascarilla (si la hubiera) se retira fuera", "Todo el EPI se retira en el pasillo", "El orden es indiferente si luego se lavan las manos"], "correct": 1, "expl": "EPI de contacto se retira dentro de la habitación + higiene de manos inmediata."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "77", "q": "Se produce un derrame de un citostático en la unidad. La actuación inicial correcta es:", "opts": ["Limpiarlo con la fregona de la unidad", "Aislar/señalizar la zona y actuar según protocolo con el kit específico de derrames", "Diluirlo con abundante agua caliente", "Recogerlo con papel y tirarlo a la bolsa negra"], "correct": 1, "expl": "Derrame de citostáticos: señalizar y usar el kit específico según protocolo; nunca limpieza convencional."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "78", "q": "Mientras retira material de una bandeja sufre un pinchazo accidental con una aguja usada. La primera medida es:", "opts": ["Succionar la herida inmediatamente", "Dejar fluir la sangre, lavar con agua y jabón, antiséptico, y comunicar/declarar el accidente según protocolo", "Aplicar un vendaje compresivo y seguir trabajando", "No hacer nada si la aguja parecía limpia"], "correct": 1, "expl": "Pinchazo accidental: dejar sangrar, agua y jabón, antiséptico, declarar el accidente (protocolo de bioseguridad). No succionar."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "79", "q": "En el turno de noche encuentra a un paciente inconsciente en el suelo del baño, que no respira con normalidad. Tras pedir ayuda/avisar, la actuación inmediata es:", "opts": ["Colocarlo en la cama y esperar al médico", "Iniciar compresiones torácicas (RCP básica) según protocolo", "Darle agua fría en la cara", "Colocarlo en posición lateral de seguridad y marcharse a buscar ayuda"], "correct": 1, "expl": "Inconsciente que no respira normal: pedir ayuda e iniciar RCP básica de inmediato."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "80", "q": "En el carro de parada de su unidad, el TCAE es responsable (junto con enfermería) de:", "opts": ["Prescribir la medicación de urgencia", "Colaborar en la reposición, limpieza y comprobación periódica del material según protocolo", "Realizar la intubación orotraqueal", "Administrar la adrenalina intravenosa"], "correct": 1, "expl": "Carro de parada: el TCAE colabora en revisión, limpieza y reposición periódica según protocolo."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "81", "q": "Un paciente quemado llega a urgencias con quemaduras en todo el miembro superior derecho y la cara anterior del tronco. Según la \"regla de los 9\" de Wallace, la superficie afectada es aproximadamente:", "opts": ["9 %", "18 %", "27 %", "36 %"], "correct": 1, "expl": "Regla de los 9: miembro superior 9 % + cara anterior del tronco 9 % = 18 %."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "82", "q": "Ante un paciente con una crisis convulsiva en curso, usted debe:", "opts": ["Sujetarlo firmemente para detener las convulsiones", "Introducir un objeto entre los dientes", "Retirar objetos peligrosos del entorno, proteger la cabeza y no introducir nada en la boca", "Darle agua en cuanto ceda la crisis"], "correct": 2, "expl": "Convulsión: proteger de lesiones, no sujetar, no introducir objetos en la boca."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "83", "q": "D. Antonio, paciente oncológico terminal, le dice llorando: \"Sé que me voy a morir\". La respuesta más adecuada del TCAE es:", "opts": ["\"No diga tonterías, se pondrá bien\"", "Escucharle, permanecer a su lado y permitir que exprese sus emociones, mostrando disponibilidad", "Cambiar de tema rápidamente", "Avisar a seguridad"], "correct": 1, "expl": "Paciente terminal: escucha activa, presencia, permitir expresión emocional. Ni falsas esperanzas ni evasivas."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "84", "q": "La esposa de D. Antonio, su cuidadora principal, muestra agotamiento físico y emocional. Esto se conoce como:", "opts": ["Síndrome de Diógenes", "Síndrome de sobrecarga del cuidador", "Síndrome confusional agudo", "Síndrome de Münchhausen"], "correct": 1, "expl": "Agotamiento del cuidador principal = síndrome de sobrecarga del cuidador."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "85", "q": "Fallece un paciente en la unidad. Respecto a los cuidados post mortem, señale la opción correcta:", "opts": ["Se realizan sin guantes por respeto al difunto", "Se realiza la higiene del cuerpo, se retiran vías/sondas salvo indicación (p. ej., judicial) y se identifica el cadáver según protocolo", "La identificación del cadáver es opcional", "Se colocan las prótesis dentales siempre después del traslado al mortuorio"], "correct": 1, "expl": "Post mortem: higiene + retirada de dispositivos (salvo causa judicial) + identificación correcta del cadáver."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "86", "q": "Un paciente con alcoholismo crónico en abstinencia comienza con temblor, sudoración, agitación y alucinaciones. Usted sospecha:", "opts": ["Delirium tremens — avisar con urgencia a enfermería/médico", "Simulación para conseguir el alta", "Reacción adversa a la dieta", "Crisis de ansiedad banal que cederá sola"], "correct": 0, "expl": "Abstinencia alcohólica con alucinaciones = sospecha de delirium tremens: urgencia médica."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "87", "q": "Para aplicar una contención mecánica a un paciente agitado se requiere:", "opts": ["Solo la decisión del TCAE del turno", "Prescripción/indicación facultativa, registro y vigilancia periódica según protocolo", "Autorización del servicio de limpieza", "Que el paciente la firme previamente en todos los casos"], "correct": 1, "expl": "Contención mecánica: siempre con indicación facultativa, registro y vigilancia periódica."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "88", "q": "En la unidad de geriatría, la mejor medida para prevenir caídas nocturnas es:", "opts": ["Contención mecánica preventiva de todos los pacientes", "Iluminación adecuada, timbre y objetos al alcance, barandillas según protocolo y calzado antideslizante", "Administrar sedantes a demanda", "Cerrar la puerta de la habitación con llave"], "correct": 1, "expl": "Prevención de caídas: medidas ambientales; nunca contención ni sedación \"preventivas\"."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "89", "q": "A un paciente con fiebre alta se le prescribe la aplicación de frío local. Usted:", "opts": ["Aplica la bolsa de hielo directamente sobre la piel del tórax", "Envuelve la bolsa en un paño y la aplica en las zonas indicadas, vigilando la piel periódicamente", "Sumerge al paciente en agua helada", "Aplica frío y calor alternos cada minuto"], "correct": 1, "expl": "Frío local terapéutico: protegido con paño y con vigilancia periódica de la piel."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "90", "q": "Tiene que hacer la cama quirúrgica (de anestesia) para un paciente que vuelve de quirófano. Su característica principal es:", "opts": ["La ropa superior se dobla en acordeón/paquete hacia un lateral, sin remeter, para facilitar el traslado del paciente", "Lleva doble manta remetida firmemente", "No lleva sábana bajera", "Se hace con el cabecero elevado 90°"], "correct": 0, "expl": "Cama quirúrgica: ropa superior en paquete/acordeón lateral sin remeter para transferir al paciente con rapidez."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "91", "q": "Un paciente portador de sonda vesical debe ser trasladado en silla de ruedas a radiología. La bolsa de diuresis debe ir:", "opts": ["Sobre el regazo del paciente", "Colgada por debajo del nivel de la vejiga, sin tocar el suelo y sin acodaduras", "Colgada del asa superior de la silla, por encima del hombro", "Pinzada y desconectada de la sonda"], "correct": 1, "expl": "Bolsa de diuresis: siempre por debajo de la vejiga, sin tocar el suelo, sin acodaduras y sin desconectar (circuito cerrado)."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "92", "q": "Al realizar la higiene genital de una paciente sondada, el lavado se realiza:", "opts": ["De la zona anal hacia el pubis", "De arriba hacia abajo (del meato hacia el ano), incluyendo la limpieza de la sonda desde el meato hacia distal", "Solo con alcohol de 70°", "Retirando previamente la sonda"], "correct": 1, "expl": "Higiene genital femenina y de la sonda: siempre de limpio a sucio (de meato/pubis hacia el ano; la sonda, desde el meato hacia fuera)."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "93", "q": "En el office de la planta detecta que un envase de dieta enteral abierto lleva más de 24 horas en la nevera sin etiquetar. Usted:", "opts": ["Lo utiliza, pues estaba refrigerado", "Lo desecha según protocolo de seguridad alimentaria", "Lo calienta a 60 °C para eliminar bacterias", "Lo mezcla con un envase nuevo"], "correct": 1, "expl": "Dieta enteral abierta: caduca en 24 h refrigerada (según protocolo, incluso menos a temperatura ambiente): se desecha."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "94", "q": "Una paciente le confía datos íntimos de su historia personal. Posteriormente, un familiar le pregunta a usted por esos datos. Usted debe:", "opts": ["Contárselo, porque es familia directa", "Guardar secreto profesional y derivar la consulta de información clínica al personal facultativo y a los cauces establecidos", "Publicarlo en la sesión de la unidad", "Contarlo solo si el familiar insiste"], "correct": 1, "expl": "Secreto profesional: obliga a todo el personal; la información clínica la facilita el facultativo por los cauces establecidos."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "95", "q": "Al pesar diariamente a un paciente con insuficiencia cardíaca, las condiciones correctas son:", "opts": ["A cualquier hora, vestido y calzado", "Siempre a la misma hora, en la misma báscula, con ropa similar (idealmente en ayunas y tras orinar)", "Después de las comidas para mayor exactitud", "Solo cuando el paciente lo solicite"], "correct": 1, "expl": "Peso diario comparable: misma hora, misma báscula, misma ropa, tras primera micción."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "96", "q": "Un paciente con EPOC portador de gafas nasales le pide que le suba el oxígeno porque \"se ahoga\". Usted:", "opts": ["Sube el flujo al máximo inmediatamente", "No modifica el flujo prescrito y avisa de inmediato a la enfermera valorando el estado del paciente", "Le retira el oxígeno para que descanse", "Le coloca una mascarilla con reservorio por iniciativa propia"], "correct": 1, "expl": "En EPOC no se modifica el flujo de O2 sin prescripción (riesgo de depresión respiratoria): valorar y avisar."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "97", "q": "En la recogida de una muestra de heces para parásitos, el recipiente debe:", "opts": ["Contener alcohol", "Ser limpio/adecuado, evitando mezclar la muestra con orina, y enviarse según protocolo del laboratorio", "Rellenarse hasta el borde", "Mantenerse a 37 °C en estufa"], "correct": 1, "expl": "Heces para parásitos: recipiente adecuado, sin mezclar con orina, envío según protocolo."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "98", "q": "Un compañero le sugiere \"ahorrar tiempo\" usando los mismos guantes para atender a varios pacientes seguidos. Esta práctica:", "opts": ["Es correcta si los guantes no están visiblemente sucios", "Es incorrecta: los guantes se cambian entre pacientes y se realiza higiene de manos; los guantes no sustituyen al lavado", "Es correcta en turnos con mucha carga de trabajo", "Solo es incorrecta en quirófano"], "correct": 1, "expl": "Guantes: se cambian entre pacientes + higiene de manos; nunca sustituyen al lavado."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "99", "q": "Llega a urgencias una mujer con lesiones que refiere haber sufrido violencia por parte de su pareja. Como TCAE, usted debe:", "opts": ["Interrogarla con detalle delante de su pareja", "Garantizar un entorno seguro e íntimo, actitud empática y sin juicios, y comunicar la situación al personal responsable según el protocolo de violencia de género", "Restar importancia para tranquilizarla", "Indicarle que vuelva otro día con cita previa"], "correct": 1, "expl": "Violencia de género: seguridad, intimidad, empatía, no juzgar, activar el protocolo (Ley 11/2007 gallega y LO 1/2004)."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "100", "q": "En un paciente anciano institucionalizado con inmovilidad, la medida más eficaz para prevenir la neumonía por estasis es:", "opts": ["Mantenerlo siempre en decúbito supino estricto", "Movilización precoz, cambios posturales, sedestación e incentivar la fisioterapia respiratoria según indicación", "Administrar antibióticos preventivos", "Restringir la ingesta de líquidos"], "correct": 1, "expl": "Neumonía por estasis: movilización precoz + cambios posturales + sedestación + fisioterapia respiratoria."}, {"sim": "1", "tag": "SIMULACRO 1", "n": "C1", "q": "La Constitución española reconoce el derecho a la protección de la salud en:", "opts": ["El artículo 15", "El artículo 43", "El artículo 14", "El artículo 103"], "correct": 1, "expl": "Art. 43 CE: derecho a la protección de la salud. (El 15 es la vida; el 14, la igualdad.) Tema común 1 — cae siempre"}, {"sim": "1", "tag": "SIMULACRO 1", "n": "C2", "q": "Los derechos fundamentales y libertades públicas de la Constitución española se regulan en:", "opts": ["Título Preliminar", "Título I, Capítulo II, Sección 1ª", "Título II", "Título VIII"], "correct": 1, "expl": "Derechos fundamentales y libertades públicas: Título I, Capítulo II, Sección 1ª (arts. 15-29). Tema común 1"}, {"sim": "1", "tag": "SIMULACRO 1", "n": "C3", "q": "Según el Estatuto de autonomía de Galicia, el poder legislativo de la Comunidad Autónoma corresponde a:", "opts": ["La Xunta de Galicia", "El Parlamento de Galicia", "La Presidencia de la Xunta", "Las diputaciones provinciales"], "correct": 1, "expl": "El Parlamento de Galicia ejerce el poder legislativo; la Xunta, el ejecutivo. Tema común 2"}, {"sim": "1", "tag": "SIMULACRO 1", "n": "C4", "q": "La Ley 14/1986, General de Sanidad, establece como principio general que el acceso y las prestaciones sanitarias:", "opts": ["Se realizarán en condiciones de igualdad efectiva", "Dependerán de la capacidad económica del usuario", "Serán exclusivas de los trabajadores en activo", "Se limitarán a la atención hospitalaria"], "correct": 0, "expl": "LGS art. 3: acceso y prestaciones en condiciones de igualdad efectiva. Tema común 3"}, {"sim": "1", "tag": "SIMULACRO 1", "n": "C5", "q": "La Ley de salud de Galicia es la:", "opts": ["Ley 8/2008, de 10 de julio", "Ley 44/2003, de 21 de noviembre", "Ley 16/2003, de 28 de mayo", "Ley 3/2001, de 28 de mayo"], "correct": 0, "expl": "Ley 8/2008, de 10 de julio, de salud de Galicia. (La 3/2001 es la del consentimiento informado.) Tema común 4 — memoriza el par 8/2008 ↔ 3/2001"}, {"sim": "1", "tag": "SIMULACRO 1", "n": "C6", "q": "Según el Estatuto marco (Ley 55/2003), el personal estatutario se clasifica en:", "opts": ["Funcionario, laboral y eventual", "Estatutario sanitario y estatutario de gestión y servicios", "De carrera e interino exclusivamente", "Directivo y no directivo"], "correct": 1, "expl": "Estatuto marco: personal estatutario sanitario y personal estatutario de gestión y servicios. Tema común 5"}, {"sim": "1", "tag": "SIMULACRO 1", "n": "C7", "q": "Conforme al Estatuto marco, la duración máxima conjunta de los tiempos de trabajo correspondientes a la jornada complementaria y la jornada ordinaria será de:", "opts": ["40 horas semanales de promedio", "48 horas semanales de promedio en cómputo semestral, salvo lo previsto en la norma", "35 horas semanales fijas", "60 horas semanales en cualquier caso"], "correct": 1, "expl": "Estatuto marco (art. 48): máx. 48 h semanales de promedio en cómputo semestral (jornada ordinaria + complementaria), salvo excepciones. Tema común 5"}, {"sim": "1", "tag": "SIMULACRO 1", "n": "C8", "q": "La Ley gallega 3/2001 regula:", "opts": ["El consentimiento informado y la historia clínica de los pacientes", "La prevención de riesgos laborales", "Las retribuciones del personal estatutario", "La ordenación farmacéutica de Galicia"], "correct": 0, "expl": "Ley 3/2001: consentimiento informado e historia clínica en Galicia. Tema común 7"}, {"sim": "1", "tag": "SIMULACRO 1", "n": "C9", "q": "Según la Ley 31/1995 de prevención de riesgos laborales, la vigilancia periódica del estado de salud de los trabajadores en función de los riesgos inherentes al trabajo es:", "opts": ["Una obligación que el empresario debe garantizar, con carácter general voluntaria para el trabajador salvo excepciones legales", "Obligatoria siempre para el trabajador en todos los casos", "Una opción sin regulación legal", "Responsabilidad exclusiva del propio trabajador"], "correct": 0, "expl": "LPRL art. 22: el empresario garantiza la vigilancia de la salud; para el trabajador es voluntaria salvo excepciones (riesgo para sí o terceros, disposición legal). Tema común 8"}, {"sim": "1", "tag": "SIMULACRO 1", "n": "C10", "q": "La Ley orgánica 1/2004 tiene por objeto actuar contra la violencia que se ejerce sobre las mujeres:", "opts": ["Únicamente en el ámbito laboral", "Por parte de quienes sean o hayan sido sus cónyuges o estén o hayan estado ligados a ellas por relaciones similares de afectividad, aun sin convivencia", "Solo si existe convivencia acreditada", "Exclusivamente en el ámbito digital"], "correct": 1, "expl": "LO 1/2004, art. 1: violencia por parte de cónyuges/excónyuges o relaciones análogas de afectividad, aun sin convivencia. Tema común 8"}, {"sim": "2", "tag": "SIMULACRO 2", "n": "1", "q": "Respecto a las dimensiones de la calidad asistencial, señale la afirmación INCORRECTA:", "opts": ["La accesibilidad se refiere a la facilidad con que el usuario obtiene la asistencia", "La efectividad es el resultado de una intervención en condiciones ideales o experimentales", "La eficiencia relaciona los resultados obtenidos con los recursos empleados", "La equidad implica prestar atención según la necesidad, sin discriminación"], "correct": 1, "expl": "Lo descrito es la eficacia (condiciones ideales). La efectividad es el resultado en condiciones reales/habituales. Ese cambio de palabra es la trampa clásica."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "2", "q": "Según la Ley 41/2002, básica reguladora de la autonomía del paciente, el consentimiento informado se prestará por escrito en todos los casos siguientes, EXCEPTO:", "opts": ["Intervención quirúrgica", "Procedimientos diagnósticos invasores", "Procedimientos que suponen riesgos o inconvenientes de notoria repercusión negativa", "Administración de la medicación oral habitual pautada"], "correct": 3, "expl": "Ley 41/2002 art. 8: el consentimiento es verbal por regla general; por escrito en cirugía, procedimientos invasores y los de riesgo notorio. La medicación oral pautada no requiere CI escrito."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "3", "q": "En una gasometría arterial, un pH de 7,30 con pCO₂ elevada indica:", "opts": ["Alcalosis respiratoria", "Acidosis respiratoria", "Acidosis metabólica", "Alcalosis metabólica"], "correct": 1, "expl": "pH bajo (<7,35) + pCO₂ alta = acidosis respiratoria (el CO₂ es ácido y está retenido)."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "4", "q": "La conservación de una vacuna que ha sufrido congelación accidental implica que:", "opts": ["Puede utilizarse si se descongela lentamente", "Debe desecharse, especialmente las vacunas adsorbidas, pues pierden eficacia", "Solo se inutiliza si supera las 24 h congelada", "Se puede usar en dosis dobles para compensar"], "correct": 1, "expl": "La congelación inutiliza las vacunas, sobre todo las adsorbidas (p. ej. con aluminio): se desechan. La congelación daña más que el calor moderado."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "5", "q": "Señale la respuesta CORRECTA sobre la posición de Sims:", "opts": ["Es un decúbito supino con las piernas elevadas", "Es un decúbito lateral izquierdo semiprono, con el brazo inferior atrás y la pierna superior flexionada", "Es la posición de rodillas y pecho", "Es un decúbito prono con la cabeza ladeada"], "correct": 1, "expl": "Sims = lateral izquierdo semiprono, brazo inferior hacia atrás, pierna superior flexionada. Se usa para enemas y exploración/administración rectal."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "6", "q": "En un paciente con presión arterial de 138/88 mmHg, según la clasificación habitual, hablamos de:", "opts": ["Presión arterial óptima", "Presión arterial normal-alta", "Hipertensión grado 2", "Hipertensión grado 3"], "correct": 1, "expl": "138/88 = normal-alta (PAS 130-139 o PAD 85-89). No llega a HTA grado 1 (≥140/90)."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "7", "q": "La escala de Glasgow valora el nivel de conciencia. Su puntuación oscila entre:", "opts": ["0 y 10", "3 y 15", "1 y 12", "5 y 20"], "correct": 1, "expl": "Glasgow: 3 (mínimo) a 15 (máximo). Un 3 es coma profundo."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "8", "q": "Sobre la esterilización por autoclave, señale la INCORRECTA:", "opts": ["Un ciclo habitual es 121 °C durante 15-20 minutos a 1 atmósfera", "Es un método de esterilización por calor húmedo", "El control biológico emplea esporas de Geobacillus stearothermophilus", "Es el método de elección para material termosensible como plásticos y ópticas"], "correct": 3, "expl": "El autoclave es para material termorresistente. El termosensible (plásticos, ópticas) se esteriliza en frío (óxido de etileno, gas plasma)."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "9", "q": "Los residuos citotóxicos y citostáticos se clasifican, en la gestión de residuos sanitarios, como:", "opts": ["Grupo I", "Grupo II", "Grupo III", "Grupo IV"], "correct": 3, "expl": "Citostáticos/citotóxicos = Grupo IV (residuos de tratamientos, con normativa específica). Grupo III = biosanitarios especiales."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "10", "q": "En una úlcera por presión de categoría II, encontramos:", "opts": ["Eritema no blanqueante con piel íntegra", "Pérdida parcial del espesor de la dermis: flictena o úlcera superficial (lecho rojo-rosado)", "Pérdida total del espesor cutáneo con tejido subcutáneo visible", "Exposición de hueso o músculo"], "correct": 1, "expl": "Categoría II = pérdida parcial de la dermis: flictena o úlcera superficial, lecho rojo-rosado. (I = eritema; III = tejido subcutáneo; IV = hueso/músculo.)"}, {"sim": "2", "tag": "SIMULACRO 2", "n": "11", "q": "Señale la afirmación FALSA sobre el lavado de manos:", "opts": ["La fricción con solución hidroalcohólica es de elección si las manos no están visiblemente sucias", "El lavado quirúrgico incluye antebrazos y dura más que el higiénico", "La solución hidroalcohólica es eficaz frente a esporas de Clostridioides difficile", "Tras contacto con fluidos corporales debe realizarse higiene de manos"], "correct": 2, "expl": "El hidroalcohólico NO elimina esporas (C. difficile): en esos casos hay que lavar con agua y jabón. Las demás son verdaderas."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "12", "q": "Según el Estatuto Marco (Ley 55/2003), un permiso por asuntos particulares NO tiene la consideración de:", "opts": ["Un derecho retribuido en los términos que fije la normativa de desarrollo", "Una situación que exima del cómputo de la jornada anual", "Un permiso concedido por la dirección conforme a las necesidades del servicio", "Un permiso regulado por la normativa autonómica de aplicación"], "correct": 1, "expl": "Los asuntos particulares son un permiso regulado y retribuido según normativa, pero NO eximen del cómputo de la jornada anual de forma automática: se disfrutan dentro de las necesidades del servicio."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "13", "q": "La cadena epidemiológica de la infección nosocomial consta de: agente causal, reservorio, puerta de salida, mecanismo de transmisión, puerta de entrada y:", "opts": ["Período de incubación", "Huésped susceptible", "Vector mecánico", "Portador asintomático"], "correct": 1, "expl": "El último eslabón es el huésped susceptible. Romper cualquier eslabón corta la transmisión."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "14", "q": "En la administración de oxígeno con mascarilla tipo Venturi, la ventaja principal es que:", "opts": ["Aporta siempre el 100 % de FiO₂", "Permite administrar una concentración (FiO₂) conocida y constante", "No precisa humidificación en ningún caso", "Sustituye a la ventilación mecánica"], "correct": 1, "expl": "La Venturi aporta FiO₂ conocida y constante (ideal en EPOC, donde interesa controlar el O₂). No da el 100 %."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "15", "q": "Un paciente con sonda vesical presenta orina turbia, con sedimento y olor fétido. Lo prioritario es:", "opts": ["Pinzar la sonda hasta valorar", "Registrar las características, comunicar a enfermería y valorar recogida de urocultivo por técnica adecuada", "Retirar la sonda de inmediato", "Aumentar la ingesta de líquidos sin más"], "correct": 1, "expl": "Registrar, comunicar a enfermería y valorar urocultivo con técnica correcta. Nunca retirar la sonda por iniciativa propia."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "16", "q": "Señale la CORRECTA sobre la vía intramuscular (colaboración del TCAE en su preparación):", "opts": ["La zona ventroglútea es una localización segura por alejarse del nervio ciático", "El deltoides admite grandes volúmenes (>5 ml)", "La absorción intramuscular es más lenta que la subcutánea", "Nunca debe aspirarse antes de inyectar en ningún músculo"], "correct": 0, "expl": "La ventroglútea es segura por alejarse del ciático. El deltoides admite poco volumen; la IM es más rápida que la SC; aspirar depende del punto."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "17", "q": "En un balance hídrico, se contabilizan como pérdidas insensibles:", "opts": ["La diuresis y las deposiciones", "La perspiración cutánea y la respiración", "Los drenajes y los vómitos", "La sudoración profusa medible"], "correct": 1, "expl": "Pérdidas insensibles = perspiración cutánea + respiración (no se miden directamente). Diuresis, drenajes, vómitos son sensibles (medibles)."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "18", "q": "Respecto al aislamiento, señale la correspondencia INCORRECTA:", "opts": ["Tuberculosis pulmonar bacilífera → aislamiento aéreo", "Gripe / COVID por gotas → aislamiento por gotas", "SARM (S. aureus resistente a meticilina) → aislamiento de contacto", "Paciente neutropénico → aislamiento por gotas"], "correct": 3, "expl": "El neutropénico necesita aislamiento protector/inverso, no por gotas: se le protege a él del entorno."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "19", "q": "Señale la afirmación CORRECTA sobre el pulso arterial normal del adulto:", "opts": ["Se considera bradicardia por debajo de 60 lpm", "El pulso paradójico es un aumento de la frecuencia con la inspiración", "La taquicardia se define a partir de 80 lpm", "El pulso se mide siempre durante 15 segundos exactos"], "correct": 0, "expl": "Bradicardia <60 lpm; taquicardia >100 lpm. El pulso paradójico es un descenso (no aumento) de la TA/pulso en inspiración. La medición idealmente 1 minuto si es irregular."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "20", "q": "En la Ley 31/1995 de prevención de riesgos laborales, los equipos de protección individual (EPI):", "opts": ["Son la primera medida preventiva a adoptar frente a un riesgo", "Se emplean cuando los riesgos no se pueden evitar o limitar suficientemente por medios técnicos o de organización", "Deben ser aportados por el propio trabajador", "Solo son obligatorios en quirófano"], "correct": 1, "expl": "LPRL: el EPI es la última barrera, cuando no se puede evitar/limitar el riesgo por medios técnicos u organizativos, y lo aporta el empresario."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "21", "q": "D. Andrés, 70 años, EPOC, ingresa con disnea. Enfermería pauta O₂. Como TCAE observa que un familiar ha subido el caudalímetro a 6 L/min con gafas nasales y el paciente está cada vez más somnoliento. Su actuación:", "opts": ["Dejarlo, ya que más oxígeno siempre es mejor", "Bajar al flujo prescrito y avisar de inmediato a enfermería por riesgo de narcosis por CO₂", "Retirar el oxígeno por completo", "Cambiar a mascarilla con reservorio por su cuenta"], "correct": 1, "expl": "En EPOC, exceso de O₂ puede provocar narcosis por CO₂ (deprime el estímulo respiratorio). Bajar al flujo pautado y avisar. La somnolencia es señal de alarma."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "22", "q": "Prepara el material para una cura estéril. Al abrir el paquete de gasas estériles, la esquina interna roza el borde exterior no estéril del envoltorio. Usted:", "opts": ["Usa las gasas, el roce es mínimo", "Considera todo el campo contaminado y descarta las gasas", "Recorta la esquina afectada", "Rocía las gasas con antiséptico y las usa"], "correct": 1, "expl": "En técnica estéril, si una parte del campo toca lo no estéril, TODO se considera contaminado. Se descarta."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "23", "q": "Dña. Elena, encamada, con sonda nasogástrica para alimentación. Antes de la toma, al aspirar comprueba un residuo gástrico de 350 ml. Lo correcto es:", "opts": ["Administrar la toma completa igualmente", "No administrar y comunicar a enfermería el residuo elevado (riesgo de intolerancia/broncoaspiración)", "Duplicar la toma para compensar", "Retirar la sonda"], "correct": 1, "expl": "Residuo gástrico elevado (típicamente >200-250 ml según protocolo) = riesgo de intolerancia/broncoaspiración: no administrar y avisar."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "24", "q": "Un paciente en decúbito supino con sujeción mecánica prescrita. Respecto a la vigilancia, señale la INCORRECTA:", "opts": ["Se revisa periódicamente el estado de la piel y la circulación de las zonas sujetas", "Se realizan cambios posturales y se atienden necesidades básicas", "Una vez colocada, no requiere reevaluación hasta el alta", "Debe existir prescripción facultativa y registro"], "correct": 2, "expl": "La sujeción se reevalúa periódicamente (piel, circulación, necesidad de mantenerla), nunca \"hasta el alta sin revisar\"."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "25", "q": "Recoge una muestra de esputo para baciloscopia (sospecha de TBC). Señale la CORRECTA:", "opts": ["Basta con saliva recogida en cualquier momento", "Debe ser esputo (no saliva), preferentemente matutino, con EPI adecuado por el riesgo de transmisión aérea", "Se recoge tras las comidas para mayor volumen", "No precisa medidas de protección respiratoria"], "correct": 1, "expl": "Esputo (no saliva), matutino, con protección respiratoria (FFP2/FFP3) por riesgo de TBC."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "26", "q": "Dña. Marta, diabética insulinodependiente, está inconsciente y no responde. El glucómetro marca 38 mg/dl. Estando inconsciente, la actuación del TCAE es:", "opts": ["Darle zumo azucarado por la boca", "NO administrar nada por vía oral (riesgo de broncoaspiración) y avisar urgentemente a enfermería/médico", "Administrar insulina rápida", "Colocarla sentada y esperar"], "correct": 1, "expl": "Paciente INCONSCIENTE: nada por boca (broncoaspiración). Avisar urgente: la enfermera/médico administrará glucosa IV o glucagón."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "27", "q": "Paciente con aislamiento de contacto por Clostridioides difficile. Respecto a la higiene de manos, señale la CORRECTA:", "opts": ["Es suficiente la solución hidroalcohólica", "Debe realizarse lavado con agua y jabón, porque el alcohol no elimina las esporas", "No es necesaria si se usan guantes", "Solo al salir de la habitación"], "correct": 1, "expl": "C. difficile forma esporas: obligatorio agua y jabón; el alcohol no basta."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "28", "q": "Al hacer la cama ocupada de un paciente encamado con vía periférica y sonda vesical, señale la INCORRECTA:", "opts": ["Se moviliza al paciente en decúbito lateral protegiendo la vía y la sonda", "La bolsa de diuresis se mantiene por debajo de la vejiga durante toda la maniobra", "Se aprovecha para pinzar la vía y la sonda \"para mayor comodidad\"", "Se realiza preferiblemente entre dos personas"], "correct": 2, "expl": "No se debe pinzar la vía ni la sonda \"por comodidad\": pinzar la sonda vesical favorece infección/reflujo y pinzar la vía puede obstruirla."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "29", "q": "Un paciente sufre una caída presenciada, refiere dolor intenso en cadera y la pierna aparece acortada y en rotación externa. Antes de que llegue enfermería/médico, usted:", "opts": ["Lo levanta y lo sienta en el sillón", "No lo moviliza, lo mantiene cómodo y quieto, y avisa de inmediato (sospecha de fractura de cadera)", "Le realiza flexo-extensiones de la pierna para valorar", "Le aplica calor local en la cadera"], "correct": 1, "expl": "Cadera acortada + rotación externa + dolor = fractura de cadera probable: NO movilizar, mantener cómodo y avisar."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "30", "q": "En la toma de temperatura, señale la CORRECTA sobre la vía rectal:", "opts": ["Registra valores aproximadamente 0,5 °C inferiores a la axilar", "Registra valores aproximadamente 0,5 °C superiores a la axilar", "Está indicada de rutina en pacientes con diarrea o cirugía rectal", "Es equivalente a la timpánica sin diferencias"], "correct": 1, "expl": "La temperatura rectal es ~0,5 °C superior a la axilar; la axilar es la más baja. La rectal está contraindicada en cirugía/patología rectal y diarrea."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "31", "q": "Traslada en cama a un paciente con drenaje torácico (sello de agua tipo Pleur-evac). Señale la INCORRECTA:", "opts": ["El sistema se mantiene por debajo del nivel del tórax", "Se evita que el sistema se vuelque o se acode", "Se pinza sistemáticamente el drenaje durante todo el traslado \"por seguridad\"", "Se vigila que la cámara de sello de agua no se rompa"], "correct": 2, "expl": "El drenaje torácico NO se pinza de rutina en el traslado (riesgo de neumotórax a tensión): se mantiene bajo el tórax, sin acodar."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "32", "q": "En la higiene bucal de un paciente inconsciente, para prevenir broncoaspiración usted:", "opts": ["Lo coloca en decúbito supino con la cabeza recta y le echa abundante agua", "Lo coloca en decúbito lateral (o con la cabeza ladeada), usa poca cantidad de líquido y aspira secreciones si es preciso", "Le pide que haga gárgaras", "Lo sienta en el borde de la cama"], "correct": 1, "expl": "Inconsciente: decúbito lateral/cabeza ladeada, poca agua, aspirar si precisa. Nunca supino con la cabeza recta y mucho líquido."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "33", "q": "Un paciente con nutrición parenteral total por vía central. Como TCAE, señale la actuación CORRECTA:", "opts": ["Puede manipular la conexión de la vía central para \"purgar\"", "Extrema la asepsia en el entorno y avisa a enfermería ante enrojecimiento, fiebre o desconexión (riesgo de sepsis)", "Administra la bolsa a temperatura de nevera directamente", "Añade medicación a la bolsa si se lo pide el paciente"], "correct": 1, "expl": "Nutrición parenteral por vía central: máxima asepsia, no manipular conexiones (competencia de enfermería) y avisar ante signos de infección (riesgo de sepsis por catéter)."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "34", "q": "En un carro de curas, encuentra un bote de suero fisiológico abierto sin fecha de apertura anotada. Lo correcto es:", "opts": ["Usarlo, el suero no caduca una vez abierto", "Desecharlo, pues no puede garantizarse su esterilidad/validez tras la apertura sin registro", "Rellenarlo con suero nuevo", "Hervirlo para reesterilizarlo"], "correct": 1, "expl": "Envase abierto sin fecha = no se garantiza esterilidad/validez: se desecha (seguridad del paciente)."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "35", "q": "Dña. Rosa, con demencia avanzada y disfagia, rechaza la comida y tose con los líquidos. Señale la actuación MÁS adecuada:", "opts": ["Darle líquidos abundantes para hidratarla rápido", "Adaptar texturas (espesantes, sólidos de fácil masticación), postura correcta y comunicar la disfagia al equipo", "Forzar la ingesta con jeringa", "Dejarla en ayunas hasta el día siguiente"], "correct": 1, "expl": "Disfagia: adaptar texturas y espesar líquidos, postura correcta y comunicar al equipo. Ni forzar ni dejar en ayunas ni dar líquidos claros abundantes."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "C1", "q": "Según la Constitución española, el derecho a la protección de la salud (art. 43) se encuadra dentro de:", "opts": ["Los derechos fundamentales y libertades públicas (Sección 1ª, Cap. II, Tít. I)", "Los principios rectores de la política social y económica (Cap. III, Tít. I)", "Los derechos de los ciudadanos (Sección 2ª, Cap. II)", "El Título Preliminar"], "correct": 1, "expl": "El art. 43 (protección de la salud) está entre los principios rectores (Cap. III, Tít. I), NO entre los derechos fundamentales. Trampa muy habitual: no tiene la misma protección jurídica que un derecho fundamental."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "C2", "q": "La reforma del Estatuto de autonomía de Galicia, conforme a su propio texto, requiere:", "opts": ["Mayoría simple del Parlamento de Galicia", "Aprobación del Parlamento de Galicia por mayoría de dos tercios y de las Cortes Generales mediante ley orgánica", "Únicamente un decreto de la Xunta", "Referéndum estatal obligatorio en todo caso"], "correct": 1, "expl": "Reforma del Estatuto gallego: mayoría de 2/3 del Parlamento de Galicia + Cortes Generales por ley orgánica."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "C3", "q": "Señale la INCORRECTA respecto al Estatuto Marco (Ley 55/2003):", "opts": ["Clasifica al personal estatutario en sanitario y de gestión y servicios", "Regula el régimen disciplinario del personal estatutario", "Establece que las faltas muy graves prescriben a los seis meses", "Regula las situaciones del personal estatutario (servicio activo, excedencias, etc.)"], "correct": 2, "expl": "En el Estatuto Marco, las faltas muy graves prescriben a los 4 años (no 6 meses; las leves a los 6 meses). Ojo a los plazos de prescripción."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "C4", "q": "La Ley Orgánica 3/2018 de protección de datos y garantía de los derechos digitales establece que los datos de salud son:", "opts": ["Datos de libre circulación", "Una categoría especial de datos con protección reforzada", "Datos que no requieren base de legitimación", "Datos accesibles a cualquier profesional del centro"], "correct": 1, "expl": "LOPDGDD 3/2018 / RGPD: los datos de salud son categoría especial con protección reforzada."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "C5", "q": "Según la Ley 11/2007 gallega para la prevención y el tratamiento integral de la violencia de género, señale la CORRECTA:", "opts": ["Solo contempla la violencia física", "Incluye, entre otras, la violencia física, psicológica, económica y sexual", "Se aplica únicamente si hay denuncia previa", "Excluye el acoso en el ámbito laboral"], "correct": 1, "expl": "La Ley 11/2007 gallega abarca violencia física, psicológica, económica y sexual, entre otras formas."}, {"sim": "2", "tag": "SIMULACRO 2", "n": "C6", "q": "Conforme a la Ley 41/2002, el titular del derecho a la información asistencial es:", "opts": ["Siempre la familia del paciente", "El paciente, y serán informadas las personas vinculadas a él en la medida que el paciente lo permita", "Exclusivamente el médico responsable", "La dirección del centro"], "correct": 1, "expl": "Ley 41/2002: el titular de la información es el paciente; los vinculados se informan en la medida que él lo permita expresa o tácitamente."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "1", "q": "La eliminación de TODA forma de vida microbiana, incluidas las esporas, se denomina:", "opts": ["Desinfección", "Esterilización", "Antisepsia", "Asepsia"], "correct": 1, "expl": "Esterilización = destruye TODA vida, incluidas esporas. Desinfección no garantiza esporas."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "2", "q": "Señale la CORRECTA sobre asepsia y antisepsia:", "opts": ["Antisepsia es evitar la llegada de microorganismos a una zona", "Asepsia se aplica sobre tejidos vivos", "Antisepsia destruye/inhibe microorganismos en tejidos vivos; asepsia previene su llegada", "Son sinónimos"], "correct": 2, "expl": "Antisepsia = sobre tejidos vivos (destruye/inhibe). Asepsia = prevención de la llegada de gérmenes. La trampa clásica."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "3", "q": "El método de esterilización por calor húmedo bajo presión es:", "opts": ["Estufa Poupinel (calor seco)", "Autoclave", "Óxido de etileno", "Radiación gamma"], "correct": 1, "expl": "Autoclave = calor húmedo a presión. Poupinel = calor seco."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "4", "q": "Un ciclo estándar de autoclave es aproximadamente:", "opts": ["100 °C durante 5 minutos", "121 °C durante 15-20 min a 1 atmósfera", "180 °C durante 60 min", "60 °C durante 30 min"], "correct": 1, "expl": "121 °C / 15-20 min / 1 atm (o 134 °C ciclo rápido)."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "5", "q": "Para esterilizar material termosensible (plásticos, ópticas, endoscopios) se usa:", "opts": ["Autoclave a 134 °C", "Estufa de calor seco", "Óxido de etileno o gas plasma", "Ebullición"], "correct": 2, "expl": "Termosensible → óxido de etileno o gas plasma (esterilización en frío)."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "6", "q": "El control MÁS fiable de que la esterilización ha sido eficaz es:", "opts": ["El control físico (temperatura/presión del aparato)", "El control químico (viraje de color de la cinta)", "El control biológico (esporas de Geobacillus stearothermophilus)", "La fecha de caducidad del envase"], "correct": 2, "expl": "Control biológico (esporas) = el más fiable. Físico y químico son indirectos."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "7", "q": "La cinta adhesiva que cambia de color al someterse al ciclo es un control:", "opts": ["Biológico", "Químico", "Físico", "Microbiológico"], "correct": 1, "expl": "Cinta que vira color = control químico."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "8", "q": "Señale la INCORRECTA sobre el material estéril:", "opts": ["Se comprueba la integridad del envase y la fecha de caducidad antes de usarlo", "Un envase húmedo o perforado se considera igualmente estéril", "Se manipula con técnica estéril", "Se almacena en lugar seco, limpio y protegido"], "correct": 1, "expl": "Un envase húmedo o perforado se considera CONTAMINADO, nunca estéril."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "9", "q": "En el aislamiento de contacto (p. ej. SARM, C. difficile) el EPI básico es:", "opts": ["Mascarilla FFP3 y gafas", "Bata y guantes", "Solo calzas", "No precisa EPI"], "correct": 1, "expl": "Contacto = bata + guantes."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "10", "q": "En el aislamiento aéreo (tuberculosis, sarampión) el personal usa:", "opts": ["Mascarilla quirúrgica", "Mascarilla de alta eficacia FFP2/FFP3", "Pantalla facial únicamente", "Ninguna protección respiratoria"], "correct": 1, "expl": "Aéreo = FFP2/FFP3."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "11", "q": "El aislamiento protector o inverso está indicado en:", "opts": ["Paciente con gripe", "Paciente inmunodeprimido (neutropénico, trasplantado)", "Paciente con gastroenteritis", "Paciente con tuberculosis"], "correct": 1, "expl": "Protector/inverso = inmunodeprimidos (se protege al paciente)."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "12", "q": "Para la higiene de manos frente a Clostridioides difficile hay que usar:", "opts": ["Solución hidroalcohólica, es suficiente", "Agua y jabón, porque el alcohol NO elimina las esporas", "Solo guantes", "Toallitas secas"], "correct": 1, "expl": "C. difficile forma esporas → agua y jabón obligatorio (el alcohol no vale). Tu fallo del Simulacro 2 — ya grabado."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "13", "q": "La cadena epidemiológica de la infección termina en:", "opts": ["El agente causal", "El reservorio", "El huésped susceptible", "La puerta de salida"], "correct": 2, "expl": "Último eslabón = huésped susceptible."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "14", "q": "Los \"5 momentos de la higiene de manos\" de la OMS incluyen todos EXCEPTO:", "opts": ["Antes del contacto con el paciente", "Antes de una técnica aséptica", "Al llegar al vestuario del personal", "Después del contacto con el entorno del paciente"], "correct": 2, "expl": "Los 5 momentos son sobre el paciente, no incluyen \"llegar al vestuario\"."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "15", "q": "Una infección que aparece 48-72 h tras el ingreso, no presente ni en incubación al llegar, es:", "opts": ["Comunitaria", "Nosocomial (relacionada con la asistencia)", "Endógena primaria", "Oportunista externa"], "correct": 1, "expl": "Aparición 48-72 h tras ingreso = nosocomial."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "16", "q": "La relación compresiones/ventilaciones en RCP básica del adulto es:", "opts": ["15:2", "30:2", "5:1", "50:2"], "correct": 1, "expl": "RCP adulto = 30:2."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "17", "q": "La frecuencia de compresiones torácicas en RCP de calidad es:", "opts": ["60-80 por minuto", "100-120 por minuto", "140-160 por minuto", "40-60 por minuto"], "correct": 1, "expl": "Compresiones 100-120/min."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "18", "q": "Según la \"regla de los 9\" de Wallace, un miembro superior completo en el adulto representa:", "opts": ["4,5 %", "9 %", "18 %", "1 %"], "correct": 1, "expl": "Regla de los 9: miembro superior = 9 %."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "19", "q": "Ante una hemorragia externa en una extremidad, la PRIMERA medida es:", "opts": ["Torniquete inmediato", "Presión directa sobre la herida", "Aplicar frío", "Elevar y esperar"], "correct": 1, "expl": "Hemorragia: presión directa primero; torniquete es último recurso."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "20", "q": "Ante una crisis convulsiva en curso, el TCAE debe:", "opts": ["Sujetar fuertemente al paciente", "Introducir un objeto en la boca", "Proteger la cabeza, retirar objetos peligrosos y NO meter nada en la boca", "Darle agua"], "correct": 2, "expl": "Convulsión: proteger, no sujetar, nada en la boca."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "21", "q": "La posición lateral de seguridad está indicada en:", "opts": ["Paciente inconsciente que respira con normalidad", "Paciente en parada cardiorrespiratoria", "Sospecha de fractura de columna", "Paciente con disnea que prefiere sentarse"], "correct": 0, "expl": "Posición lateral de seguridad = inconsciente que respira normal. En PCR se inicia RCP."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "22", "q": "El carro de parada: respecto al TCAE, señale la CORRECTA:", "opts": ["Administra la medicación de urgencia", "Colabora en su revisión, reposición y comprobación periódica", "Decide las dosis", "Realiza la desfibrilación"], "correct": 1, "expl": "El TCAE colabora en revisión/reposición del carro; no prescribe ni desfibrila."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "23", "q": "La aspiración de secreciones no debe superar, por episodio:", "opts": ["10-15 segundos", "1 minuto", "2 minutos", "El tiempo es indiferente"], "correct": 0, "expl": "Aspiración ≤ 10-15 s por episodio."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "24", "q": "Un drenaje de Redón es:", "opts": ["Pasivo por gravedad", "Activo por aspiración (vacío)", "Pasivo por capilaridad", "De irrigación"], "correct": 1, "expl": "Redón = activo aspirativo (vacío)."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "25", "q": "Un drenaje de Penrose es:", "opts": ["Activo aspirativo", "Pasivo (gravedad/capilaridad)", "Con sello de agua", "De doble luz"], "correct": 1, "expl": "Penrose = pasivo (gravedad/capilaridad)."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "26", "q": "Un paciente porta drenaje torácico (sello de agua). Durante el traslado NO se debe:", "opts": ["Mantener el sistema por debajo del tórax", "Pinzarlo de rutina (riesgo de neumotórax a tensión)", "Evitar acodaduras", "Vigilar que la cámara no se rompa"], "correct": 1, "expl": "El drenaje torácico NO se pinza de rutina (riesgo neumotórax a tensión)."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "27", "q": "La escala de Glasgow puntúa entre:", "opts": ["0 y 10", "3 y 15", "1 y 12", "5 y 20"], "correct": 1, "expl": "Glasgow 3-15. Tu fallo del Simulacro 2 — ya grabado."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "28", "q": "La toma de temperatura rectal, respecto a la axilar:", "opts": ["Es ~0,5 °C inferior", "Es ~0,5 °C superior", "Es idéntica", "No es fiable nunca"], "correct": 1, "expl": "Rectal ~0,5 °C superior a axilar (la axilar es la más baja)."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "29", "q": "Ante un derrame de citostáticos, la actuación correcta es:", "opts": ["Limpiar con la fregona común", "Señalizar/aislar la zona y usar el kit específico de derrames según protocolo", "Diluir con agua caliente", "Recogerlo con papel a la bolsa negra"], "correct": 1, "expl": "Derrame citostáticos: señalizar + kit específico."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "30", "q": "Tras un pinchazo accidental con aguja usada, la primera medida es:", "opts": ["Succionar la herida", "Dejar sangrar, lavar con agua y jabón, antiséptico y declarar el accidente", "Vendar y seguir trabajando", "No hacer nada si la aguja parecía limpia"], "correct": 1, "expl": "Pinchazo: dejar sangrar, lavar, antiséptico, declarar. No succionar."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "31", "q": "El material punzante/cortante usado se elimina en:", "opts": ["Bolsa negra de residuos urbanos", "Contenedor rígido, imperforable y hermético (biocontenedor)", "Bolsa verde", "Cualquier caja de cartón"], "correct": 1, "expl": "Punzantes → biocontenedor rígido, imperforable, hermético."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "32", "q": "Los residuos citotóxicos/citostáticos pertenecen al grupo:", "opts": ["Grupo I (asimilables a urbanos)", "Grupo II (biosanitarios no específicos)", "Grupo III (biosanitarios especiales)", "Grupo IV (citotóxicos)"], "correct": 3, "expl": "Citostáticos = Grupo IV."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "33", "q": "La orina para urocultivo se recoge:", "opts": ["Primera parte de la micción, frasco no estéril", "Chorro medio, técnica estéril, previa higiene genital", "Toda la micción de 24 horas", "Siempre por sondaje"], "correct": 1, "expl": "Urocultivo = chorro medio, estéril, higiene previa."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "34", "q": "Una muestra de sangre para gasometría arterial se transporta:", "opts": ["A temperatura ambiente, sin prisa", "Lo antes posible y en frío", "En estufa a 37 °C", "Congelada"], "correct": 1, "expl": "Gasometría → transporte inmediato y en frío."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "35", "q": "La orina de 24 horas se recoge:", "opts": ["Incluyendo la primera micción del primer día", "Desechando la primera micción y recogiendo hasta la primera del día siguiente inclusive", "Solo la primera y la última", "Una muestra por hora"], "correct": 1, "expl": "Orina 24 h: desechar la 1ª micción, recoger hasta la 1ª del día siguiente inclusive."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "36", "q": "Un exudado de herida para cultivo se recoge con:", "opts": ["Gasa limpia no estéril", "Hisopo/torunda estéril con medio de transporte", "Depresor lingual", "Jeringa no estéril"], "correct": 1, "expl": "Exudado = hisopo estéril con medio de transporte."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "37", "q": "La conservación habitual de las vacunas (cadena de frío) es a:", "opts": ["0 a 4 °C", "+2 a +8 °C", "Por debajo de 0 °C", "Temperatura ambiente"], "correct": 1, "expl": "Cadena de frío: +2 a +8 °C."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "38", "q": "Una vacuna que se ha congelado accidentalmente:", "opts": ["Puede usarse si se descongela despacio", "Debe desecharse (pierde eficacia, sobre todo las adsorbidas)", "Se usa en dosis doble", "Solo se inutiliza tras 48 h"], "correct": 1, "expl": "Vacuna congelada = desechar (sobre todo adsorbidas)."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "39", "q": "Los guantes en la atención al paciente:", "opts": ["Sustituyen a la higiene de manos", "Se cambian entre pacientes y NO sustituyen al lavado de manos", "Pueden reutilizarse si no están sucios", "Solo son obligatorios en quirófano"], "correct": 1, "expl": "Guantes: se cambian entre pacientes y NO sustituyen el lavado."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "40", "q": "En la eliminación de residuos, las gasas con sangre (empapadas) van a:", "opts": ["Grupo I (urbanos)", "Grupo III (biosanitarios especiales)", "Contenedor de punzantes", "Desagüe"], "correct": 1, "expl": "Gasas empapadas en sangre = Grupo III (biosanitarios especiales)."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "C1", "q": "El derecho a la protección de la salud está en el artículo de la Constitución:", "opts": ["Art. 15", "Art. 43", "Art. 14", "Art. 27"], "correct": 1, "expl": "Protección de la salud = art. 43."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "C2", "q": "El art. 43 (protección de la salud) se ubica en la Constitución dentro de:", "opts": ["Derechos fundamentales (Sección 1ª, Cap. II)", "Principios rectores de la política social y económica (Cap. III)", "Título Preliminar", "Título II (la Corona)"], "correct": 1, "expl": "El art. 43 está en principios rectores (Cap. III), NO en derechos fundamentales. La trampa estrella — grábala."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "C3", "q": "Los derechos fundamentales y libertades públicas se regulan en:", "opts": ["Título I, Capítulo II, Sección 1ª", "Título Preliminar", "Título VIII", "Capítulo III"], "correct": 0, "expl": "Derechos fundamentales = Título I, Cap. II, Sección 1ª."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "C5", "q": "La Ley que regula el consentimiento informado y la historia clínica en Galicia es:", "opts": ["Ley 8/2008", "Ley 3/2001, de 28 de mayo", "Ley 41/2002 (solo estatal)", "Ley 31/1995"], "correct": 1, "expl": "Consentimiento/historia clínica Galicia = 3/2001. Truco: 8/2008 salud ↔ 3/2001 consentimiento."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "C6", "q": "El Estatuto Marco del personal estatutario es la:", "opts": ["Ley 55/2003, de 16 de diciembre", "Ley 44/2003", "Ley 14/1986", "Ley 53/1984"], "correct": 0, "expl": "Estatuto Marco = Ley 55/2003."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "C7", "q": "Según el Estatuto Marco, la jornada ordinaria + complementaria no superará de promedio:", "opts": ["40 horas semanales", "48 horas semanales en cómputo semestral", "35 horas semanales", "60 horas semanales"], "correct": 1, "expl": "48 h/semana de promedio (cómputo semestral)."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "C8", "q": "En el Estatuto Marco, las faltas MUY GRAVES prescriben a los:", "opts": ["6 meses", "2 años", "4 años", "1 mes"], "correct": 2, "expl": "Faltas muy graves prescriben a los 4 años (leves 6 meses)."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "C9", "q": "El personal estatutario se clasifica en:", "opts": ["Funcionario y laboral", "Sanitario y de gestión y servicios", "Fijo y eventual únicamente", "Directivo y de base"], "correct": 1, "expl": "Personal estatutario: sanitario / de gestión y servicios."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "C10", "q": "La Ley General de Sanidad es la:", "opts": ["Ley 14/1986, de 25 de abril", "Ley 16/2003", "Ley 8/2008", "Ley 41/2002"], "correct": 0, "expl": "Ley General de Sanidad = 14/1986."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "C11", "q": "La Ley 41/2002 regula:", "opts": ["Prevención de riesgos laborales", "La autonomía del paciente y derechos y obligaciones en información y documentación clínica", "El Estatuto Marco", "La ordenación de las profesiones sanitarias"], "correct": 1, "expl": "Ley 41/2002 = autonomía del paciente + documentación clínica."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "C12", "q": "Según la Ley 41/2002, el consentimiento informado será por escrito en:", "opts": ["Toda actuación sanitaria", "Cirugía, procedimientos invasores y los de riesgo notorio", "Solo si lo pide el paciente", "Nunca, siempre es verbal"], "correct": 1, "expl": "CI por escrito: cirugía, procedimientos invasores, riesgo notorio."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "C13", "q": "El titular del derecho a la información asistencial es:", "opts": ["La familia", "El paciente (y los vinculados en la medida que él permita)", "El médico responsable", "La dirección del centro"], "correct": 1, "expl": "Titular de la información = el paciente."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "C14", "q": "La Ley 31/1995 regula:", "opts": ["La prevención de riesgos laborales", "La autonomía del paciente", "El Estatuto de Galicia", "La protección de datos"], "correct": 0, "expl": "Ley 31/1995 = prevención de riesgos laborales."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "C15", "q": "Según la LPRL, los equipos de protección individual (EPI):", "opts": ["Son la primera medida a adoptar", "Se usan cuando el riesgo no puede evitarse/limitarse por medios técnicos u organizativos", "Los aporta el trabajador", "Solo se usan en laboratorio"], "correct": 1, "expl": "EPI = última barrera, cuando no se evita por otros medios."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "C16", "q": "La Ley Orgánica 3/2018 (protección de datos) considera los datos de salud:", "opts": ["Datos de libre circulación", "Categoría especial con protección reforzada", "Datos sin regulación", "Accesibles a todo el personal"], "correct": 1, "expl": "Datos de salud = categoría especial (LOPDGDD 3/2018)."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "C17", "q": "El poder legislativo de la Comunidad Autónoma de Galicia corresponde a:", "opts": ["La Xunta de Galicia", "El Parlamento de Galicia", "El Presidente de la Xunta", "Las diputaciones"], "correct": 1, "expl": "Poder legislativo gallego = Parlamento de Galicia."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "C18", "q": "La Ley Orgánica 1/2004 protege contra la violencia de género ejercida por:", "opts": ["Cualquier persona", "Cónyuges/excónyuges o relaciones análogas de afectividad, aun sin convivencia", "Solo con convivencia acreditada", "Solo en el ámbito laboral"], "correct": 1, "expl": "LO 1/2004: cónyuges/excónyuges o relaciones análogas, aun sin convivencia."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "C19", "q": "La Ley gallega 11/2007 contempla como formas de violencia de género:", "opts": ["Solo la física", "Física, psicológica, económica y sexual, entre otras", "Solo la que hay denuncia", "Solo la sexual"], "correct": 1, "expl": "Ley 11/2007 gallega: física, psicológica, económica, sexual..."}, {"sim": "3", "tag": "SIMULACRO 3", "n": "C20", "q": "El umbral electoral para obtener escaños en las elecciones al Parlamento de Galicia / sistema proporcional se rige por:", "opts": ["Mayoría absoluta de votos", "Regla proporcional (D'Hondt) con barrera legal establecida en la normativa electoral", "Sorteo", "Voto censitario"], "correct": 1, "expl": "Sistema proporcional (D'Hondt/Sainte-Laguë según norma) con barrera legal."}, {"sim": "4", "tag": "SIMULACRO 4", "n": "1", "q": "El aseo del paciente encamado se realiza siguiendo el orden:", "opts": ["De las zonas más sucias a las más limpias", "De las zonas más limpias a las más sucias (genitales al final)", "Empezando siempre por los genitales", "Sin ningún orden establecido"], "correct": 1, "expl": "Siempre de lo más limpio a lo más sucio; los genitales, al final."}, {"sim": "4", "tag": "SIMULACRO 4", "n": "2", "q": "Al limpiar los ojos durante el aseo:", "opts": ["Del ángulo externo al interno con la misma gasa", "Del ángulo interno al externo, usando una gasa distinta para cada ojo", "Con alcohol y algodón", "Solo si hay legañas visibles"], "correct": 1, "expl": "Ojos: del ángulo interno al externo y una gasa distinta por ojo (evita contaminar el otro)."}, {"sim": "4", "tag": "SIMULACRO 4", "n": "3", "q": "En la higiene bucal de un paciente inconsciente hay que:", "opts": ["Colocarlo en decúbito supino totalmente plano", "Lateralizar la cabeza y usar torunda, evitando la broncoaspiración", "Enjuagar con agua a chorro abundante", "No realizarla por riesgo"], "correct": 1, "expl": "Inconsciente: cabeza ladeada + torunda para evitar broncoaspiración. Nunca agua a chorro."}, {"sim": "4", "tag": "SIMULACRO 4", "n": "4", "q": "La temperatura aproximada del agua para el baño del paciente es de:", "opts": ["20-25 °C", "37-40 °C", "45-50 °C", "15-18 °C"], "correct": 1, "expl": "Agua del baño ~37-40 °C (temperatura corporal templada)."}, {"sim": "4", "tag": "SIMULACRO 4", "n": "5", "q": "Tras el aseo, la piel del paciente debe quedar:", "opts": ["Ligeramente húmeda", "Bien seca, con especial atención a los pliegues", "Cubierta de talco, también en las heridas", "Friccionada con alcohol en los pliegues"], "correct": 1, "expl": "Secar bien, sobre todo pliegues (la humedad macera y favorece UPP e infecciones). Nunca talco en heridas."}, {"sim": "4", "tag": "SIMULACRO 4", "n": "6", "q": "La prótesis dental removible del paciente se higieniza:", "opts": ["Dentro de la boca con torunda", "Retirándola, cepillándola y guardándola en un recipiente con agua/líquido", "No se limpia", "Sumergiéndola en lejía"], "correct": 1, "expl": "Prótesis: se retira, se cepilla y se guarda en recipiente con líquido. Jamás lejía."}, {"sim": "4", "tag": "SIMULACRO 4", "n": "7", "q": "La \"unidad del paciente\" se define como:", "opts": ["Únicamente la cama", "El espacio, mobiliario y enseres destinados a la estancia del paciente", "La habitación de aislamiento", "El office de enfermería"], "correct": 1, "expl": "Unidad del paciente = espacio + mobiliario + enseres para su estancia."}, {"sim": "4", "tag": "SIMULACRO 4", "n": "8", "q": "La cama quirúrgica (o de anestesia) se prepara para:", "opts": ["Un paciente que va a deambular", "Recibir a un paciente que vuelve de quirófano", "Un paciente en aislamiento aéreo", "Una exploración ginecológica"], "correct": 1, "expl": "Cama quirúrgica/de anestesia: preparada para recibir al paciente que vuelve de quirófano."}, {"sim": "4", "tag": "SIMULACRO 4", "n": "9", "q": "Al retirar la ropa de cama sucia, el TCAE debe:", "opts": ["Dejarla en el suelo mientras hace la cama", "Introducirla en la bolsa/carro sin airearla ni pegarla al uniforme", "Sacudirla dentro de la habitación", "Reutilizarla si parece limpia"], "correct": 1, "expl": "Ropa sucia: a la bolsa/carro, sin airear (dispersa gérmenes) ni pegar al uniforme."}, {"sim": "4", "tag": "SIMULACRO 4", "n": "10", "q": "Las arrugas en la sábana bajera del paciente encamado:", "opts": ["Son irrelevantes", "Favorecen la aparición de úlceras por presión y deben evitarse", "Solo resultan incómodas", "Mejoran la circulación"], "correct": 1, "expl": "Las arrugas de la bajera producen presión y roce → UPP. Cama siempre lisa y estirada."}, {"sim": "4", "tag": "SIMULACRO 4", "n": "11", "q": "El lavado del cabello del paciente encamado:", "opts": ["No puede realizarse nunca", "Puede hacerse en la cama con palangana o dispositivo específico", "Solo con champú seco, prohibido el agua", "Solo si el paciente puede levantarse"], "correct": 1, "expl": "El pelo se puede lavar en cama con palangana o dispositivo específico."}, {"sim": "4", "tag": "SIMULACRO 4", "n": "12", "q": "Señale la CORRECTA sobre la higiene perineal:", "opts": ["En la mujer se limpia de atrás hacia delante", "En la mujer se limpia de delante hacia atrás (de pubis a ano)", "Se usa el mismo movimiento de ida y vuelta", "No forma parte del aseo"], "correct": 1, "expl": "Higiene perineal femenina: de delante hacia atrás (pubis → ano), para no arrastrar gérmenes al meato/vagina."}, {"sim": "4", "tag": "SIMULACRO 4", "n": "14", "q": "La posición de Trendelenburg es:", "opts": ["Cabeza más alta que los pies", "Plano inclinado con la cabeza más baja que los pies", "Sentado con las piernas colgando", "Decúbito prono"], "correct": 1, "expl": "Trendelenburg = cabeza más baja que los pies (usado en shock/hipotensión)."}, {"sim": "4", "tag": "SIMULACRO 4", "n": "15", "q": "La posición de Sims (semiprono, lateral izquierdo) se emplea para:", "opts": ["El parto", "Administración de enemas y exploración/tacto rectal", "La RCP", "La punción lumbar"], "correct": 1, "expl": "Sims (semiprono lateral izq.) = enemas y exploración rectal."}, {"sim": "4", "tag": "SIMULACRO 4", "n": "16", "q": "La posición ginecológica o de litotomía se utiliza en:", "opts": ["Exploraciones vaginales, partos y sondaje vesical femenino", "Cirugía de columna", "Drenaje postural pulmonar", "La alimentación oral"], "correct": 0, "expl": "Ginecológica/litotomía = exploración vaginal, partos y sondaje vesical femenino."}, {"sim": "4", "tag": "SIMULACRO 4", "n": "17", "q": "Para prevenir las úlceras por presión en un paciente encamado, los cambios posturales se realizan aproximadamente cada:", "opts": ["8 horas", "2-3 horas", "12 horas", "Una vez al día"], "correct": 1, "expl": "Cambios posturales cada 2-3 h para prevenir UPP."}, {"sim": "4", "tag": "SIMULACRO 4", "n": "18", "q": "Las úlceras por presión aparecen con mayor frecuencia en:", "opts": ["Zonas de tejido blando y graso", "Las prominencias óseas (sacro, talones, trocánteres, occipucio...)", "El abdomen", "El cuero cabelludo"], "correct": 1, "expl": "Las UPP se dan en prominencias óseas: sacro, talones, trocánteres, occipucio, codos..."}, {"sim": "4", "tag": "SIMULACRO 4", "n": "19", "q": "Una úlcera por presión en estadio I se caracteriza por:", "opts": ["Eritema que NO blanquea a la presión, con piel íntegra", "Pérdida total del espesor de la piel", "Afectación de músculo y hueso", "Escara necrótica negra"], "correct": 0, "expl": "Estadio I = eritema que NO blanquea a la presión, con piel íntegra. La clave: piel entera + rojez que no desaparece."}, {"sim": "4", "tag": "SIMULACRO 4", "n": "20", "q": "En una úlcera por presión de estadio II se produce:", "opts": ["Piel íntegra con enrojecimiento", "Pérdida parcial del espesor de la piel (dermis): abrasión o flictena", "Destrucción hasta el hueso", "Solo picor sin lesión"], "correct": 1, "expl": "Estadio II = pérdida parcial del espesor (dermis): abrasión o flictena/ampolla."}, {"sim": "4", "tag": "SIMULACRO 4", "n": "21", "q": "Al movilizar a un paciente o levantar una carga, el TCAE debe:", "opts": ["Flexionar la espalda manteniendo las piernas rectas , "q": "El consentimiento informado, según la Ley 41/2002, será por escrito en:", "opts": ["Toda actuación", "Cirugía, procedimientos invasores y de riesgo notorio", "Solo si lo pide el paciente", "Nunca"], "correct": 1, "expl": "CI por escrito: cirugía, invasores, riesgo notorio."}, {"sim": "5", "tag": "SIMULACRO 5", "n": "C7", "q": "Según el Estatuto Marco, las faltas MUY GRAVES prescriben a los:", "opts": ["6 meses", "2 años", "4 años", "1 mes"], "correct": 2, "expl": "Faltas muy graves prescriben a los 4 años."}, {"sim": "5", "tag": "SIMULACRO 5", "n": "C8", "q": "Los datos de salud, según la LO 3/2018, son:", "opts": ["De libre circulación", "Categoría especial con protección reforzada", "Sin regulación", "Accesibles a todos"], "correct": 1, "expl": "Datos de salud = categoría especial (LO 3/2018)."}, {"sim": "5", "tag": "SIMULACRO 5", "n": "C9", "q": "El organismo que gestiona la sanidad pública en Galicia es:", "opts": ["INSALUD", "SERGAS", "Osakidetza", "SESCAM"], "correct": 1, "expl": "Sanidad gallega = SERGAS."}, {"sim": "5", "tag": "SIMULACRO 5", "n": "C10", "q": "Los EPI, según la LPRL, se emplean:", "opts": ["Como primera medida", "Cuando el riesgo no puede evitarse/limitarse por otros medios", "Los aporta el trabajador", "Solo en laboratorio"], "correct": 1, "expl": "EPI = última barrera."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "1", "q": "O dereito á protección da saúde do artigo 43 da Constitución Española:", "opts": ["É un dereito fundamental protexible en amparo ante o Tribunal Constitucional", "É un principio reitor da política social e económica (capítulo III do título I)", "Está recollido no título preliminar", "Só vincula ás comunidades autónomas con competencias sanitarias transferidas"], "correct": 1, "expl": "O art. 43 CE está no capítulo III do título I: principios reitores. Non é dereito fundamental nin cabe recurso de amparo (trampa clásica)."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "2", "q": "Segundo a Lei Xeral de Sanidade 14/1986,
