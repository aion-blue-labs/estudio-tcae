raquial, carótida, temporal, femoral, poplítea, tibial posterior, pedia); se cuenta 15 s x 4 (o 30 s x 2) si es regular, 1 minuto si es irregular. El brazo debe estar relajado, no con el puño cerrado. A y C correctas.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O331","q":"Ingresa un paciente adulto con 37,5ºC de temperatura, 145/110 de TA, 120 lpm y con más de 24 rpm. Con estos datos, diremos que el paciente presenta:","caso":"","opts":["Fiebre moderada, hipertensión, taquicardia, taquipnea.","Febrícula, hipertensión, taquicardia, taquipnea.","Fiebre moderada, hipotensión, taquicardia, taquipnea.","Temperatura normal, hipotensión, bradicardia, bradipnea."],"correct":1,"expl":"37,5 °C = FEBRÍCULA (37,1-37,9). 145/110 = hipertensión. 120 lpm = taquicardia (>100). >24 rpm = taquipnea (>20).","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O332","q":"Manuel, paciente de la habitación 302 B tiene oxigenoterapia. Lucía, TCAE de la Unidad, debe revisar el frasco humidificador. Señale la opción correcta:","caso":"","opts":["El frasco humidificador se llenará hasta 2/3 de su capacidad con agua destilada estéril.","El frasco humidificador se llenará hasta 2/3 de su capacidad con agua destilada no estéril.","El frasco humidificador se llenará hasta 1/3 de su capacidad con agua destilada estéril.","El frasco humidificador se llenará con agua del grifo."],"correct":0,"expl":"El frasco humidificador de la oxigenoterapia se llena hasta 2/3 (entre las marcas mínimo y máximo) con AGUA DESTILADA ESTÉRIL, y se cambia según protocolo. Nunca agua del grifo.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O333","q":"El objetivo del personal técnico en cuidados auxiliares de enfermería, cuando en su actividad profesional va a dar de comer a un paciente terminal, es:","caso":"","opts":["Atrasar todo lo posible su fallecimiento.","Procurar una nutrición óptima para luchar contra la enfermedad.","Proporcionar bienestar al paciente.","Aumentar mecanismos de defensa ante la enfermedad."],"correct":2,"expl":"En el paciente terminal la alimentación busca el BIENESTAR y el placer de comer (pequeñas cantidades, lo que le apetezca), no una nutrición óptima ni prolongar la vida.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O334","q":"Quique, Lucía y Mar son parte del servicio de Cardiología; para una buena colaboración como miembros de trabajo en un equipo deben:","caso":"","opts":["Únicamente dedicarse a una parcela propia asignada previamente.","Realizar una crítica constructiva ejerciendo un feedback negativo.","Preocuparse por las necesidades y los problemas profesionales y emocionales de los compañeros de trabajo.","Fiarse de los conocimientos y experiencia de uno mismo."],"correct":2,"expl":"Trabajo en equipo: interesarse por las necesidades y problemas (profesionales y emocionales) de los compañeros, comunicación, crítica constructiva positiva y confianza mutua; no encerrarse en la propia parcela ni fiarse solo de uno mismo.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O335","q":"Usted se encuentra trabajando en el Servicio de Rehabilitación como TCAE, por lo que debe saber que la transmisión de calor por medio de un fluido recibe el nombre de:","caso":"","opts":["Conducción.","Convección.","Hidroterapia.","Conversión."],"correct":1,"expl":"Transmisión del calor: CONDUCCIÓN (contacto directo: bolsa de agua caliente), CONVECCIÓN (a través de un fluido en movimiento: aire o agua caliente), RADIACIÓN (infrarrojos) y CONVERSIÓN (otra energía se transforma en calor: ultrasonidos, diatermia).","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O336","q":"Usted tiene que realizar la higiene bucal de un enfermo inconsciente. ¿Cuál de los siguientes procedimientos es correcto?:","caso":"","opts":["Colocará al paciente en posición de Semifowler con la cabeza ladeada (si no existe contraindicación).","Al terminar secará bien los labios y aplicará hidratación.","Si tiene prótesis dental, la retirará con una gasa, la limpiará y volverá a colocársela.","A y B son correctas."],"correct":3,"expl":"Higiene bucal del inconsciente: semi-Fowler (o lateral) con la cabeza ladeada para evitar aspiraciones, limpiar con torunda/depresor, secar labios e hidratarlos (vaselina). La prótesis se retira y NO se vuelve a colocar.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"O","tag":"OPE SERGAS","n":"O337","q":"Fermín es un paciente de 46 años diagnosticado de antropofobia que se encuentra ingresado en nuestra unidad. Dada su dolencia, debemos:","caso":"","opts":["Trivializar la fobia cuando sea ridícula.","No dejar que el paciente se aísle completamente.","Desde el primer momento tratar de modificar las estrategias de afrontamiento del paciente.","Todas son verdaderas."],"correct":1,"expl":"Antropofobia = miedo a las personas. Cuidados: no dejar que el paciente se aísle completamente, no trivializar ni ridiculizar la fobia y no intentar cambiar de golpe sus estrategias de afrontamiento (eso es terapia progresiva).","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O338","q":"Está indicado que al paciente de la habitación 416 debe administrársele un enema de limpieza. La postura correcta del paciente para su administración será:","caso":"","opts":["Decúbito lateral derecho.","Decúbito lateral izquierdo con el miembro inferior derecho flexionado.","Decúbito lateral derecho con el miembro inferior izquierdo flexionado.","Posición genupectoral."],"correct":1,"expl":"Enema de limpieza: decúbito lateral IZQUIERDO con la pierna derecha flexionada (posición de Sims), porque el sigma queda en declive y facilita la entrada del líquido.","tema":"eliminacion","bloque":"Eliminación, sondajes y ostomías"},{"sim":"O","tag":"OPE SERGAS","n":"O339","q":"Paciente de 82 años ingresado por infección respiratoria, comienza a manifestar diarrea acuosa, fiebre y dolor abdominal por Clostridium difficile, principal patógeno asociado a infección nosocomial. ¿Qué medida debes realizar para eliminar las esporas y evitar su propagación?","caso":"","opts":["Lavado de manos con solución hidroalcohólica 20 o 30 segundos.","Lavado de manos con alcohol al 70%.","Lavado de manos con agua y jabón antiséptico.","Lavado de manos con peróxido de hidrógeno."],"correct":2,"expl":"Clostridium difficile forma ESPORAS resistentes al alcohol: la solución hidroalcohólica no las elimina. Hay que lavarse las manos con AGUA Y JABÓN (antiséptico), que las arrastra mecánicamente, además de aislamiento de contacto y limpieza con clorados.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O340","q":"El técnico en cuidados auxiliares de enfermería está trabajando en turno de mañana. Antes de mandar las muestras al laboratorio, es correcto afirmar que las condiciones óptimas para mantener una muestra de orina, son:","caso":"","opts":["En el control de enfermería, cerrada herméticamente en un frasco estéril, y en la batea correspondiente a las muestras que se han de enviar al laboratorio.","En la nevera, a 4ºC, cerrada herméticamente y correctamente etiquetada.","En la mesilla del paciente.","Todas las respuestas anteriores son falsas."],"correct":3,"expl":"La orina se envía al laboratorio lo antes posible (en menos de 1-2 h). Si hay demora, se refrigera a 4 °C, pero la opción B no es \"óptima\" en el sentido del tribunal (lo óptimo es el envío inmediato): dio como correcta \"todas falsas\". Nunca en la mesilla ni esperando en la batea.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O341","q":"En el Servicio de Urgencias ingresa un paciente por accidente de tráfico. Necesita una transfusión sanguínea de forma inmediata y no conocemos su grupo sanguíneo. Deberían solicitar al Banco de Sangre, sangre del grupo:","caso":"","opts":["AB con Rh positivo, ya que es el receptor universal.","O con Rh negativo, ya que es el donante universal.","No se podrá solicitar sangre porque no se conoce el grupo sanguíneo del paciente.","Se solicitará sangre a la familia del paciente hasta el segundo grado de consanguinidad."],"correct":1,"expl":"Transfusión urgente sin conocer el grupo: sangre O Rh NEGATIVO (donante universal, sin antígenos A, B ni D). AB positivo es el receptor universal.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O342","q":"Iniciamos el turno de tarde y por la mañana se realizó un ingreso en nuestra unidad, al consultar los datos del paciente en GACELA observamos que, en la ventana del mapa de camas, al lado del número de cama aparece una bandera roja como indica la imagen superior. ¿Qué nos está indicando?","caso":"","opts":["El paciente debe permanecer en aislamiento inverso.","El paciente debe permanecer en aislamiento de contacto.","El paciente debe permanecer en aislamiento entérico.","El paciente padece una alergia."],"correct":3,"expl":"En GACELA, la bandera ROJA junto a la cama en el mapa de camas indica que el paciente tiene una ALERGIA registrada. Los aislamientos tienen otros iconos.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O343","q":"Paciente de 39 años operada de un cáncer de mama que tras ser tratada con radioterapia, pasados 3 meses, comienza a sentir pesadez y adormecimiento en el brazo del lado operado apareciéndole signos como hinchazón e inflamación. ¿De qué afección estaríamos hablando?","caso":"","opts":["Linganxioma.","Linfoadenoma.","Linfedema.","Linfoma."],"correct":2,"expl":"LINFEDEMA: acúmulo de linfa en el brazo tras la extirpación de ganglios axilares y/o radioterapia por cáncer de mama (hinchazón, pesadez, hormigueo). Se previene evitando extracciones, TA y esfuerzos en ese brazo.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O344","q":"En la central de esterilización llega material para esterilizar por calor húmedo, de los citados, ¿cuáles NO se pueden someter a vapor saturado por autoclave?:","caso":"","opts":["Textiles secos.","Vidrio.","Sustancias grasas.","Contenedores."],"correct":2,"expl":"En el autoclave (vapor saturado) NO se esterilizan sustancias grasas, aceites, polvos (el vapor no penetra) ni materiales termosensibles (plásticos, ópticas). Sí: textiles, vidrio, instrumental metálico, contenedores.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O345","q":"Si quieres consultar alguna prescripción de un paciente ingresado en tu unidad, debes acceder a la siguiente aplicación informática:","caso":"","opts":["Fides.","Synasp.","Silicon.","Recex."],"correct":2,"expl":"SILICON es la aplicación del SERGAS para la prescripción electrónica hospitalaria (consultar y administrar medicación). GACELA = cuidados de enfermería; IANUS = historia clínica electrónica; FIDES = expediente profesional.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O346","q":"Emilio, TCAE en medicina interna, sabe que dentro de la prevención de accidentes del paciente, la incidencia de caídas fue considerada un indicador indirecto de la calidad de la atención del personal de enfermería. ¿Qué escala de las citadas, sería la más adecuada para la prevención de caídas en adultos mayores hospitalizados?","caso":"","opts":["Escala de test del lobo.","Escala Pfeiffer.","Escala Braden.","Escala Dowton."],"correct":3,"expl":"Escala de DOWNTON: valora el riesgo de caídas (caídas previas, medicación, déficits sensoriales, estado mental, deambulación). Pfeiffer y Lobo evalúan el deterioro cognitivo; Braden el riesgo de UPP.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O347","q":"Josefa está ingresada por parotiditis, por lo que debemos tomar precauciones para evitar la transmisión de microorganismos por gotas. Entre estas precauciones se encuentra:","caso":"","opts":["Utilizaremos máscara cuando estemos a menos de un metro de la paciente.","La puerta de la habitación debe permanecer cerrada en todo momento.","Si tiene que desplazarse a otro servicio lo hará con máscara FFP2.","Mantener a la paciente en una habitación con presión de aire negativa."],"correct":0,"expl":"Parotiditis = transmisión por GOTAS (>5 micras, no permanecen en el aire): mascarilla quirúrgica a menos de 1 metro, puerta puede estar abierta y no se necesita presión negativa ni FFP2 (eso es para transmisión aérea: tuberculosis, sarampión, varicela). Si se desplaza, mascarilla quirúrgica al paciente.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O348","q":"Luís es el cuidador principal de su padre, que es un paciente terminal. A la hora de realizar la higiene personal de su padre, Luís ha de tener en cuenta varios aspectos. Señala la respuesta INCORRECTA:","caso":"","opts":["Aprovechará el momento en el que su padre está más fuerte o animado.","Respetará su intimidad y utilizará sus propios efectos personales.","Mantendrá la piel limpia e hidratada.","Tratará de realizar el aseo de manera minuciosa y rápida para que su padre no se esfuerce."],"correct":3,"expl":"La higiene del paciente terminal se hace con calma, aprovechando su mejor momento, respetando su intimidad y sus efectos personales y cuidando la piel. \"Minuciosa y rápida\" es contradictorio: se prioriza el confort, no la rapidez.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O349","q":"En el servicio de urgencias del hospital XY, un paciente entra en PCR en uno de los cubículos. Si queremos iniciar la RCP, ¿qué es lo primero que debemos hacer?","caso":"","opts":["Dejar las vías aéreas libres.","Retirar la dentadura postiza.","Colocar la tabla debajo del colchón.","Todas son correctas."],"correct":0,"expl":"RCP: lo PRIMERO es dejar libre la vía aérea (abrirla con la maniobra frente-mentón, retirar cuerpos extraños y la prótesis si está suelta). La tabla o superficie dura se coloca después para las compresiones.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O350","q":"A las doce de la mañana hay que administrar a Martín P.S., paciente de la habitación 306 B, gotas óticas en ambos oídos. Administraremos dicha medicación de la siguiente manera:","caso":"","opts":["Dejaremos transcurrir 5 minutos entre la administración del fármaco en un oído y en el otro.","Utilizaremos el envase de uso colectivo que contiene el fármaco (si no hay más de un mes que está abierto).","El cuentagotas debe tocar obligatoriamente el pabellón auricular.","Todas son correctas."],"correct":0,"expl":"Gotas óticas: paciente en lateral con el oído hacia arriba, tirar del pabellón hacia arriba y atrás (adultos), instilar sin tocar el oído con el cuentagotas, y esperar unos 5 minutos antes de tratar el otro oído. Los envases son individuales.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O351","q":"Para facilitar la comunicación de un paciente anciano con alteraciones del habla, es correcto:","caso":"","opts":["Facilitaremos papel y lápiz.","Identificaremos el método que le permita expresar mejor sus necesidades.","Le aconsejaremos que no se esfuerce y nos adelantaremos a sus necesidades.","Todas las respuestas anteriores son correctas."],"correct":1,"expl":"Con un anciano con alteraciones del habla hay que identificar el método que le permita expresarse mejor (pizarra, gestos, pictogramas); papel y lápiz solo si puede escribir. Nunca adelantarse a sus necesidades ni decirle que /* ---------------- identidad estable de cada pregunta ---------------- */
function hid(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return 'q'+(h>>>0);}
DATA.forEach(q => q._id = hid(q.q));
const BY_ID = {}; DATA.forEach(q => BY_ID[q._id] = q);

/* ---------------- progreso persistente (v3, migra de v2) ---------------- */
const KEY = 'tcae_progress_v3', OLDKEY = 'tcae_progress_v2';
const DAY = 86400000;
const INTERVALS = [0, 1, 2, 4, 8, 16, 32];   // días por caja Leitner
const MASTER_BOX = 3;                        // caja a partir de la cual cuenta como dominada

function blankP(){ return {v:3,totalAns:0,totalCorr:0,streak:0,best:0,lastDay:null,q:{},hist:{}}; }
function loadP(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return Object.assign(blankP(), JSON.parse(raw));
  }catch(e){}
  // migración desde v2
  try{
    const old = JSON.parse(localStorage.getItem(OLDKEY) || 'null');
    if(old){
      const p = blankP();
      p.totalAns = old.totalAns||0; p.totalCorr = old.totalCorr||0;
      p.streak = old.streak||0; p.best = old.best||0; p.lastDay = old.lastDay||null;
      Object.keys(old.seen||{}).forEach(id => p.q[id] = {b:0,d:0,n:1,w:0,r:0,m:0});
      Object.keys(old.correct||{}).forEach(id => { p.q[id] = p.q[id]||{b:0,d:0,n:1,w:0,r:0,m:0};
        p.q[id].b = MASTER_BOX; p.q[id].r = 1; p.q[id].d = Date.now() + INTERVALS[MASTER_BOX]*DAY; });
      Object.keys(old.fails||{}).forEach(id => { p.q[id] = p.q[id]||{b:0,d:0,n:1,w:0,r:0,m:0};
        p.q[id].b = 0; p.q[id].w = 1; p.q[id].d = 0; });
      return p;
    }
  }catch(e){}
  return blankP();
}
let P = loadP();
function saveP(){ try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){} }
function rec(id){ if(!P.q[id]) P.q[id] = {b:0,d:0,n:0,w:0,r:0,m:0}; return P.q[id]; }
function today(){ return new Date().toISOString().slice(0,10); }
function touchDay(){
  const t = today(); if(P.lastDay === t) return;
  if(P.lastDay){ const d = Math.round((new Date(t) - new Date(P.lastDay))/DAY);
                 P.streak = d === 1 ? (P.streak||0)+1 : 1; }
  else P.streak = 1;
  P.lastDay = t; saveP();
}

const ids = () => Object.keys(P.q);
const masteredCount = () => ids().filter(id => BY_ID[id] && P.q[id].b >= MASTER_BOX).length;
const weakCount     = () => ids().filter(id => BY_ID[id] && P.q[id].w > 0 && P.q[id].b < MASTER_BOX).length;
const seenCount     = () => ids().filter(id => BY_ID[id]).length;
const markedIds     = () => ids().filter(id => BY_ID[id] && P.q[id].m);
const acc           = () => P.totalAns ? Math.round(P.totalCorr/P.totalAns*100) : 0;
function dueIds(){
  const now = Date.now();
  return DATA.filter(q => { const r = P.q[q._id]; return r && r.d <= now && r.b < INTERVALS.length-1; })
             .map(q => q._id);
}
function temaStats(){
  const s = {}; TEMAS.forEach(t => s[t.id] = {tot:0,mas:0,weak:0,seen:0});
  DATA.forEach(q => { const t = s[q.tema] || (s[q.tema] = {tot:0,mas:0,weak:0,seen:0});
    t.tot++; const r = P.q[q._id]; if(!r) return; t.seen++;
    if(r.b >= MASTER_BOX) t.mas++; else if(r.w > 0) t.weak++; });
  return s;
}

function applyTheme(){
  let th = null; try{ th = localStorage.getItem('tcae_theme'); }catch(e){}
  if(th) document.documentElement.setAttribute('data-theme', th);
  else document.documentElement.removeAttribute('data-theme');
}
function toggleTheme(){
  let th = null; try{ th = localStorage.getItem('tcae_theme'); }catch(e){}
  const sysDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  const next = th ? (th === 'dark' ? 'light' : 'dark') : (sysDark ? 'light' : 'dark');
  try{ localStorage.setItem('tcae_theme', next); }catch(e){}
  applyTheme();
}

/* ---------------- helpers de UI ---------------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ring(pct, label, color){
  const r = 46, c = 2*Math.PI*r, off = c*(1 - Math.max(0, Math.min(100, pct))/100);
  return '<div class="ring"><svg viewBox="0 0 110 110"><circle class="track" cx="55" cy="55" r="'+r+'"/>'+
    '<circle class="val" cx="55" cy="55" r="'+r+'" stroke-dasharray="'+c.toFixed(1)+
    '" stroke-dashoffset="'+off.toFixed(1)+'"'+(color?' style="stroke:'+color+'"':'')+'/></svg>'+
    '<div class="num"><b>'+pct+'%</b><span>'+label+'</span></div></div>';
}
function dateES(){
  const d = new Date();
  const dias = ['dom','lun','mar','mié','jue','vie','sáb'];
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return dias[d.getDay()]+' '+d.getDate()+' '+meses[d.getMonth()];
}
function shuffled(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));
  const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function resetP(){ if(confirm('¿Borrar todo tu progreso y empezar de cero?')){ P = blankP(); saveP(); home(); } }
function exportP(){
  const txt = JSON.stringify(P);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(
      () => alert('Copia guardada en el portapapeles. Pégala en una nota o mándatela por WhatsApp: con eso puedes restaurar tu progreso en cualquier móvil.'),
      () => prompt('Copia este texto y guárdalo:', txt));
  } else prompt('Copia este texto y guárdalo:', txt);
}
function importP(){
  const txt = prompt('Pega aquí la copia de tu progreso:');
  if(!txt) return;
  try{ const o = JSON.parse(txt); if(!o || typeof o !== 'object' || !o.q) throw 0;
       P = Object.assign(blankP(), o); saveP(); home(); alert('Progreso restaurado.'); }
  catch(e){ alert('Ese texto no parece una copia válida.'); }
}

/* ---------------- construcción de la sesión ---------------- */
let deck = [], idx = 0, score = 0, streak = 0, best = 0, mode = 'normal';
let sessionLog = [], examEnd = 0, examTimer = null, temaActual = '';

function buildDeck(list){
  return list.map(q => {
    const opts = q.opts.map((t,i) => ({t:t, ok:i === q.correct}));
    for(let i=opts.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));
      const t=opts[i]; opts[i]=opts[j]; opts[j]=t; }
    return {_id:q._id, q:q.q, caso:q.caso, expl:q.expl, tag:q.tag, sim:q.sim, tema:q.tema,
            opts:opts, correct:opts.findIndex(o => o.ok), answered:null};
  });
}
function begin(){ idx=0; score=0; streak=0; best=0; sessionLog=[]; render(); }
function stopTimer(){ if(examTimer){ clearInterval(examTimer); examTimer = null; } }

function start(n){
  mode = 'normal'; stopTimer();
  const nuevas = DATA.filter(q => !P.q[q._id]);
  const flojas = DATA.filter(q => P.q[q._id] && P.q[q._id].b < MASTER_BOX);
  let pool = shuffled(nuevas).concat(shuffled(flojas));
  if(!pool.length) pool = shuffled(DATA);
  deck = buildDeck(n ? pool.slice(0, n) : shuffled(DATA));
  begin();
}
function startSRS(){
  mode = 'srs'; stopTimer();
  const due = shuffled(dueIds()).map(id => BY_ID[id]).filter(Boolean);
  if(!due.length) return home();
  deck = buildDeck(due.slice(0, 30)); begin();
}
function startWeak(){
  mode = 'fallos'; stopTimer();
  const w = DATA.filter(q => P.q[q._id] && P.q[q._id].w > 0 && P.q[q._id].b < MASTER_BOX);
  if(!w.length) return home();
  deck = buildDeck(shuffled(w).slice(0, 30)); begin();
}
function startMarked(){
  mode = 'marcadas'; stopTimer();
  const m = markedIds().map(id => BY_ID[id]).filter(Boolean);
  if(!m.length) return home();
  deck = buildDeck(shuffled(m)); begin();
}
function startTema(t){
  mode = 'tema'; temaActual = t; stopTimer();
  const pool = DATA.filter(q => q.tema === t);
  const sinDominar = pool.filter(q => !P.q[q._id] || P.q[q._id].b < MASTER_BOX);
  const use = sinDominar.length >= 5 ? sinDominar : pool;
  deck = buildDeck(shuffled(use).slice(0, 25)); begin();
}
function startExam(n){
  mode = 'examen'; stopTimer();
  deck = buildDeck(shuffled(DATA).slice(0, n));
  examEnd = Date.now() + n*60000;
  examTimer = setInterval(tick, 1000);
  begin();
}
function tick(){
  const el = document.getElementById('clock'); if(!el) return;
  const left = Math.max(0, examEnd - Date.now());
  const m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
  el.textContent = m+':'+String(s).padStart(2,'0');
  el.className = 'clock' + (left < 120000 ? ' warn' : '');
  if(left <= 0){ stopTimer(); results(); }
}

/* ---------------- pintar pregunta ---------------- */
const MODE_LABEL = {srs:'REPASO INTELIGENTE', fallos:'MIS FALLOS', marcadas:'MARCADAS', examen:'SIMULACRO'};
function render(){
  const q = deck[idx];
  $('#hdrRight').textContent = mode === 'examen' ? 'Simulacro' : 'Sesión';
  const mk = (P.q[q._id] && P.q[q._id].m) ? ' on' : '';
  const pillMode = MODE_LABEL[mode];
  let h = '<div class="qbar"><div class="track"><i style="width:'+(idx/deck.length*100)+'%"></i></div>'+
      '<div class="n">'+(idx+1)+'/'+deck.length+'</div>'+
      (mode === 'examen' ? '<div class="clock" id="clock">--:--</div>'
                         : (streak >= 2 ? '<div class="fire">🔥'+streak+'</div>' : ''))+'</div>'+
    '<div class="card">'+
      '<div class="pills">'+
        (pillMode ? '<span class="pill rev">'+pillMode+'</span>' : '')+
        '<span class="pill">'+esc(TEMA_LABEL[q.tema] || 'General')+'</span>'+
        '<span class="pill src">'+esc(q.tag)+'</span>'+
        '<button class="star'+mk+'" onclick="toggleMark()" title="Marcar para repasar">⭐</button>'+
      '</div>'+
      (q.caso ? '<p class="caso">'+esc(q.caso)+'</p>' : '')+
      '<p class="q">'+esc(q.q)+'</p><div id="opts">';
  q.opts.forEach((o,i) => {
    h += '<button class="opt" onclick="answer('+i+')"><span class="k">'+'ABCD'[i]+'</span><span>'+esc(o.t)+'</span></button>';
  });
  h += '</div><div class="feed" id="feed"></div>'+
       '<button class="btn" id="next" style="display:none" onclick="next()">Siguiente</button>'+
       (mode === 'examen' ? '<button class="btn ghost sm" onclick="answer(-1)">Dejar en blanco</button>' : '')+
     '</div>'+
     '<p class="hint kbd">Atajos: A · B · C · D para responder, Enter para seguir</p>'+
     '<button class="btn ghost sm" onclick="quit()">Salir de la sesión</button>';
  screenEl.innerHTML = h;
  if(mode === 'examen') tick();
  window.scrollTo(0,0);
}
function toggleMark(){
  const r = rec(deck[idx]._id); r.m = r.m ? 0 : 1; saveP();
  const el = document.querySelector('.star'); if(el) el.className = 'star' + (r.m ? ' on' : '');
}
function quit(){
  if(confirm('¿Salir de la sesión? Lo respondido hasta ahora ya está guardado.')){ stopTimer(); home(); }
}

/* ---------------- responder ---------------- */
function grade(q, i){
  const ok = i === q.correct, r = rec(q._id), now = Date.now();
  r.n = (r.n||0) + 1; r.t = now;
  if(i < 0){ r.d = now; }                                    // en blanco: vuelve pronto, no puntúa
  else if(ok){ r.r = (r.r||0)+1; r.b = Math.min((r.b||0)+1, INTERVALS.length-1);
               r.d = now + INTERVALS[r.b]*DAY; }
  else { r.w = (r.w||0)+1; r.b = 0; r.d = now; }
  if(i >= 0){
    P.totalAns++; if(ok) P.totalCorr++;
    const k = today(); P.hist[k] = (P.hist[k]||0) + 1;
  }
  saveP();
  sessionLog.push({q:q, given:i, ok:ok, blank:i < 0});
  return ok;
}
function answer(i){
  const q = deck[idx];
  if(q.answered !== null && q.answered !== undefined) return;
  q.answered = i;
  const btns = document.querySelectorAll('.opt');
  btns.forEach(b => b.disabled = true);
  const ok = grade(q, i);

  if(mode === 'examen'){
    if(i >= 0) btns[i].classList.add('sel');
    return next();                                            // sin feedback: como el examen real
  }
  btns[q.correct].classList.add('correct');
  if(!ok && i >= 0) btns[i].classList.add('wrong');
  const feed = $('#feed');
  if(ok){
    score++; streak++; best = Math.max(best, streak);
    const c = ['Correcto','Muy bien','Exacto','Perfecto','Esa la tienes'];
    feed.className = 'feed ok show';
    feed.innerHTML = '<span class="h ok">✓ '+c[Math.floor(Math.random()*c.length)]+
      (streak >= 3 ? ' · racha de '+streak : '')+'</span>'+esc(q.expl||'');
  } else {
    streak = 0;
    feed.className = 'feed no show';
    feed.innerHTML = '<span class="h no">✕ La correcta era la '+'ABCD'[q.correct]+'</span>'+
      esc(q.expl || 'Repásalo con calma; se aprende fallando.');
  }
  const nx = $('#next'); nx.style.display = 'flex';
  nx.textContent = idx+1 < deck.length ? 'Siguiente' : 'Ver resultado';
  nx.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function next(){ idx++; if(idx >= deck.length) return results(); render(); }

/* ---------------- teclado ---------------- */
document.addEventListener('keydown', e => {
  if(!deck.length) return;
  const q = deck[idx]; if(!q) return;
  const k = e.key.toLowerCase();
  const map = {a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3};
  if(k in map && (q.answered === null || q.answered === undefined)){ e.preventDefault(); answer(map[k]); }
  else if((k === 'enter' || k === ' ') && document.getElementById('next') &&
          $('#next').style.display !== 'none'){ e.preventDefault(); next(); }
});

/* ---------------- resultados ---------------- */
function results(){
  stopTimer();
  const answered = sessionLog.filter(l => !l.blank).length;
  const right = sessionLog.filter(l => l.ok).length;
  const wrong = answered - right;
  const pct = deck.length ? Math.round(right/deck.length*100) : 0;
  P.best = Math.max(P.best||0, pct); saveP();
  $('#hdrRight').textContent = 'Resultado';

  let title, note;
  if(pct >= 90){ title = 'Excelente'; note = 'Nivel de aprobado con mucho margen. Sigue así.'; }
  else if(pct >= 70){ title = 'Muy bien'; note = 'Vas por buen camino. Repasa los fallos y subes más.'; }
  else if(pct >= 50){ title = 'Aprobado'; note = 'Base sólida. El repaso inteligente te lleva más arriba.'; }
  else { title = 'A seguir'; note = 'Cada fallo repasado es un acierto ganado para el examen.'; }

  let neto = '';
  if(mode === 'examen'){
    const n = right - wrong/4;
    const sobre10 = deck.length ? Math.max(0, n/deck.length*10) : 0;
    neto = '<p class="sub" style="margin-top:6px"><b>Nota con penalización ¼:</b> '+
      n.toFixed(2)+' / '+deck.length+' · equivale a un <b>'+sobre10.toFixed(1)+'</b> sobre 10'+
      (sobre10 >= 5 ? ' ✓ aprobado' : '')+'</p>'+
      '<p class="sub">En blanco: '+(deck.length - answered)+'</p>';
  }

  // desglose por tema de esta sesión
  const byT = {};
  sessionLog.forEach(l => { const t = l.q.tema; byT[t] = byT[t] || {n:0,ok:0};
    byT[t].n++; if(l.ok) byT[t].ok++; });
  const rows = Object.keys(byT).sort((a,b) => byT[a].ok/byT[a].n - byT[b].ok/byT[b].n).map(t =>
    '<div class="row"><span class="lb">'+esc(TEMA_LABEL[t]||t)+'</span>'+
    '<span class="bar" style="width:60px;height:6px;border-radius:4px;background:var(--line);overflow:hidden">'+
    '<i style="display:block;height:100%;width:'+Math.round(byT[t].ok/byT[t].n*100)+'%;background:'+
    (byT[t].ok/byT[t].n >= .7 ? 'var(--teal)' : 'var(--amber)')+'"></i></span>'+
    '<span class="sc">'+byT[t].ok+'/'+byT[t].n+'</span></div>').join('');

  const fails = sessionLog.filter(l => !l.ok);
  const revlist = fails.length ? '<div class="revlist"><h3>Repasa estas '+fails.length+'</h3>'+
    fails.map(l => '<div class="rev-item"><p class="rq">'+esc(l.q.q)+'</p>'+
      '<p class="ra">Correcta: <b>'+esc(l.q.opts[l.q.correct].t)+'</b></p>'+
      (l.blank ? '<p class="ra">La dejaste en blanco.</p>'
               : (l.given >= 0 ? '<p class="ra">Marcaste: '+esc(l.q.opts[l.given].t)+'</p>' : ''))+
      (l.q.expl ? '<p class="re">'+esc(l.q.expl)+'</p>' : '')+'</div>').join('')+'</div>' : '';

  screenEl.innerHTML =
    '<div class="card res">'+ring(pct, 'esta sesión', pct >= 70 ? 'var(--teal)' : 'var(--amber)')+
      '<h1>'+title+'</h1>'+
      '<p class="sub">'+right+' de '+deck.length+' correctas'+(mode !== 'examen' ? ' · mejor racha '+best : '')+'</p>'+
      neto+
      '<p class="sub" style="margin-top:8px">'+note+'</p>'+
      (rows ? '<div class="tbreak">'+rows+'</div>' : '')+
      (fails.length ? '<button class="btn amber" onclick="repeatFails()">Repetir estas '+fails.length+' ahora</button>' : '')+
      '<button class="btn" onclick="home()">Volver al inicio</button>'+
      revlist+
    '</div>';
  window.scrollTo(0,0);
}
function repeatFails(){
  const qs = sessionLog.filter(l => !l.ok).map(l => BY_ID[l.q._id]).filter(Boolean);
  if(!qs.length) return home();
  mode = 'fallos'; stopTimer(); deck = buildDeck(shuffled(qs)); begin();
}

home();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      // avisa cuando hay una versión nueva esperando
      function offer(sw){
        if(document.querySelector('.banner')) return;
        var b = document.createElement('div');
        b.className = 'banner';
        b.innerHTML = '<span>Hay una versión nueva de la app.</span>';
        var btn = document.createElement('button');
        btn.textContent = 'Actualizar';
        btn.onclick = function(){ sw.postMessage('skipWaiting'); location.reload(); };
        b.appendChild(btn); document.body.appendChild(b);
      }
      if(reg.waiting) offer(reg.waiting);
      reg.addEventListener('updatefound', function(){
        var sw = reg.installing;
        if(!sw) return;
        sw.addEventListener('statechange', function(){
          if(sw.state === 'installed' && navigator.serviceWorker.controller) offer(sw);
        });
      });
      setInterval(function(){ reg.update(); }, 60*60*1000);
    }).catch(function(e){ console.warn('SW fail', e); });
  });
}
</script>
</body>
</html>
