<html lang="es">
<head>
<meta charset="utf-8">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>TCAE Pro · Preparación SERGAS</title>
<style>
  :root{
    --bg:#F4F7F9; --card:#FFFFFF; --ink:#0F1F2E; --ink2:#3C4C5C; --muted:#6B7B8B;
    --line:#E3E9EF; --line2:#CFD8E1;
    --teal:#0E8A7A; --teal-dk:#0B6E62; --teal-soft:#E3F4F1;
    --amber:#B86E00; --amber-soft:#FFF1DB;
    --red:#B93A2E; --red-soft:#FCE9E6;
    --neutral:#D3DBE3;
    --shadow:0 1px 2px rgba(15,31,46,.05),0 8px 24px rgba(15,31,46,.06);
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{max-width:600px;width:100%;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 16px 24px;overflow-x:clip}
  .card,.tiles,.chips,.cov,.leg,.hero{min-width:0;max-width:100%}
  .opt{min-width:0}
  .opt>span:last-child{min-width:0;overflow-wrap:anywhere}
  /* Header */
  .hdr{display:flex;align-items:center;gap:12px;padding:16px 2px 12px}
  .logo{width:38px;height:38px;border-radius:11px;background:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(14,138,122,.25)}
  .logo svg{width:20px;height:20px}
  .hdr .t{line-height:1.15}
  .hdr .t b{font-size:1.05rem;letter-spacing:-.01em;display:block}
  .hdr .t span{font-size:.75rem;color:var(--muted);font-weight:500}
  .hdr .right{margin-left:auto;font-size:.75rem;color:var(--muted);font-weight:600;background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:20px}
  /* Cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);animation:rise .28s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .stack>*+*{margin-top:14px}
  h1{font-size:1.5rem;margin:0 0 2px;letter-spacing:-.02em;font-weight:700}
  h2{font-size:.78rem;margin:0 0 10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .sub{color:var(--muted);margin:0;font-size:.95rem}
  /* Hero ring */
  .hero{display:flex;align-items:center;gap:18px}
  .ring{width:118px;height:118px;flex-shrink:0;position:relative}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .track{fill:none;stroke:var(--line);stroke-width:10}
  .ring .val{fill:none;stroke:var(--teal);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
  .ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .num b{font-size:1.75rem;letter-spacing:-.03em;line-height:1}
  .ring .num span{font-size:.68rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
  .hero .txt{flex:1 1 0;min-width:0;overflow-wrap:anywhere}
  .hero .txt b{display:block;font-size:1.05rem;margin-bottom:4px}
  .hero .txt p{margin:0;color:var(--muted);font-size:.9rem}
  /* Stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .tile{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px;text-align:center;box-shadow:var(--shadow);overflow-wrap:anywhere}
  .tile b{display:block;font-size:1.5rem;letter-spacing:-.02em;line-height:1.1}
  .tile span{display:block;font-size:.7rem;color:var(--muted);font-weight:600;margin-top:4px;text-transform:uppercase;letter-spacing:.04em}
  .tile.amb b{color:var(--amber)}
  .tile.teal b{color:var(--teal)}
  /* Coverage bar */
  .cov{display:flex;height:12px;border-radius:8px;overflow:hidden;gap:2px;background:transparent}
  .cov i{display:block;height:100%}
  .cov .m{background:var(--teal)} .cov .p{background:var(--amber)} .cov .u{background:var(--neutral)}
  .leg{display:flex;flex-wrap:wrap;gap:12px 16px;margin-top:10px;font-size:.8rem;color:var(--ink2)}
  .leg span{display:inline-flex;align-items:center;gap:6px}
  .leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
  /* Buttons */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;background:var(--teal);color:#fff;font-weight:700;border:none;border-radius:14px;padding:15px;font-size:1.02rem;cursor:pointer;box-shadow:0 6px 16px rgba(14,138,122,.22);transition:transform .06s,filter .15s}
  .btn:active{transform:scale(.99)}
  .btn:disabled{opacity:.45;cursor:default;box-shadow:none}
  .btn.amber{background:var(--amber);box-shadow:0 6px 16px rgba(184,110,0,.2)}
  .btn.ghost{background:var(--card);color:var(--ink2);border:1px solid var(--line2);box-shadow:none;font-weight:600}
  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .chip{min-width:0;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:12px 2px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;overflow-wrap:anywhere}
  .chip:active{background:var(--teal-soft);border-color:var(--teal)}
  .chip b{display:block;font-size:1.05rem}
  .chip span{font-size:.68rem;color:var(--muted);font-weight:600}
  /* Quiz */
  .qbar{display:flex;align-items:center;gap:12px;padding:14px 2px 10px}
  .track{flex:1;height:8px;background:var(--line);border-radius:8px;overflow:hidden}
  .track i{display:block;height:100%;width:0;background:var(--teal);border-radius:8px;transition:width .35s}
  .qbar .n{font-size:.85rem;font-weight:700;color:var(--ink2);min-width:44px;text-align:right}
  .qbar .fire{font-size:.85rem;font-weight:700;color:var(--amber)}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--teal-soft);color:var(--teal-dk);font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:20px;margin-bottom:12px;letter-spacing:.02em}
  .pill.rev{background:var(--amber-soft);color:var(--amber)}
  .q{font-size:1.15rem;font-weight:600;margin:0 0 16px;line-height:1.45;color:var(--ink)}
  .opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line2);border-radius:14px;padding:13px 14px;margin:9px 0;font-size:1rem;cursor:pointer;transition:border-color .15s,background .15s,transform .06s;line-height:1.4}
  .opt:active{transform:scale(.995)}
  .opt .k{flex-shrink:0;width:28px;height:28px;border-radius:9px;background:var(--bg);border:1px solid var(--line2);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
  .opt.correct{border-color:var(--teal);background:var(--teal-soft)}
  .opt.correct .k{background:var(--teal);border-color:var(--teal);color:#fff}
  .opt.wrong{border-color:var(--red);background:var(--red-soft)}
  .opt.wrong .k{background:var(--red);border-color:var(--red);color:#fff}
  .opt:disabled{cursor:default;color:var(--ink)}
  .feed{margin-top:12px;padding:13px 14px;border-radius:12px;font-size:.95rem;display:none;line-height:1.5}
  .feed.show{display:block;animation:rise .25s}
  .feed.ok{background:var(--teal-soft);border:1px solid #BFE5DE;color:var(--ink)}
  .feed.no{background:var(--red-soft);border:1px solid #F3C9C3;color:var(--ink)}
  .feed b{color:var(--ink)}
  .feed .h{display:block;font-weight:700;margin-bottom:4px}
  .feed .h.ok{color:var(--teal-dk)} .feed .h.no{color:var(--red)}
  .feed small{color:var(--muted)}
  /* Results */
  .res{text-align:center}
  .res .ring{margin:4px auto 10px;width:140px;height:140px}
  .res .ring .num b{font-size:2rem}
  .res h1{font-size:1.35rem}
  .foot{text-align:center;color:var(--muted);font-size:.75rem;padding:18px 0 0}
  .foot b{color:var(--teal)}
</style>
</head>

<div class="app">
  <div class="hdr">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>

<script>
const DATA = [{"sim": "1", "q": "Según el ciclo evaluativo de la calidad asistencial, el enfoque clásico de Donabedian evalúa la calidad a través de:", "opts": ["Eficacia, eficiencia y efectividad", "Estructura, proceso y resultado", "Planificación, ejecución y control", "Accesibilidad, equidad y satisfacción"], "correct": 1, "expl": "Donabedian: estructura (recursos), proceso (actividades) y resultado (efectos). Tema esp. 1"}, {"sim": "1", "q": "La coordinación entre niveles asistenciales se refiere a la relación entre:", "opts": ["Los distintos servicios de un mismo hospital", "Atención primaria y atención hospitalaria (especializada)", "El personal sanitario y no sanitario", "La sanidad pública y la privada"], "correct": 1, "expl": "Niveles asistenciales = atención primaria ↔ atención hospitalaria/especializada. Tema esp. 2"}, {"sim": "1", "q": "Los cuatro principios fundamentales de la bioética son:", "opts": ["Beneficencia, no maleficencia, autonomía y justicia", "Beneficencia, legalidad, equidad y secreto", "Autonomía, confidencialidad, justicia y veracidad", "No maleficencia, universalidad, gratuidad y autonomía"], "correct": 0, "expl": "Los 4 principios clásicos de la bioética (Beauchamp y Childress): beneficencia, no maleficencia, autonomía y justicia. Tema esp. 3 — cae muchísimo"}, {"sim": "1", "q": "La historia clínica es un documento:", "opts": ["No clínico de tipo administrativo", "Clínico, único por paciente e institución", "Clínico, propiedad exclusiva del médico", "No clínico intrahospitalario"], "correct": 1, "expl": "La historia clínica es el documento clínico por excelencia, única por paciente e institución. Tema esp. 3"}, {"sim": "1", "q": "Las vacunas deben conservarse habitualmente a una temperatura de:", "opts": ["Entre 0 °C y 4 °C", "Entre +2 °C y +8 °C", "Por debajo de 0 °C", "A temperatura ambiente, protegidas de la luz"], "correct": 1, "expl": "Cadena de frío: +2 °C a +8 °C. Pregunta clásica del SERGAS. Tema esp. 4"}, {"sim": "1", "q": "En la cadena del frío, el responsable del control diario de la temperatura de la nevera de vacunas debe registrarla:", "opts": ["Una vez por semana", "Solo cuando se reciben vacunas nuevas", "Al inicio y al final de cada jornada laboral", "Una vez al mes"], "correct": 2, "expl": "El registro de temperatura de la nevera de vacunas se hace al inicio y al final de cada jornada. Tema esp. 4"}, {"sim": "1", "q": "La escucha activa, dentro de las habilidades de comunicación, implica:", "opts": ["Oír al paciente mientras se realizan otras tareas", "Atender, comprender y devolver señales de comprensión al paciente", "Interrumpir para ahorrar tiempo asistencial", "Escuchar únicamente los datos clínicos relevantes"], "correct": 1, "expl": "Escucha activa = atender + comprender + retroalimentar. Tema esp. 5"}, {"sim": "1", "q": "Una intranet es:", "opts": ["Una red pública de acceso universal", "Una red privada interna de una organización", "Un programa procesador de textos", "Un tipo de correo electrónico cifrado"], "correct": 1, "expl": "Intranet = red privada interna de la organización. Tema esp. 6"}, {"sim": "1", "q": "En la higiene del paciente encamado, el orden correcto del lavado comienza por:", "opts": ["Ojos y cara, siguiendo en sentido céfalo-caudal", "Extremidades inferiores, en sentido ascendente", "Región genital, por ser la zona más contaminada", "Espalda y nalgas, con el paciente en decúbito lateral"], "correct": 0, "expl": "El aseo sigue sentido céfalo-caudal, empezando por ojos/cara (de lo más limpio a lo más sucio). Tema esp. 7"}, {"sim": "1", "q": "En el baño del neonato, la temperatura del agua debe estar en torno a:", "opts": ["30-32 °C", "34-37 °C", "38-40 °C", "27-29 °C"], "correct": 1, "expl": "Agua del baño del neonato ≈ 34-37 °C (comprobar con termómetro o codo). Tema esp. 7"}, {"sim": "1", "q": "Para hacer la cama de un paciente encamado, la ropa sucia debe:", "opts": ["Dejarse en el suelo junto a la cama para agilizar", "Depositarse directamente en la bolsa/carro de sucio sin airearla ni pegarla al uniforme", "Sacudirse antes de retirarla para eliminar restos", "Colocarse sobre la mesilla mientras se hace la cama"], "correct": 1, "expl": "La ropa sucia nunca se sacude, no se apoya en el uniforme ni en el suelo: va directa a la bolsa. Tema esp. 8"}, {"sim": "1", "q": "La posición de Fowler consiste en:", "opts": ["Decúbito supino con la cabecera elevada 45° aproximadamente", "Decúbito prono con las piernas flexionadas", "Decúbito lateral izquierdo con rodilla derecha flexionada", "Decúbito supino con la cabeza más baja que los pies"], "correct": 0, "expl": "Fowler: semisentado ~45° (semi-Fowler ~30°, Fowler alta ~90°). Tema esp. 8/9 — clásica"}, {"sim": "1", "q": "La posición de Trendelenburg está indicada en caso de:", "opts": ["Insuficiencia respiratoria aguda", "Lipotimia o shock hipovolémico", "Exploración ginecológica", "Sondaje rectal"], "correct": 1, "expl": "Trendelenburg (cabeza más baja que pies) favorece el riego cerebral: lipotimias, shock. Tema esp. 9"}, {"sim": "1", "q": "La posición genupectoral se utiliza principalmente para:", "opts": ["Exploraciones rectales", "Punción lumbar", "Enemas de retención", "Exploración de mamas"], "correct": 0, "expl": "Genupectoral (rodillas-pecho): exploraciones rectales/proctológicas. Tema esp. 9"}, {"sim": "1", "q": "En los cambios posturales de un paciente encamado con riesgo de úlceras por presión, la frecuencia recomendada general es cada:", "opts": ["1 hora", "2-3 horas", "6 horas", "8 horas"], "correct": 1, "expl": "Cambios posturales: como norma general cada 2-3 horas (individualizando según riesgo). Tema esp. 18"}, {"sim": "1", "q": "Un drenaje tipo Redón es un drenaje:", "opts": ["Pasivo por gravedad", "Activo por vacío (aspirativo)", "Pasivo por capilaridad", "Mixto irrigación-aspiración"], "correct": 1, "expl": "Redón = drenaje activo aspirativo por vacío. Penrose/tejadillo = pasivos. Tema esp. 8"}, {"sim": "1", "q": "La frecuencia cardíaca normal en un adulto en reposo es de:", "opts": ["40-60 latidos por minuto", "60-100 latidos por minuto", "100-120 latidos por minuto", "120-160 latidos por minuto"], "correct": 1, "expl": "FC normal adulto: 60-100 lpm. Tema esp. 10"}, {"sim": "1", "q": "La temperatura axilar normal de un adulto se sitúa aproximadamente entre:", "opts": ["35,0-35,8 °C", "36,0-37,0 °C", "37,5-38,0 °C", "38,0-38,5 °C"], "correct": 1, "expl": "Temperatura axilar normal ≈ 36-37 °C. Tema esp. 10"}, {"sim": "1", "q": "Se denomina febrícula a la temperatura corporal comprendida entre:", "opts": ["36,5 °C y 37 °C", "37,1 °C y 37,9 °C (aprox.)", "38 °C y 39 °C", "Superior a 39 °C"], "correct": 1, "expl": "Febrícula ≈ 37,1-37,9 °C; fiebre ≥ 38 °C. Tema esp. 10"}, {"sim": "1", "q": "El balance hídrico de un paciente es:", "opts": ["La cantidad total de líquidos administrados en 24 h", "La diferencia entre los líquidos ingresados y los eliminados en un período determinado", "El volumen de orina eliminado por sonda vesical", "El peso del paciente en ayunas"], "correct": 1, "expl": "Balance hídrico = ingresos − pérdidas en un período. Tema esp. 10"}, {"sim": "1", "q": "La eupnea en el adulto corresponde a una frecuencia respiratoria de:", "opts": ["8-10 respiraciones por minuto", "12-20 respiraciones por minuto", "22-28 respiraciones por minuto", "30-35 respiraciones por minuto"], "correct": 1, "expl": "Eupnea adulto: 12-20 rpm. Tema esp. 10"}, {"sim": "1", "q": "Para la recogida de orina de 24 horas se debe indicar al paciente que:", "opts": ["Recoja todas las micciones incluyendo la primera de la mañana del primer día", "Deseche la primera micción de la mañana y recoja todas las siguientes hasta la primera del día siguiente inclusive", "Recoja solo la primera y la última micción del día", "Recoja una muestra de cada micción en frascos separados"], "correct": 1, "expl": "Orina de 24 h: se desecha la 1ª micción del primer día y se recoge todo hasta la 1ª del día siguiente inclusive. Tema esp. 11 — muy repetida"}, {"sim": "1", "q": "El urocultivo requiere la recogida de orina:", "opts": ["De la primera parte de la micción", "De la parte media de la micción, con técnica estéril, previa higiene genital", "De cualquier momento de la micción en frasco no estéril", "Siempre mediante sondaje vesical"], "correct": 1, "expl": "Urocultivo: chorro medio, técnica estéril, higiene previa. Tema esp. 11"}, {"sim": "1", "q": "Una colostomía es una ostomía de eliminación que aboca al exterior:", "opts": ["El intestino delgado (íleon)", "El intestino grueso (colon)", "El uréter", "El estómago"], "correct": 1, "expl": "Colostomía = colon; ileostomía = íleon; urostomía = vía urinaria. Tema esp. 11"}, {"sim": "1", "q": "El enema de limpieza en un adulto se administra preferentemente con el paciente en posición de:", "opts": ["Decúbito lateral izquierdo (posición de Sims)", "Decúbito prono", "Decúbito lateral derecho", "Fowler alta"], "correct": 0, "expl": "Enema: decúbito lateral izquierdo/Sims (anatomía del colon sigmoide). Tema esp. 11"}, {"sim": "1", "q": "Según la clasificación de los residuos sanitarios, las agujas y material punzante usado pertenecen a los residuos:", "opts": ["Clase I — residuos generales asimilables a urbanos", "Clase II — residuos sanitarios no específicos", "Clase III — residuos sanitarios especiales (de riesgo)", "Clase IV — residuos citostáticos"], "correct": 2, "expl": "Punzantes/cortantes usados = residuos sanitarios especiales (Clase III). Tema esp. 12"}, {"sim": "1", "q": "Los contenedores para material punzante y cortante deben ser:", "opts": ["Bolsas de plástico resistentes de color rojo", "Recipientes rígidos, imperforables y con cierre hermético", "Cajas de cartón debidamente etiquetadas", "Cualquier recipiente con tapa de rosca"], "correct": 1, "expl": "Contenedores rígidos, imperforables, herméticos (biocontenedores amarillos). Tema esp. 12"}, {"sim": "1", "q": "Las muestras de sangre para gasometría arterial deben transportarse al laboratorio:", "opts": ["A temperatura ambiente, sin prisa", "Lo antes posible y en frío (con hielo)", "En estufa a 37 °C", "Congeladas a -20 °C"], "correct": 1, "expl": "Gasometría: transporte inmediato y en frío para evitar alteración de gases. Tema esp. 12"}, {"sim": "1", "q": "Una dieta absoluta significa que el paciente:", "opts": ["Solo puede tomar líquidos claros", "No puede ingerir nada por vía oral, ni alimentos ni líquidos", "Puede comer todo excepto sal", "Solo puede tomar alimentos triturados"], "correct": 1, "expl": "Dieta absoluta = nada por boca (NPO). Tema esp. 13"}, {"sim": "1", "q": "La dieta hiposódica está indicada principalmente en pacientes con:", "opts": ["Diabetes mellitus", "Hipertensión arterial e insuficiencia cardíaca", "Celiaquía", "Estreñimiento crónico"], "correct": 1, "expl": "Hiposódica: HTA, insuficiencia cardíaca, edemas, hepatopatías con ascitis. Tema esp. 13"}, {"sim": "1", "q": "Antes de administrar alimentación por sonda nasogástrica se debe:", "opts": ["Colocar al paciente en decúbito supino sin almohada", "Comprobar la correcta colocación de la sonda y elevar la cabecera 30-45°", "Administrar el alimento frío directamente de la nevera", "Retirar la sonda y volver a colocarla"], "correct": 1, "expl": "SNG: comprobar colocación + Fowler/semi-Fowler 30-45° para evitar broncoaspiración. Tema esp. 13"}, {"sim": "1", "q": "La alimentación parenteral consiste en administrar los nutrientes por vía:", "opts": ["Oral en forma líquida", "Intravenosa", "Rectal", "Por sonda nasogástrica"], "correct": 1, "expl": "Parenteral = intravenosa (central o periférica). Tema esp. 13"}, {"sim": "1", "q": "La vía de administración de medicamentos más utilizada, cómoda y segura es la:", "opts": ["Intravenosa", "Oral", "Intramuscular", "Sublingual"], "correct": 1, "expl": "Vía oral: la más fisiológica, cómoda, segura y económica. Tema esp. 14"}, {"sim": "1", "q": "Respecto a la caducidad de los medicamentos, señale la respuesta correcta:", "opts": ["Si el envase está sin const $ = s => document.querySelector(s);
const screen = $('#screen');
let deck=[], idx=0, score=0, streak=0, best=0, mode='normal';

function hid(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return 'q'+(h>>>0);}
DATA.forEach(q=>q._id=hid(q.q));
const BY_ID={}; DATA.forEach(q=>BY_ID[q._id]=q);

const KEY='tcae_progress_v2';
function today(){return new Date().toISOString().slice(0,10);}
function loadP(){try{return JSON.parse(localStorage.getItem(KEY))||null;}catch(e){return null;}}
function blankP(){return {totalAns:0,totalCorr:0,fails:{},correct:{},seen:{},lastDay:null,streak:0,best:0};}
let P=loadP()||blankP();
function saveP(){try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}}
function touchDay(){
  const t=today(); if(P.lastDay===t)return;
  if(P.lastDay){const d=Math.round((new Date(t)-new Date(P.lastDay))/86400000);P.streak=d===1?(P.streak||0)+1:1;}
  else P.streak=1;
  P.lastDay=t; saveP();
}
const failCount=()=>Object.keys(P.fails).length;
const masteredCount=()=>Object.keys(P.correct).filter(id=>!P.fails[id]).length;
const seenCount=()=>Object.keys(P.seen).length;
const acc=()=>P.totalAns?Math.round(P.totalCorr/P.totalAns*100):0;

function ring(pct,label){
  const r=46, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(100,pct))/100);
  return '<div class="ring"><svg viewBox="0 0 110 110"><circle class="track" cx="55" cy="55" r="'+r+'"/>'+
    '<circle class="val" cx="55" cy="55" r="'+r+'" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>'+
    '<div class="num"><b>'+pct+'%</b><span>'+label+'</span></div></div>';
}
function dateES(){
  const d=new Date(); const dias=['dom','lun','mar','mié','jue','vie','sáb'];
  const meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return dias[d.getDay()]+' '+d.getDate()+' '+meses[d.getMonth()];
}

function home(){
  touchDay();
  $('#hdrRight').textContent=dateES();
  const total=DATA.length, nf=failCount(), nm=masteredCount(), ns=seenCount();
  const nu=Math.max(0,total-ns);
  const pm=nm/total*100, pp=nf/total*100, pu=nu/total*100;
  const msg = P.totalAns===0 ? 'Empieza con una ronda corta. Cada pregunta que falles la guardo para repasar.'
            : acc()>=80 ? 'Vas muy bien. Mantén el ritmo y repasa tus fallos.'
            : acc()>=60 ? 'Buen progreso. Los repasos son donde más se aprende.'
            : 'Sin prisa. Cada fallo que repasas es un acierto en el examen.';
  screen.innerHTML=
    '<div class="card"><h1>Hola, Cristina</h1><p class="sub">Tu preparación de hoy</p>'+
      '<div class="hero" style="margin-top:14px">'+ring(acc(),'aciertos')+
        '<div class="txt"><b>'+(P.totalAns?P.totalCorr+' de '+P.totalAns+' respondidas':'Sin datos todavía')+'</b><p>'+msg+'</p></div>'+
      '</div></div>'+
    '<div class="tiles">'+
      '<div class="tile amb"><b>'+(P.streak||0)+'</b><span>días seguidos</span></div>'+
      '<div class="tile teal"><b>'+nm+'</b><span>dominadas</span></div>'+
      '<div class="tile"><b>'+nf+'</b><span>por repasar</span></div>'+
    '</div>'+
    '<div class="card"><h2>Cobertura del temario</h2>'+
      '<div class="cov"><i class="m" style="width:'+pm+'%"></i><i class="p" style="width:'+pp+'%"></i><i class="u" style="width:'+pu+'%"></i></div>'+
      '<div class="leg"><span><i style="background:var(--teal)"></i>Dominadas '+nm+'</span><span><i style="background:var(--amber)"></i>Por repasar '+nf+'</span><span><i style="background:var(--neutral)"></i>Sin ver '+nu+'</span></div>'+
      '<button class="btn amber" '+(nf?'':'disabled')+' onclick="startFails()">Repasar mis fallos'+(nf?' · '+nf:'')+'</button>'+
    '</div>'+
    '<div class="card"><h2>Nueva sesión</h2>'+
      '<div class="chips">'+
        '<div class="chip" onclick="start(10)"><b>10</b><span>rápida</span></div>'+
        '<div class="chip" onclick="start(15)"><b>15</b><span>normal</span></div>'+
        '<div class="chip" onclick="start(25)"><b>25</b><span>larga</span></div>'+
        '<div class="chip" onclick="start('+total+')"><b>'+total+'</b><span>completa</span></div>'+
      '</div>'+
      (P.totalAns?'<button class="btn ghost" onclick="resetP()">Reiniciar progreso</button>':'')+
    '</div>';
}
function resetP(){ if(confirm('¿Borrar todo tu progreso y empezar de cero?')){P=blankP();saveP();home();} }

function buildDeck(list){
  return list.map(function(q){
    var opts=q.opts.map(function(t,i){return {t:t,ok:i===q.correct};});
    for(var i=opts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=opts[i];opts[i]=opts[j];opts[j]=tmp;}
    return {_id:q._id,q:q.q,expl:q.expl,sim:q.sim,opts:opts,correct:opts.findIndex(function(o){return o.ok;})};
  });
}
function shuffled(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function start(n){ mode='normal'; deck=buildDeck(shuffled(DATA).slice(0,n)); begin(); }
function startFails(){ mode='fails'; var qs=Object.keys(P.fails).map(function(id){return BY_ID[id];}).filter(Boolean); deck=buildDeck(shuffled(qs)); begin(); }
function begin(){ idx=0;score=0;streak=0;best=0; render(); }

function render(){
  var q=deck[idx];
  $('#hdrRight').textContent=(mode==='fails'?'Repaso':'Sesión');
  var h='<div class="qbar"><div class="track"><i style="width:'+(idx/deck.length*100)+'%"></i></div>'+
        '<div class="n">'+(idx+1)+'/'+deck.length+'</div>'+(streak>=2?'<div class="fire">🔥'+streak+'</div>':'')+'</div>'+
    '<div class="card"><span class="pill'+(mode==='fails'?' rev':'')+'">'+(mode==='fails'?'REPASO DE FALLOS':'SIMULACRO '+q.sim)+'</span>'+
    '<p class="q">'+q.q+'</p><div id="opts">';
  q.opts.forEach(function(o,i){h+='<button class="opt" onclick="answer('+i+')"><span class="k">'+'ABCD'[i]+'</span><span>'+o.t+'</span></button>';});
  h+='</div><div class="feed" id="feed"></div>'+
     '<button class="btn" id="next" style="display:none" onclick="next()">Siguiente</button></div>';
  screen.innerHTML=h;
  window.scrollTo(0,0);
}
function answer(i){
  var q=deck[idx];
  var btns=document.querySelectorAll('.opt');
  btns.forEach(function(b){b.disabled=true;});
  var ok=i===q.correct;
  btns[q.correct].classList.add('correct');
  if(!ok) btns[i].classList.add('wrong');
  P.totalAns++; P.seen[q._id]=true;
  if(ok){ P.totalCorr++; P.correct[q._id]=true; delete P.fails[q._id]; } else { P.fails[q._id]=true; }
  saveP();
  var feed=$('#feed');
  if(ok){
    score++; streak++; best=Math.max(best,streak);
    var c=['Correcto','Muy bien','Exacto','Perfecto'];
    feed.className='feed ok show';
    feed.innerHTML='<span class="h ok">✓ '+c[Math.floor(Math.random()*c.length)]+(streak>=3?' · racha de '+streak:'')+(mode==='fails'?' · sale de tus fallos':'')+'</span>'+(q.expl||'');
  }else{
    streak=0;
    feed.className='feed no show';
    feed.innerHTML='<span class="h no">✕ La correcta era la '+'ABCD'[q.correct]+'</span>'+(q.expl||'Repásalo con calma; se aprende fallando.');
  }
  var nx=$('#next'); nx.style.display='flex';
  nx.textContent=idx+1<deck.length?'Siguiente':'Ver resultado';
  nx.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function next(){ idx++; if(idx>=deck.length) return results(); render(); }

function results(){
  var pct=Math.round(score/deck.length*100);
  P.best=Math.max(P.best||0,pct); saveP();
  $('#hdrRight').textContent='Resultado';
  var title,note;
  if(pct>=90){title='Excelente';note='Nivel de aprobado con margen. Sigue así.';}
  else if(pct>=70){title='Muy bien';note='Vas por buen camino. Repasa los fallos y sube.';}
  else if(pct>=50){title='Aprobado';note='Base sólida. Los repasos te llevarán más arriba.';}
  else{title='Sigue practicando';note='Cada fallo repasado es un acierto ganado para el examen.';}
  var nf=failCount();
  screen.innerHTML=
    '<div class="card res">'+ring(pct,'esta sesión')+
      '<h1>'+title+'</h1><p class="sub">'+score+' de '+deck.length+' correctas · mejor racha '+best+'</p>'+
      '<p class="sub" style="margin-top:8px;color:var(--ink2)">'+note+'</p>'+
      (nf?'<button class="btn amber" onclick="startFails()">Repasar mis fallos · '+nf+'</button>':'')+
      '<button class="btn" onclick="home()">Volver al inicio</button>'+
    '</div>';
  window.scrollTo(0,0);
}
home();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function(e){ console.warn('SW fail', e); });
  });
}
</script>
