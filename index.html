onde desarrolla sus funciones de cuidados auxiliares a los pacientes de forma directa o delegada. El médico nos indica que al paciente de la 304 tenemos que ponerle un enema de limpieza. ¿Qué tipo de enema evacuante utilizaríamos?","caso":"","opts":["Enema de agua solamente.","Enema salino (1/2 cucharada de sal común en 1000 ml de agua).","Enema jabonoso.","Todos son correctos."],"correct":3,"expl":"Enema de limpieza/evacuante: puede ser de agua tibia, salino (suero fisiológico o sal en agua) o jabonoso (jabón neutro), 500-1500 ml en el adulto a 37-40 °C. Todos son correctos.","tema":"eliminacion","bloque":"Eliminación, sondajes y ostomías"},{"sim":"O","tag":"OPE SERGAS","n":"O218","q":"En relación con la indicación de la povidona yodada en función de la disolución, señale la FALSA.","caso":"","opts":["La solución jabonosa al 7,5% se utiliza generalmente para el lavado de manos quirúrgico.","La solución acuosa al 0,3% se utiliza generalmente para la desinfección vaginal.","La pomada o gel al 10% se utiliza generalmente para la impregnación de apósitos sobre catéteres.","La solución isotónica al 0,1% se utiliza generalmente para la desinfección para la punción."],"correct":3,"expl":"Povidona yodada: jabonosa 7,5 % para lavado quirúrgico de manos; solución 10 % (dérmica) para piel, punciones y apósitos de catéteres; solución vaginal/bucal diluida. No existe una \"isotónica al 0,1 %\" para punción: es la falsa.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O219","q":"Señale el enunciado CORRECTO de las siguientes disoluciones de clorhexidina.","caso":"","opts":["La solución alcohólica al 0,5-2% de clorhexidina está indicada para el lavado quirúrgico de manos.","La solución acuosa al 0,05% de clorhexidina está indicada para la lubricación de catéteres vesicales.","La solución acuosa al 4% de clorhexidina con detergente no iónico está indicada para el lavado quirúrgico de manos.","La solución acuosa al 1% de clorhexidina está indicada para la lubricación de catéteres vesicales."],"correct":2,"expl":"Clorhexidina: solución jabonosa/acuosa al 4 % con detergente para lavado quirúrgico e higiénico de manos; alcohólica 0,5-2 % para piel antes de punciones; acuosa 0,05-0,1 % para mucosas y heridas; gel/lubricante para sondajes.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O220","q":"Nos encontramos ante un paciente ingresado en la unidad de urología, al que se le han formado coágulos. Maribel, enfermera en esta planta, nos pide que le facilitemos una sonda de irrigación vesical. ¿Cuál de las siguientes le llevaremos?","caso":"","opts":["Suero salino.","Foley de tres vías.","Foley de dos vías.","Rígida acanalada."],"correct":1,"expl":"Para la irrigación vesical continua (coágulos tras cirugía prostática/vesical) se usa la sonda Foley de TRES vías: una para el balón, otra para el drenaje y otra para la entrada de suero de lavado.","tema":"eliminacion","bloque":"Eliminación, sondajes y ostomías"},{"sim":"O","tag":"OPE SERGAS","n":"O221","q":"En la unidad de cirugía tenemos a José, un paciente que va a ser sometido a una intervención quirúrgica debido a un tumor de colon. Respecto al consentimiento informado, ¿qué es falso?","caso":"","opts":["Protege al paciente contra intervenciones no autorizadas.","Protege al cirujano de demandas ante una operación que no se permitió.","Independientemente de la edad del paciente, el consentimiento debe ser firmado por el paciente.","En caso de incapacidad del paciente, el documento lo firmará el familiar responsable o tutor."],"correct":2,"expl":"El consentimiento lo firma el paciente capaz; en menores (salvo mayores de 16 años en la mayoría de actuaciones) o incapaces lo firma el representante legal/familiar. \"Independientemente de la edad\" es falso.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O222","q":"Elena, paciente de 80 años, ingresa en la unidad de medicina interna con una frecuencia respiratoria de 26 r.p.m. Diremos, por lo tanto, que presenta:","caso":"","opts":["Taquipnea.","Hiperpnea.","Bradipnea.","Disnea."],"correct":0,"expl":"Taquipnea = frecuencia respiratoria >20 rpm en el adulto (26 rpm lo es). Bradipnea <12 rpm. Hiperpnea = respiración profunda (aumento de volumen), no de frecuencia. Disnea = sensación de falta de aire.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O223","q":"Un niño de 12 años ingresa con rigidez de nuca, vómitos, fiebre alta y cefalea intensa. Le diagnostican una meningitis. ¿Qué tipo de prueba realizaron para llegar al diagnóstico?","caso":"","opts":["Una toracocentesis.","Una gammagrafía cerebral.","Una biopsia de médula espinal.","Una punción lumbar."],"correct":3,"expl":"La meningitis se diagnostica analizando el líquido cefalorraquídeo obtenido por PUNCIÓN LUMBAR (entre L3-L4 o L4-L5). La toracocentesis extrae líquido pleural.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O224","q":"Respecto al programa GACELA, es correcto que:","caso":"","opts":["Se estructura en varios módulos.","Está implantado en toda la red asistencial gallega.","Está hecho para enfermería, tanto para enfermeras/os como técnicos/as en cuidados auxiliares de enfermería.","Todas son correctas."],"correct":3,"expl":"GACELA es el programa de gestión de cuidados de enfermería del SERGAS: modular, implantado en la red asistencial gallega y usado por enfermería y TCAE (registros de cuidados, constantes, dietas). Todas correctas.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O225","q":"Mario es un recién nacido que al minuto de nacer presenta un test de Apgar de 4 a 6 puntos. ¿Qué afirmación de las siguientes es la correcta?","caso":"","opts":["Dificultad grave.","Dificultad moderada.","No hay dificultad (normal).","Ninguna es correcta."],"correct":1,"expl":"Apgar: 7-10 normal; 4-6 dificultad MODERADA (necesita estimulación/oxígeno); 0-3 dificultad grave (reanimación).","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O226","q":"María trabaja en el servicio de traumatología, tiene que realizar el aseo en cama de Manuel, paciente ingresado en la habitación 315. ¿Cuál será la forma correcta de posicionar al paciente?","caso":"","opts":["Primero en decúbito supino y a continuación en decúbito lateral derecho e izquierdo.","Decúbito prono y después en decúbito lateral derecho e izquierdo.","Dependería de la patología del paciente.","Decúbito lateral derecho e izquierdo y luego en decúbito supino."],"correct":2,"expl":"El orden de posiciones para el aseo en cama depende de la patología del paciente (fracturas, cirugía, dificultad respiratoria): en general supino y después lateral para la espalda, pero siempre adaptado a su situación.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"O","tag":"OPE SERGAS","n":"O227","q":"Clara se encuentra trabajando en la 2ª planta, le indican que aplique calor seco a un paciente con una contractura muscular. De los siguientes modos, ¿cuál estaría contraindicado?","caso":"","opts":["Calentadores eléctricos.","Manta de hipotermia.","Bolsa de agua caliente.","Manta eléctrica."],"correct":1,"expl":"Para aplicar calor seco sirven manta eléctrica, bolsa de agua caliente, calentadores/lámparas. La manta de HIPOTERMIA sirve para enfriar (bajar la temperatura), no para dar calor: está contraindicada para una contractura.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O228","q":"Al acceder a la zona de rayos, nos encontramos un panel pegado a la puerta con un círculo y hojas de trébol a su alrededor de color amarillo.","caso":"","opts":["El panel está indicando que accedemos a una zona de acceso prohibido.","El panel está indicando que solo puede acceder el personal con ese distintivo amarillo.","El panel está indicando que accedemos a una zona de permanencia limitada.","El panel está indicando que accedemos a una zona controlada."],"correct":2,"expl":"Señalización radiológica (trébol): gris-azulado = zona vigilada; VERDE = zona controlada; AMARILLO = zona de permanencia limitada; naranja = permanencia reglamentada; rojo = acceso prohibido.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O229","q":"Andrés, TCAE de una unidad hospitalaria, después de hacer sus tareas habituales, tiene que realizar un lavado de manos rutinario o higiénico. ¿Cuánto tiempo prolongará este tipo de lavado?","caso":"","opts":["15-30 segundos.","30-60 segundos.","2-6 minutos.","Ninguna es correcta."],"correct":0,"expl":"Lavado de manos higiénico o rutinario: agua y jabón durante 15-30 segundos (40-60 s el procedimiento completo). Antiséptico: 30-60 s. Quirúrgico: 2-6 minutos.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O230","q":"En las unidades de psiquiatría, el personal TCAE tendrá como funciones. Señale la INCORRECTA.","caso":"","opts":["Ayudar en las necesidades del paciente para levantarse y estimularlo para que realice su aseo y arreglo personal.","Realizar funciones de apoyo en la vigilancia de la toma correcta de la medicación, por si algún paciente pierde o esconde las pastillas.","Preparar directamente la medicación de los pacientes en los vasos unidosis según la orden facultativa.","Acompañar en la sala de entretenimiento a los pacientes para ayudarles en las posibles actividades a desarrollar."],"correct":2,"expl":"En psiquiatría el TCAE ayuda en el aseo, acompaña en actividades y colabora en la vigilancia de que el paciente tome la medicación. Pero NO prepara la medicación en unidosis: eso es función de enfermería.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O231","q":"Jorge, paciente de 24 años de edad, inmunodeprimido, el médico le prescribe un aislamiento protector o inverso. Marque la opción falsa acerca de este tipo de aislamiento.","caso":"","opts":["La habitación será individual y con presión positiva.","El material de limpieza será exclusivo para esa habitación.","En la dieta prescrita estarán prohibidos los alimentos crudos (frutas, verduras).","La habitación será individual y con presión negativa."],"correct":3,"expl":"Aislamiento protector o inverso (inmunodeprimidos): habitación individual con presión POSITIVA (el aire sale, no entra), material exclusivo, sin flores ni alimentos crudos. La presión negativa es la del aislamiento aéreo (tuberculosis).","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O232","q":"El equipo de enfermería recibe la orden de colocar una vía intravenosa al paciente de la habitación 101-1 para la perfusión de una solución electrolítica. ¿Qué material NO será estrictamente necesario para ayudar a la enfermera en dicha colocación?","caso":"","opts":["Solución para perfundir con la identificación completa.","Pie de gotero para colgar el recipiente que contiene la solución.","Venda de presión kinesiotaping.","Gasas y sistema de punción."],"correct":2,"expl":"Para canalizar una vía intravenosa se necesita: catéter/sistema de punción, compresor (torniquete), antiséptico, gasas, apósito, solución identificada y pie de gotero. La venda kinesiotaping no tiene nada que ver.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O233","q":"Como técnicos/as en cuidados auxiliares de enfermería, sabemos que el esfigmomanómetro sirve para:","caso":"","opts":["Medir la respiración.","Medir la tensión arterial.","Medir la frecuencia cardíaca.","Medir la tensión venosa."],"correct":1,"expl":"El esfigmomanómetro (manguito + manómetro), con el fonendoscopio, mide la TENSIÓN ARTERIAL. El pulsioxímetro mide saturación y frecuencia cardíaca.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O234","q":"¿Qué método utilizará para la esterilización de instrumental óptico?","caso":"","opts":["Calor seco.","Ácido peracético líquido.","Óxido de etileno.","Óxido de anhídrido."],"correct":2,"expl":"Instrumental óptico (endoscopios, lentes) es termosensible: se esteriliza con ÓXIDO DE ETILENO o gas plasma (peróxido de hidrógeno) a baja temperatura. El calor seco y el autoclave lo estropearían. El ácido peracético líquido es desinfección de alto nivel.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O235","q":"Tenemos un paciente en la planta con reflujo gastroesofágico importante. ¿En qué posición lo colocamos para que mejore la sintomatología?","caso":"","opts":["Trendelenburg.","Decúbito supino.","Decúbito prono.","Fowler."],"correct":3,"expl":"Reflujo gastroesofágico: posición de FOWLER (semisentado, cabecera elevada 45°) para que la gravedad dificulte el ascenso del contenido gástrico; también tras las comidas y durante la alimentación por sonda.","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"O","tag":"OPE SERGAS","n":"O236","q":"El médico del servicio de medicina interna ordena a la enfermera la extracción de hemocultivos a Juan, paciente de la habitación 206. ¿Cuándo debe la enfermera realizar dicha extracción?","caso":"","opts":["Siempre a primera hora de la mañana.","En cualquier momento a lo largo del día, cuando el paciente no presente fiebre.","Cuando el paciente presente un pico febril.","Siempre de noche."],"correct":2,"expl":"Los hemocultivos se extraen cuando el paciente tiene un PICO FEBRIL o escalofríos (máxima bacteriemia), antes de iniciar antibióticos, normalmente 2-3 muestras de venas distintas.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O237","q":"La Ley General de Sanidad establece en su artículo tercero que los medios y actuaciones del sistema sanitario estarán orientados prioritariamente a:","caso":"","opts":["La promoción del bienestar social.","La educación sanitaria y la rehabilitación.","La vigilancia y control de los posibles riesgos para la salud.","La promoción de la salud y la prevención de las enfermedades."],"correct":3,"expl":"Ley General de Sanidad, art. 3.1: los medios y actuaciones del sistema sanitario estarán orientados prioritariamente a la promoción de la salud y a la prevención de las enfermedades.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O238","q":"Indique cuál de las siguientes NO es una situación administrativa del personal estatutario:","caso":"","opts":["Servicio activo.","Servicios especiales.","Excedencia voluntaria.","Incapacidad permanente."],"correct":3,"expl":"Situaciones administrativas del personal estatutario (Estatuto Marco, art. 62): servicio activo, servicios especiales, servicios bajo otro régimen jurídico, excedencia (voluntaria, por cuidado de familiares, por servicios en el sector público) y suspensión de funciones. La incapacidad permanente es causa de pérdida de la condición, no una situación.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O239","q":"Según el artículo 42 del Estatuto Marco, las retribuciones básicas son:","caso":"","opts":["El sueldo, los trienios y el complemento de destino.","El sueldo y los trienios y el complemento de carrera.","El sueldo, los trienios y las pagas extraordinarias.","El sueldo, los trienios y el complemento específico."],"correct":2,"expl":"Estatuto Marco, art. 42: retribuciones BÁSICAS = sueldo, trienios y pagas extraordinarias. Complementarias: destino, específico, productividad, atención continuada y carrera profesional.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O240","q":"NO corresponde a la Consellería de Sanidad el ejercicio de la siguiente competencia:","caso":"","opts":["Los acuerdos de creación de hospitales públicos en Galicia.","La inspección sanitaria en su ámbito competencial.","La aprobación del anteproyecto de presupuesto del Servicio Gallego de Salud.","El nombramiento y cese del personal directivo de la Consellería de Sanidad."],"correct":0,"expl":"Ley 8/2008 de salud de Galicia: la creación de hospitales públicos corresponde al Consello de la Xunta (por decreto), no a la Consellería. La inspección, el anteproyecto de presupuesto del SERGAS y el nombramiento de directivos sí son competencias de la Consellería.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O241","q":"La Comisión contra la Violencia de Género prevista en la Ley 1/2004 está constituida en el seno del:","caso":"","opts":["Congreso de los Diputados.","Servicio de Salud de cada Comunidad Autónoma.","Consejo Interterritorial del Sistema Nacional de Salud.","Senado."],"correct":2,"expl":"Ley Orgánica 1/2004 de violencia de género, art. 16: la Comisión contra la Violencia de Género se constituye en el seno del Consejo Interterritorial del Sistema Nacional de Salud.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O242","q":"Se entiende por riesgo laboral:","caso":"","opts":["Cualquier característica del trabajo que pueda afectar a la seguridad y la salud del trabajador.","Cualquier actividad que, en ausencia de medidas preventivas específicas, origine daños en la salud de los trabajadores.","Las enfermedades, patologías o lesiones sufridas con motivo u ocasión del trabajo.","La posibilidad de que un trabajador sufra un determinado daño derivado del trabajo."],"correct":3,"expl":"Ley 31/1995 PRL, art. 4: riesgo laboral = posibilidad de que un trabajador sufra un determinado daño derivado del trabajo. Daños derivados del trabajo = enfermedades, patologías o lesiones sufridas con motivo u ocasión del trabajo.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O243","q":"El Decreto 206/2005 de provisión de plazas de personal estatutario establece que, por necesidades del servicio, y cuando una plaza o puesto de trabajo se encuentre vacante o temporalmente desatendido, podrá ser cubierto en comisión de servicios:","caso":"","opts":["Por personal estatutario fijo o temporal.","Por personal funcionario o estatutario.","Por personal fijo de la correspondiente categoría y especialidad.","Por personal estatutario de la misma o superior categoría."],"correct":2,"expl":"Decreto 206/2005: la comisión de servicios para cubrir una plaza vacante o desatendida se realiza con personal estatutario FIJO de la correspondiente categoría y especialidad.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O244","q":"En relación con los distritos sanitarios, la Ley de Salud de Galicia establece que:","caso":"","opts":["Son divisiones territoriales de las zonas sanitarias.","El Sistema Público de Salud de Galicia se configura en 12 distritos sanitarios.","Cada distrito sanitario contará con un hospital en su ámbito geográfico.","Son las unidades básicas de prestación de servicios sanitarios."],"correct":2,"expl":"Ley 8/2008 de salud de Galicia: las áreas sanitarias se dividen en distritos sanitarios, y cada distrito cuenta con un hospital en su ámbito geográfico. Los distritos se dividen a su vez en zonas sanitarias (unidad básica).","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O245","q":"¿Cuál de los siguientes NO se establece como un derecho de las personas en la Ley Orgánica 3/2018, del 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales?","caso":"","opts":["Supresión.","Rectificación.","No portabilidad.","Limitación del tratamiento."],"correct":2,"expl":"Derechos de la LO 3/2018 (y RGPD): acceso, rectificación, supresión (olvido), limitación del tratamiento, PORTABILIDAD y oposición. \"No portabilidad\" no existe.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O246","q":"Según el Decreto 206/2005 de provisión de plazas de personal estatutario, en el concurso-oposición la puntuación máxima de la fase de concurso:","caso":"","opts":["No podrá exceder del 60% de la puntuación máxima del proceso selectivo.","No podrá exceder del 40% de la puntuación máxima del proceso selectivo.","No podrá exceder del 50% de la puntuación máxima del proceso selectivo.","La puntuación de la fase de concurso podrá aplicarse para superar la fase de oposición."],"correct":1,"expl":"Decreto 206/2005: en el concurso-oposición la puntuación de la fase de concurso no podrá exceder del 40 % de la puntuación máxima total, y no sirve para superar la fase de oposición.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O247","q":"Es una actuación que compete a la Administración estatal según la Ley General de Sanidad:","caso":"","opts":["El control sanitario de edificios y lugares de vivienda y convivencia humana.","El nombramiento de los Consejos de Salud de Área.","La reglamentación, autorización y registro u homologación de los medicamentos de uso humano y veterinario.","El control sanitario de la distribución y suministro de alimentos y bebidas."],"correct":2,"expl":"Ley General de Sanidad, art. 40: competencias del Estado = reglamentación, autorización y registro de medicamentos de uso humano y veterinario, sanidad exterior, coordinación, etc. El control de edificios, alimentos y los Consejos de Salud de Área son autonómicos/locales.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O248","q":"Indique cuál de las siguientes NO es una clasificación del personal estatutario según el Estatuto Marco:","caso":"","opts":["La función desarrollada.","El nivel del título exigido para el ingreso.","El régimen jurídico.","El tipo de su nombramiento."],"correct":2,"expl":"Estatuto Marco, art. 5: el personal estatutario se clasifica por la función desarrollada (sanitario/gestión y servicios), por el nivel del título exigido y por el tipo de nombramiento (fijo/temporal). El \"régimen jurídico\" no es un criterio.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O249","q":"Señale la respuesta INCORRECTA en relación con las Úlceras por Presión (UPP).","caso":"","opts":["Cuando un paciente está en posición de sedestación debe reposicionarse cada 15 minutos.","La presencia de temperatura corporal elevada está asociada con la aparición de UPP.","Las zonas de aparición de UPP más frecuentes en neonatos son glúteos y talones.","En los pacientes con riesgo de desarrollar UPP se deben registrar los cambios posturales especificando la frecuencia y la posición, incluyendo una evaluación de los resultados observados."],"correct":2,"expl":"En neonatos y lactantes la zona más frecuente de UPP es el OCCIPUCIO (cabeza proporcionalmente grande), no glúteos y talones. El resto es correcto: en sedestación reposicionar cada 15 min, la fiebre aumenta el riesgo y hay que registrar los cambios posturales.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"O","tag":"OPE SERGAS","n":"O250","q":"¿Cuál es la primera acción a llevar a cabo ante una quemadura eléctrica?","caso":"","opts":["Iniciar maniobra RCP.","Comprobar pulso y respiración.","Cubrir la zona quemada.","Desconectar la corriente antes de tocar a la víctima."],"correct":3,"expl":"Quemadura eléctrica: lo PRIMERO es desconectar la corriente (o separar a la víctima con material aislante) antes de tocarla; después valorar consciencia, respiración y pulso, e iniciar RCP si procede.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O251","q":"Donabedian clasifica los criterios de calidad en función de varias características. Según el grado de especificación estos criterios pueden ser:","caso":"","opts":["Encadenados o transversales.","Ponderados o isovalentes.","Implícitos o explícitos.","Específicos o generales"],"correct":2,"expl":"Donabedian: según el grado de especificación, los criterios de calidad son IMPLÍCITOS (juicio del experto) o EXPLÍCITOS (definidos por escrito de antemano). Según el enfoque: estructura, proceso y resultado.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O252","q":"Las necesidades básicas según Virginia Henderson son:","caso":"","opts":["Comunicarse.","Comer, beber y descansar.","Evitar peligros y recrearse.","Todas las anteriores son correctas."],"correct":3,"expl":"Las 14 necesidades de Virginia Henderson incluyen comer y beber, descansar/dormir, comunicarse, evitar peligros, recrearse, respirar, eliminar, moverse, vestirse, temperatura, higiene, creencias, trabajar y aprender. Todas correctas.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O253","q":"¿Cuántas gotas equivalen a 1 ml en los sistemas de perfusión normales?","caso":"","opts":["30 gotas.","20 gotas.","60 gotas.","Ninguna es correcta."],"correct":1,"expl":"Sistema de perfusión normal (macrogotero): 1 ml = 20 gotas. Microgotero: 1 ml = 60 microgotas. Regla: gotas/min = ml/h ÷ 3.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O254","q":"La Diatermia consiste en:","caso":"","opts":["Aplicación de calor de forma superficial.","Aplicación de calor mediante baños de parafina.","Aplicación de calor de forma profunda.","Aplicación de calor mediante convección."],"correct":2,"expl":"Diatermia: aplicación de calor PROFUNDO mediante corrientes de alta frecuencia (onda corta, microondas). La parafina y los baños son calor superficial.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O255","q":"Al método curativo que utiliza el trabajo manual en la reeducación de los pacientes psiquiátricos, para su reinserción en la vida social, lo llamamos:","caso":"","opts":["Ludoterapia.","Socioterapia.","Ergoterapia.","TEC."],"correct":2,"expl":"Ergoterapia (terapia ocupacional): rehabilitación mediante el trabajo manual para reinsertar al paciente psiquiátrico en la vida social. Ludoterapia = juego; socioterapia = relaciones de grupo; TEC = terapia electroconvulsiva.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O256","q":"El aporte de sustancias nutrientes digeridas, por vía oral, se denomina:","caso":"","opts":["Nutrición parenteral.","Nutrición forzada.","Nutrición enteral.","Nutrición nasogástrica."],"correct":2,"expl":"Nutrición ENTERAL = aporte de nutrientes al tubo digestivo (por boca, con fórmulas, o por sonda). Parenteral = por vía intravenosa. La nasogástrica es una modalidad de enteral por sonda.","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"O","tag":"OPE SERGAS","n":"O257","q":"¿Para qué son útiles las habilidades de comunicación en la práctica clínica?","caso":"","opts":["Son necesarias desde el mero hecho del análisis al paciente como una unidad integral, (bio-psico, social, espiritual y cultural).","Son necesarias desde el mero hecho del análisis al paciente como una unidad independiente, (bio-psico, local, espiritual y cultural).","Son necesarias desde el mero hecho del análisis al paciente como una unidad individual, (bio-psico, social, espiritual y cultural).","Son necesarias desde el mero hecho del análisis al paciente como una unidad incompleta, (bio-psico, social, espiritual y cultural)."],"correct":0,"expl":"Las habilidades de comunicación son necesarias porque el paciente se aborda como una unidad INTEGRAL: bio-psico-social, espiritual y cultural.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O258","q":"De los siguientes accesorios, ¿cuál tiene como objetivo prevenir que los pacientes se caigan o golpeen contra las barandillas?","caso":"","opts":["Arcos de cama.","Rejas de seguridad.","Barras de tracción.","Protectores de barandillas de la cama."],"correct":3,"expl":"Los protectores de barandillas (almohadillados) evitan que el paciente se golpee o quede atrapado contra ellas. El arco de cama evita el peso de la ropa; las barras de tracción son para traumatología.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"O","tag":"OPE SERGAS","n":"O259","q":"Un paciente que tiene TA 190/110 mmHg y una frecuencia cardíaca de 110 lpm, presenta:","caso":"","opts":["Hipotensión y bradicardia.","Hipertensión y taquicardia.","Normotensión y taquicardia.","Hipertensión y pulso normal."],"correct":1,"expl":"TA 190/110 mmHg = hipertensión (normal <140/90; hipertensión ≥140/90). FC 110 lpm = taquicardia (>100 lpm). Bradicardia <60 lpm.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O260","q":"NO es cierto del Proceso de Atención de Enfermería (PAE) que:","caso":"","opts":["Consta de cinco etapas.","Forma parte de la historia de enfermería.","Es un proceso lineal.","Está informatizado."],"correct":2,"expl":"El PAE es un proceso CÍCLICO y dinámico (no lineal): valoración, diagnóstico, planificación, ejecución y evaluación; si la evaluación no es satisfactoria, se vuelve a empezar. Forma parte de la historia de enfermería y está informatizado (GACELA).","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O261","q":"Los residuos de vacunas con agentes vivos o atenuados son clasificados como:","caso":"","opts":["Clase IV: residuos de citotóxicos y citostáticos.","Clase IIa: residuos específicos de la actividad sanitaria.","Clase IIb: residuos no específicos de la actividad sanitaria.","Clase III: residuos sanitarios biocontaminados."],"correct":3,"expl":"Residuos de vacunas de agentes vivos o atenuados = clase III (residuos sanitarios peligrosos biocontaminados), igual que agujas, cultivos, sangre y material de aislamientos infecciosos.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O262","q":"En el balance hídrico, donde los líquidos ingresados son iguales a los perdidos, el paciente se encuentra en el estado:","caso":"","opts":["Hipervolémico.","Hipovolémico.","Euvolémico.","Todas son falsas."],"correct":2,"expl":"Balance hídrico equilibrado (entradas = salidas) = EUVOLEMIA. Hipervolemia = exceso de líquido (balance positivo). Hipovolemia = déficit (balance negativo).","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O263","q":"¿En cuál de las siguientes situaciones debería realizar la maniobra frente-mentón?","caso":"","opts":["Ante un enfermo consciente que presenta respiración espontánea.","Ante un enfermo con posible obstrucción de la vía aérea.","Ante un enfermo con posible obstrucción severa de las vías respiratorias.","En una víctima inconsciente que no responde a estímulos."],"correct":2,"expl":"La maniobra frente-mentón abre la vía aérea en la víctima INCONSCIENTE (la lengua cae hacia atrás). El tribunal dio como correcta la opción C; en un paciente consciente que respira no se realiza. Ante sospecha de lesión cervical se usa la tracción mandibular.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O264","q":"¿Cuál de las siguientes consideraciones sobre la muerte NO es verdadera?","caso":"","opts":["La muerte implica un proceso de duelo por las pérdidas que conlleva.","Las muertes esperadas durante un cierto tiempo pueden provocar una resolución anticipada del duelo.","El significado que se atribuye a la muerte de un miembro de la familia no varía con la edad.","Las creencias y valores pueden determinar la visión de la muerte propia o de los demás."],"correct":2,"expl":"El significado de la muerte de un familiar SÍ varía con la edad (niños, adolescentes y adultos la viven de forma diferente). El duelo, la resolución anticipada en muertes esperadas y la influencia de creencias y valores son ciertos.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O265","q":"La parada cardiorrespiratoria (PCR) se puede definir como:","caso":"","opts":["Cese brusco, inesperado y potencialmente reversible de la circulación y ventilación espontánea.","Cese brusco de la actividad cardíaca.","Cese brusco de la actividad cardíaca y respiratoria.","Pérdida de la conciencia y cese súbito de la actividad cardiovascular."],"correct":0,"expl":"PCR = cese brusco, inesperado y potencialmente REVERSIBLE de la circulación y la ventilación espontáneas. Si no es reversible o es esperada (enfermedad terminal), no se considera PCR a efectos de RCP.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O266","q":"Los motivos para realizar una exploración médica son:","caso":"","opts":["El diagnóstico de una enfermedad.","Un reconocimiento laboral.","Programas de prevención.","Todas son correctas."],"correct":3,"expl":"La exploración médica se realiza para diagnosticar enfermedades, en reconocimientos laborales y en programas de prevención/cribado. Todas correctas.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O267","q":"Los servicios sanitarios de calidad deben ser:","caso":"","opts":["Centrados en la persona y oportunos.","Eficaces y seguros.","Equitativos, eficientes e integrados.","Todas son correctas."],"correct":3,"expl":"Atributos de la calidad asistencial (OMS): centrada en la persona, oportuna, eficaz, segura, equitativa, eficiente e integrada. Todas correctas.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O268","q":"¿A qué se refiere la infectividad de una enfermedad?","caso":"","opts":["Capacidad del agente para extenderse en la población.","Capacidad para dar lugar a una enfermedad.","Grado o cantidad de enfermedad que puede producir un agente causal.","Capacidad para multiplicarse en los tejidos, dando lugar o no a enfermedad."],"correct":3,"expl":"Infectividad = capacidad del agente para multiplicarse en los tejidos del huésped, produzca o no enfermedad. Patogenicidad = capacidad de producir enfermedad. Virulencia = gravedad de la enfermedad producida. Contagiosidad = capacidad de extenderse.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O269","q":"Para la recogida de una muestra de orina y su posterior análisis rutinario, es correcto:","caso":"","opts":["La muestra tiene que ser estéril.","No es necesario que la muestra sea estéril.","El paciente debe estar sondado.","La recogida de la muestra se realizará a primera hora de la mañana."],"correct":1,"expl":"Para un análisis de orina RUTINARIO (sistemático/sedimento) no es necesario que la muestra sea estéril ni que el paciente esté sondado. La esterilidad se exige en el urocultivo. Se prefiere la primera de la mañana pero no es obligatorio.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O270","q":"En referencia a los trastornos de ideas delirantes persistentes, las acciones del/de la TCAE irán encaminadas a (señale la respuesta FALSA):","caso":"","opts":["Recogida de información relacionada con el estado de ánimo del paciente.","Descripción del comportamiento del paciente.","Fingir que se creen los contenidos delirantes como verdaderos.","Comunicarse con el paciente de modo directo y preciso."],"correct":2,"expl":"Ante un paciente con ideas delirantes el TCAE observa y registra el ánimo y el comportamiento y se comunica de forma directa y precisa. NUNCA se finge creer el delirio (ni se discute agresivamente): se muestra respeto sin confirmarlo.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O271","q":"En cuanto a las características del paciente terminal, señale la respuesta INCORRECTA:","caso":"","opts":["Presencia de una enfermedad avanzada, progresiva e incurable.","Gran impacto emocional en paciente, familia y equipo terapéutico.","Pronóstico de vida limitado, inferior a seis meses.","Presencia de una enfermedad aguda y con mal pronóstico."],"correct":3,"expl":"Paciente terminal: enfermedad AVANZADA, progresiva e incurable (no aguda), sin respuesta a tratamiento específico, con síntomas intensos, gran impacto emocional y pronóstico de vida inferior a 6 meses.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O272","q":"La farmacocinética comprende los siguientes procesos:","caso":"","opts":["Liberación y absorción.","Metabolismo.","Distribución.","Todas las respuestas son correctas."],"correct":3,"expl":"Farmacocinética = lo que el organismo hace con el fármaco: Liberación, Absorción, Distribución, Metabolismo y Excreción (LADME). Todas correctas.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O273","q":"¿Cuál de las siguientes afirmaciones es la principal vía de transmisión cruzada de microorganismos potencialmente patógenos entre los pacientes en los centros sanitarios?","caso":"","opts":["No existen las infecciones cruzadas. En todo caso sería infección transmisible.","El aire del hospital.","El entorno y las superficies del hospital.","Las manos de los profesionales sanitarios cuando no están limpias."],"correct":3,"expl":"La principal vía de transmisión cruzada en los centros sanitarios son las MANOS del personal sin higienizar. Por eso el lavado de manos es la medida más eficaz (grado I) contra la infección nosocomial.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O274","q":"Según el Plan de Prevención del Suicidio en Galicia, entre los factores contextuales del riesgo de suicidio está:","caso":"","opts":["La esquizofrenia.","Falta de apoyo social y situación laboral.","Abuso del alcohol y otras drogas.","Depresión mayor."],"correct":1,"expl":"Plan de Prevención del Suicidio en Galicia: factores CONTEXTUALES = falta de apoyo social, situación laboral (desempleo), aislamiento. Esquizofrenia, depresión y abuso de alcohol son factores individuales/clínicos.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O275","q":"Señale la respuesta correcta en relación con la higiene del cordón umbilical:","caso":"","opts":["Se lavará con agua y jabón y se secará.","Se desinfectará con Povidona yodada.","Se desinfectará con alcohol de 96º.","Se lavará con agua y jabón y se aplicará antibiótico de uso tópico."],"correct":0,"expl":"Cuidado del cordón umbilical: lavar con agua y jabón, secar bien y mantenerlo limpio y seco (cura seca). No se recomienda alcohol de 96°, povidona (interfiere con el tiroides) ni antibióticos tópicos.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"O","tag":"OPE SERGAS","n":"O276","q":"¿Cómo se denomina la forma de inmunidad que se genera por la exposición a un antígeno extraño?","caso":"","opts":["Resistencia antigénica.","Inmunidad pasiva.","Inmunidad activa.","Sistema inmunitario."],"correct":2,"expl":"Inmunidad ACTIVA: el propio organismo fabrica anticuerpos tras exponerse a un antígeno (pasar la enfermedad o vacunarse). PASIVA: se reciben anticuerpos ya hechos (gammaglobulinas, leche materna).","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O277","q":"Señale la respuesta correcta en relación con la higiene del enfermo:","caso":"","opts":["Las uñas de las manos se cortarán rectas y las de los pies ovaladas.","La higiene de los ojos debe realizarse desde el ángulo externo hacia el interno utilizando una gasa para cada ojo.","La higiene perianal debe realizarse de abajo hacia arriba y de fuera hacia dentro.","En condiciones normales del paciente, la temperatura del agua para el aseo será lo más próxima a la temperatura corporal."],"correct":3,"expl":"El agua del aseo se mantiene próxima a la temperatura corporal (37-40 °C). Las uñas de los pies se cortan RECTAS (las de las manos redondeadas), los ojos se limpian del ángulo INTERNO al externo y la zona perianal de delante hacia atrás.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"O","tag":"OPE SERGAS","n":"O278","q":"Entre las funciones que un procesador de textos ofrece, está:","caso":"","opts":["Agregar, borrar o mover palabras.","Corrección de errores.","Cambio del aspecto del texto.","Todas son correctas."],"correct":3,"expl":"Un procesador de textos permite agregar, borrar y mover palabras, corregir errores y cambiar el aspecto del texto (fuente, tamaño, formato). Todas correctas.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O279","q":"El nombre del fármaco que recoge la acción del producto químico se denomina:","caso":"","opts":["Nombre genérico.","Nombre químico.","Marca registrada.","Ninguna es correcta."],"correct":0,"expl":"Nombre GENÉRICO (DCI): denominación oficial que recoge la acción/naturaleza del principio activo (p. ej. paracetamol). Nombre químico: fórmula química. Marca registrada: nombre comercial del laboratorio.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O280","q":"Como método de esterilización, el gas plasma es un proceso:","caso":"","opts":["Físico por calor húmedo.","Químico en caliente.","Químico en frío.","Físico por calor seco."],"correct":2,"expl":"Gas plasma (peróxido de hidrógeno): esterilización QUÍMICA EN FRÍO (<50 °C), para material termosensible, sin residuos tóxicos y ciclos cortos. Óxido de etileno también es química en frío; autoclave = física por calor húmedo; Poupinel = calor seco.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O281","q":"El colchón que está formado por unos tubos que se hinchan y deshinchan alternativamente y automáticamente, recibe el nombre de:","caso":"","opts":["Colchón de agua.","Colchón de espuma.","Colchón de resortes.","Colchón antiescaras."],"correct":3,"expl":"Colchón antiescaras de aire alternante: tubos que se hinchan y deshinchan alternativamente con un motor, variando los puntos de presión. Es una superficie especial de manejo de presión (SEMP) para pacientes de riesgo medio-alto.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"O","tag":"OPE SERGAS","n":"O282","q":"En la gráfica de hospitalización, se anota en color verde:","caso":"","opts":["La temperatura.","El pulso.","La respiración.","La tensión arterial."],"correct":3,"expl":"Colores habituales de la gráfica: temperatura rojo, pulso azul, respiración negro y TENSIÓN ARTERIAL verde.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O283","q":"Las principales recomendaciones utilizadas para la prevención de caídas en adultos mayores durante el proceso de hospitalización, se pueden clasificar en los siguientes ítems, exceptuando:","caso":"","opts":["Predicción del riesgo de caídas en pacientes hospitalizados.","Generar evaluación e intervenciones sistemáticas.","Proporcionar información oral y escrita relevante y apoyo para pacientes, sus familiares y cuidadores.","Uso de calzado inadecuado, resbaladizo y fomentar que camine descalzo o con calcetines sin necesidad de elementos de apoyo, para aumentar su autonomía."],"correct":3,"expl":"Prevención de caídas en mayores hospitalizados: valorar el riesgo, intervenciones sistemáticas, información a paciente y familia, calzado ADECUADO y cerrado, ayudas técnicas. Caminar descalzo o con calcetines aumenta el riesgo.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O284","q":"¿Quién diseñó un criterio jerárquico por el cual el logro de unas metas o necesidades nos permitiría acceder a nuevas metas?","caso":"","opts":["Maslow.","Mischel.","Piaget.","Vygotsky."],"correct":0,"expl":"La pirámide de necesidades de MASLOW ordena jerárquicamente las necesidades: fisiológicas, seguridad, pertenencia/afecto, estima y autorrealización; cubrir las inferiores permite acceder a las superiores.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O285","q":"Los núcleos goticulares aéreos o de Wells, causantes de la diseminación de microorganismos y ante los que debemos tomar precauciones para evitar la transmisión aérea de enfermedades, tienen como característica:","caso":"","opts":["Se pueden extender ampliamente con las corrientes de aire.","Permanecen en el aire durante largos períodos de tiempo conteniendo microorganismos.","Tamaño igual o inferior a 5 micrómetros.","Todas son correctas."],"correct":3,"expl":"Núcleos goticulares de Wells: partículas ≤5 micras que permanecen suspendidas en el aire mucho tiempo y se dispersan con las corrientes (tuberculosis, sarampión, varicela). Requieren precauciones de transmisión aérea (habitación con presión negativa, mascarilla FFP2). Todas correctas.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O286","q":"Referente a la alimentación del lactante, es correcto:","caso":"","opts":["Se introducirá el gluten entre los cuatro y once meses, idealmente alrededor del sexto mes.","Se introducirá la leche entera a partir de los doce meses.","Se introducirán los alimentos sólidos con riesgo de atragantamiento por encima de los tres años.","Todas las respuestas anteriores son correctas."],"correct":3,"expl":"Alimentación del lactante: gluten entre los 4 y 11 meses (ideal hacia el 6.º), leche entera de vaca a partir de los 12 meses y alimentos con riesgo de atragantamiento (frutos secos enteros) no antes de los 3 años. Todas correctas.","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"O","tag":"OPE SERGAS","n":"O287","q":"Señale la respuesta correcta en relación con las prótesis bucales en los pacientes inconscientes:","caso":"","opts":["Hay que retirarlas siempre. Los pacientes inconscientes no deben tener prótesis bucales puestas.","Hay que retirarlas con una gasa no estéril por las noches y colocarlas nuevamente por las mañanas.","Hay que retirarlas con una gasa estéril tres veces al día para su limpieza y volverlas a colocar inmediatamente.","Hay que retirarlas con una gasa no estéril dos veces al día para su limpieza y volverlas a colocar inmediatamente."],"correct":0,"expl":"En pacientes inconscientes las prótesis dentales se RETIRAN SIEMPRE (riesgo de aspiración y obstrucción), se limpian y se guardan en un recipiente identificado con agua.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"O","tag":"OPE SERGAS","n":"O288","q":"La Histerosalpingografía es una prueba radiológica de:","caso":"","opts":["Vesícula biliar.","Útero y trompas de Falopio.","Hígado y vías biliares.","Vejiga y uréteres."],"correct":1,"expl":"Histerosalpingografía: radiografía con contraste del ÚTERO y las TROMPAS de Falopio (estudio de esterilidad). Colecistografía = vesícula; colangiografía = vías biliares; cistografía = vejiga.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O289","q":"Con respecto a las necesidades básicas del paciente, el esquema de 11 patrones funcionales es de:","caso":"","opts":["Dorotea Orem.","Marjory Gordon.","Florence Nightingale.","Abraham Maslow."],"correct":1,"expl":"Los 11 patrones funcionales son de Marjory GORDON. Orem = teoría del autocuidado; Henderson = 14 necesidades; Maslow = pirámide de necesidades; Nightingale = teoría del entorno.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O290","q":"Si hablamos de Intranet, hablamos de:","caso":"","opts":["Una red digital de uso interno en una organización.","Un conjunto de ordenadores sin conexión entre ellos.","Un programa interno del SERGAS para el archivo de las historias clínicas.","Un sistema operativo interno de cada ordenador."],"correct":0,"expl":"Intranet = red digital privada de uso interno de una organización (el hospital), basada en tecnología de Internet, para compartir información y aplicaciones.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O291","q":"Cuando estamos en decúbito supino, de forma que la cabeza esté más baja que los pies, la postura que tenemos se denomina:","caso":"","opts":["Posición de Rose.","Posición de Sims.","Antitrendelenburg.","Ninguna es correcta."],"correct":3,"expl":"Supino con la cabeza más baja que los pies = TRENDELENBURG, que no está entre las opciones. Antitrendelenburg (Morestin) es lo contrario; Rose/Roser = cabeza colgando; Sims = lateral semiprono.","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"O","tag":"OPE SERGAS","n":"O292","q":"¿Cuál de las siguientes afirmaciones es correcta?","caso":"","opts":["El personal que accede a los datos de la historia clínica en el ejercicio de sus funciones queda sujeto al deber de secreto.","El deber de secreto no atañe a la Administración Pública.","El personal TCAE no puede acceder a los datos de la historia clínica.","Todas son correctas."],"correct":0,"expl":"Ley 41/2002, art. 16.6: el personal que accede a los datos de la historia clínica en el ejercicio de sus funciones queda sujeto al deber de secreto. El TCAE sí puede acceder a lo necesario para sus funciones y la Administración también está obligada al secreto.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O293","q":"¿Qué sistema es una parte principal del sistema inmunitario?","caso":"","opts":["Sistema Nervioso.","Sistema Endocrino.","Sistema Linfático.","Sistema Circulatorio."],"correct":2,"expl":"El sistema LINFÁTICO (ganglios, bazo, timo, médula ósea, linfocitos) es la parte principal del sistema inmunitario: produce y transporta las células de defensa.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O294","q":"La medida más eficaz en la prevención de las úlceras por presión, es:","caso":"","opts":["Cambios posturales.","Estimulación de la circulación.","Limpieza de la piel.","No hay medida preventiva realmente eficaz."],"correct":0,"expl":"La medida más eficaz para prevenir UPP son los CAMBIOS POSTURALES (cada 2-3 horas en cama, cada hora en sedestación), junto con las superficies de alivio de presión, la higiene y la nutrición.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"O","tag":"OPE SERGAS","n":"O295","q":"Por vía oral se pueden administrar medicamentos en forma de:","caso":"","opts":["Cápsulas.","Líquidos.","Polvos.","En cualquiera de las formas anteriores."],"correct":3,"expl":"Vía oral: comprimidos, cápsulas, grageas, polvos/sobres, jarabes, soluciones, suspensiones, gotas. Cualquiera de las formas citadas.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O296","q":"A la alteración de la coloración de la piel, limitada y circunscrita, que no presenta depresión ni elevación, se le denomina:","caso":"","opts":["Mácula.","Pápula.","Pústula.","Escama."],"correct":0,"expl":"MÁCULA = cambio de color de la piel, circunscrito, sin relieve ni depresión (p. ej. peca). Pápula = elevación sólida <1 cm; pústula = elevación con pus; escama = láminas de piel que se desprenden.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"O","tag":"OPE SERGAS","n":"O297","q":"¿Cuál de las siguientes NO es una escala de valoración de riesgo de desarrollar Úlceras por Presión (UPP)?","caso":"","opts":["Escala Braden.","Escala Barthel.","Escala Braden Q.","Escala NSRAS."],"correct":1,"expl":"Escalas de riesgo de UPP: Braden (adultos), Braden Q (pediátrica), NSRAS (neonatal), Norton, Emina, Arnell. La escala de BARTHEL mide la independencia en actividades de la vida diaria.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"O","tag":"OPE SERGAS","n":"O298","q":"La rama de la medicina dedicada a los aspectos preventivos, clínicos, terapéuticos y sociales de las enfermedades físicas y mentales en los ancianos se denomina:","caso":"","opts":["Geriatría.","Gerontología.","Gerocultura.","Senescencia."],"correct":0,"expl":"GERIATRÍA = rama de la medicina que estudia los aspectos preventivos, clínicos, terapéuticos y sociales de la enfermedad en el anciano. Gerontología = ciencia del envejecimiento en todos sus aspectos. Senescencia = proceso de envejecer.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O299","q":"NO son signos o síntomas del paciente agonizante:","caso":"","opts":["Poliuria.","Livideces.","Oliguria.","Apneas."],"correct":0,"expl":"Signos del paciente agonizante: OLIGURIA/anuria, livideces, extremidades frías, apneas y respiración estertorosa, pulso débil, disminución de la conciencia. La poliuria no es un signo de agonía.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O300","q":"En relación a la temperatura corporal, señale la verdadera:","caso":"","opts":["Es más alta por la mañana.","No varía en relación con la hora del día.","Es más baja por la mañana.","Todas son falsas."],"correct":2,"expl":"La temperatura corporal sigue un ritmo circadiano: es más BAJA por la mañana (madrugada, 4-6 h) y más alta al final de la tarde (16-20 h), con variaciones de 0,5-1 °C.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O301","q":"Los certificados digitales se emplean para..., elija la respuesta INCORRECTA:","caso":"","opts":["Autentificar la identidad del/de la usuario/a.","Firmar electrónicamente documentos.","Garantizar el acceso seguro a los servicios en línea.","Mantener el anonimato cuando usamos internet."],"correct":3,"expl":"Los certificados digitales sirven para autenticar la identidad, firmar electrónicamente y acceder de forma segura a servicios en línea. NO sirven para mantener el anonimato: precisamente identifican al usuario.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O302","q":"Germán desempeña sus funciones de TCAE formando parte de un equipo multidisciplinar de trabajo de una planta de hospitalización. En el transcurso de la mañana, le avisan desde enfermería que debe recoger una muestra de orina para realizar un urocultivo al paciente de la cama 450/3, ¿qué precauciones debe tener en cuenta para la obtención de dicha muestra?","caso":"","opts":["No se debe tener ninguna precaución especial.","Tiene el mismo procedimiento que cualquier otra muestra. Sin ningún tipo de precaución, excepto que sea una muestra de obtención en quirófano.","Se extremarán las precauciones y condiciones de asepsia en el equipo y en el procedimiento de recogida y manipulación de la muestra.","La obtención de este tipo de muestras solo la realizará el personal de laboratorio."],"correct":2,"expl":"Para un UROCULTIVO se extreman las condiciones de asepsia: lavado genital, recogida de la parte media de la micción en frasco estéril (o punción del punto específico de la sonda), sin tocar el interior, y envío inmediato o nevera.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O303","q":"Una de las funciones del técnico en cuidados auxiliares de enfermería es la de movilizar y acomodar al paciente anciano. Es correcto:","caso":"","opts":["Los pies del técnico en cuidados auxiliares de enfermería deben estar separados y las rodillas ligeramente flexionadas.","El técnico en cuidados auxiliares de enfermería explicará al paciente el procedimiento a realizar.","Al incorporar al paciente para levantarlo de la cama, el técnico en cuidados auxiliares de enfermería deberá girar los miembros inferiores del paciente hacia sí mismo dejándolos caer por el borde de la cama.","Todas las respuestas anteriores son correctas."],"correct":3,"expl":"Para movilizar al anciano: pies separados y rodillas flexionadas (base de sustentación amplia), explicar siempre el procedimiento y, al sentarlo en el borde, girar sus piernas hacia el profesional dejándolas caer por el borde mientras se eleva el tronco. Todas correctas.","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"O","tag":"OPE SERGAS","n":"O304","q":"Berta, TCAE en Consultas Externas, está terminando su turno de trabajo en una consulta de Oftalmología. Antes de salir debe:","caso":"","opts":["Revisar y reponer el material de la consulta.","Revisar, reponer y limpiar el carro de curas.","Limpiar y/o esterilizar el instrumental según corresponda.","Las respuestas a, b y c son correctas."],"correct":3,"expl":"Al terminar el turno en una consulta el TCAE revisa y repone el material, limpia y repone el carro de curas y limpia/esteriliza el instrumental según corresponda. Todas correctas.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O305","q":"Marcos, enfermero de Cirugía, solicita nuestra colaboración para colocar al paciente en decúbito dorsal para realizarle una exploración. Para ello colocaremos al paciente:","caso":"","opts":["Tumbado sobre la espalda.","Tumbado sobre el abdomen.","Semisentado, con las rodillas ligeramente flexionadas.","Sobre sus rodillas."],"correct":0,"expl":"Decúbito DORSAL = decúbito supino: tumbado sobre la espalda. Decúbito ventral = prono (sobre el abdomen).","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"O","tag":"OPE SERGAS","n":"O306","q":"La enfermera de la Unidad en la que trabajamos nos dice que en las órdenes médicas está indicada la administración de gotas nasales cada 8 horas a María, paciente de la habitación 203 A. Para una correcta administración debemos:","caso":"","opts":["Indicar a María que incline ligeramente la cabeza hacia atrás.","Abrir completamente los orificios nasales de la paciente. Para esto, emplearemos el dedo pulgar de la mano y haremos una ligera presión sobre la punta de la nariz, mientras apoyamos el resto de la mano en la frente.","Dirigir la punta del cuentagotas hacia el tabique nasal, manteniendo un ángulo de 180 grados respecto de la nariz.","Todas las respuestas son correctas."],"correct":3,"expl":"Gotas nasales: cabeza ligeramente hacia atrás (o en decúbito supino con la cabeza colgando), abrir los orificios presionando suavemente la punta de la nariz con el pulgar y dirigir el cuentagotas hacia el tabique sin tocarlo. El tribunal dio todas como correctas.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O307","q":"En la planta de maternidad, por orden de enfermería, después de estar informados los progenitores, se le pide al TCAE que lleve al recién nacido Marcos, hijo de María, para la realización del cribado neonatal de hipoacusia. La madre preocupada, le pregunta por qué es tan importante esa prueba:","caso":"","opts":["No es competencia del TCAE dar dicha información.","Es un programa de detección precoz de sordera para neonatos. Se le explicaría la importancia del cribado, y que cuanto antes se detecte un problema de audición, antes empezarán a tratarlo con el fin de mejorar su audición y facilitar su aprendizaje.","Es un análisis de sangre que se realiza a un bebé recién nacido para detectar trastornos genéticos metabólicos sanguíneos u otros que no son evidentes inmediatamente después del parto.","Se le dice que no se preocupe, que es un procedimiento rutinario y que todo va a salir bien."],"correct":1,"expl":"El TCAE puede informar sobre el sentido de un procedimiento rutinario: el cribado neonatal de hipoacusia detecta precozmente la sordera para tratarla cuanto antes y facilitar el desarrollo del lenguaje. La prueba de sangre (talón) es el cribado metabólico, otra prueba distinta.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O308","q":"Hoy en la unidad de REA empieza a trabajar Paco, un TCAE que inicia su primer contrato. Después de explicarle el funcionamiento de la unidad, le incidimos mucho en cómo leer las distintas variables de los monitores para su registro en las gráficas. Una vez finalizado todo el recorrido, empieza su turno. Debido a toda la información recibida, no recuerda cómo identificar la temperatura en la gráfica del paciente. ¿Cómo tiene que registrar Paco este valor?","caso":"","opts":["En color azul y con una P.","En color verde con las letras TA.","En color rojo con una T.","Ninguna es correcta."],"correct":3,"expl":"Colores habituales de la gráfica: temperatura ROJO con un punto/T, pulso AZUL, respiración NEGRO, TA VERDE. Ninguna opción los combina bien (azul con P y verde con TA no corresponden a la temperatura, y \"rojo con una T\" no era la convención del tribunal): respuesta modificada a D en la clave definitiva.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O309","q":"Alberto, paciente de 58 años, ingresado en la unidad de cuidados intensivos por un infarto agudo de miocardio, le dice a Laura, TCAE del servicio, que tiene que comentarle un tema delicado con respecto a su salud. ¿Qué elementos facilitan la escucha activa?","caso":"","opts":["Ofrecer ayudas o soluciones prematuras.","Contar \"tu historia\" cuando el paciente necesita hablar.","Observar al paciente: identificar el contenido de lo que dice, los objetivos y los sentimientos.","Interrumpir al que habla."],"correct":2,"expl":"Escucha activa: observar al paciente, identificar el contenido, los objetivos y los sentimientos de lo que dice, sin interrumpir, sin juzgar, sin dar soluciones prematuras ni contar la propia historia.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O310","q":"En su práctica diaria, el personal técnico en cuidados auxiliares de enfermería, sabe que, dentro de sus funciones, está la de dar de comer a los pacientes que no sean capaces de hacerlo por sí mismos. Cuando un paciente padece náuseas y vómitos, el/la TCAE, sabe que la dieta NO debe ser:","caso":"","opts":["Dieta con predominio de infusiones.","Dieta blanda fraccionada.","Dieta con predominio de líquidos.","Dieta con predominio de fibra."],"correct":3,"expl":"Con náuseas y vómitos: dieta fraccionada en pequeñas tomas, líquidos e infusiones, blanda y de fácil digestión. La FIBRA (y las grasas) aumentan la sensación de plenitud y las náuseas: no está indicada.","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"O","tag":"OPE SERGAS","n":"O311","q":"Rosa es una paciente encamada de 58 años ingresada en la Unidad de Oncología a la que usted tiene que lavarle el cabello. ¿En qué posición colocará a la paciente para realizar esta tarea?","caso":"","opts":["Posición de Proetz (siempre que no exista contraindicación).","Posición de Roser (siempre que no exista contraindicación).","Posición Antitrendelenburg (siempre que no exista contraindicación).","Las respuestas A y B son correctas."],"correct":3,"expl":"Para lavar el cabello del encamado se coloca en posición de Roser o Proetz (decúbito supino con la cabeza colgando fuera del borde del colchón, hombros al borde), salvo contraindicación. A y B correctas.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"O","tag":"OPE SERGAS","n":"O312","q":"En la planta de cardiología, después de una PCR y posterior RCP, el personal de enfermería tiene que comprobar el estado del carro de paradas. Reponiendo la medicación utilizada, así como el material; asegurándose de que contiene:","caso":"","opts":["Adrenalina.","Atropina.","Nitroglicerina.","Todas son correctas."],"correct":3,"expl":"El carro de paradas debe contener adrenalina (primer fármaco en la PCR), atropina, amiodarona, nitroglicerina, bicarbonato, etc., además de material de vía aérea y desfibrilador. Se revisa y precinta tras cada uso.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O313","q":"Estamos en una habitación con un paciente que se encuentra nauseoso y molesto. El paciente vomita salpicándonos en los antebrazos ligeramente con pequeñas salpicaduras, teniendo los guantes puestos. ¿Qué utilizaría para realizar la higiene de manos?","caso":"","opts":["Agua y jabón.","Solución hidroalcohólica.","Al tener guantes no sería necesario porque nuestras manos ya estarían protegidas.","Utilizaría agua y jabón y después solución hidroalcohólica."],"correct":0,"expl":"Si las manos están VISIBLEMENTE sucias o contaminadas con fluidos (vómito), la higiene se hace con AGUA Y JABÓN: la solución hidroalcohólica no limpia la suciedad. Los guantes no sustituyen la higiene de manos.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O314","q":"Mateo es un neonato al que usted tiene que bañar. Indique la respuesta INCORRECTA:","caso":"","opts":["Fregará la piel suavemente para retirar el vérnix caseoso de todo el cuerpo.","Durante el baño mantendrá la temperatura ambiente entre 23ºC-25ºC.","Secará la piel mediante una ligera presión, sin fregar.","Antes de bañarlo se asegurará de la estabilidad térmica del neonato tomándole la temperatura."],"correct":0,"expl":"El vérnix caseoso protege la piel del neonato: NO se frota para retirarlo, se reabsorbe solo. Ambiente a 23-25 °C, secar sin frotar y comprobar antes la estabilidad térmica son correctos.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"O","tag":"OPE SERGAS","n":"O315","q":"Loreto es técnico en cuidados auxiliares de enfermería y trabaja en la Unidad de Cuidados Paliativos. En cuanto a las necesidades emocionales de sus pacientes, Loreto tendrá en cuenta una serie de pautas a seguir. Señale la opción FALSA:","caso":"","opts":["Se procurará una habitación individual, permitiendo la presencia de la familia.","Se procurará conocer los deseos del paciente respecto a sus cuidados, respetando la voluntad de la familia siempre.","Se mantendrá una actitud de escucha.","Se respetarán las creencias religiosas del paciente, proporcionando ayuda espiritual si lo solicita."],"correct":1,"expl":"En paliativos se respeta la voluntad del PACIENTE (autonomía), no \"la de la familia siempre\". Habitación individual con presencia de la familia, escucha y respeto de sus creencias son correctos.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O316","q":"La TCAE Raquel trabaja en el turno de noche de una planta de cardiología del hospital \"U\". En una de las habitaciones, un paciente empieza a encontrarse mal. Cuando llega a la habitación el paciente entró en PCR, ¿cómo debe actuar la TCAE ante esta situación de urgencia vital?","caso":"","opts":["Siempre avisar a enfermería y pedir ayuda para iniciar secuencia de maniobras. Siempre que sea posible uno de los reanimadores será médico.","Hacer el mayor ruido y aspavientos posibles para que nuestros compañeros acudan en nuestra ayuda.","Una vez comprobado el estado del paciente, nuestra función será facilitar todo el material, equipos y ayuda que nos soliciten así como colaborar en las maniobras de RCP.","Las respuestas A y C son correctas."],"correct":3,"expl":"Ante una PCR el TCAE avisa a enfermería/pide ayuda para iniciar la RCP (idealmente con un médico en el equipo), aporta el material y el carro de paradas y colabora en las maniobras. A y C correctas.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O317","q":"Lucía es una paciente ingresada en la Unidad de Traumatología que tiene indicada terapia con frío. Señale la respuesta INCORRECTA:","caso":"","opts":["Durante la terapia, observará la zona expuesta para detectar posibles complicaciones.","Observará el estado de la piel antes y después de la aplicación del tratamiento.","Una de las indicaciones de la crioterapia es el síndrome de Raynaud.","Vigilará siempre la temperatura y el tiempo de exposición."],"correct":2,"expl":"La crioterapia está CONTRAINDICADA en el síndrome de Raynaud (vasoespasmo), arteriopatías, hipersensibilidad al frío y zonas con mala circulación. Vigilar la piel, la temperatura y el tiempo de exposición es correcto.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O318","q":"Uxío, paciente de 15 años, está ingresado en la sala de psiquiatría infanto-juvenil y está sufriendo un cuadro de agitación. Como primer paso para el manejo de la agitación está la contención verbal. En esta fase NO debemos emplear frases como:","caso":"","opts":["¿Qué te ayuda en un momento de intranquilidad como este para saber lo que podemos hacer?","Lo que estás pasando también le molestaría a otras personas.","De lo que me cuentas entiendo que...","Debes tranquilizarte o tendremos que darte medicación."],"correct":3,"expl":"En la contención verbal se usan preguntas abiertas, se valida lo que siente y se ofrece ayuda. NUNCA amenazas o chantajes (\"tranquilízate o te medicamos\"), que aumentan la agitación.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O319","q":"Después del uso de una pala de laringoscopio en una parada cardiorrespiratoria, ¿qué desinfectante debería utilizarse para alcanzar un alto nivel de desinfección?","caso":"","opts":["Fenoles.","Derivados clorados.","Clorhexidina digluconato.","Ácido peracético."],"correct":3,"expl":"La pala del laringoscopio es material semicrítico (contacta con mucosas): requiere desinfección de ALTO NIVEL con ácido peracético, glutaraldehído u ortoftaldehído. Clorhexidina, fenoles y clorados son de nivel bajo/intermedio.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O320","q":"Manuel es un paciente anciano ingresado en la planta de Medicina Interna y diagnosticado recientemente de Alzheimer, ¿cuál de las siguientes manifestaciones NO observaremos en esta primera fase de la enfermedad en nuestra práctica diaria con Manuel?","caso":"","opts":["Deterioro del juicio.","Falta de espontaneidad.","Confusión.","Reducción de la iniciativa."],"correct":0,"expl":"Alzheimer fase inicial (leve): pérdida de memoria reciente, confusión, falta de espontaneidad, reducción de la iniciativa, cambios de humor. El deterioro del JUICIO y la desorientación grave aparecen en fases moderada/avanzada.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O321","q":"En la unidad de psiquiatría observamos que un paciente presenta inquietud, parkinsonismo, sequedad de boca, protrusión de la lengua, cuello torcido y movimientos incontrolables de los dedos. Avisaremos al personal de enfermería y/o al especialista en psiquiatría porque posiblemente esté sufriendo:","caso":"","opts":["Una crisis de histeria.","Una crisis de ansiedad.","Síntomas extrapiramidales.","Las respuestas B y C son correctas."],"correct":2,"expl":"Síntomas EXTRAPIRAMIDALES por antipsicóticos (neurolépticos): parkinsonismo, distonías (cuello torcido, protrusión de la lengua), acatisia (inquietud), discinesias. Hay que avisar a enfermería/psiquiatría.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O322","q":"En la planta de hospitalización donde trabaja Rocío como TCAE, el equipo de enfermería le comenta que a la paciente de la habitación 218 se le va a realizar la extracción de una muestra de sangre capilar. ¿De dónde la puede extraer?","caso":"","opts":["De la yema del dedo, del lóbulo de la oreja o del talón del pie. Pero esta acción no se corresponde con las funciones del/de la TCAE, aunque pueda colaborar con la enfermera si así se le requiriese.","De la yema del dedo, del glúteo o del lóbulo de la oreja.","De la yema del dedo, del glúteo o de toda la oreja.","Del lóbulo de la oreja, del antebrazo o del glúteo. Pero esta acción no se corresponde con las funciones del/de la TCAE, aunque pueda colaborar con la enfermera si así se le requiriese."],"correct":0,"expl":"Sangre CAPILAR: yema del dedo, lóbulo de la oreja o talón (neonatos). La punción/extracción es función de enfermería; el TCAE colabora y prepara el material.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O323","q":"Lourdes, TCAE de UCI, en un aislamiento respiratorio realiza la secuencia de la colocación de EPIs frente a agentes biológicos para entrar en la habitación, siendo lo correcto:","caso":"","opts":["Retirar objetos personales, higiene de manos antes de entrar en área contaminada, vestir bata atando las cintas, colocar máscara respiratoria ajustándola, protección ocular o pantalla protectora ajustando con el resto de EPIs, poner guantes por debajo de","Retirar objetos personales, higiene de manos antes de entrar en área contaminada, vestir bata atando las cintas, colocar máscara respiratoria ajustándola, protección ocular o pantalla protectora ajustando con el resto de EPIs, poner guantes por encima de","Retirar los guantes pellizcando con un movimiento de pelado, higiene de manos, retirar protección ocular agarrando por la parte de atrás de la cinta, quitar la bata con efecto de pelado del interior al exterior, retirar la máscara, higiene de manos.","Retirar los guantes pellizcando con un movimiento de pelado, higiene de manos, retirar protección ocular agarrando por la parte delantera de la cinta, quitar la bata con efecto de pelado del exterior al interior, retirar la máscara, higiene de manos."],"correct":1,"expl":"Colocación de EPI: higiene de manos, bata (atar cintas), mascarilla/respirador (ajustar), protección ocular, y guantes por ENCIMA del puño de la bata. Retirada: guantes, higiene, gafas por detrás, bata pelando de dentro afuera, mascarilla, higiene de manos.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O324","q":"Manuel es un paciente con escasa movilidad ingresado en la Unidad de Paliativos. Usted debe saber que las zonas de mayor incidencia de UPP cuando lo sitúa en Decúbito Lateral son:","caso":"","opts":["Orejas y trocánteres.","Costillas y maléolos.","Hombros y crestas ilíacas.","Todas son correctas."],"correct":3,"expl":"En decúbito LATERAL apoyan: oreja, hombro/acromion, costillas, cresta ilíaca, trocánter, cóndilos de la rodilla y maléolos. Todas correctas.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"O","tag":"OPE SERGAS","n":"O325","q":"En la sala de extracciones y recogida de análisis en Atención Primaria, llega una muestra de heces para estudio de parásitos, debemos saber como TCAE que:","caso":"","opts":["Se debe transportar la muestra al laboratorio tan pronto como sea posible, o mantenerla refrigerada hasta que el transporte se realice.","Las muestras sólidas deben examinarse dentro de las dos primeras horas.","Si la recomendación de tiempo general para el envío (2 horas) no es factible, la muestra debe colocarse en uno de los fijadores disponibles.","Las muestras secas (diarreicas, semi-formadas o formadas) son aceptables para el examen fecal."],"correct":0,"expl":"Heces para parásitos: enviar cuanto antes; si hay demora, mantener refrigeradas (el tribunal dio esta opción como correcta) o usar fijadores. Las muestras líquidas/diarreicas se examinan en 30 min, las formadas en 24 h; las muestras secas no son aceptables.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O326","q":"María acaba de tener un bebé, y en las indicaciones dadas por los profesionales de la salud se especifican varias. Entre las siguientes, señala la opción INCORRECTA:","caso":"","opts":["Le recomiendan mantener la lactancia materna de forma exclusiva durante los seis primeros meses de edad.","Añadirá de forma paulatina el resto de los alimentos, manteniendo la lactancia materna a demanda todo el tiempo que madre/hijo lo deseen.","La alimentación complementaria se puede introducir entre el cuarto y sexto mes.","Le recomiendan mantener la lactancia materna de forma exclusiva durante el primer año de edad."],"correct":3,"expl":"Lactancia materna EXCLUSIVA los primeros 6 meses (no un año), después alimentación complementaria progresiva (entre el 4.º-6.º mes según el caso) manteniendo el pecho a demanda hasta los 2 años o más si madre e hijo lo desean.","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"O","tag":"OPE SERGAS","n":"O327","q":"Como personal técnico en cuidados auxiliares de enfermería, vamos a indicarle a nuestro paciente autónomo y portador de sonda vesical, que debe recoger una orina de 24 horas. Es correcto:","caso":"","opts":["Empezará la recogida de orina a cualquier hora del día.","Empezará la recogida de orina por la mañana, vaciando la bolsa de orina en el frasco de recogida.","Empezará la recogida de orina por la mañana, vaciando la bolsa de orina y desechando el contenido por el WC.","Todas las respuestas anteriores son falsas."],"correct":2,"expl":"Orina de 24 h en portador de sonda: por la mañana se vacía la bolsa y se DESECHA (hora 0) y, a partir de ahí, se recoge todo lo que drene hasta la misma hora del día siguiente. No se empieza a cualquier hora.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O328","q":"Pío desempeña sus funciones de TCAE en la planta de Neumología del hospital H. En el turno de tarde, le avisan de que el paciente de la habitación 357/1 tiene que recoger una muestra de esputo para enviar al laboratorio. Aparte de proporcionarle al paciente el recipiente de recogida, ¿cómo puede ser la obtención de esta muestra?","caso":"","opts":["Realizando un estudio exhaustivo previo.","Hay que utilizar un catéter.","La muestra puede ser en eliminación voluntaria o involuntaria.","Debe estar en ayunas."],"correct":2,"expl":"Esputo: se obtiene por expectoración espontánea (voluntaria) o, si el paciente no puede, por aspiración/inducción (involuntaria). No requiere ayuno ni estudio previo; el catéter es para aspirar secreciones.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O329","q":"María, paciente de 83 años con escasa movilidad ingresa en la planta donde usted presta sus servicios como TCAE. En la valoración inicial de la piel observa flictena con contenido seroso en talón derecho. ¿Qué estadio o grado de UPP presenta?","caso":"","opts":["Estadio o Grado II.","Estadio o Grado V.","Estadio o Grado I.","Estadio o Grado III."],"correct":0,"expl":"FLICTENA (ampolla con contenido seroso) o piel agrietada = UPP estadio/grado II (pérdida parcial de piel). Grado I = eritema que no palidece; III = afecta subcutáneo; IV = músculo/hueso. No existe grado V.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"O","tag":"OPE SERGAS","n":"O330","q":"En una unidad de urgencias, llega una alerta por un accidente con múltiples heridos, después de prepararse todo el personal para su llegada, los/as TCAE nos solicitan colaboración para que según vayan llegando a urgencias, acomodemos a los menos graves y les tomemos el pulso periférico. ¿Cómo debemos realizar el procedimiento?","caso":"","opts":["Elegir el lugar de la medición: radial, braquial, carótida, temporal, femoral, tibial posterior, poplítea o pedial.","Si elegimos la arteria radial, se cerrará el puño fuerte y con el brazo pegado al cuerpo en un ángulo de 90º.","Una vez localizado el pulso contaremos los latidos durante 15 segundos y los multiplicaremos por cuatro.","Las respuestas A y C son correctas."],"correct":3,"expl":"Pulso periférico: elegir arteria (radial, b
