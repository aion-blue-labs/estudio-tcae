cer, es adecuado:","caso":"","opts":["Retirarles rápidamente de la habitación","Ofrecer un espacio de intimidad para la despedida, respetar sus creencias y ritos y acompañar sin juzgar","Explicarles la causa médica de la muerte","Impedirles ver el cuerpo"],"correct":1,"expl":"Intimidad, respeto a creencias y ritos, escucha y acompañamiento. La información clínica sobre la causa corresponde al facultativo.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"X","tag":"BANCO EXTRA","n":"X128","q":"La aplicación local de CALOR está indicada, entre otros casos, en:","caso":"","opts":["Un esguince en las primeras horas","Contracturas musculares y dolores crónicos, favoreciendo la vasodilatación y la relajación","Una hemorragia activa","Un abdomen agudo"],"correct":1,"expl":"Calor: contracturas, dolor crónico, rigidez. Frío: traumatismo agudo, hemorragia, inflamación reciente. Calor contraindicado en abdomen agudo y hemorragias.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"X","tag":"BANCO EXTRA","n":"X129","q":"Los signos que permiten sospechar un posible maltrato en una persona mayor incluyen:","caso":"","opts":["Buen estado de higiene y nutrición","Lesiones en distintos estadios de evolución, desnutrición, mala higiene, miedo ante el cuidador o explicaciones incoherentes","Que acuda acompañado","Que tenga varias enfermedades crónicas"],"correct":1,"expl":"Lesiones de distinta antigüedad, negligencia en higiene y nutrición, retraso en buscar atención, actitud temerosa y relatos incoherentes son señales de alarma que hay que comunicar.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"X","tag":"BANCO EXTRA","n":"X130","q":"El duelo ANTICIPADO es aquel que:","caso":"","opts":["Aparece años después de la pérdida","Comienza antes del fallecimiento, cuando la familia y el paciente ya conocen el desenlace previsible","Solo lo sufren los profesionales","No existe"],"correct":1,"expl":"El duelo anticipado se inicia antes de la muerte, en la fase de enfermedad avanzada. El duelo patológico es el que se cronifica o incapacita.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"X","tag":"BANCO EXTRA","n":"X131","q":"El desgaste profesional o síndrome de burnout en el personal sanitario se manifiesta con:","caso":"","opts":["Mayor implicación y energía","Agotamiento emocional, despersonalización (trato frío) y baja realización personal","Mejor trato al paciente","Aumento del rendimiento"],"correct":1,"expl":"Las tres dimensiones clásicas de Maslach: agotamiento emocional, despersonalización y baja realización personal.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"X","tag":"BANCO EXTRA","n":"X132","q":"El derecho a la intimidad, que ampara la confidencialidad de los datos del paciente, se recoge en la Constitución en el artículo:","caso":"","opts":["14","18","43","51"],"correct":1,"expl":"Art. 18 CE: derecho al honor, a la intimidad personal y familiar y a la propia imagen (sí es derecho fundamental). El 43 es la protección de la salud (principio rector).","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"X","tag":"BANCO EXTRA","n":"X133","q":"El artículo 14 de la Constitución consagra:","caso":"","opts":["El derecho a la vida","La igualdad ante la ley y la no discriminación","La protección de la salud","La libertad sindical"],"correct":1,"expl":"Art. 14 CE: igualdad ante la ley sin discriminación por nacimiento, raza, sexo, religión, opinión o cualquier otra condición.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"X","tag":"BANCO EXTRA","n":"X134","q":"Según la Ley 41/2002, el acceso a la historia clínica con fines de investigación o docencia exige, como regla general:","caso":"","opts":["Acceso libre para cualquier profesional","Preservar los datos de identificación personal del paciente, separados de los clínico-asistenciales","Autorización del gerente únicamente","Publicación previa en el boletín"],"correct":1,"expl":"Para investigación, docencia o salud pública se accede a datos anonimizados/disociados, separando la identificación de la información clínica.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"X","tag":"BANCO EXTRA","n":"X135","q":"El paciente tiene derecho a obtener copia de su historia clínica. Este derecho puede limitarse:","caso":"","opts":["Siempre que lo decida el centro","Por las anotaciones subjetivas de los profesionales y por el derecho de terceras personas a la confidencialidad","Nunca, es absoluto","Solo si el paciente está ingresado"],"correct":1,"expl":"Ley 41/2002 art. 18: el derecho de acceso no ampara las anotaciones subjetivas de los profesionales ni perjudicar a terceros.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"X","tag":"BANCO EXTRA","n":"X136","q":"Según la Ley 41/2002, la información asistencial al paciente se proporciona:","caso":"","opts":["Siempre por escrito y con firma de dos testigos","Como regla general verbalmente, dejando constancia en la historia clínica, de forma comprensible y adecuada a sus necesidades","Solo a la familia","Únicamente el día del alta"],"correct":1,"expl":"La información es, por regla general, verbal, con constancia en la historia, verdadera, comprensible y adecuada a las necesidades del paciente.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"X","tag":"BANCO EXTRA","n":"X137","q":"El personal estatutario en situación de EXCEDENCIA por cuidado de hijos:","caso":"","opts":["Pierde todos sus derechos","Tiene derecho a la reserva de plaza durante el periodo legalmente establecido y a que ese tiempo compute a efectos de antigüedad","Debe reincorporarse en un mes","Deja de pertenecer al servicio de salud"],"correct":1,"expl":"La excedencia por cuidado de familiares/hijos conserva la reserva de plaza durante el periodo previsto y computa a efectos de antigüedad y carrera.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"X","tag":"BANCO EXTRA","n":"X138","q":"En el Estatuto Marco, las faltas GRAVES prescriben a los:","caso":"","opts":["6 meses","2 años","4 años","10 años"],"correct":1,"expl":"Prescripción: muy graves 4 años, graves 2 años, leves 6 meses. Es una de las preguntas más repetidas.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"X","tag":"BANCO EXTRA","n":"X139","q":"Los delegados de prevención, según la Ley 31/1995, son:","caso":"","opts":["Nombrados libremente por la dirección","Representantes de los trabajadores con funciones específicas en materia de prevención de riesgos laborales","Personal externo contratado","Miembros del comité de dirección"],"correct":1,"expl":"Los delegados de prevención se designan por y entre los representantes del personal; junto con la empresa forman el Comité de Seguridad y Salud.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"X","tag":"BANCO EXTRA","n":"X140","q":"Ante un riesgo grave e inminente en su puesto, el trabajador tiene derecho a:","caso":"","opts":["Seguir trabajando obligatoriamente","Interrumpir su actividad y abandonar el lugar de trabajo, sin poder ser sancionado por ello","Cobrar un plus de peligrosidad y continuar","Denunciar solo al año siguiente"],"correct":1,"expl":"LPRL art. 21: ante riesgo grave e inminente el trabajador puede interrumpir la actividad y abandonar el lugar, sin sanción.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"X","tag":"BANCO EXTRA","n":"X141","q":"La protección de la trabajadora embarazada frente a riesgos laborales implica:","caso":"","opts":["Su despido automático","La adaptación del puesto o el cambio a otro compatible y, si no es posible, la suspensión del contrato por riesgo durante el embarazo","Que asuma el riesgo","Que trabaje siempre en turno de noche"],"correct":1,"expl":"Primero adaptación de condiciones o tiempo de trabajo, después cambio de puesto y, si no es posible, suspensión con prestación por riesgo durante el embarazo o la lactancia.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"X","tag":"BANCO EXTRA","n":"X142","q":"El TCAE que traslada a un paciente y comenta su diagnóstico en el ascensor delante de terceros:","caso":"","opts":["Actúa correctamente si no dice el nombre","Vulnera el deber de confidencialidad, aunque no haya intención de perjudicar","Solo comete falta si le oye un familiar","No tiene ninguna responsabilidad"],"correct":1,"expl":"Comentar información clínica en espacios comunes (ascensores, pasillos, cafetería) es una vulneración habitual y evitable del secreto profesional.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"X","tag":"BANCO EXTRA","n":"X143","q":"La categoría profesional de Técnico en Cuidados Auxiliares de Enfermería se encuadra, dentro del personal estatutario, como:","caso":"","opts":["Personal de gestión y servicios","Personal sanitario de formación profesional","Personal sanitario licenciado","Personal laboral temporal"],"correct":1,"expl":"El TCAE es personal estatutario SANITARIO de formación profesional (grado medio), diferenciado del personal de gestión y servicios.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"I","tag":"INSTRUMENTAL","n":"I1","q":"Según su función, ¿a qué grupo pertenece el bisturí?","caso":"","opts":["Instrumental de hemostasia","Instrumental de diéresis o corte","Instrumental de síntesis","Instrumental de separación"],"correct":1,"expl":"El bisturí es instrumental de diéresis: se emplea para cortar o seccionar tejidos. En este grupo también se incluyen las tijeras.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I2","q":"¿Qué instrumento se utiliza principalmente para sujetar la aguja durante una sutura?","caso":"","opts":["Pinza de Backhaus","Portaagujas de Mayo-Hegar","Pinza de Foerster","Separador de Farabeuf"],"correct":1,"expl":"El portaagujas de Mayo-Hegar sujeta y guía la aguja de sutura. Sus ramas cortas y robustas proporcionan un agarre firme.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I3","q":"La tijera de Metzenbaum está indicada sobre todo para:","caso":"","opts":["Cortar tejidos delicados y realizar disección roma","Cortar yesos","Sujetar campos quirúrgicos","Ocluir vasos de gran calibre"],"correct":0,"expl":"La Metzenbaum es una tijera fina, de ramas largas y hojas relativamente cortas, diseñada para tejidos delicados y disección.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I4","q":"La tijera de Mayo, comparada con la de Metzenbaum, se caracteriza por ser:","caso":"","opts":["Más robusta y adecuada para tejidos resistentes o material de sutura","Más fina y exclusiva para microcirugía","Una pinza de hemostasia","Un separador autoestático"],"correct":0,"expl":"La tijera de Mayo es más fuerte y robusta. Se usa para tejidos resistentes; la recta también se emplea habitualmente para cortar suturas.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I5","q":"¿Qué mango de bisturí se asocia habitualmente con las hojas pequeñas números 10, 11, 12 y 15?","caso":"","opts":["Mango número 3","Mango número 4","Mango universal número 8","Mango de Mathieu"],"correct":0,"expl":"El mango número 3 admite normalmente las hojas 10, 11, 12 y 15. El número 4 se usa con hojas mayores, como las 20 a 25.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I6","q":"La hoja de bisturí número 11, con punta triangular aguda, se usa especialmente para:","caso":"","opts":["Incisiones por punción o pequeñas aperturas precisas","Separar bordes de una herida","Sujetar gasas","Ocluir vasos"],"correct":0,"expl":"La hoja 11 tiene una punta muy aguda y es apropiada para incisiones por punción, por ejemplo al abrir un absceso o introducir un drenaje.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I7","q":"¿Qué pinza hemostática pequeña es adecuada para vasos finos y cirugía menor?","caso":"","opts":["Mosquito o Halsted","Babcock","Allis","Foerster"],"correct":0,"expl":"La pinza mosquito o Halsted es una pinza hemostática pequeña y fina, útil para clampar vasos de pequeño calibre.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I8","q":"¿Qué característica permite reconocer una pinza de Kocher?","caso":"","opts":["Tiene anillas ovaladas para gasas","Presenta uno o más dientes en el extremo de las ramas","Carece de cremallera","Es flexible y maleable"],"correct":1,"expl":"La Kocher es una pinza fuerte con dientes en la punta. Su agarre es traumático, por lo que se reserva para tejidos resistentes o pedículos.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I9","q":"¿Cuál de las siguientes pertenece al instrumental de hemostasia?","caso":"","opts":["Pinza de Crile","Separador de Farabeuf","Tijera de Metzenbaum","Portaagujas de Mayo-Hegar"],"correct":0,"expl":"La pinza de Crile es hemostática y se utiliza para clampar vasos. Farabeuf separa, Metzenbaum corta y Mayo-Hegar sostiene agujas.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I10","q":"La pinza de Allis se considera una pinza de prensión:","caso":"","opts":["Traumática, para tejidos resistentes que deben sujetarse con firmeza","Atraumática, para asas intestinales","Exclusiva para campos quirúrgicos","Destinada a sujetar agujas"],"correct":0,"expl":"La Allis tiene dientes y ejerce una prensión firme, por lo que puede lesionar tejidos delicados. Se usa en tejidos resistentes o que van a resecarse.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I11","q":"¿Qué pinza de prensión atraumática, fenestrada y de punta redondeada se utiliza en tejidos tubulares delicados?","caso":"","opts":["Babcock","Kocher","Backhaus","Mosquito"],"correct":0,"expl":"La Babcock tiene extremos redondeados y fenestrados. Permite sujetar estructuras delicadas, como intestino o trompas, con menor traumatismo.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I12","q":"La pinza de Foerster, también llamada portaesponjas, se reconoce por:","caso":"","opts":["Sus extremos en forma de anillos ovalados","Su hoja triangular cortante","Sus dientes agudos para sujetar campos","Su pala ancha y maleable"],"correct":0,"expl":"La Foerster presenta anillas ovaladas en el extremo y se utiliza para sujetar gasas o torundas, preparar la piel o realizar limpieza.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I13","q":"¿Para qué se utiliza la pinza de Backhaus?","caso":"","opts":["Para fijar los paños o campos quirúrgicos","Para cortar tejido profundo","Para suturar piel","Para explorar conductos"],"correct":0,"expl":"La Backhaus es una pinza de campo o de talla. Sus puntas agudas fijan los paños quirúrgicos y ayudan a delimitar el campo.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I14","q":"En una pinza de disección, los dientes son especialmente útiles para:","caso":"","opts":["Sujetar piel o tejidos resistentes con firmeza","Manipular vasos muy delicados sin traumatismo","Cortar hilos de sutura","Mantener abierta una cavidad"],"correct":0,"expl":"Las pinzas con dientes agarran con firmeza la piel y tejidos resistentes. Para estructuras delicadas se prefieren pinzas sin dientes o atraumáticas.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I15","q":"¿Qué pinza de disección se emplea para manipular tejidos vasculares delicados con el menor traumatismo posible?","caso":"","opts":["DeBakey","Kocher","Allis","Backhaus"],"correct":0,"expl":"La pinza DeBakey posee un estriado atraumático característico y se usa en cirugía vascular y tejidos delicados.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I16","q":"El separador de Farabeuf es un instrumento:","caso":"","opts":["Manual, que debe ser sostenido por un ayudante","Autoestático, que permanece abierto por sí solo","De hemostasia","De sutura"],"correct":0,"expl":"El Farabeuf es un separador manual de doble pala. Mantiene apartados los bordes superficiales mientras lo sostiene el ayudante.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I17","q":"¿Cuál es un separador autoestático?","caso":"","opts":["Weitlaner","Farabeuf","Deaver","Langenbeck"],"correct":0,"expl":"El Weitlaner tiene cremallera y ramas con garfios, por lo que mantiene la apertura sin que un ayudante lo sostenga continuamente.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I18","q":"El separador de Deaver, de pala ancha y curva, se usa principalmente para:","caso":"","opts":["Separación profunda, especialmente en cirugía abdominal","Clampar vasos pequeños","Sujetar agujas","Fijar campos"],"correct":0,"expl":"El Deaver es un separador manual curvo y profundo, empleado para retraer vísceras o paredes en cirugía abdominal.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I19","q":"¿A qué grupo funcional pertenece un separador quirúrgico?","caso":"","opts":["Exposición o separación","Diéresis","Hemostasia","Síntesis"],"correct":0,"expl":"Los separadores apartan tejidos y mantienen visible el campo operatorio; por ello pertenecen al instrumental de exposición o separación.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I20","q":"¿Qué instrumento se utiliza para pasar una ligadura alrededor de un vaso situado en profundidad?","caso":"","opts":["Pinza de Mixter o de ángulo recto","Pinza de Backhaus","Tijera de Mayo recta","Separador de Farabeuf"],"correct":0,"expl":"La Mixter tiene la punta angulada y facilita la disección alrededor de vasos profundos y el paso de ligaduras.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I21","q":"La pinza intestinal de Doyen está diseñada para:","caso":"","opts":["Ocluir temporalmente el intestino con mínima lesión por aplastamiento","Cortar fascia","Sujetar campos a la piel","Retirar grapas cutáneas"],"correct":0,"expl":"La Doyen es una pinza intestinal atraumática o no aplastante, con ramas largas, que permite ocluir el intestino temporalmente.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I22","q":"Antes de enviar a reprocesar una pinza con cremallera, lo correcto es:","caso":"","opts":["Mantenerla abierta y desmontarla si el diseño lo permite","Cerrarla en el último diente","Envolverla sin retirar la suciedad visible","Sumergirla indefinidamente en suero fisiológico"],"correct":0,"expl":"Las articulaciones y cremalleras deben quedar abiertas, y las piezas desmontables separadas según las instrucciones del fabricante, para que la limpieza alcance todas las superficies.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I23","q":"¿Cuál es la primera medida ante restos visibles de sangre o tejido en el instrumental usado?","caso":"","opts":["Evitar que se sequen y retirarlos cuanto antes según el protocolo de limpieza","Esterilizar directamente sin limpiar","Aplicar lejía concentrada","Guardarlo seco hasta el día siguiente"],"correct":0,"expl":"La materia orgánica seca dificulta la limpieza y protege a los microorganismos. Debe iniciarse el pretratamiento y la limpieza lo antes posible siguiendo el protocolo.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I24","q":"Para la limpieza manual del instrumental, se recomienda emplear:","caso":"","opts":["Detergente compatible, preferentemente de pH neutro o enzimático, siguiendo sus instrucciones","Suero fisiológico como solución de remojo prolongado","Lejía sin diluir para cualquier metal","Abrasivos metálicos"],"correct":0,"expl":"Se usan detergentes compatibles con el material, a la concentración, temperatura y tiempo indicados. El cloruro del suero y los productos abrasivos favorecen daños y corrosión.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I25","q":"Durante la limpieza manual, el cepillado del instrumental debe realizarse:","caso":"","opts":["Con el material sumergido o evitando salpicaduras, usando un cepillo adecuado","Dirigiendo las salpicaduras hacia la cara para ver mejor","Con un cepillo metálico para todo tipo de pieza","Después de esterilizar"],"correct":0,"expl":"Cepillar bajo la superficie de la solución reduce aerosoles y salpicaduras. El cepillo debe ser compatible y alcanzar estrías, articulaciones y lúmenes.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I26","q":"La limpieza por ultrasonidos resulta especialmente útil para:","caso":"","opts":["Zonas de difícil acceso, articulaciones y estrías de instrumental compatible","Sustituir siempre a la esterilización","Material óptico no sumergible sin consultar instrucciones","Eliminar la necesidad de aclarado"],"correct":0,"expl":"Los ultrasonidos desprenden suciedad por cavitación en zonas difíciles. Solo se usan con material compatible y no sustituyen el aclarado, secado ni la esterilización.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I27","q":"Después del aclarado, ¿por qué debe secarse cuidadosamente el instrumental?","caso":"","opts":["Para prevenir corrosión y evitar que la humedad interfiera en el proceso posterior","Para que pese menos","Para poder cerrarlo con más fuerza","Porque el secado sustituye a la esterilización"],"correct":0,"expl":"El secado completo, incluidos articulaciones y lúmenes, ayuda a evitar corrosión y problemas en el empaquetado o la esterilización.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I28","q":"En la inspección del instrumental limpio, debe comprobarse:","caso":"","opts":["Limpieza, integridad, alineación, corte y funcionamiento de articulaciones y cremalleras","Solo el color del mango","Únicamente que esté seco","Que todas las pinzas queden cerradas"],"correct":0,"expl":"Antes de preparar el equipo se revisan limpieza, corrosión, grietas, puntas, filo, alineación y funcionamiento. El material defectuoso se retira del circuito.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I29","q":"Para lubricar articulaciones de instrumental quirúrgico se debe usar:","caso":"","opts":["Un lubricante específico, hidrosoluble y compatible con el método de esterilización","Aceite doméstico","Vaselina sin comprobar compatibilidad","Alcohol de 96 grados"],"correct":0,"expl":"Los lubricantes específicos para instrumental, a menudo llamados leche instrumental, deben ser compatibles y permeables al agente esterilizante. No se usan aceites domésticos.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I30","q":"Al preparar instrumental articulado para esterilización, debe colocarse:","caso":"","opts":["Abierto y desbloqueado, sin tensión en la cremallera","Cerrado en el último punto de la cremallera","Atado en grupos compactos","Cubierto de aceite mineral"],"correct":0,"expl":"El instrumental articulado se esteriliza abierto y desbloqueado para que el agente esterilizante contacte con todas las superficies y no se deformen las articulaciones.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I31","q":"En una caja de instrumental, las piezas pesadas deben colocarse:","caso":"","opts":["En la parte inferior, protegiendo las piezas delicadas","Encima de las piezas finas","Sobre los filos sin protección","Fuera del contenedor estéril"],"correct":0,"expl":"Las piezas pesadas se sitúan abajo y las delicadas se protegen para evitar deformaciones, golpes y daños en puntas o filos durante el transporte y procesado.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I32","q":"Si durante la revisión se observa una tijera desalineada o una pinza con la cremallera defectuosa, se debe:","caso":"","opts":["Retirarla del uso y enviarla a reparación o sustitución","Incluirla igualmente en la caja","Forzarla hasta que cierre","Ocultar el defecto con lubricante"],"correct":0,"expl":"El instrumental defectuoso compromete la seguridad y puede dañar tejidos. Debe apartarse, identificarse y seguir el circuito de reparación o baja.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I33","q":"¿Qué práctica protege mejor los filos y puntas durante el transporte y la esterilización?","caso":"","opts":["Usar protectores adecuados que permitan el paso del agente esterilizante","Cubrirlos con cinta adhesiva común","Juntarlos bajo piezas pesadas","Cerrar el paquete mientras están húmedos"],"correct":0,"expl":"Los protectores específicos evitan lesiones y daños sin impedir la limpieza o la esterilización. Deben ser compatibles con el proceso empleado.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I34","q":"¿Qué diferencia esencial existe entre limpieza y esterilización del instrumental?","caso":"","opts":["La limpieza elimina suciedad; la esterilización destruye todas las formas de vida microbiana, incluidas las esporas","Son exactamente el mismo proceso","La esterilización se realiza antes de limpiar","La limpieza destruye siempre todas las esporas"],"correct":0,"expl":"La limpieza es imprescindible y retira suciedad y materia orgánica. Después, el material crítico debe esterilizarse para eliminar microorganismos, incluidas las esporas.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I35","q":"El instrumental quirúrgico que penetra en tejidos estériles se clasifica, según Spaulding, como material:","caso":"","opts":["Crítico y debe esterilizarse","Semicrítico y solo necesita limpieza","No crítico y basta con agua","Desechable en todos los casos"],"correct":0,"expl":"El material que entra en tejidos estériles o en el sistema vascular es crítico. Tras la limpieza requiere esterilización antes de reutilizarse.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I36","q":"En cirugía menor, ¿qué conjunto reúne instrumentos de funciones diferentes y habituales?","caso":"","opts":["Bisturí, pinzas de disección, tijeras, hemostáticas, separadores y portaagujas","Solo gasas y apósitos","Fonendoscopio, tensiómetro y pulsioxímetro","Sonda vesical, bolsa colectora y cuña"],"correct":0,"expl":"Un equipo de cirugía menor suele combinar corte, disección, hemostasia, separación y sutura. Su composición exacta depende del procedimiento y del protocolo del centro.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I37","q":"Para reducir accidentes con hojas de bisturí, la conducta correcta es:","caso":"","opts":["Manipularlas con un dispositivo o instrumento adecuado y desecharlas en el contenedor de punzocortantes","Retirarlas siempre con los dedos","Reencapucharlas antes de tirarlas","Dejarlas sobre la mesa al terminar"],"correct":0,"expl":"Las hojas no deben manipularse directamente con los dedos. Se usan dispositivos o instrumentos apropiados y se eliminan de inmediato en un contenedor resistente a punzocortantes.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"I","tag":"INSTRUMENTAL","n":"I38","q":"¿Qué debe hacerse con el instrumental de un solo uso?","caso":"","opts":["Desecharlo tras su uso conforme al etiquetado y al protocolo del centro","Reprocesarlo siempre aunque el fabricante lo prohíba","Mezclarlo con el reutilizable sin identificarlo","Guardarlo para otro paciente"],"correct":0,"expl":"El material etiquetado como de un solo uso no se reutiliza de forma rutinaria. Se elimina según su riesgo y la normativa o protocolo aplicable.","tema":"instrumental","bloque":"Instrumental quirúrgico"},{"sim":"O","tag":"OPE SERGAS","n":"O1","q":"¿Qué aspectos tendremos en cuenta en la relación con los familiares del paciente?","caso":"","opts":["Reforzar los puntos fuertes de la familia.","Evitar tópicos y consejos vagos.","Mantener a la famillia informada sobre los cuidados que recibe el/la paciente, horarios de información médica, etc.","Todas las respuestas son correctas."],"correct":3,"expl":"Con la familia: reforzar sus puntos fuertes, evitar tópicos y consejos vagos y mantenerla informada de cuidados y horarios. Todas son correctas.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O2","q":"Procedemos a realizar la higiene de la boca a un enfermo inconsciente. ¿Cuál de los siguientes procedimientos no es correcto?","caso":"","opts":["Valorar y limpiar, lengua, encías, dientes y labios.","Si tiene prótesis dental, limpiar y volver a colocar en la boca.","Colocarlo en posición de Fowler con la cabeza ladeada, si no hay contraindicación.","Secar bien los labios y aplicar vaselina."],"correct":1,"expl":"En el paciente inconsciente la prótesis dental se retira, se limpia y se guarda en su envase con agua: nunca se vuelve a colocar en la boca por el riesgo de aspiración. El resto (Fowler con cabeza ladeada, limpiar lengua/encías, vaselina) es correcto.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"O","tag":"OPE SERGAS","n":"O3","q":"Andrés es un paciente psiquiatrico que esta en estado de agresividad, el médico nos indica realizar una contención mecánica. ¿Cúal será el número óptimo de personas necesarias para llevarla a cabo?","caso":"","opts":["3 personas.","5 personas.","2 personas.","7 personas."],"correct":1,"expl":"La contención mecánica se realiza idealmente con 5 personas: una por cada extremidad y otra que controla la cabeza y dirige la maniobra.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O4","q":"Juan es un paciente ingresado con escasa movilidad. Usted debe saber que las zonas de mayor incidencia de úlceras cuando se encuentra en decúbito prono son:","caso":"","opts":["Tobillos, rodillas, costillas y hombros.","Dedos del pie, codos, costillas y nuca.","Glúteos, codos, talones y nuca.","Dedos del pie, rodillas, hombros y mejillas."],"correct":3,"expl":"En decúbito prono apoyan: dedos de los pies, rodillas, genitales, crestas ilíacas, costillas, hombros, mejillas y orejas. Talones, sacro y nuca son del supino.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"O","tag":"OPE SERGAS","n":"O5","q":"Tenemos que realizar los primeros auxilios a una persona que ha sufrido una lipotimia. ¿Cómo no debemos actuar?","caso":"","opts":["Tumbarla en posición antishock.","Aflojarle la ropa, para facilitarle la respiración.","Darle de beber agua a pequeños sorbos.","Llevarla a un ambiente fresco."],"correct":2,"expl":"Ante una lipotimia: tumbar (antishock, piernas elevadas), aflojar la ropa y aire fresco. NUNCA dar de beber a una persona con alteración de la conciencia (riesgo de aspiración).","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O6","q":"Pedro está ingresado en la unidad de Cirugía. Tiene indicado tratamiento con calor. Señale cuál de las respuestas es incorrecta:","caso":"","opts":["Está indicado en el tratamiento de abscesos, para favorecer la cicatrización.","Está contraindicado en pacientes que toman medicación anticoagulante.","Está indicado para disminuir el peristaltismo.","Está indicado en dolores musculares."],"correct":2,"expl":"El calor produce vasodilatación, relaja la musculatura y AUMENTA el peristaltismo (por eso ayuda en el estreñimiento). Contraindicado en anticoagulados, hemorragias y procesos inflamatorios agudos.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O7","q":"Alfredo ingresa en la habitación 207 diagnosticado de rubéola. ¿Qué aislamiento necesita?","caso":"","opts":["Cutáneo.","Respiratorio.","Inverso.","No precisa aislamiento."],"correct":1,"expl":"La rubéola se transmite por gotitas respiratorias: precisa aislamiento respiratorio (habitación individual, mascarilla).","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O8","q":"Debemos esterilizar material en el Horno Pasteur a 180°C ¿Cúantos minutos necesita?","caso":"","opts":["15 minutos.","30 minutos.","60 minutos.","120 minutos."],"correct":1,"expl":"Estufa Poupinel / horno Pasteur (calor seco): 180 °C durante 30 min, 170 °C 60 min, 160 °C 120 min. Tiempos más largos que el autoclave porque el calor seco penetra peor.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O9","q":"Miguel es un paciente alcohólico, que se le presenta un conjunto de alteraciones físicas y psíquicas, que le aparecen por dejar bruscamente de tomar alcohol. ¿Qué le pasa en este momento a Miguel?","caso":"","opts":["Tiene un delirium tremens.","Tiene síndrome de abstinencia.","Tiene dependencia de alcohol.","Tiene un abuso de alcohol."],"correct":1,"expl":"El síndrome de abstinencia es el conjunto de alteraciones físicas y psíquicas que aparecen al suspender bruscamente una sustancia de la que se depende. El delirium tremens es su forma más grave, no la definición general.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O10","q":"¿Qué actitud debemos tener ante un paciente agonizante?","caso":"","opts":["Procurar que se sienta acompañado.","Atenderle en todas sus necesidades básicas.","Hacer que se sienta ayudado.","Todas las respuestas son correctas."],"correct":3,"expl":"Ante el paciente agonizante: acompañarlo, atender sus necesidades básicas y que se sienta ayudado. Todas son correctas.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O11","q":"¿Cuál de las siguientes medidas no emplearía para prevenir la aparición de una úlcera por presión en la zona sacra de un paciente encamado en el servicio de Medicina Interna?","caso":"","opts":["Control de la dieta del paciente encamado.","Férula de arco.","Todas las respuestas son correctas.","Ninguna respuesta es correcta."],"correct":1,"expl":"Para prevenir la UPP sacra sirven el control de la dieta (proteínas, líquidos), los cambios posturales y las superficies de alivio de presión. La férula de arco (arco de cama) solo evita el peso de la ropa sobre pies/piernas: no previene la UPP sacra.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"O","tag":"OPE SERGAS","n":"O12","q":"Con respecto al/a la enfermo/a terminal:","caso":"","opts":["La familia debe participar en la medida de sus posibilidades.","Se debe explicar a todos los miembros de la familia los cuidados que deben llevar a cabo.","Las respuestas A y B son correctas.","Debemos conseguir resolver sus problemas personales."],"correct":2,"expl":"En el enfermo terminal la familia participa en la medida de sus posibilidades y se le explican los cuidados que puede realizar. No es objetivo \"resolver sus problemas personales\".","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O13","q":"La señora Josefa de 65 años de edad, acude a la consulta de cirugía, remitida por su médico de atención primaria, por presentar falta de apetito, dispepsia, cansancio, sensación de ardor en el esófago al agacharse, dolor de estómago y heces muy oscuras desde hace un mes. A usted, que trabaja como técnico en cuidados auxiliares de enfermería en esa consulta, el médico le dice que prepare a la enferma para una exploración fisica abdominal. ¿Qué es lo que no haría?","caso":"","opts":["Explicar a la enferma que va a ser examinada.","Proporcionar luz suficiente a la sala de exploraciones, abriendo las cortinas y la ventana, y colocando una luz auxiliar si no fuese suficiente.","Ayudar a la enferma a desvestirse.","Instalarla sobre la camilla de exploraciones y cubrirla con una o dos sábanas, dejando solo descubierta la zona a explorar."],"correct":1,"expl":"En la exploración se preserva la intimidad: se explica, se ayuda a desvestirse y se cubre dejando solo la zona a explorar. Abrir cortinas y ventana rompe la intimidad y el confort térmico.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O14","q":"Nos encontramos en el quirófano de traumatología, nos piden una prótesis de cadera. ¿Cómo se clasifica dicho material según su peligrosidad infectiva?","caso":"","opts":["Critico.","Semicritico.","No critico.","Ninguna respuesta es correcta."],"correct":0,"expl":"Clasificación de Spaulding: material CRÍTICO = entra en tejidos estériles o sistema vascular (prótesis, instrumental quirúrgico) y requiere esterilización. Semicrítico = contacta con mucosas. No crítico = piel intacta.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O15","q":"Ayudamos a la enfermera en el sondaje vesical. De las siguientes acciones, ¿cuál no debe realizar antes de empezar con el sondaje?","caso":"","opts":["Proporcionar intimidad al paciente.","Lavado de manos.","Realizar la higiene genital.","Colocarse guantes estériles."],"correct":3,"expl":"Los guantes estériles se colocan en el momento de introducir la sonda, no \"antes de empezar\" (intimidad, lavado de manos e higiene genital sí son previos). Al TCAE le corresponde además la preparación del material.","tema":"eliminacion","bloque":"Eliminación, sondajes y ostomías"},{"sim":"O","tag":"OPE SERGAS","n":"O16","q":"Usted como técnico/a en cuidados auxiliares de enfermería tiene que recoger una muestra de esputo. Señale la respuesta incorrecta:","caso":"","opts":["Se recogerá a primera hora de la mañana.","Puede conservarse a temperatura ambiente.","Se debe obtener un volumen entre 5 y 10 ml.","Se debe recoger en un recipiente estéril."],"correct":1,"expl":"El esputo se recoge a primera hora, en recipiente estéril, 5-10 ml, y se envía de inmediato o se conserva en nevera (no a temperatura ambiente).","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O17","q":"¿Qué elementos son imprescindibles para conseguir una buena comunicación con el/la enfermo/a terminal y su familia?","caso":"","opts":["Saber escuchar.","Respeto a los juicios confidencias y creencias del paciente y familiares.","Ninguna respuesta es correcta.","Las respuestas A y B son correctas."],"correct":3,"expl":"Con el enfermo terminal y su familia: saber escuchar y respetar sus juicios, confidencias y creencias. A y B correctas.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O18","q":"José acude al servicio de urgencias con un dolor en el cuadrante superior del abdomen. ¿Qué estructuras comprende dicho cuadrante?","caso":"","opts":["Epigastrio e hipocondrios.","Vacíos y epigastrio.","Fosas iliacas e hipocondrios.","Las respuestas A y B son correctas."],"correct":0,"expl":"Cuadrante/región superior del abdomen: epigastrio (centro) e hipocondrios derecho e izquierdo. Zona media: vacíos/flancos y mesogastrio. Zona inferior: fosas ilíacas e hipogastrio.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O19","q":"En el plan de cuidados de un paciente con esquizofrenia, entre los objetivos de enfermería no se encuentra:","caso":"","opts":["Asegurar un medio ambiente de seguridad para el enfermo.","Orientar al enfermo a la realidad.","Evaluar las manifestaciones sómaticas y tratarlas.","Ayudar al enfermo a superar su conducta regresiva."],"correct":2,"expl":"Evaluar y tratar manifestaciones somáticas es función médica. Los objetivos de enfermería en la esquizofrenia son seguridad, orientación a la realidad y ayudar a superar la conducta regresiva.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O20","q":"Fernando sale de quirófano y pasa a la sala de reanimación. ¿Dónde se coloca el profesional encargado de trasladar al paciente?","caso":"","opts":["A los pies de la cama, empujando la cama.","En la cabecera de la cama, empujando la cama.","En la cabecera de la cama, tirando de la cama.","Es indiferente el lugar en el que se sitúe."],"correct":0,"expl":"La cama se EMPUJA desde los pies (el paciente avanza con la cabeza por delante) para ver el camino y controlar la marcha; nunca se tira de ella.","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"O","tag":"OPE SERGAS","n":"O21","q":"Indalecio acude a una sesión de diálisis. Una vez finalizado el tratamiento ¿cómo eliminamos los filtros utilizados?","caso":"","opts":["Como residuos sanitarios no peligrosos clase lla.","Como residuos sanitarios no peligrosos clase llb.","Como residuos sanitarios peligrosos clase IIl.","Como residuos sanitarios peligrosos clase IV."],"correct":0,"expl":"Los filtros de diálisis son residuos sanitarios no peligrosos clase IIa (específicos de la actividad sanitaria, sin riesgo infeccioso especial). Recuerda: Ia y Ib domésticos; IIa/IIb sanitarios no peligrosos; III biocontaminados; IV citotóxicos; V químicos.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O22","q":"¿Cómo procedemos a realizar los primeros auxilios ante una sospecha de una hemorragia interna?. Señale la respuesta incorrecta.","caso":"","opts":["Cubrir con una manta.","No dar nunca nada por vía oral.","Hacer presión directa sobre la hemorragia.","Controlar la respiración y el pulso."],"correct":2,"expl":"En la hemorragia INTERNA no hay punto sobre el que presionar: se abriga, no se da nada por boca, se controlan pulso y respiración y se traslada urgente. La presión directa es para la hemorragia externa.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O23","q":"Como profesional sanitario, usted debe saber que puede romper el secreto profesional:","caso":"","opts":["Nunca.","Cuando declare como testigo en un juicio.","Cuando haya peligro para la salud pública o esté en juego la vida de terceras personas.","Las respuestas B y C son correctas."],"correct":3,"expl":"El secreto profesional puede romperse por imperativo legal (declarar como testigo) o cuando existe peligro para la salud pública o la vida de terceros. B y C correctas.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O24","q":"Cuando un paciente ingresado en Neumología con un aumento de las secreciones bronquiales, observamos que al respirar emite ruidos roncantes anormales. ¿De qué tipo de respiración se trata?","caso":"","opts":["Respiración de Biot.","Respiración estertorosa.","Respiración de Bouchut.","Respiración de Cheyne-Stokes."],"correct":1,"expl":"Respiración estertorosa = ruidos roncantes por secreciones en las vías aéreas. Biot = pausas irregulares; Cheyne-Stokes = ciclos creciente-decreciente con apneas; Kussmaul = profunda y rápida (acidosis).","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O25","q":"Ana acude a su centro de salud. Su médico le recomienda, entre otras cosas, autoexplorarse las mamas. ¿Qué tipo de prevención sería?","caso":"","opts":["Cuaternaria.","Secundaria.","Terciaria.","Primaria."],"correct":1,"expl":"Prevención secundaria = diagnóstico precoz (autoexploración, cribados, mamografía). Primaria = evitar que aparezca (vacunas). Terciaria = rehabilitación y evitar secuelas.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O26","q":"Edelmiro no puede dejar de comer tierra, su médico le ha dicho que tiene un trastorno de Pica. ¿Qué nombre recibe dicho trastorno en relación con la sustancia ingerida?","caso":"","opts":["Tricofagia.","Coprofagia.","Geofagia.","Geomelofagia."],"correct":2,"expl":"Pica: ingesta de sustancias no nutritivas. Geofagia = tierra; tricofagia = pelo; coprofagia = heces.","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"O","tag":"OPE SERGAS","n":"O27","q":"Si tiene que realizar la maniobra de Heimlich, ¿a qué nos estamos refiriendo?","caso":"","opts":["Maniobra de resucitación.","Maniobra de obstrucción de la vía aérea.","Maniobra de disminución de la frecuencia cardíaca.","Maniobra de desobstrucción de la vía aérea."],"correct":3,"expl":"La maniobra de Heimlich (compresiones abdominales) sirve para DESOBSTRUIR la vía aérea en el atragantamiento con obstrucción completa.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O28","q":"Trabajando usted en la planta de Oncología, observa que el paciente, no cree que el diagnóstico que se le corrobora sea cierto. ¿Cómo se denomina el mecanismo de defensa empleado?","caso":"","opts":["Negación.","Compensación.","Proyección.","Regresión."],"correct":0,"expl":"Negación = rechazar una realidad dolorosa (\"esto no me pasa a mí\"). Es la primera fase del duelo de Kübler-Ross. Proyección = atribuir a otros lo propio; regresión = volver a conductas infantiles.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O29","q":"Nos encontramos ante un aviso de emergencia en la 3* planta del hospital; el accidente puede ser controlado y dominado de forma sencilla y rápida por el personal y medios de protección de la planta. ¿Cómo clasificamos esta emergencia?","caso":"","opts":["Conato de emergencia.","Emergencia parcial.","Emergencia general.","Ninguna respuesta es correcta."],"correct":0,"expl":"Conato de emergencia: se controla de forma sencilla y rápida con el personal y medios de la zona. Emergencia parcial: requiere equipos especiales del hospital. Emergencia general: supera los medios del centro, evacuación.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O30","q":"En la planta donde trabajamos la supervisora nos pide colaboración para hacer un estudio sobre la relación entre el número de infecciones y el número de pacientes de riesgo expresado en porcentaje. El estudio hace referencia a:","caso":"","opts":["Incidencia.","Infección.","Prevalencia.","Prevención."],"correct":2,"expl":"Prevalencia = casos existentes (nuevos + antiguos) en una población en un momento dado, expresado en porcentaje. Incidencia = casos NUEVOS en un periodo. El EPINE es un estudio de prevalencia.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O31","q":"Para poner en marcha los cuidados post mortem, es necesario que el/la técnico/a en cuidados auxiliares de enfermería y resto de personal que los lleve a cabo, utilice los guantes, bata, mascarilla y gorro:","caso":"","opts":["Cuando la enfermedad del/de la paciente haya sido contagiosa.","Cada hospital tiene su propio protocolo.","Siempre.","Cuando lo indique el personal médico o el personal de enfermería."],"correct":2,"expl":"En los cuidados post mortem se usan SIEMPRE guantes, bata, mascarilla y gorro (precauciones estándar), sea cual sea la causa de la muerte.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O32","q":"¿Por qué debemos permitir que el/la paciente participe de sus propios cuidados?","caso":"","opts":["Porque así aumenta su autoestima y autoimagen.","Porque el/la paciente siempre lo hará mejor que nosotros.","Porque así nos quita un poco de trabajo.","Ninguna respuesta es correcta."],"correct":0,"expl":"Fomentar la participación del paciente en sus cuidados aumenta su autoestima, su autoimagen y su autonomía. No es para ahorrar trabajo.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O33","q":"Usted se encuentra trabajando y se le ordena que le ponga a un paciente aplicaciones calientes, ¿para lograr?","caso":"","opts":["Causar anestesia local.","Disminuir el metabolismo celular.","Aumentar la supuración.","Reducir la temperatura."],"correct":2,"expl":"El calor aumenta el metabolismo celular y el aporte sanguíneo, favoreciendo la supuración y maduración de abscesos. El frío es el que anestesia, reduce el metabolismo y baja la temperatura.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O34","q":"Trabajando en su turno, la/el enfermera/o le dice que el médico/a encargado de Julio, ordena administrar un fármaco vía rectal. Usted técnico en cuidados auxiliares de enfermería debe saber, si es posible, en que posición se debe colocar al paciente:","caso":"","opts":["Decúbito supino.","Decúbito prono.","Decúbito lateral izquierdo.","Decúbito lateral derecho."],"correct":2,"expl":"Vía rectal (supositorios, enemas): decúbito lateral izquierdo (posición de Sims), porque el sigma y el recto quedan en declive y facilita la introducción.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O35","q":"Mario es un recién nacido, al que tenemos que realizar su baño diario. Indique la técnica incorrecta:","caso":"","opts":["Frotar la piel suavemente para disolver la vérmix caseosa.","Usar un jabón neutro.","Mantener una temperatura ambiente entre los 23°C - 25°C.","Secar la piel mediante una ligera presión."],"correct":0,"expl":"La vérmix caseosa protege la piel del recién nacido: NO se frota para eliminarla, se reabsorbe sola. Jabón neutro, ambiente a 23-25 °C y secar sin frotar sí son correctos.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"O","tag":"OPE SERGAS","n":"O36","q":"Ana tiene que asear a Manuel, que debido a su patologia no puede realizar por él mismo. ¿En qué orden realizará el baño a Manuel?","caso":"","opts":["Cara, brazos y manos, tórax, abdomen, extremidades inferiores, región genital, espalda y nalgas.","Brazos y manos, cara, tórax, abdomen, extremidades inferiores, espalda y nalgas, región genital.","Cara, brazos y manos, tórax, abdomen, extremidades inferiores, espalda y nalgas, región genital.","Cara, brazos y manos, espalda y nalgas, tórax, abdomen, extremidades inferiores, región genital."],"correct":2,"expl":"Orden del aseo: de limpio a sucio. Cara, brazos y manos, tórax, abdomen, extremidades inferiores, espalda y nalgas y, por último, la región genital (con agua y esponja nuevas).","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"O","tag":"OPE SERGAS","n":"O37","q":"Un/a paciente, que va a ser operado de apendicitis, dice que tiene sed. ¿Cuál es la actuación correcta?","caso":"","opts":["Avisar al personal de enfermería, para ver si se puede aumentar la velocidad del suero.","Darle un poco de agua.","Darle un poco de zumo.","Son correctas las respuestas B y C."],"correct":0,"expl":"Paciente en ayunas prequirúrgico: no se le da nada por boca. Se avisa a enfermería para valorar aumentar el suero o humedecer los labios.","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"O","tag":"OPE SERGAS","n":"O38","q":"José tiene 89 años, vive con su hija, que trabaja mañana y tarde; su poder adquisitivo es precario. José padece hipertensión aguda, es insulino dependiente, y sufre sordera que lo aisla socialmente. ¿Cuáles son los principales indicadores de malnutrición en el anciano?","caso":"","opts":["Alcoholismo, síndrome de mala absorción, osteoporosis y bajo peso.","Pérdida de peso de más de 5 kg, ingesta alimentaria indecuada, bajo peso/sobrepeso, osteoporosis y cambio de estado.","Alcoholismo, deterioro cognitivo, síndrome de mala absorción.","Deshidratación, pérdida de más de 7kg, deterioro cognitivo y cambios en el hábito intestinal."],"correct":1,"expl":"Indicadores de malnutrición en el anciano: pérdida de peso >5 kg, ingesta inadecuada, bajo peso o sobrepeso, osteoporosis y cambios en el estado general.","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"O","tag":"OPE SERGAS","n":"O39","q":"Cuando se anota en la hoja de observaciones de Juan, paciente ingresado en Urología, presenta febrícula. ¿Qué cifras de temperatura indican esa situación?","caso":"","opts":["36-37ºC.","37,1-37,9°C.","38-38,4°C.","38,5-39°C."],"correct":1,"expl":"Febrícula: 37,1-37,9 °C. Fiebre: 38-38,9. Fiebre alta: 39-40. Hiperpirexia: >41 °C. Hipotermia: <35 °C.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O40","q":"Juan es un paciente que acude a Urgencias y usted como técnico en cuidados auxiliares de enfermería observa una incapacidad para respirar e incremento en el esfuerzo cuando está en posición horizontal o acostado. ¿Qué nombre recibiría?","caso":"","opts":["Eupnea.","Taquipnea.","Ortopnea.","Respiración estertorosa."],"correct":2,"expl":"Ortopnea = dificultad para respirar en decúbito, que mejora sentado o de pie (típica de la insuficiencia cardíaca). Eupnea = respiración normal.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O41","q":"Entre las funciones del técnico/a en cuidados auxiliares de enfermería que trabaja en el área de psiquiatría, no se encuentra:","caso":"","opts":["Cuidado a personas, familiares y comunidad con problemas de salud mental.","Fomentar el cuidado personal y la salud, higiene, alimentación y ejercicio físico.","Realizar intervenciones psicoterapeuticas individuales o en grupo.","Enseñanza de aspectos de la salud mental a otros trabajadores."],"correct":2,"expl":"Las intervenciones psicoterapéuticas son función del psiquiatra/psicólogo/enfermería especialista. El TCAE cuida, fomenta el autocuidado y enseña aspectos de salud mental.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O42","q":"Andrea se ha torcido un tobillo. ¿Cuál no será una actuación correcta por nuestra parte?","caso":"","opts":["Colocar compresas frías .","Reposo y elevación del miembro lesionado.","Intentar reducir la torcedura.","Efectuar un vendaje de presión."],"correct":2,"expl":"Esguince: frío, reposo, elevación y vendaje compresivo (RICE). NUNCA intentar reducir la lesión: eso es tarea médica (y sería una luxación, no un esguince).","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O43","q":"María trabaja como técnico en cuidados auxiliares de enfermería en el servicio de Medicina Interna, tiene que lavarle el cabello a Rosa, una anciana encamada. ¿En qué posición pondrá a la paciente para realizar esta tarea?","caso":"","opts":["Posición de Trendelemburg.","Posición de Sims.","Posición de Litotomía.","Posición de Proetz."],"correct":3,"expl":"Posición de Proetz (o Roser): decúbito supino con la cabeza colgando fuera del borde de la cama. Se usa para lavar el cabello del encamado, intubación y exploraciones de garganta.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"O","tag":"OPE SERGAS","n":"O44","q":"En el servicio de medicina interna ingresa José Domínguez de 83 años de edad, procedente de la unidad de cuidados intensivos, tras haber permanecido en ella durante veinte días. A la hora de realizar las movilizaciones al/a la paciente, el/la técnico/a en cuidados auxiliares de enfermería:","caso":"","opts":["No tendrá en cuenta su nivel de consciencia.","No intentará que el/la paciente colabore.","Empleará los músculos de los muslos y de las piernas, evitando los músculos de la espalda.","Lo hará siempre con dos celadores/as o con dos técnicos/as en cuidados auxiliares de enfermería."],"correct":2,"expl":"Mecánica corporal: usar los músculos de muslos y piernas (grandes), no la espalda; siempre valorar la consciencia y pedir la colaboración del paciente.","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"O","tag":"OPE SERGAS","n":"O45","q":"Paula es una técnica en cuidados auxiliares de enfermería de la planta de Obstetricia. Le indican que tiene que recoger una orina de 24 horas a una paciente para determinar una proteinuria. Señale la actuación incorrecta:","caso":"","opts":["Conservar la muestra en frío.","Incluir la primera micción del día siguiente.","Informar a la paciente sobre el procedimiento.","Se debe incluir la primera micción de la mañana."],"correct":3,"expl":"Orina de 24 h: se desecha la primera micción de la mañana del primer día (se empieza a contar desde ahí) y se incluye la primera del día siguiente. Se conserva en frío.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O46","q":"Cuando no es posible la lactancia materna, se recurre a la administración de fórmulas adaptadas para la alimentación del/de la lactante. ¿Cómo actuaría el/la técnico/a en cuidados auxiliares de enfermería para preparar el biberón?","caso":"","opts":["Lavarse las manos y ponerse los guantes.","Echar el agua hervida y templada en el biberón, en función de la cantidad de leche que hay que preparar y de la edad del niño/a.","Administrarlo inmediatamente después de prepararlo o como máximo pasada media hora.","Todas las respuestas son correctas."],"correct":3,"expl":"Preparación del biberón: lavado de manos y guantes, agua hervida y templada según cantidad y edad, y administrar inmediatamente (máximo media hora). Todas correctas.","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"O","tag":"OPE SERGAS","n":"O47","q":"¿Qué cuidados físicos deben aplicarse en el enfermo terminal?","caso":"","opts":["Higiene, alimentación, eliminación, descanso, sueño, alivio de síntomas y procedimientos asistenciales de rutina.","Higiene, procedimientos asistenciales de rutina, medicación oral e informar a la familia.","Higiene, medicación oral e informar al personal de enfermera y a la familia.","Higiene, medicación oral, informar al personal médico y familia."],"correct":0,"expl":"Cuidados físicos del terminal: higiene, alimentación, eliminación, descanso y sueño, alivio de síntomas y procedimientos de rutina. Informar a la familia no es un cuidado \"físico\".","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O48","q":"Al paciente de la habitación 605 se le vacía la bolsa de orina; tiene una diuresis de 1.500cc. ¿Dónde depositas dicho residuo?","caso":"","opts":["Contenedor rígido clase Ill, por ser mayor de 100 cc.","En el W.C.","En una bolsa opaca bien cerrada herméticamente.","Ninguna respuesta es correcta."],"correct":1,"expl":"La orina de una bolsa de diuresis se vacía directamente en el WC (residuo líquido no peligroso). Solo se usaría contenedor especial si fuese de paciente en aislamiento por infección de alto riesgo.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O49","q":"Si nos encontramos a una persona inconsciente con una otorragia. ¿Cómo lo trasladaríamos al hospital más cercano?","caso":"","opts":["En posición de seguridad sobre el oido que sangra.","En decúbito supino.","En posición de seguridad y taponamos el oido que sangra.","En posición de seguridad hacia el lado contrario del oido que sangra."],"correct":0,"expl":"Otorragia (sangrado por el oído): posición lateral de seguridad SOBRE el oído que sangra para que drene y no aumente la presión intracraneal. Nunca taponar.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O50","q":"Usted trabaja en el servicio de Medicina Interna. En el lavado de un paciente encamado, observa que la piel se agrieta a nivel de la epidermis y la dermis. ¿En qué estadío o grado encuadramos esta úlcera por presión?","caso":"","opts":["Primer grado o estadío.","Segundo grado o estadío.","Tercer grado o estadío.","Cuarto grado o estadío."],"correct":1,"expl":"UPP estadio II: pérdida parcial del grosor de la piel (epidermis y/o dermis): agrietamiento, ampolla, abrasión. Estadio I = eritema que no palidece; III = afecta tejido subcutáneo; IV = músculo, hueso.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"O","tag":"OPE SERGAS","n":"O51","q":"Antes de una intervención quirúrgica, el técnico en cuidados auxiliares de enfermería debe:","caso":"","opts":["Comprobar el buen funcionamiento del material y aparatos.","Comprobar la correcta esterilización del instrumental y material.","Comprobar la iluminación y ventilación.","Todas las respuestas son correctas."],"correct":3,"expl":"Antes de una intervención el TCAE comprueba material y aparatos, esterilización del instrumental y las condiciones de iluminación y ventilación. Todas correctas.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O52","q":"Ana ingresa en la planta de obstetricia. ¿Qué factores de riesgo la predisponen a padecer una enfermedad nosocomial?","caso":"","opts":["Malnutrición.","Patologías de base.","Sondaje urinario.","Todos son factores de riesgo."],"correct":3,"expl":"Factores de riesgo de infección nosocomial: malnutrición, patologías de base, edad, sondajes y otros dispositivos invasivos, inmunosupresión. Todos.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O53","q":"Raúl Peña está ingresado en la planta de neumología; acude a realizar una radiografía. Nos disponemos a hacerle la cama en ese momento. ¿Qué tipo de cama es?","caso":"","opts":["Cama abierta desocupada.","Cama cerrada.","Cama abierta ocupada.","Cama abierta vacía."],"correct":0,"expl":"Cama abierta desocupada: paciente ingresado que no está en la cama en ese momento. Cerrada = sin paciente asignado. Ocupada = con el paciente dentro.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"O","tag":"OPE SERGAS","n":"O54","q":"De los siguientes drenajes, ¿cúal tiene tres luces?","caso":"","opts":["Saratoga.","Jackson-Pratt.","Abramson.","Redón."],"correct":2,"expl":"El drenaje de Abramson tiene tres luces (aspiración, entrada de aire e irrigación). Saratoga = dos luces. Jackson-Pratt y Redón = una luz con aspiración.","tema":"eliminacion","bloque":"Eliminación, sondajes y ostomías"},{"sim":"O","tag":"OPE SERGAS","n":"O55","q":"¿Cúando realizamos una desinfección concomitante?","caso":"","opts":["Al alta del paciente ingresado.","Cuanto el paciente permanece ingresado.","Al exitus del paciente.","Todas las respuestas son correctas."],"correct":1,"expl":"Desinfección concomitante (concurrente): la que se hace mientras el paciente está ingresado, sobre lo que contamina. Terminal: al alta o exitus.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O56","q":"Señale la respuesta falsa respecto al enfermo terminal:","caso":"","opts":["El paciente terminal tiene derecho a morir en paz y con dignidad.","A medida que la enfermedad avanza, se usan más medidas curativas.","Los/las niños/as entre 5 y 7 años entienden la muerte como un castigo.","La persona adulta nunca debe verse como una persona aislada."],"correct":1,"expl":"A medida que la enfermedad terminal avanza se usan MENOS medidas curativas y más paliativas (control de síntomas, confort).","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O57","q":"¿Cuál de las siguientes afirmaciones no es correcta respecto a la toma de temperatura corporal?","caso":"","opts":["Secar la axila del paciente con una gasa, ya que la humedad falsea el registro.","Colocar el bulbo del termómetro en la axila del paciente, cruzar su antebrazo sobre el tórax y esperar el tiempo necesario.","En la boca se coloca el bulbo del termómetro debajo de la lengua del paciente.","En caso de que el paciente este agitado, se tomará la temperatura en la boca."],"correct":3,"expl":"En pacientes agitados, inconscientes, con convulsiones o niños pequeños NO se toma la temperatura oral (riesgo de rotura/mordedura): se usa axilar, rectal o timpánica.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O58","q":"¿Cuál es el trastorno mental en el que una persona, deliberadamente causa lesión, enfermedad o trastorno a otra persona o a si mismo?","caso":"","opts":["Síndrome de Reye.","Síndrome de Brugada.","Síndrome de Munchhausen.","Síndrome de Cotard."],"correct":2,"expl":"Síndrome de Munchausen: se provoca deliberadamente síntomas o lesiones (a sí mismo; \"por poderes\" cuando se hace a otro, p. ej. un hijo). Cotard = delirio de estar muerto.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O59","q":"¿Con cuál de estos sintomas no está indicada la oxigenoterapia?","caso":"","opts":["Ortopnea.","Cianosis.","Eupnea.","Disnea."],"correct":2,"expl":"Eupnea = respiración normal (12-20 rpm en adulto): no requiere oxígeno. Disnea, ortopnea y cianosis sí son indicaciones de oxigenoterapia.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O60","q":"Entre las ventajas de la lactancia materna se encuentran todas las siguientes excepto:","caso":"","opts":["La leche tiene una temperatura adecuada independientemente del momento de la lactancia.","Contiene anticuerpos.","Aumenta la frecuencia de trastornos gastrointestinales.","Disminuye la tendencia a la sobrealimentación."],"correct":2,"expl":"La lactancia materna DISMINUYE los trastornos gastrointestinales (anticuerpos, temperatura adecuada, menos sobrealimentación).","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"O","tag":"OPE SERGAS","n":"O61","q":"La finalidad general de la higiene busca:","caso":"","opts":["Conservar la integridad de la piel.","Estimular la circulación sanguínea.","Mejorar su confort y bienestar.","Todas las respuestas son correctas."],"correct":3,"expl":"Objetivos de la higiene: conservar la integridad de la piel, estimular la circulación y mejorar el confort. Todas correctas.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"O","tag":"OPE SERGAS","n":"O62","q":"¿Cúal de las siguientes enfermedades mentales es una neurosis?","caso":"","opts":["Esquizofrenia.","Trastorno de conversión.","Trastorno bipolar.","Demencia."],"correct":1,"expl":"Neurosis: trastornos sin pérdida del contacto con la realidad (ansiedad, conversión, fobias). Esquizofrenia y trastorno bipolar son psicosis; la demencia es un trastorno orgánico.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O63","q":"Los/las pacientes terminales se dividen en:","caso":"","opts":["Adolescentes y adultos/as.","Niños/as, adolescentes y adultos/as.","Recién nacidos, lactantes, niños/as, adolescentes, adultos y ancianos/as.","Adolescentes y ancianos/as."],"correct":2,"expl":"Los pacientes terminales se clasifican por edad: recién nacidos, lactantes, niños, adolescentes, adultos y ancianos.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O64","q":"El instrumental que ocluye de forma provisional los vasos sanguíneos se llama:","caso":"","opts":["De hemostasia.","De disección.","De aprehensión.","De exposición."],"correct":0,"expl":"Instrumental de hemostasia: pinzas (Kocher, Crile, mosquito) que ocluyen vasos para detener el sangrado. Disección = separar tejidos; aprehensión = sujetar; exposición = separadores.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O65","q":"En la higiene del cordón umbilical. Señale la respuesta correcta:","caso":"","opts":["Se realizará la desinfección con alcohol de 96°.","Al realizar el baño no se debe sumergir.","Mantener el cordón limpio y seco en todo momento.","Las respuestas B y C son correctas."],"correct":3,"expl":"Cordón umbilical: mantener limpio y seco, no sumergir en el baño hasta que caiga, lavar con agua y jabón y secar. El alcohol de 96° y la povidona no se recomiendan.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"O","tag":"OPE SERGAS","n":"O66","q":"¿Cuándo está contraindicado la administración de un enema de limpieza?","caso":"","opts":["Antes de una exploración radiológica.","Obstrucción intestinal.","Impactación fecal.","Antes y después del parto."],"correct":1,"expl":"El enema de limpieza está contraindicado en obstrucción intestinal, apendicitis, cirugía reciente de colon/recto y hemorragia digestiva. Sí se usa en impactación fecal y antes de exploraciones.","tema":"eliminacion","bloque":"Eliminación, sondajes y ostomías"},{"sim":"O","tag":"OPE SERGAS","n":"O67","q":"¿Qué método utilizaremos para esterilizar material de caucho?","caso":"","opts":["Calor seco en estufa Poupinel.","Por óxido de etileno.","Con hipoclorito sódico.","Con ultrasonidos."],"correct":1,"expl":"Óxido de etileno: esterilización química en frío para material termosensible (caucho, plásticos, ópticas). El calor seco (Poupinel) es para vidrio y metal. Hipoclorito desinfecta, no esteriliza.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O68","q":"Según la regla de Wallace, ¿qué porcentaje de la superficie corporal corresponde a la extremidad inferior izquierda?","caso":"","opts":["18%.","9%.","36%.","1%."],"correct":0,"expl":"Regla de los 9 de Wallace: cabeza 9 %, cada brazo 9 %, tronco anterior 18 %, posterior 18 %, cada pierna 18 %, genitales 1 %.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O69","q":"¿Cuál es un tipo de sonda rectal?","caso":"","opts":["Foley.","Malecot.","Levin.","Todas las respuestas son incorrectas."],"correct":3,"expl":"Foley y Malecot son sondas vesicales; Levin es nasogástrica. Las sondas rectales son tubos flexibles de una luz (tipo Nelaton de gran calibre) sin balón.","tema":"eliminacion","bloque":"Eliminación, sondajes y ostomías"},{"sim":"O","tag":"OPE SERGAS","n":"O70","q":"No es una aplicación de calor seco:","caso":"","opts":["Bolsa de agua caliente.","Baño de parafina.","Fomentos.","Calentador eléctrico."],"correct":2,"expl":"Los fomentos (compresas húmedas calientes) son calor HÚMEDO. Calor seco: bolsa de agua caliente, manta eléctrica, parafina, lámpara de infrarrojos.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O71","q":"El instrumental que permite sujetar los campos quirúrgicos se denomina:","caso":"","opts":["De sutura.","De talla o campo.","De hemostasia.","De aprehensión."],"correct":1,"expl":"Las pinzas de campo o de talla (Backhaus) sujetan los paños quirúrgicos a la piel. Las de hemostasia ocluyen vasos, las de aprehensión sujetan tejidos.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O72","q":"Despues de la extracción de una muestra de LCR, ¿en qué posición colocaremos al paciente?","caso":"","opts":["Decúbito ventral sin almohada.","Decúbito supino sin almohada.","Fowler modificada.","Como el paciente se sienta más cómodo."],"correct":3,"expl":"Tras una punción lumbar el paciente se coloca en decúbito supino sin almohada (clásico) o, según protocolo actual, en la posición que le resulte más cómoda; el tribunal dio esta última como correcta.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O73","q":"¿De qué forma podemos aplicar desinfectantes?","caso":"","opts":["Inmersión.","Loción.","Pulverización.","Todas las respuestas son correctas."],"correct":3,"expl":"Los desinfectantes se aplican por inmersión del material, loción/fricción sobre superficies o pulverización. Todas correctas.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O74","q":"Los residuos de vacunas con agentes vivos o atenuados, ¿a qué clase de residuos pertenecen?","caso":"","opts":["Residuos sanitarios peligrosos clase lI.","Residuos sanitarios peligrosos clase III.","Residuos sanitarios peligrosos clase IV.","Residuos sanitarios peligrosos clase V."],"correct":1,"expl":"Los residuos de vacunas de agentes vivos o atenuados son residuos peligrosos clase III (biocontaminados), igual que agujas, cultivos y material de aislamientos.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O75","q":"El período prodrómico de una enfermedad transmisible se caracteriza por:","caso":"","opts":["La aparición de síntomas y signos que definen la enfermedad.","Paciente asintomático, pero acompañado de alteraciones en los datos analíticos.","La aparición de signos inespecíficos de carácter general.","La aparición de gran número de personas infectadas."],"correct":2,"expl":"Periodos de una enfermedad transmisible: incubación (asintomático), prodrómico (síntomas inespecíficos generales: malestar, febrícula), clínico (síntomas típicos) y convalecencia.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O76","q":"¿Cuales son las características clínicas de la demencia?","caso":"","opts":["Deterioro de las funciones intelectuales.","Comportamiento y afectividad.","Las respuestas A y B son correctas.","Ninguna respuesta es correcta."],"correct":0,"expl":"La demencia se define por el deterioro adquirido de las funciones intelectuales (memoria, orientación, juicio). Las alteraciones de comportamiento y afectividad acompañan pero no la definen.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O77","q":"La relación cuidar-sanar implica el desarrollo y la utilización de cualidades como:","caso":"","opts":["Empatía y calidez.","Amor y respeto.","Compasión y comunicación.","Todas son correctas."],"correct":3,"expl":"La relación cuidar-sanar requiere empatía, calidez, respeto, compasión y comunicación. Todas correctas.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O78","q":"¿Cuáles son los estadíos del proceso de morir?","caso":"","opts":["Período de negación.","Período de aceptación.","Período de depresión.","Todas las respuestas son correctas."],"correct":3,"expl":"Fases de Kübler-Ross ante la muerte: negación, ira, negociación (pacto), depresión y aceptación. Todas las opciones son fases.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O79","q":"¿Cúal es la función del Marco de Balkan?","caso":"","opts":["Sujetar poleas y equipos de tracción.","Sujetar el trapecio, para que el paciente pueda ayudarse en su movilización.","Sujetar los sueros.","Las respuestas A y B son correctas."],"correct":3,"expl":"El marco de Balkan es una estructura sobre la cama que sujeta poleas/equipos de tracción y el trapecio (triángulo) para que el paciente se movilice. A y B correctas.","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"O","tag":"OPE SERGAS","n":"O80","q":"Según NAHAS, la clasificación de las drogas, en relación con sus características farmacológicas, el tabaco entra dentro de:","caso":"","opts":["Grupo de opiáceos.","Grupo psicoestimulantes mayores.","Grupo de solventes.","Grupo de psicoestimulantes menores."],"correct":3,"expl":"Clasificación de Nahas: el tabaco (nicotina) y la cafeína son psicoestimulantes MENORES. Cocaína y anfetaminas son psicoestimulantes mayores.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O81","q":"Los restos anatómicos humanos de escasa entidad, procedentes de actividades sanitarias pertenecen a:","caso":"","opts":["Residuos sanitarios no peligrosos clase Il a.","Residuos sanitarios no peligrosos clase ll b.","Residuos sanitarios peligrosos clase IIl.","Residuos sanitarios peligrosos clase IV."],"correct":0,"expl":"Restos anatómicos de escasa entidad = clase IIa (no peligroso, específico). Los restos anatómicos de entidad (miembros, órganos reconocibles) tienen legislación propia (cadáveres).","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O82","q":"De las siguientes vacunas, ¿cúal está totalmente contraindicada en el embarazo?","caso":"","opts":["Polio.","Triple vírica.","Hib.","Gripe."],"correct":1,"expl":"Las vacunas de virus vivos atenuados (triple vírica, varicela) están contraindicadas en el embarazo. Gripe (inactivada), polio inactivada y Hib pueden administrarse.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O83","q":"El proceso de formación de úlceras por presión es:","caso":"","opts":["Erosión, vesícula y eritema.","Eritema, vesícula y erosión.","Hiperoxia, erosión y eritema.","Hipoxia, erosión y eritema."],"correct":1,"expl":"Formación de la UPP: presión → isquemia → eritema (que no palidece) → vesícula/flictena → erosión/úlcera → necrosis.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"O","tag":"OPE SERGAS","n":"O84","q":"La franja de edad que requiere más recursos hospitalarios es la comprendida por:","caso":"","opts":["Los adolescentes.","Los primeros y los últimos años de vida.","La pubertad.","La edad adulta."],"correct":1,"expl":"Los primeros años (neonatos, lactantes) y los últimos años de vida (ancianos, pluripatología) son los que más recursos hospitalarios consumen.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O85","q":"¿Cuál es el objetivo fundamental de la educación sanitaria?","caso":"","opts":["Aumentar los conocimientos de la población.","Modificar los comportamientos.","Disminuir la morbilidad.","Aumentar la morbilidad."],"correct":1,"expl":"El objetivo fundamental de la educación sanitaria es MODIFICAR los comportamientos (hábitos) hacia estilos de vida saludables; aumentar conocimientos es solo un medio.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O86","q":"Respecto a los grados de eficacia de las medidas de prevención de las infecciones nosocomiales, el empleo de guantes está incluído en la categoría:","caso":"","opts":["Grado |, eficacia probada.","Grado ll, eficacia lógica.","Grado Il eficacia dudosa.","Ninguna respuesta es correcta."],"correct":0,"expl":"Los guantes y el lavado de manos son medidas de grado I (eficacia probada) en la prevención de infecciones nosocomiales.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O87","q":"Una de las características del frío sobre el organismo es:","caso":"","opts":["Su efecto antihemorrágico.","Su efecto anestésico.","Su efecto astringente.","Todas las respuestas son correctas."],"correct":3,"expl":"El frío produce vasoconstricción (antihemorrágico), reduce la sensibilidad (anestésico), es astringente y antiinflamatorio. Todas correctas.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O88","q":"¿Qué muestras no se conservan en nevera antes de enviarlas al laboratorio?","caso":"","opts":["LCR.","Hemocultivos.","Exudados.","Ninguna de las muestras anteriores se guarda en nevera."],"correct":3,"expl":"LCR, hemocultivos y exudados NO se refrigeran (se dañan los microorganismos, p. ej. meningococo): se envían de inmediato o se mantienen a temperatura ambiente/estufa. Sí van en nevera orina, esputo, heces para cultivo.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O89","q":"En el proceso de f
