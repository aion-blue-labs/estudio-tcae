ormación de úlceras de decúbito, la isquemia se produce después de ocurrir:","caso":"","opts":["El enrojecimiento de la piel.","El dolor.","La presión prolongada de la zona.","La ruptura de la piel."],"correct":2,"expl":"La presión prolongada sobre una prominencia ósea comprime los capilares y produce isquemia; después aparece el enrojecimiento (eritema), el dolor y la rotura de la piel.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"O","tag":"OPE SERGAS","n":"O90","q":"En una tienda de oxígeno, manteniendo un flujo de 15 litros por minuto, se obtienen concentraciones de oxígeno del:","caso":"","opts":["30%-40%.","20%-30%.","50%-60%.","40%-50%."],"correct":2,"expl":"Tienda/carpa de oxígeno con 15 l/min: FiO2 del 50-60 %. Gafas nasales: 24-40 %. Venturi: 24-50 %. Mascarilla con reservorio: hasta 90 %.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O91","q":"¿Qué método debe utilizarse para la limpieza del instrumental de microcirugía, oftalmología y en general pequeños instrumentos?","caso":"","opts":["Ultrasonidos.","Formaldehido.","Glutaraldehido.","Las respuestas B y C son correctas."],"correct":0,"expl":"Los ultrasonidos limpian por cavitación el instrumental pequeño y delicado (microcirugía, oftalmología). Formaldehído y glutaraldehído son desinfectantes/esterilizantes químicos, no limpiadores.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O92","q":"¿Cuál de las siguientes localizaciones nos da una medición más exacta en la temperatura corporal?","caso":"","opts":["La axilar.","El recto.","La boca.","La vagina."],"correct":1,"expl":"La temperatura rectal es la más exacta (más cercana a la central) y la más alta (+0,5 °C sobre la axilar). La axilar es la más baja y menos precisa.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O93","q":"La dieta hiperproteica está indicada en caso de:","caso":"","opts":["Anemias.","Quemaduras.","Úlceras por presión.","Todas las respuestas son correctas."],"correct":3,"expl":"Dieta hiperproteica: anemias, quemaduras, UPP, desnutrición, postoperatorios, infecciones. Todas correctas.","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"O","tag":"OPE SERGAS","n":"O94","q":"La eficiencia es:","caso":"","opts":["La cantidad de mejoría del estado de salud de una población con una práctica determinada.","La relación entre las necesidades de una población y la atención recibida.","La satisfacción del paciente ante una situación.","La consecución de un nivel de calidad determinado al menor coste posible."],"correct":3,"expl":"Eficiencia = conseguir un nivel de calidad/resultado al menor coste posible. Eficacia = conseguir el objetivo en condiciones ideales. Efectividad = en condiciones reales.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O95","q":"En la RCP básica en adultos. ¿Cuál es la secuencia compresión/ventilación recomendada para un solo reanimador?","caso":"","opts":["15/2.","15/1.","30/2.","10/2."],"correct":2,"expl":"RCP básica en adultos: 30 compresiones / 2 ventilaciones, sea uno o dos reanimadores. Compresiones a 100-120 por minuto, 5-6 cm de profundidad.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O96","q":"Define plano sagital:","caso":"","opts":["El formado por los ejes longitudinal y sagital.","El formado por el cruce del eje transversal y sagital.","La unión del eje longitudinal y transversal.","Las respuestas A y B son correctas."],"correct":0,"expl":"Plano sagital: formado por los ejes longitudinal y sagital (anteroposterior); divide el cuerpo en derecha e izquierda. Frontal: longitudinal + transversal. Transversal: sagital + transversal.","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"O","tag":"OPE SERGAS","n":"O97","q":"La rotación o giro del antebrazo, que coloca la palma de la mano hacia atrás o hacia abajo y el dorso hacia arriba, se denomina:","caso":"","opts":["Pronación.","Supinación.","Flexión.","Las respuestas A y C son correctas."],"correct":0,"expl":"Pronación = girar el antebrazo con la palma hacia abajo/atrás. Supinación = palma hacia arriba/adelante (como si sostuvieras una sopa).","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"O","tag":"OPE SERGAS","n":"O98","q":"¿Qué factores predisponen o determinan la aparición de úlceras por presión?","caso":"","opts":["Exógenos e intrínsecos.","Endógenos e intrínsecos.","Extrínsecos e intrínsecos.","Extrínsecos y endógenos."],"correct":2,"expl":"Factores de riesgo de UPP: EXTRÍNSECOS (presión, fricción, cizalla, humedad) e INTRÍNSECOS (edad, inmovilidad, desnutrición, incontinencia, alteración de la sensibilidad).","tema":"upp","bloque":"Úlceras por presión"},{"sim":"O","tag":"OPE SERGAS","n":"O99","q":"¿Qué condiciones debe tener la habitación de un paciente?","caso":"","opts":["Debe tener luz directa del sol, a ser posible.","Tranquila y sin ruidos.","De fácil ventilación.","Todas las respuestas son correctas."],"correct":3,"expl":"La habitación del paciente: luz natural (solar) a ser posible, tranquila y sin ruidos, de fácil ventilación, temperatura 20-22 °C y humedad 40-60 %. Todas correctas.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"O","tag":"OPE SERGAS","n":"O100","q":"Los productos químicos que inhiben el crecimiento de bacterias se denominan:","caso":"","opts":["Antisépticos.","Bactericidas.","Germicidas.","Ninguna respuesta es correcta."],"correct":3,"expl":"Los productos que INHIBEN el crecimiento bacteriano (sin matar) son bacteriostáticos. Bactericidas/germicidas destruyen los microorganismos; los antisépticos se aplican sobre tejidos vivos.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O101","q":"¿Qué artículo del Capítulo III de la Ley 41/2002 , de 14 de noviembre, básica reguladora de la autonomía del paciente establece que: Toda persona tiene derecho a que se respete el carácter confidencial de los datos referentes a su salud, y a que nadie pueda acceder a ellos sin previa autorización amparada por la ley?","caso":"","opts":["Artículo 11.","Artículo 7.","Artículo 15.","Artículo 5."],"correct":1,"expl":"Ley 41/2002, art. 7: derecho a la intimidad (confidencialidad de los datos de salud). Art. 5: titular del derecho a la información. Art. 15: contenido de la historia clínica. Art. 11: instrucciones previas.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O102","q":"El lavado genital femenino:","caso":"","opts":["Es indiferente como se realice.","Se lavará en sentido de adelante hacia atrás.","Se lavará en círculos.","Se lavará en sentido de atrás hacia adelante."],"correct":1,"expl":"El lavado genital femenino se hace siempre de delante hacia atrás (del meato hacia el ano) para no arrastrar gérmenes fecales a la uretra y la vagina.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"O","tag":"OPE SERGAS","n":"O103","q":"¿Cuál es la dieta apropiada en un anciano desnutrido y con úlceras por presión?","caso":"","opts":["Dieta blanda, pobre en glúcidos e hiposódica.","Dieta hiperproteica, pobre en glúcidos e hipersódica.","Dieta blanda, hipercalórica e hiperproteica.","Dieta normal, pobre en sal e hipercalórica."],"correct":2,"expl":"Anciano desnutrido con UPP: dieta blanda (fácil de masticar), hipercalórica e hiperproteica para favorecer la cicatrización. No debe ser hipersódica ni pobre en glúcidos.","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"O","tag":"OPE SERGAS","n":"O104","q":"El WORD, como procesador de texto:","caso":"","opts":["Solo trabaja con letras y números.","Sirve para calcular y realizar operaciones de cálculo automáticamente.","Es una herramienta más de Microsoft Office.","Sólo permite corregir textos al final del documento."],"correct":2,"expl":"Word es el procesador de textos del paquete Microsoft Office (Excel calcula, PowerPoint presenta). Permite corregir en cualquier punto del documento y trabajar con imágenes, tablas, etc.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O105","q":"El EPINE hace referencia a:","caso":"","opts":["La prevalencia de infecciones nosocomiales entéricas.","La prevalencia de infecciones nosocomiales externas.","La prevalencia de infecciones nosocomiales en España.","Las precauciones universales y de España."],"correct":2,"expl":"EPINE = Estudio de Prevalencia de las Infecciones Nosocomiales en España; se realiza anualmente desde 1990.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O106","q":"¿Cuál no es un enema de retención?","caso":"","opts":["Emoliente.","Opaco.","Evacuante.","Antihelmíntico."],"correct":2,"expl":"Enemas de RETENCIÓN (se mantienen 20-30 min o más): emoliente/oleoso, opaco (contraste), antihelmíntico, medicamentoso. El evacuante o de limpieza se expulsa en pocos minutos.","tema":"eliminacion","bloque":"Eliminación, sondajes y ostomías"},{"sim":"O","tag":"OPE SERGAS","n":"O107","q":"¿Cuál de los siguientes factores no afecta a la frecuencia respiratoria de una persona adulta?","caso":"","opts":["La alimentación.","La edad.","El ejercicio físico.","La altitud geográfica."],"correct":0,"expl":"La frecuencia respiratoria varía con la edad, el ejercicio, la altitud, la fiebre, el dolor, las emociones y los fármacos. La alimentación no la modifica de forma directa.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O108","q":"De conformidad con el artículo 45 del Decreto 206/2005, de 22 de julio, de provisión de plazas de personal estatutario del Servicio Gallego de Salud, los puestos de supervisor/a de área de enfermería se cubren por el procedimiento de:","caso":"","opts":["Concurso de méritos.","Evaluación colegiada.","Libre designación.","Concurso de traslados."],"correct":2,"expl":"Decreto 206/2005, art. 45: los puestos de supervisor/a de área de enfermería (y jefaturas de unidad) se cubren por libre designación.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O109","q":"La Constitución española de 1978, en su artículo 15 establece que:","caso":"","opts":["Todos los españoles tienen derecho a la vida y a la integridad física y moral.","Todos tienen derecho a la vida y a la integridad física y mental.","Todos los españoles tienen derecho a la vida y a la integridad física y mental.","Todos tienen derecho a la vida y a la integridad física y moral."],"correct":3,"expl":"Constitución española, art. 15: \"Todos tienen derecho a la vida y a la integridad física y moral\" (no dice \"españoles\" ni \"mental\"). Ojo con la literalidad.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O110","q":"Según el artículo 11 del Estatuto de Autonomía de Galicia, Ley orgánica 1/1981 de 6 de abril, el Parlamento estará constituido por diputados elegidos por:","caso":"","opts":["Sufragio universal, igual, libre, directo y secreto.","Sufragio restringido.","Sufragio universal, igual, libre, directo y público.","Sufragio universal, igual, libre e indirecto."],"correct":0,"expl":"Estatuto de Autonomía de Galicia, art. 11: el Parlamento se elige por sufragio universal, igual, libre, directo y secreto.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O111","q":"Según el artículo 30 de la Ley 8/2008, de 10 de julio, de salud de Galicia, el sistema público de salud de Galicia es:","caso":"","opts":["Parte integrante del Sistema Nacional de Salud.","Un sistema independiente del Sistema Nacional de Salud.","Un sistema independiente que debe coordinarse con el Sistema Nacional de Salud.","Ninguna de las respuestas es correcta."],"correct":0,"expl":"Ley 8/2008 de salud de Galicia, art. 30: el Sistema Público de Salud de Galicia es parte integrante del Sistema Nacional de Salud.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O112","q":"De conformidad con el artículo 2 del Decreto 206/2005, del 22 de julio, la provisión de plazas de personal estatutario del Servicio Gallego de Salud se rige por los siguientes principios básicos:","caso":"","opts":["Igualdad y capacidad.","Mérito.","Publicidad.","Todas las respuestas anteriores son correctas."],"correct":3,"expl":"Decreto 206/2005, art. 2: la provisión de plazas se rige por igualdad, mérito, capacidad y publicidad. Todas correctas.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O113","q":"De conformidad con el artículo 5 de la Ley Orgánica 15/1999, del 13 de diciembre, de protección de datos de carácter personal, los interesados a los que se soliciten datos personales deberán ser previamente informados:","caso":"","opts":["De las consecuencias de la obtención de los datos o de la negativa a facilitarlos.","De la posibilidad de ejercitar, entre otros, los derechos de acceso y cancelación.","De la identidad y dirección del responsable del tratamiento o, en su caso, de su representante.","Todas las respuestas anteriores son correctas."],"correct":3,"expl":"LOPD 15/1999, art. 5 (derogada por la LO 3/2018): el interesado debe ser informado de las consecuencias de facilitar o no los datos, de sus derechos (acceso, rectificación, cancelación, oposición) y de la identidad del responsable. Todas.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O114","q":"De conformidad con el artículo 9 del Decreto 206/2005, del 22 de julio, de provisión de plazas de personal estatutario del Servicio Gallego de Salud, para poder participar en los procesos de selección de personal estatutario fijo, será preciso reunir el siguiente requisito:","caso":"","opts":["Poseer la titulación exigida en la convocatoria o estar en condiciones de obtenerla dentro del plazo de presentación de solicitudes.","Poseer la capacidad funcional necesaria para el desempeño de las funciones que deriven del correspondiente nombramiento.","No haber sido separado/a del servicio, mediante expediente disciplinario, en los seis años anteriores a la convocatoria.","Todas las respuestas anteriores son correctas."],"correct":3,"expl":"Decreto 206/2005, art. 9: requisitos para participar: titulación, capacidad funcional, no haber sido separado del servicio (6 años), nacionalidad, edad. Todas correctas.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O115","q":"Indique cuales de las siguientes son retribuciones básicas del personal estatutario de los servicios de salud:","caso":"","opts":["Sueldo, trienios y complemento de productividad fija.","Sueldo, trienios y pagas extraordinarias.","Sueldo, complemento de destino y complemento específico.","Sueldo, trienios y complemento de atención continuada."],"correct":1,"expl":"Estatuto Marco (Ley 55/2003), art. 42: retribuciones BÁSICAS = sueldo, trienios y pagas extraordinarias. Las complementarias: destino, específico, productividad, atención continuada, carrera.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O116","q":"La Constitución española de 1978, establece en su artículo 41, que los poderes públicos mantendrán:","caso":"","opts":["Un régimen público de seguridad social para todos los españoles.","Un régimen público de seguridad social para todos los ciudadanos.","Un régimen público o privado de seguridad social para todos los españoles.","Un régimen público o privado de seguridad social para todos los ciudadanos."],"correct":1,"expl":"Constitución, art. 41: \"los poderes públicos mantendrán un régimen público de Seguridad Social para todos los ciudadanos\". Literal: público y ciudadanos.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O117","q":"Indique cuál de los siguientes NO constituye un derecho colectivo del personal estatutario, según el artículo 18 del Estatuto Marco del personal estatutario de los servicios de salud:","caso":"","opts":["El derecho a la huelga.","El derecho a la libre sindicación.","El derecho a la negociación colectiva.","El derecho a la movilidad voluntaria."],"correct":3,"expl":"Estatuto Marco, art. 18, derechos colectivos: libre sindicación, negociación colectiva, huelga, reunión, participación. La movilidad voluntaria es un derecho INDIVIDUAL (art. 17).","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O118","q":"De conformidad con el artículo 9 de la Ley 31/1995, del 8 de noviembre, de prevención de riesgos laborales, la función de vigilancia y control de la normativa sobre prevención de riesgos laborales corresponde a:","caso":"","opts":["Instituto Nacional de la Seguridad Social.","Ministerio de Sanidad, Servicios Sociales e Igualdad.","Tesorería General de la Seguridad Social.","Inspección de Trabajo y Seguridad Social."],"correct":3,"expl":"Ley 31/1995 de PRL, art. 9: la vigilancia y control del cumplimiento de la normativa de prevención corresponde a la Inspección de Trabajo y Seguridad Social.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O119","q":"La Ley 14/1986 de 25 de abril, general de sanidad, establece en su artículo 10.13, que todos tienen derecho con respecto a las distintas administraciones públicas sanitarias:","caso":"","opts":["A elegir solamente el médico.","A elegir el médico y los demás sanitarios titulados.","A elegir todos los profesionales que trabajan en el ámbito de la salud.","Ninguna de las respuestas es correcta."],"correct":1,"expl":"Ley General de Sanidad, art. 10.13: derecho a elegir el médico y los demás sanitarios titulados, en los términos que reglamentariamente se establezcan.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O120","q":"El artículo 6 de la Ley 14/1986, de 25 de abril, General de Sanidad, establece que las actuaciones de las Administraciones Públicas estarán orientadas a:","caso":"","opts":["Garantizar que cuantas acciones sanitarias se desarrollen estén dirigidas a la prevención de enfermedades y no solo a su curación.","Garantizar la información sobre los servicios sanitarios.","Promover el interés colectivo mediante la educación de la población.","Garantizar que los ciudadanos obtengan los medicamentos y productos sanitarios que consideren necesarios para la salud."],"correct":2,"expl":"Ley General de Sanidad, art. 6: las actuaciones se orientan a la promoción de la salud, a promover el interés individual, familiar y social por la salud mediante la educación sanitaria, a la prevención, a garantizar la asistencia y a la rehabilitación.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O121","q":"De acuerdo con lo previsto en el artículo 4 del Decreto 206/2005, de provisión de plazas de personal estatutario del Servicio Gallego de Salud, señale cuál de los siguientes NO es un sistema de provisión de plazas:","caso":"","opts":["Promoción interna.","Movilidad.","Carrera profesional.","Reingreso provisional al servicio activo."],"correct":0,"expl":"Decreto 206/2005, art. 4: sistemas de provisión = concurso de traslados (movilidad), libre designación, reingreso provisional, comisión de servicios... La promoción interna es un sistema de SELECCIÓN, no de provisión.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O122","q":"De conformidad con la Ley 3/2001, reguladora del consentimiento informado y de la historia clínica de los pacientes, en el consentimiento por sustitución, en el caso de los familiares, se dará preferencia, si existen:","caso":"","opts":["Al cónyuge o pareja de hecho.","Progenitores.","Descendientes mayores de edad.","Familiares de primer grado por consanguinidad."],"correct":0,"expl":"Ley 3/2001 de Galicia (consentimiento informado): en el consentimiento por sustitución se da preferencia al cónyuge o pareja de hecho; en su defecto, familiares de grado más próximo y, dentro del mismo grado, de mayor edad.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O123","q":"La Ley 31/1995, de 8 de noviembre, de prevención de riesgos laborales, establece que se considerarán como \"daños derivados del trabajo\":","caso":"","opts":["Las enfermedades profesionales.","Las lesiones o enfermedades sufridas a consecuencia de un accidente de trabajo.","Las enfermedades, patologías o lesiones sufridas con motivo u ocasión del trabajo.","Las lesiones físicas producidas en el lugar de trabajo o durante el desplazamiento en la entrada y salida del mismo."],"correct":2,"expl":"Ley 31/1995 PRL, art. 4: \"daños derivados del trabajo\" = enfermedades, patologías o lesiones sufridas con motivo u ocasión del trabajo. Literal.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O124","q":"La Ley 55/2003, del Estatuto Marco del personal estatutario, en su artículo 6 y atendiendo al nivel académico del título exigido para el ingreso, clasifica al personal estatutario sanitario en:","caso":"","opts":["Facultativos especialistas de área y diplomados universitarios de enfermería.","Facultativos, diplomados sanitarios y técnicos.","Personal de formación universitaria y personal de formación profesional.","Licenciados, graduados y técnicos superiores."],"correct":2,"expl":"Estatuto Marco, art. 6: el personal estatutario sanitario se clasifica, según el título exigido, en personal de formación universitaria (licenciados/graduados, diplomados) y personal de formación profesional (técnicos superiores y técnicos).","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O125","q":"Según la Ley 8/2008, de salud de Galicia, el Servicio Gallego de Salud:","caso":"","opts":["No es un organismo autónomo.","Tiene por objeto la prestación directa de servicios de salud pública.","Está dotado de personalidad jurídica propia y plena capacidad para el cumplimiento de sus fines.","Está adscrito al Consello de la Xunta."],"correct":2,"expl":"Ley 8/2008 de salud de Galicia: el SERGAS es un organismo autónomo adscrito a la Consellería de Sanidad, con personalidad jurídica propia y plena capacidad para cumplir sus fines; presta asistencia sanitaria (la salud pública es de la Consellería).","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O126","q":"Conforme a la Ley 3/2001, reguladora del consentimiento informado y de la historia clínica de los pacientes, los datos relativos al proceso en una historia clínica deben incluir al menos:","caso":"","opts":["Órdenes médicas.","Informe sobre los procedimientos diagnósticos o terapéuticos e interconsultas realizadas.","Hoja de evolución y planificación de cuidados de enfermería.","Todas las respuestas son correctas."],"correct":3,"expl":"Ley 3/2001, contenido mínimo de la historia clínica (datos del proceso): órdenes médicas, informes de procedimientos e interconsultas, hoja de evolución y planificación de cuidados de enfermería, anamnesis, etc. Todas correctas.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O127","q":"Según el artículo 67 de la Ley 55/2003, de 16 de diciembre, del Estatuto Marco del personal estatutario de los servicios de salud, el tiempo que el personal estatutario permanezca en situación de excedencia voluntaria:","caso":"","opts":["Computa a efectos de carrera profesional.","Computa a efectos de trienios.","Computa a efectos de carrera profesional y trienios.","No computa a efectos de carrera profesional ni de trienios."],"correct":3,"expl":"Estatuto Marco, art. 67: el tiempo en excedencia voluntaria NO computa a efectos de carrera profesional ni de trienios (tampoco se reserva plaza).","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O128","q":"Los aspirantes nombrados tras la superación de un proceso selectivo de personal fijo deberán incorporarse al destino adjudicado:","caso":"","opts":["En el plazo de un mes desde el día siguiente a la publicación de la resolución en el Diario Oficial de Galicia.","Al día siguiente de la publicación de la resolución en el Diario Oficial de Galicia.","El día de la publicación de la resolución en el Diario Oficial de Galicia.","En el plazo de 15 días desde la publicación de la resolución en el Diario Oficial de Galicia."],"correct":0,"expl":"Tras superar el proceso selectivo, los aspirantes disponen de un mes desde el día siguiente a la publicación de la resolución en el DOG para incorporarse al destino adjudicado.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O129","q":"El sistema público de salud de Galicia se ordena territorialmente en:","caso":"","opts":["Áreas de gestión integrada y comarcas sanitarias.","Áreas sanitarias, distritos sanitarios y zonas sanitarias.","Áreas de salud y zonas básicas de salud.","Áreas de atención hospitalaria y distritos de atención primaria."],"correct":1,"expl":"Ley 8/2008 de salud de Galicia: ordenación territorial en áreas sanitarias, distritos sanitarios y zonas sanitarias.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O130","q":"A efectos de la Ley 11/2007, de 27 de julio, gallega para la prevención y el tratamiento integral de la violencia de género, la situación de violencia se acreditará mediante:","caso":"","opts":["Sentencia de cualquier orden jurisdiccional que declare que la mujer ha sufrido violencia en cualquiera de las modalidades definidas en la Ley.","Certificación o informe de los servicios sociales y/o sanitarios de la Administración pública autonómica o local.","Certificación de los servicios de acogida de la Administración pública autonómica o local.","Todas las respuestas anteriores son correctas."],"correct":3,"expl":"Ley 11/2007 gallega de violencia de género, art. 5: la situación se acredita por sentencia, orden de protección, informe del Ministerio Fiscal, certificación de servicios sociales/sanitarios o de servicios de acogida, entre otros. Todas correctas.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O131","q":"De conformidad con el artículo 1 de la Ley 14/1986, de 25 de abril, General de Sanidad, son titulares del derecho a la protección de la salud y a la atención sanitaria:","caso":"","opts":["Todos los españoles.","Todos los españoles residentes en territorio nacional y en situación de alta en la Seguridad Social.","Todos los españoles y los ciudadanos extranjeros que tengan establecida su residencia en el territorio nacional.","Todos los españoles y los ciudadanos extranjeros que tengan establecida su residencia en la Unión Europea."],"correct":2,"expl":"Ley General de Sanidad, art. 1.2: son titulares del derecho a la protección de la salud todos los españoles y los ciudadanos extranjeros que tengan establecida su residencia en el territorio nacional.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"O","tag":"OPE SERGAS","n":"O132","q":"¿Qué infección vírica es la más común en los pacientes que están recibiendo quimioterapia?","caso":"","opts":["La candidiasis oral.","El herpes simple.","La xerostomía.","Las úlceras por decúbito."],"correct":1,"expl":"En pacientes con quimioterapia (inmunodeprimidos) la infección VÍRICA más común es el herpes simple. La candidiasis es fúngica, la xerostomía (boca seca) es un síntoma y las UPP no son infecciones.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O133","q":"El ácido palmítico es un ácido graso:","caso":"","opts":["Poliinsaturado.","Saturado.","Parcialmente insaturado.","Ninguna es correcta."],"correct":1,"expl":"El ácido palmítico es un ácido graso SATURADO (grasas animales, aceite de palma). Los insaturados: oleico (mono), linoleico y omega-3 (poli).","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"O","tag":"OPE SERGAS","n":"O134","q":"El paso del fármaco desde el lugar donde se administra hasta el torrente sanguíneo se llama:","caso":"","opts":["Distribución.","Liberación.","Biotransformación.","Absorción."],"correct":3,"expl":"Farmacocinética (LADME): Liberación → ABSORCIÓN (paso del lugar de administración a la sangre) → Distribución → Metabolismo (biotransformación) → Excreción.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O135","q":"¿Qué significa en geriatría el término \"anciano frágil”?","caso":"","opts":["Hace referencia a una situación de alto riesgo de deterioro.","El término frágil no es suficientemente descriptivo.","Hace referencia a una situación de bajo riesgo de deterioro.","Las respuestas a y b son correctas."],"correct":0,"expl":"\"Anciano frágil\" = persona mayor en situación de alto riesgo de deterioro, dependencia, institucionalización o muerte, por disminución de su reserva funcional.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O136","q":"Se denomina eupnea:","caso":"","opts":["Dificultad respiratoria.","Respiración normal.","Cese de la respiración.","Incapacidad para respirar en posición horizontal."],"correct":1,"expl":"Eupnea = respiración normal (12-20 rpm en el adulto). Disnea = dificultad; apnea = cese; ortopnea = incapacidad de respirar tumbado.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O137","q":"¿Qué es la habilidad?","caso":"","opts":["Ponerse en el lugar de otra persona.","Saber escuchar atentamente.","Un estado de alegría.","La capacidad y disposición para hacer algo."],"correct":3,"expl":"Habilidad = capacidad y disposición para hacer algo. Empatía = ponerse en el lugar del otro; escucha activa = saber escuchar.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O138","q":"La asistencia en los cuidados paliativos se realiza según unos principios básicos de bioética, que son:","caso":"","opts":["Autonomía, higiene y actividad física.","Reposo y sueño.","Cuidados espirituales, relajación y bienestar.","Justicia, beneficencia, autonomía y no maleficencia."],"correct":3,"expl":"Los cuatro principios de la bioética (Beauchamp y Childress): autonomía, beneficencia, no maleficencia y justicia. Son la base de los cuidados paliativos.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O139","q":"Se establecen como algunas de las cualidades de un buen desinfectante. Señale la CORRECTA:","caso":"","opts":["Que cubra un amplio espectro con capacidad para destruir toda la gama de microorganismos.","Que sea estable, de tal forma que su acción no pueda ser modificada por las características del medio en el que actúa.","Que sea biodegradable para evitar la contaminación residual.","Todas son correctas."],"correct":3,"expl":"Un buen desinfectante: amplio espectro, estable (no se altera por el medio), biodegradable, no tóxico, no corrosivo, acción rápida y económico. Todas correctas.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O140","q":"Según el Dr. A. Donabedian se establece un marco conceptual para el estudio de la calidad asistencial:","caso":"","opts":["Analizando el proceso.","Analizando la eficacia.","Analizando el proceso y la eficacia.","Analizando la estructura, el proceso y los resultados."],"correct":3,"expl":"Donabedian: la calidad asistencial se evalúa analizando la ESTRUCTURA (recursos), el PROCESO (lo que se hace) y los RESULTADOS (lo que se consigue).","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O141","q":"¿En qué grado de la enfermedad de Alzheimer el enfermo puede aún bañarse y vestirse solo, con la vigilancia del familiar cuidador?","caso":"","opts":["Primer grado.","Segundo grado.","Tercer grado.","Cuarto grado."],"correct":0,"expl":"Clasificación del Alzheimer por grados: en el PRIMER grado (leve) el enfermo aún puede bañarse y vestirse solo con supervisión del cuidador; en fases avanzadas pierde esas capacidades.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O142","q":"¿En qué período actúa la prevención primaria de la enfermedad?","caso":"","opts":["En la fase subclínica del período patogénico.","En la fase clínica del período patogénico.","En el período pre-patogénico.","Ninguna es correcta."],"correct":2,"expl":"Prevención primaria: actúa en el periodo PRE-patogénico (antes de que aparezca la enfermedad: vacunas, educación sanitaria). Secundaria: fase subclínica/clínica precoz (cribados). Terciaria: rehabilitación.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O143","q":"Entre las escalas de valoración de riesgo de desarrollar una úlcera por presión NO se encuentra:","caso":"","opts":["Escala de Arnell.","Escala de Barthel.","Escala de Norton.","Escala de Braden."],"correct":1,"expl":"Escalas de riesgo de UPP: Norton, Braden, Arnell, Emina, Waterlow. La escala de Barthel mide la independencia para las actividades básicas de la vida diaria, NO el riesgo de UPP.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"O","tag":"OPE SERGAS","n":"O144","q":"¿A qué hace referencia la denominada “hora de oro” al hablar de los politraumatizados?","caso":"","opts":["A la hora en que estadísticamente ocurren la mayoría de los accidentes.","Al tercer pico en la distribución por causas de muerte en el politraumatizado.","A la edad en que estadísticamente ocurren la mayoría de los accidentes.","Al segundo pico en la distribución por causas de muerte en el politraumatizado, en el que ocurren el 60 % de los fallecimientos."],"correct":3,"expl":"En el politraumatizado la mortalidad tiene tres picos; el segundo (primeras horas tras el accidente) concentra el 60 % de las muertes: es la \"hora de oro\", en la que una atención rápida salva vidas.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O145","q":"¿Cuáles son las cinco comprobaciones que debemos realizar al preparar un medicamento?","caso":"","opts":["Fármaco, dosis, vía, hora y paciente.","Vía, dosis, fármaco, paciente y médico/a.","Fármaco, dosis, hora, vía y enfermero/a.","Ninguna es correcta."],"correct":0,"expl":"Los cinco correctos de la administración de medicamentos: fármaco correcto, dosis correcta, vía correcta, hora correcta y paciente correcto (hoy se añaden registro, caducidad, etc.).","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O146","q":"Desde el punto de vista funcional, los alimentos se agrupan en:","caso":"","opts":["Hidratos de carbono, lípidos, proteínas, vitaminas y minerales.","Energéticos, plásticos y reguladores.","Minerales y vitaminas.","Proteínas y calcio."],"correct":1,"expl":"Clasificación funcional de los alimentos: ENERGÉTICOS (hidratos, grasas), PLÁSTICOS o formadores (proteínas, calcio) y REGULADORES (vitaminas, minerales, agua, fibra).","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"O","tag":"OPE SERGAS","n":"O147","q":"Se considera fiebre muy alta:","caso":"","opts":["Temperatura de 40,6 °C a 41 °C.","Temperatura de 38,1 °C a 38,5 °C.","Temperatura de 38,6 °C a 39 °C.","Temperatura mayor de 41 °C."],"correct":0,"expl":"Según la clasificación usada por el tribunal: febrícula 37,1-37,9; fiebre ligera 38-38,5; moderada 38,6-39; alta 39,1-40,5; muy alta 40,6-41; hiperpirexia >41 °C.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O148","q":"Según el Decreto de Residuos Sanitarios de Galicia, la clasificación de los residuos generados en la actividad sanitaria es:","caso":"","opts":["Residuos sanitarios peligrosos y residuos sanitarios no peligrosos.","Residuos inflamables, residuos para el reciclaje y residuos alimentarios.","Residuos sanitarios para el reciclaje y residuos sanitarios alimentarios.","Residuos sanitarios para el reciclaje y residuos sanitarios para destrucción."],"correct":0,"expl":"Decreto 38/2015 de residuos sanitarios de Galicia: se clasifican en residuos sanitarios NO PELIGROSOS (clase I y II) y PELIGROSOS (clase III biocontaminados, IV citotóxicos, V químicos, VI radiactivos, VII restos anatómicos).","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O149","q":"El masaje cardíaco externo en lactantes se realiza deprimiendo el esternón para que se hunda aproximadamente:","caso":"","opts":["5 cm.","3 cm.","En los lactantes no se realiza masaje cardíaco.","4 cm."],"correct":3,"expl":"RCP en lactantes: compresiones con dos dedos (o dos pulgares abrazando el tórax) en el tercio inferior del esternón, deprimiéndolo unos 4 cm (un tercio del diámetro torácico). En niños 5 cm; adultos 5-6 cm.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O150","q":"El tiempo máximo aproximado que debe permanecer puesta una sonda rectal es de:","caso":"","opts":["60 minutos.","30 minutos.","2 horas.","Hasta que el paciente sienta alivio."],"correct":1,"expl":"La sonda rectal se mantiene un máximo de unos 30 minutos para evitar lesiones de la mucosa; si es necesario se repite pasadas 2-3 horas.","tema":"eliminacion","bloque":"Eliminación, sondajes y ostomías"},{"sim":"O","tag":"OPE SERGAS","n":"O151","q":"Una cistografía retrógrada es el nombre que recibe una radiografía por contraste de:","caso":"","opts":["Los bronquios.","Los uréteres.","El riñón.","La vejiga."],"correct":3,"expl":"Cistografía retrógrada: radiografía con contraste de la VEJIGA introducido por la uretra. Pielografía/urografía = riñón y uréteres; broncografía = bronquios.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O152","q":"Para realizar el procedimiento de colocar al paciente en decúbito lateral es imprescindible:","caso":"","opts":["Frenar la cama.","Realizar una abducción de los dedos de las manos.","Realizar una aducción de los dedos de las manos.","Realizar una abducción y una aducción de los dedos de las manos."],"correct":0,"expl":"Antes de cualquier movilización es imprescindible FRENAR la cama (y colocarla a la altura adecuada) para la seguridad del paciente y del profesional.","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"O","tag":"OPE SERGAS","n":"O153","q":"El síndrome que se caracteriza porque el afectado cree que ha muerto, que sus órganos o intestinos no funcionan, o que su corazón no late, se denomina:","caso":"","opts":["Síndrome de Münchhausen.","Síndrome de Pica.","Síndrome de Cotard.","Síndrome de Schultz."],"correct":2,"expl":"Síndrome de Cotard: delirio de negación (cree estar muerto, que sus órganos no funcionan). Munchausen = simulación deliberada de enfermedad. Pica = ingesta de sustancias no nutritivas.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O154","q":"En un ordenador, ¿cuál de los siguientes NO es un periférico?","caso":"","opts":["Ratón.","Teclado.","Memoria RAM.","Todas son correctas."],"correct":2,"expl":"La memoria RAM es un componente interno de la unidad central, no un periférico. Ratón, teclado, monitor e impresora sí son periféricos (de entrada/salida).","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O155","q":"El principio que consiste en buscar el bien del enfermo se denomina:","caso":"","opts":["Principio de no maleficencia.","Principio de justicia.","Principio de beneficencia.","Principio de autonomía."],"correct":2,"expl":"Beneficencia = buscar el bien del enfermo. No maleficencia = no dañar. Autonomía = respetar sus decisiones. Justicia = repartir con equidad.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O156","q":"Un paciente está recibiendo alimentación enteral:","caso":"","opts":["Se alimenta por una sonda nasogástrica introducida en el estómago.","Se alimenta por sí solo.","Se alimenta por vía intravenosa.","Necesita la ayuda del médico."],"correct":0,"expl":"Alimentación ENTERAL: aporte de nutrientes al tubo digestivo por sonda (nasogástrica, gastrostomía). PARENTERAL = por vía intravenosa.","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"O","tag":"OPE SERGAS","n":"O157","q":"En la higiene de los ojos, si el paciente está inconsciente, la lubricación del ojo debe hacerse con:","caso":"","opts":["Pomada lubricante.","Agua.","Colirio.","Suero."],"correct":0,"expl":"En el paciente inconsciente el ojo no parpadea y se seca: tras limpiarlo con suero, se lubrica con pomada/lágrima artificial y, si procede, se cubre. El tribunal dio como correcta la pomada lubricante.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"O","tag":"OPE SERGAS","n":"O158","q":"En cuanto a la clorhexidina como desinfectante. ¿Cuál de las siguientes afirmaciones es VERDADERA?","caso":"","opts":["Puede mezclarse con jabones amónicos para una disolución más efectiva.","No se puede usar para la prevención y el tratamiento odontológico.","No enmascara la evolución de las heridas.","Es el desinfectante más usado en la desinfección de endoscopios."],"correct":2,"expl":"Clorhexidina: antiséptico de amplio espectro, no enmascara la evolución de las heridas (no tiñe), se inactiva con jabones aniónicos y se usa en odontología. No es el desinfectante de endoscopios (eso es el glutaraldehído/ácido peracético).","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O159","q":"Las funciones generales o básicas del/de la técnico/a en cuidados auxiliares de enfermería son:","caso":"","opts":["Asistenciales y técnicas.","Asistenciales y administrativas.","Asistenciales, administrativas, docentes e investigadoras.","Asistenciales, administrativas, técnicas y docentes."],"correct":2,"expl":"Funciones generales del TCAE: asistenciales, administrativas, docentes e investigadoras (colabora en formación e investigación dentro de su nivel).","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"O","tag":"OPE SERGAS","n":"O160","q":"Dentro de las fases de la úlcera por presión, en la que se observa necrosis o muerte celular pertenece a:","caso":"","opts":["Úlcera grado I.","Úlcera grado II.","Úlcera grado III.","Úlcera grado IV."],"correct":2,"expl":"UPP grado III: pérdida total del grosor de la piel con NECROSIS del tejido subcutáneo (puede llegar hasta la fascia, sin atravesarla). Grado IV: afecta músculo, hueso o estructuras de sostén.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"O","tag":"OPE SERGAS","n":"O161","q":"Para realizar la cura de mantenimiento del catéter central de inserción periférica en un adulto, el personal TCAE tendrá preparado como antiséptico:","caso":"","opts":["Clorhexidina mayor del 0,5 % con alcohol isopropílico al 70°.","Povidona iodada alcohólica, salvo en catéteres de silicona.","Sulfadiazina de plata con hidróxido potásico.","A y B son correctas."],"correct":3,"expl":"Cura del catéter central de inserción periférica (PICC): clorhexidina >0,5 % alcohólica al 70 % (de elección) o povidona yodada alcohólica (no en catéteres de silicona, porque la daña). A y B correctas.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O162","q":"Entre los tipos de relaciones que se establecen entre un agente causal o etiológico y el huésped, pueden existir:","caso":"","opts":["Simbiosis, comensalismo, parasitismo, saprofitismo y oportunismo.","Simbiosis, parasitismo, furitismo, discitismo y fagocitismo.","Parasitismo, oportunismo, comensalismo, saprofitismo y discitismo.","Simbiosis, oportunismo, saprofitismo, furitismo y fagocitismo."],"correct":0,"expl":"Relaciones agente-huésped: simbiosis (beneficio mutuo), comensalismo (uno se beneficia sin dañar), parasitismo (daña al huésped), saprofitismo (vive de materia muerta) y oportunismo (aprovecha la debilidad del huésped).","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O163","q":"La auscultación mediante fonendoscopio es una variedad de exploración:","caso":"","opts":["Física.","Instrumental.","Rutinaria.","Palpatoria."],"correct":1,"expl":"La auscultación con fonendoscopio es una exploración INSTRUMENTAL (usa un aparato). Inspección, palpación y percusión son exploraciones físicas directas.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O164","q":"El enema de flujo de retorno o lavativa de Harris se utiliza para:","caso":"","opts":["Irrigar la parte anterior del colon y el recto.","Irrigar la parte posterior del colon y el recto.","Irrigar la parte superior del colon y el recto.","Irrigar la parte inferior del colon y el recto."],"correct":3,"expl":"El enema de flujo de retorno o lavativa de Harris (enema carminativo) irriga la parte INFERIOR del colon y el recto para expulsar gases (flatulencia).","tema":"eliminacion","bloque":"Eliminación, sondajes y ostomías"},{"sim":"O","tag":"OPE SERGAS","n":"O165","q":"¿Cuál NO es una forma de aplicación del calor húmedo?","caso":"","opts":["Fomentos calientes.","Inmersión en agua caliente.","Bolsa de agua caliente.","Baños calientes."],"correct":2,"expl":"Calor húmedo: fomentos, compresas calientes, baños calientes e inmersión. La bolsa de agua caliente es calor SECO (junto con manta eléctrica, parafina, infrarrojos).","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O166","q":"Respecto a los grados de eficacia de las medidas de prevención de las infecciones nosocomiales, el aislamiento hospitalario está incluido en la categoría de:","caso":"","opts":["Grado I, eficacia probada.","Grado II, eficacia lógica.","Grado III, eficacia dudosa.","Grado IV, eficacia comprobada."],"correct":1,"expl":"Eficacia de las medidas contra la infección nosocomial: grado I probada (lavado de manos, guantes, esterilización); grado II lógica (aislamientos, antisépticos); grado III dudosa (desinfección de suelos y paredes).","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O167","q":"En una unidad de psiquiatría, los signos de violencia inminente a tener en cuenta son:","caso":"","opts":["Que el paciente estire grotescamente los brazos.","Que el paciente tenga excesiva sudoración en las manos y elevada tensión muscular.","Que el paciente mantenga su mirada.","Todas son ciertas."],"correct":1,"expl":"Signos de violencia inminente: tensión muscular, sudoración, puños cerrados, mirada fija, tono elevado, inquietud motora. Estirar los brazos y \"mantener la mirada\" no son signos por sí mismos.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O168","q":"La cama cerrada hospitalaria es aquella que:","caso":"","opts":["Está en una planta de hospitalización cerrada, a la espera de ser arreglada.","Está a la espera de la admisión de un nuevo paciente.","Corresponde a un paciente ingresado y está a la espera de su regreso del quirófano.","También se define como cama de anestesia."],"correct":1,"expl":"Cama cerrada: unidad desocupada, a la espera de un nuevo ingreso, con la ropa cubriéndola por completo. Abierta: paciente ingresado. Quirúrgica/de anestesia: para recibir al paciente de quirófano.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"O","tag":"OPE SERGAS","n":"O169","q":"Los órganos con aire tienen un sonido:","caso":"","opts":["Timpánico.","Mate.","Fuerte.","Débil."],"correct":0,"expl":"Percusión: los órganos con aire (pulmón, estómago, intestino) suenan TIMPÁNICOS/claros; los órganos macizos (hígado, bazo) o con líquido suenan MATES.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O170","q":"¿Cómo se denomina la temperatura que se mantiene por encima de los valores normales a lo largo del día sufriendo muy pocas variaciones?","caso":"","opts":["Fiebre recurrente.","Fiebre en meseta o continua.","Fiebre mantenida.","Fiebre en aguja o constante."],"correct":1,"expl":"Fiebre en meseta o continua: se mantiene elevada todo el día con variaciones <1 °C. Recurrente: alterna días con fiebre y sin fiebre. Intermitente/en agujas: picos que bajan a la normalidad. Remitente: oscila sin normalizarse.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O171","q":"De los siguientes tipos de shock, señale el que NO es de tipo distributivo:","caso":"","opts":["Séptico.","Anafiláctico.","Hipovolémico.","Neurogénico."],"correct":2,"expl":"Shock distributivo (vasodilatación): séptico, anafiláctico y neurogénico. El HIPOVOLÉMICO (pérdida de sangre o líquidos) y el cardiogénico no son distributivos.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O172","q":"Diluir una concentración de una disolución es:","caso":"","opts":["Disminuir la concentración de la disolución al aumentar la cantidad de disolvente.","Disminuir la concentración de la disolución al aumentar la cantidad de soluto.","Aumentar la concentración de la disolución al aumentar la cantidad de disolvente.","Ninguna es correcta."],"correct":0,"expl":"Diluir = disminuir la concentración añadiendo más DISOLVENTE (p. ej. más suero). Concentrar = aumentar el soluto o reducir el disolvente.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O173","q":"De los siguientes parámetros. ¿Cuál es el que valora el test de Apgar?","caso":"","opts":["Temperatura.","Perímetro torácico.","Perímetro craneal.","Tono muscular."],"correct":3,"expl":"Test de Apgar (al minuto y a los 5 min): frecuencia cardíaca, esfuerzo respiratorio, TONO muscular, respuesta a estímulos y color. 0-2 puntos cada uno (máximo 10).","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O174","q":"La fontanela mayor o anterior está situada en:","caso":"","opts":["La unión del occipital y los parietales.","La confluencia del parietal y temporal.","La confluencia del frontal y parietal.","La unión del occipital y parietal."],"correct":2,"expl":"Fontanela mayor o anterior (bregmática): entre los huesos frontal y parietales; se cierra hacia los 12-18 meses. La menor o posterior (lambdoidea): entre occipital y parietales; se cierra a los 2-3 meses.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O175","q":"Las compresas frías se utilizan para:","caso":"","opts":["Aliviar el dolor.","Detener las hemorragias locales.","Detener los procesos inflamatorios.","Todas son correctas."],"correct":3,"expl":"El frío (compresas frías) alivia el dolor (anestésico), detiene hemorragias locales (vasoconstricción) y frena la inflamación. Todas correctas.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O176","q":"El consumo crónico de cannabis da lugar al denominado:","caso":"","opts":["Síndrome de demanda.","Síndrome amotivacional.","Síndrome de deshabituación.","Síndrome de psicosis."],"correct":1,"expl":"El consumo crónico de cannabis produce el síndrome AMOTIVACIONAL: apatía, falta de interés, abandono de actividades, deterioro de la atención y la memoria.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O177","q":"¿Cuántos días se recomienda tomar las muestras de esputos si se van a emplear para estudio microbiológico?","caso":"","opts":["Las de un día, solo por la mañana.","Las de un día, tomando dos, una por la mañana y otra por la tarde.","Las de dos días alternos.","Las de tres días seguidos."],"correct":3,"expl":"Para estudio microbiológico (p. ej. bacilo de Koch/tuberculosis) se recogen esputos de TRES días seguidos, a primera hora de la mañana, en recipiente estéril.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O178","q":"Una muestra de heces:","caso":"","opts":["Nunca debe refrigerarse.","No debe refrigerarse si es para análisis parasitológico.","No debe refrigerarse si es para realizar un coprocultivo.","Debe refrigerarse siempre que haya demora en el envío al laboratorio."],"correct":1,"expl":"Heces para estudio PARASITOLÓGICO: no se refrigeran (los parásitos móviles mueren con el frío) y se envían de inmediato. Para coprocultivo sí puede refrigerarse si hay demora.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O179","q":"La prueba para estudiar la capacidad respiratoria es:","caso":"","opts":["Broncoscopia.","Radiografía.","Espirometría.","Gammagrafía."],"correct":2,"expl":"La espirometría mide volúmenes y capacidades pulmonares (capacidad respiratoria). La broncoscopia visualiza los bronquios; la radiografía y la gammagrafía dan imagen.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O180","q":"En relación con los inconvenientes de la solución de yodo o sus derivados halogenados utilizados como desinfectantes, señale la INCORRECTA:","caso":"","opts":["Se inactivan en presencia de materia orgánica (sangre, pus, exudaciones, etc.)","Puede enmascarar el aspecto y la evolución de las heridas.","Se evaporan a temperatura ambiente.","Deben protegerse de la luz."],"correct":2,"expl":"Inconvenientes del yodo/povidona: se inactiva con materia orgánica, puede enmascarar heridas (tiñe), hay que protegerla de la luz y puede irritar/producir alergia. NO se evapora a temperatura ambiente (eso es el alcohol).","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O181","q":"De entre los siguientes antídotos. ¿Cuál es el usado en las intoxicaciones con benzodiacepinas?","caso":"","opts":["Protamina.","Flumazenilo.","N-acetilcisteína.","Naloxona."],"correct":1,"expl":"Antídotos: FLUMAZENILO para benzodiacepinas; naloxona para opiáceos; N-acetilcisteína para paracetamol; protamina para heparina; vitamina K para anticoagulantes orales.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O182","q":"Según el artículo 3 del Decreto 38/2015 del 26 de febrero, de residuos sanitarios de Galicia, la gestión intracentros de los residuos comprende:","caso":"","opts":["Las operaciones únicas de segregación y almacenamiento de residuos hechas por los productores y que se lleven a cabo en el interior de los centros productores.","Las operaciones de segregación, envasado, transporte y almacenamiento de residuos hechas por los productores y que las lleven a cabo empresas especializadas de tipo AJA.","Las operaciones de segregación, envasado, transporte y almacenamiento de residuos hechas por los receptores y que las lleven a cabo empresas especializadas de tipo AIA.","Las operaciones de segregación, envasado, transporte y almacenamiento de residuos hechas por los productores y que se lleven a cabo en el interior de los centros productores."],"correct":3,"expl":"Decreto 38/2015, art. 3: gestión INTRACENTRO = operaciones de segregación, envasado, transporte y almacenamiento realizadas por los productores dentro del propio centro. La gestión extracentro la hacen empresas autorizadas.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O183","q":"Una vez obtenida la muestra de sangre arterial. ¿Cuándo se manda al laboratorio?","caso":"","opts":["Puede permanecer unas horas a temperatura ambiente.","Inmediatamente después de su extracción.","Puede permanecer en la nevera 24 horas a 4 grados.","Puede quedar congelada hasta 48 horas."],"correct":1,"expl":"La gasometría arterial se envía al laboratorio INMEDIATAMENTE (en hielo si hay demora >10-15 min): los gases se alteran con el tiempo y la temperatura.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O184","q":"Será necesario realizar aislamiento respiratorio a un enfermo contagioso, en el caso de que se trate de:","caso":"","opts":["Una neumonía estafilocócica.","Fiebre de Lassa.","Parotiditis.","Neumonía estreptocócica."],"correct":2,"expl":"Aislamiento respiratorio (gotas/aéreo): parotiditis, sarampión, rubéola, varicela, tuberculosis, meningitis meningocócica, tosferina. La fiebre de Lassa requiere aislamiento estricto; las neumonías bacterianas, precauciones estándar.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O185","q":"La paciente de la habitación 502 permanece largos períodos de tiempo encamada. Es un factor intrínseco para la formación de úlceras por presión:","caso":"","opts":["Fricción.","Deficiencias nutricionales.","Humedad.","Presión."],"correct":1,"expl":"Factores INTRÍNSECOS de UPP (propios del paciente): deficiencias nutricionales, edad, inmovilidad, incontinencia, enfermedades. EXTRÍNSECOS (externos): presión, fricción, cizalla, humedad.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"O","tag":"OPE SERGAS","n":"O186","q":"El paciente J.H.Z. ingresado en la planta de psiquiatría tiene dificultad para llamar por su nombre a los objetos de uso cotidiano, ¿cómo se denomina este trastorno?:","caso":"","opts":["Afasia.","Amnesia.","Apraxia.","Agnosia."],"correct":0,"expl":"Afasia = alteración del lenguaje (no encontrar el nombre de los objetos, no comprender). Amnesia = pérdida de memoria. Apraxia = incapacidad de realizar movimientos aprendidos. Agnosia = no reconocer objetos/personas.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O187","q":"Nuestra compañera Xoana, TCAE, está encargada de comprobar las etapas de un ciclo de esterilización en el autoclave. Observa que el autoclave está en la etapa de calentamiento de la temperatura interior con inyecciones de vapor. Señale la afirmación CORRECTA:","caso":"","opts":["El proceso de esterilización finalizó.","El ciclo de esterilización debe continuar aún hasta el secado final.","El ciclo de esterilización está en su inicio.","El ciclo pasará a la fase Bowie-Dick."],"correct":1,"expl":"Fases del ciclo del autoclave: acondicionamiento/prevacío, calentamiento con inyecciones de vapor, esterilización (meseta a 121-134 °C), evacuación del vapor y SECADO final. Si está calentando, el ciclo aún debe continuar hasta el secado. El test de Bowie-Dick es un control previo, no una fase del ciclo.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O188","q":"La extinción o desaparición progresiva e irreversible de la actividad biológica de los diferentes órganos y tejidos de una paciente ingresada en la unidad de cuidados paliativos se denomina:","caso":"","opts":["Muerte absoluta.","Muerte intermedia.","Muerte aparente.","Muerte relativa."],"correct":1,"expl":"Tipos de muerte: aparente (signos vitales mínimos, reversible), relativa (parada reversible con RCP), INTERMEDIA (extinción progresiva e irreversible de la actividad de órganos y tejidos) y absoluta (desaparición total de toda actividad biológica).","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O189","q":"Al paciente de traumatología, Enrique A.F., debemos colocarlo en posición de semi-Fowler. Señale la expresión CORRECTA:","caso":"","opts":["Colocaremos a Enrique en posición decúbito supino con la cabeza colgando y sus hombros apoyados en la cama.","Enrique permanecerá tumbado en decúbito supino, en un plano oblicuo de 45° con la cabeza más baja que los pies.","Enrique permanecerá tumbado en decúbito supino con la cabecera de la cama elevada 30°.","Enrique permanecerá tumbado en decúbito supino con la cabecera de la cama elevada 45°."],"correct":2,"expl":"Semi-Fowler: decúbito supino con la cabecera elevada 30° (Fowler 45°, Fowler alta 90°). La cabeza colgando es Roser/Proetz; cabeza más baja que los pies es Trendelenburg.","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"O","tag":"OPE SERGAS","n":"O190","q":"Si en las órdenes de tratamiento de Lucía encontramos la prescripción: concentración de oxígeno 25 / 3. ¿Qué significa?","caso":"","opts":["25 minutos de oxígeno al 3%.","3 litros de oxígeno por minuto al 25%.","25 litros de oxígeno en 3 horas.","3 litros de oxígeno en 25 minutos."],"correct":1,"expl":"Prescripción \"oxígeno 25 / 3\" = concentración (FiO2) del 25 % a un flujo de 3 litros por minuto. Se ajusta con el caudalímetro y la mascarilla Venturi correspondiente.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O191","q":"En una contención mecánica por agitación de un paciente ingresado en la unidad de agudos de psiquiatría. Señale la INCORRECTA.","caso":"","opts":["Alejar del alcance del paciente cualquier objeto peligroso.","La inmovilización del paciente debe realizarse con la colocación del equipo de sujeción comenzando por los miembros superiores, seguido de los miembros inferiores y la cintura al final.","La inmovilización del paciente debe realizarse con la colocación del equipo de sujeción comenzando por la cintura, seguido de los miembros inferiores y por último los miembros superiores.","Se tendrá especial cuidado en no forzar las articulaciones más allá de los límites fisiológicos."],"correct":1,"expl":"Contención mecánica: se sujeta primero la CINTURA (tronco), después los miembros inferiores y por último los superiores, sin forzar articulaciones y retirando objetos peligrosos. Empezar por los brazos es incorrecto.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O192","q":"Debemos movilizar a Xurxo, paciente encamado pero que colabora, hacia la cabecera de la cama. Señale la CORRECTA:","caso":"","opts":["Pedirle a Xurxo que flexione las rodillas, si puede, apoyando las plantas de los pies sobre la cama; y que se agarre, si es posible, al cabecero de la cama.","Pedirle a Xurxo que se estire recto en la cama, sujetándose en los laterales, retirando su almohada de la cabecera.","Colocarnos en el cabecero de la cama agarrando a Xurxo por las manos mientras nuestro compañero empuja sus pies hacia arriba.","Todas son correctas."],"correct":0,"expl":"Para subir a un paciente colaborador hacia la cabecera: flexiona las rodillas apoyando los pies en la cama y se agarra al cabecero, empujando con los pies mientras el profesional lo desplaza. Nunca tirar de él por las manos ni empujarle los pies desde el cabecero.","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"O","tag":"OPE SERGAS","n":"O193","q":"José, paciente de 84 años, acude a consulta de urología y es diagnosticado de enuresis. ¿A qué hace referencia dicho término?","caso":"","opts":["Imposibilidad de orinar.","Dolor al orinar.","Micción involuntaria durante el sueño.","Deseo de orinar."],"correct":2,"expl":"Enuresis = micción involuntaria durante el sueño (más allá de la edad en que se controla). Anuria/retención = no orinar; disuria = dolor al orinar; tenesmo = deseo continuo de orinar.","tema":"eliminacion","bloque":"Eliminación, sondajes y ostomías"},{"sim":"O","tag":"OPE SERGAS","n":"O194","q":"Como indicadores del proceso de esterilización, se pueden utilizar:","caso":"","opts":["Controles químicos internos.","Controles de pinza hueca.","Controles de pinza abierta.","Controles invertidos internos."],"correct":0,"expl":"Indicadores de esterilización: físicos (gráficas, manómetros), QUÍMICOS (cintas/tiras que cambian de color: externos e internos en el paquete) y biológicos (esporas de Geobacillus stearothermophilus).","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O195","q":"Si nos encontramos en la calle a un niño con una parada cardiorrespiratoria. ¿Qué es lo primero que debería hacer usted?","caso":"","opts":["Pedir ayuda.","Comenzar la RCP básica.","Colocarlo en posición lateral de seguridad y pedir ayuda.","Realizarle un minuto de RCP básica y luego pedir ayuda."],"correct":3,"expl":"En niños (y ahogados) la PCR suele ser de origen respiratorio: si el reanimador está solo, primero realiza 1 minuto de RCP básica y después pide ayuda/llama al 112. En adultos, primero se pide ayuda.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O196","q":"María es una paciente a la que le van a hacer una punción lumbar. ¿Qué posición sería la más adecuada para hacer este procedimiento?","caso":"","opts":["Prono.","Genupectoral.","Semi-Fowler.","Todas las respuestas anteriores son incorrectas."],"correct":3,"expl":"Punción lumbar: decúbito lateral en posición fetal (rodillas al pecho, espalda arqueada) o sentado inclinado hacia delante, para abrir los espacios intervertebrales. Prono, genupectoral y semi-Fowler no sirven.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O197","q":"Paciente de 70 años con desnutrición y empobrecimiento del lenguaje. Sería compatible con:","caso":"","opts":["Vejez.","Demencia.","Amnesia.","Delirium."],"correct":1,"expl":"Desnutrición con empobrecimiento del lenguaje en un anciano orienta a DEMENCIA (deterioro cognitivo progresivo con afasia). El delirium es agudo y fluctuante; la vejez normal no empobrece el lenguaje.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O198","q":"No todos envejecemos de igual forma, ni en morfología ni en la función. ¿Qué edad está definida por el envejecimiento de los órganos?","caso":"","opts":["Edad cronológica.","Edad senil.","Edad biológica.","Edad funcional."],"correct":2,"expl":"Edad cronológica = años vividos. Edad BIOLÓGICA = envejecimiento real de órganos y tejidos. Edad funcional = capacidad para desenvolverse. Edad social/psicológica = roles y adaptación.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O199","q":"Paciente politraumatizado de 27 años, víctima de un accidente de moto, ingresado en la UCI. Su estado es crítico ya que presenta taquicardia, oliguria, hipotensión, quemaduras por abrasión, hemorragia y dificultad para respirar por fracturas costales. Cuando el paciente está estable le realizan un TAC para descartar lesiones cerebrales y medulares. Se sospecha que tiene una hemorragia interna con una pérdida de sangre de entre 1500 y 2000 ml. Según la clasificación de las hemorragias, ¿a qué clase pertenece?","caso":"","opts":["Clase I.","Clase II.","Clase III.","Clase IV."],"correct":2,"expl":"Clasificación de la hemorragia (ATLS): clase I <750 ml (<15 %); clase II 750-1500 ml; clase III 1500-2000 ml (taquicardia, hipotensión, oliguria); clase IV >2000 ml (shock grave).","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O200","q":"Jaime es un paciente con una alimentación enteral debido a una intervención quirúrgica de la orofaringe. Señale la afirmación correcta:","caso":"","opts":["Esta alimentación no presenta ninguna complicación.","La dieta se administra muy fría para que se absorban mejor los nutrientes.","La dieta tiene que ser líquida y estar a temperatura ambiente.","La mejor posición para alimentarlo es decúbito supino."],"correct":2,"expl":"Nutrición enteral: la fórmula debe ser líquida y estar a TEMPERATURA AMBIENTE (no fría), administrada con el paciente en Fowler/semi-Fowler para evitar aspiraciones. Puede tener complicaciones (diarrea, aspiración, obstrucción de la sonda).","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"O","tag":"OPE SERGAS","n":"O201","q":"Laura trabaja en la unidad de cuidados intensivos y recibe a un paciente politraumatizado. Al inspeccionar la cara y la cabeza del paciente se encuentra con un hematoma en la apófisis mastoides. ¿Cómo se llama este signo y qué nos puede indicar?","caso":"","opts":["Signo de Babinski, que puede indicar lesión en el oído medio.","Signo de Baltz, que puede indicar fractura del atlas.","Signo de Baeyer, que puede indicar fractura de la mandíbula.","Signo de Battle, que puede indicar fractura de la base del cráneo."],"correct":3,"expl":"Signo de BATTLE: hematoma retroauricular sobre la apófisis mastoides; indica fractura de la base del cráneo (junto con los \"ojos de mapache\" y la otorrea/rinorrea de LCR). Babinski es un reflejo plantar.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O202","q":"A Pablo, un paciente que acude al servicio de urgencias, se le administra una gammaglobulina antitetánica. La inmunidad que aporta es:","caso":"","opts":["Natural pasiva.","Natural activa.","Artificial activa.","Artificial pasiva."],"correct":3,"expl":"Gammaglobulina (anticuerpos ya formados) = inmunidad ARTIFICIAL PASIVA: protección inmediata pero temporal. Vacuna = artificial activa. Pasar la enfermedad = natural activa. Anticuerpos maternos/lactancia = natural pasiva.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"O","tag":"OPE SERGAS","n":"O203","q":"En la planta 10 acabamos de tener un éxitus. Los cuidados post-mortem:","caso":"","opts":["Se efectuarán una vez el médico firme el certificado de defunción.","No se debe manipular el cadáver en presencia de los familiares u otros pacientes.","Hay que prestar los cuidados antes de que aparezca el rigor mortis.","Todas las respuestas son correctas."],"correct":3,"expl":"Cuidados post mortem: tras la certificación médica de la defunción, antes del rigor mortis (aparece a las 2-4 h) y preservando la intimidad (no manipular delante de familiares u otros pacientes). Todas correctas.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"O","tag":"OPE SERGAS","n":"O204","q":"En la movilización de un paciente en estado de coma con sonda vesical, incontinencia fecal y leve deshidratación, para evitar úlceras por presión, debemos:","caso":"","opts":["Incorporar al paciente.","Levantar su cuerpo y separarlo de la superficie de apoyo.","Aplicar una loción alcohólica.","Arrastrar al paciente sobre la cama."],"correct":1,"expl":"Para movilizar sin lesionar la piel hay que LEVANTAR al paciente separándolo de la superficie (entremetida, grúa), nunca arrastrarlo (fricción/cizalla). Las lociones alcohólicas resecan la piel y están desaconsejadas.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"O","tag":"OPE SERGAS","n":"O205","q":"La TCAE María colabora con la enfermera en la medición de las constantes vitales. ¿Qué colores utilizará para registrarlas en la gráfica?","caso":"","opts":["Temperatura: verde, FC: azul, FR: negro, TA: rojo.","Temperatura: azul, FC: negro, FR: rojo, TA: verde.","Temperatura: rojo, FC: azul, FR: negro, TA: verde.","Temperatura: rojo, FC: negro, FR: azul, TA: verde."],"correct":2,"expl":"Colores clásicos de la gráfica: temperatura ROJO, frecuencia cardíaca AZUL, frecuencia respiratoria NEGRO, tensión arterial VERDE (pueden variar según el centro).","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"O","tag":"OPE SERGAS","n":"O206","q":"Un paciente ingresa por urgencias con una hemorragia digestiva. ¿Qué tipo de dieta le pondrán?","caso":"","opts":["Blanda.","Hiperproteica.","Líquida.","Absoluta."],"correct":3,"expl":"En una hemorragia digestiva activa la dieta es ABSOLUTA (nada por boca) hasta que se controle el sangrado y lo indique el médico; después se progresa a líquida y blanda.","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"O","tag":"OPE SERGAS","n":"O207","q":"Manuel es un paciente de 80 años que vive solo y con claros signos de malnutrición. ¿Qué tipo de dieta se le pondrá?","caso":"","opts":["Dieta hipercalórica.","Dieta hiperpotásica.","Dieta hiperproteica.","Dieta hipersódica."],"correct":2,"expl":"Anciano con malnutrición: dieta HIPERPROTEICA (e hipercalórica) para recuperar masa muscular y favorecer la cicatrización. Hipersódica o hiperpotásica no tienen sentido.","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"O","tag":"OPE SERGAS","n":"O208","q":"Tomás es un paciente que acude a urgencias con xeroftalmia. ¿De qué vitamina carece?","caso":"","opts":["Vitamina B6 o piridoxina.","Vitamina B12 o cianocobalamina.","Vitamina E o tocoferol.","Vitamina A o retinol."],"correct":3,"expl":"La xeroftalmia (sequedad ocular, ceguera nocturna) es el signo típico del déficit de vitamina A (retinol). B12 → anemia perniciosa; vitamina E → antioxidante; B6 → neuropatía, dermatitis.","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"O","tag":"OPE SERGAS","n":"O209","q":"Usted se encuentra trabajando y le ordenan ponerle al paciente de la habitación 413 aplicaciones calientes. ¿En qué caso estarían contraindicadas?","caso":"","opts":["Aliviar espasmos musculares.","Ablandar exudados.","Acelerar procesos de cicatrización.","Disminuir hemorragias."],"correct":3,"expl":"El calor produce vasodilatación: NUNCA se aplica para disminuir hemorragias (eso es el frío). Sí sirve para aliviar espasmos musculares, ablandar exudados y favorecer la cicatrización.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O210","q":"Alonso llega al servicio de Urgencias vomitando, ¿qué clase de medicamento indicará el facultativo para evitar los vómitos?","caso":"","opts":["Antiarrítmico.","Antiemético.","Mucolítico.","Antidiarreico."],"correct":1,"expl":"ANTIEMÉTICO = evita náuseas y vómitos (metoclopramida, ondansetrón). Antiarrítmico = ritmo cardíaco; mucolítico = fluidifica secreciones; antidiarreico = frena la diarrea.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"O","tag":"OPE SERGAS","n":"O211","q":"Recibimos la indicación de enfermería de que el paciente T.R.L. de la cama 415-2 debe levantarse de la cama por primera vez desde su operación y ayudarle a sentarse en una silla de brazos. Dicho paciente colabora, por lo que NO deberemos:","caso":"","opts":["Situar la silla de brazos próxima a la cama, a la altura de los pies de la cama.","Una vez ayudado el paciente a sentarse en el borde de la cama, comprobaremos que no se marea en esa posición.","Situarnos detrás del paciente, apoyando las manos en sus hombros para que pueda incorporarse fácilmente.","Situarnos frente al paciente, con las piernas flexionadas, sujetando con nuestras manos su cintura."],"correct":2,"expl":"Para levantar a un paciente colaborador de la cama a la silla: silla frenada junto a la cama, sentarlo en el borde y comprobar que no se marea, y situarse FRENTE a él sujetándolo por la cintura con las piernas flexionadas. Colocarse detrás empujando los hombros es incorrecto.","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"O","tag":"OPE SERGAS","n":"O212","q":"En la conservación de muestras biológicas en un ámbito hospitalario:","caso":"","opts":["No debe transcurrir más de un día desde la obtención de la muestra hasta su análisis en el laboratorio.","No debe transcurrir más de un turno desde la obtención de la muestra hasta su análisis en el laboratorio.","La sangre, las heces y los esputos pueden mantenerse en el frigorífico entre 4° C y 6° C.","La sangre, las heces y los esputos pueden mantenerse en el frigorífico entre 0° C y 1° C."],"correct":2,"expl":"Las muestras deben enviarse lo antes posible; si hay demora, sangre, heces y esputos pueden mantenerse en frigorífico a 4-6 °C (nunca a 0-1 °C ni congeladas). No es admisible esperar \"un turno\" o \"un día\".","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"O","tag":"OPE SERGAS","n":"O213","q":"El 061 lleva a un accidentado de moto. Tras una primera observación por parte del personal médico, deciden realizar una intervención quirúrgica, ha perdido mucha sangre y su grupo sanguíneo es AB positivo. ¿Qué tipo de sangre deben transfundir si no tienen AB positivo?","caso":"","opts":["Solamente puede transfundirse AB positivo.","Puede transfundirse con AB negativo.","Puede transfundirse con O positivo, que es el donante universal.","Puede transfundirse con O negativo, que es el donante universal."],"correct":3,"expl":"El donante universal es el grupo O NEGATIVO (sin antígenos A, B ni Rh): sirve para cualquier receptor en urgencias. AB positivo es el receptor universal.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O214","q":"El paciente de la cama 215-1 necesita ser trasladado de la cama a la camilla. Señale cuál de las siguientes opciones es la CORRECTA:","caso":"","opts":["Si el paciente colabora, se colocará la camilla cubierta con una sábana, perpendicular a la cama, de modo que coincidan los pies de la cama con la cabecera de la camilla.","Si el paciente NO colabora, se colocará la camilla cubierta con una sábana, perpendicular a la cama, de modo que coincidan los pies de la cama con la cabecera de la camilla.","Si el paciente colabora, se colocará una silla a los pies de la cama para que sea más sencillo el traslado.","Si el paciente NO colabora, se colocará una silla a los pies de la cama para que le sea más sencillo al personal auxiliar."],"correct":1,"expl":"Traslado cama-camilla: si el paciente NO colabora, la camilla se coloca en paralelo (o perpendicular, según protocolo) y se moviliza en bloque con entremetida entre 3 personas. Si colabora, se coloca la camilla paralela y él mismo se desplaza. El tribunal dio la opción B como correcta.","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"O","tag":"OPE SERGAS","n":"O215","q":"Usted como TCAE del servicio de obstetricia colabora en los cuidados del recién nacido, por lo cual debe saber que el baño del recién nacido por inmersión deberá evitarse hasta:","caso":"","opts":["24 horas después del parto.","48 horas después del parto.","Hasta la absorción espontánea del vérnix caseoso.","Hasta que se desprenda el cordón umbilical."],"correct":3,"expl":"El baño por inmersión del recién nacido se evita hasta que se desprenda el cordón umbilical (7-15 días); antes se hace lavado por partes con esponja, manteniendo el cordón limpio y seco.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"O","tag":"OPE SERGAS","n":"O216","q":"Manuel, de 45 años, entra por urgencias por una fractura de tobillo, tienen que colocarle un vendaje con yeso. Al cabo de un día, el paciente presenta un edema de ventana. ¿Cuál de las siguientes medidas sería la incorrecta a seguir?","caso":"","opts":["Aplicar un vendaje compresivo sobre la ventana.","Elevar el miembro afectado durante 20-30 minutos.","Prolongar todo el vendaje de yeso hasta cubrir todo el dorso del pie hasta la base de los dedos, dejando estos libres.","Aumentar el tamaño de la ventana sin realizar el vendaje."],"correct":3,"expl":"Edema de ventana (la piel se hincha por el hueco del yeso): se eleva el miembro, se rellena el hueco con un apósito y se venda por encima o se recorta la ventana con vendaje; NUNCA se deja la ventana ampliada sin vendaje ni se comprime en exceso.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"O","tag":"OPE SERGAS","n":"O217","q":"Mónica, TCAE, forma parte de un equipo de trabajo en una planta de hospitalización quirúrgica, d
