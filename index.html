<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TCAE Pro · Preparación SERGAS</title>
<meta name="theme-color" content="#0E8A7A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TCAE Pro">
<style>
:root{
  --teal:#0E8A7A; --teal-d:#0a6b5e; --teal-l:#e6f5f2;
  --amber:#D98324; --amber-l:#fdf1e2;
  --red:#C6453C; --red-l:#fdecea;
  --green:#2E8B57; --green-l:#e8f6ee;
  --bg:#F4F7F6; --card:#fff; --ink:#16232b; --ink2:#5c6b74;
  --line:#e2e9e7; --neutral:#cfd8d5;
  --shadow:0 1px 2px rgba(16,40,50,.06),0 8px 24px rgba(16,40,50,.07);
  --r:16px;
}
html[data-theme="dark"]{
  --teal:#2fb3a0; --teal-d:#249383; --teal-l:#12312d;
  --amber:#e5a355; --amber-l:#32250f;
  --red:#e8776d; --red-l:#331a17;
  --green:#4dbd7f; --green-l:#12301f;
  --bg:#0e1518; --card:#151f23; --ink:#e8eeec; --ink2:#9aa9ae;
  --line:#243036; --neutral:#38474d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:16px;line-height:1.45;overscroll-behavior-y:contain}
.wrap{max-width:600px;margin:0 auto;padding:0 14px calc(28px + env(safe-area-inset-bottom))}

header{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.hdr{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(140deg,var(--teal),var(--teal-d));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.3px;flex:none}
.brand{font-weight:750;font-size:15px;letter-spacing:-.2px}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--ink2);letter-spacing:0}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:10px;
  width:34px;height:34px;display:grid;place-items:center;font-size:15px;cursor:pointer}
.iconbtn:active{transform:scale(.94)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;box-shadow:var(--shadow)}
h1{font-size:21px;margin:0;letter-spacing:-.4px}
h2{font-size:15px;margin:0 0 10px;letter-spacing:-.2px}
h3{font-size:13px;margin:0 0 8px;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px}
.sub{margin:2px 0 0;color:var(--ink2);font-size:13.5px}

.hero{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .track{stroke:var(--line)}
.ring .val{stroke:var(--teal);transition:stroke-dashoffset .7s cubic-bezier(.3,1,.4,1)}
.ring .num{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .num b{display:block;font-size:24px;letter-spacing:-1px}
.ring .num span{font-size:10.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px}
.hero .txt b{font-size:15px}
.hero .txt p{margin:4px 0 0;font-size:13.5px;color:var(--ink2)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;
  box-shadow:var(--shadow)}
.tile b{display:block;font-size:22px;letter-spacing:-.8px}
.tile span{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px}
.tile.amb b{color:var(--amber)} .tile.teal b{color:var(--teal)} .tile.red b{color:var(--red)}

.btn{width:100%;border:0;border-radius:13px;padding:14px 16px;font-size:15.5px;font-weight:650;
  background:var(--teal);color:#fff;cursor:pointer;margin-top:10px;display:flex;align-items:center;
  justify-content:center;gap:8px;font-family:inherit}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.amber{background:var(--amber)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.btn.sm{padding:11px 14px;font-size:14px}

.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 4px;text-align:center;cursor:pointer}
.chip:active{transform:scale(.96)}
.chip b{display:block;font-size:17px;letter-spacing:-.4px}
.chip span{font-size:10.5px;color:var(--ink2)}

.cov{display:flex;height:9px;border-radius:6px;overflow:hidden;background:var(--neutral);margin:2px 0 9px}
.cov i{display:block;height:100%}
.cov .m{background:var(--teal)} .cov .p{background:var(--amber)} .cov .u{background:var(--neutral)}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.temas{display:flex;flex-direction:column;gap:2px}
.tema{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:10px;cursor:pointer;
  border:1px solid transparent}
.tema:active{background:var(--bg)}
.tema .nm{flex:1;min-width:0;font-size:13.5px}
.tema .nm i{display:block;font-style:normal;font-size:11px;color:var(--ink2);margin-top:2px}
.tema .bar{width:66px;height:6px;border-radius:4px;background:var(--line);overflow:hidden;flex:none}
.tema .bar i{display:block;height:100%;background:var(--teal)}
.tema .pc{width:38px;text-align:right;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;flex:none}
.tema.weak .nm{font-weight:650} .tema.weak .bar i{background:var(--amber)}

.streakrow{display:flex;gap:5px;margin-top:4px}
.day{flex:1;height:26px;border-radius:7px;background:var(--line);display:grid;place-items:center;
  font-size:9.5px;color:var(--ink2)}
.day.on{background:var(--teal);color:#fff;font-weight:700}
.day.today{outline:2px solid var(--amber);outline-offset:1px}

/* ---------- pregunta ---------- */
.qbar{display:flex;align-items:center;gap:10px;margin:12px 0 0}
.qbar .track{flex:1;height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.qbar .track i{display:block;height:100%;background:var(--teal);transition:width .3s}
.qbar .n{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.qbar .fire{font-size:12px;color:var(--amber);font-weight:700}
.qbar .clock{font-size:12.5px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.qbar .clock.warn{color:var(--red)}

.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  background:var(--teal-l);color:var(--teal-d);padding:4px 9px;border-radius:999px}
.pill.rev{background:var(--amber-l);color:var(--amber)}
.pill.src{background:var(--bg);color:var(--ink2)}
.star{margin-left:auto;border:0;background:transparent;font-size:19px;cursor:pointer;line-height:1;
  padding:2px 4px;opacity:.35;filter:grayscale(1)}
.star.on{opacity:1;filter:none}

.caso{background:var(--bg);border-left:3px solid var(--teal);border-radius:0 10px 10px 0;
  padding:10px 12px;font-size:13.5px;color:var(--ink2);margin:0 0 10px;font-style:italic}
p.q{font-size:17px;line-height:1.4;font-weight:600;margin:0 0 14px;letter-spacing:-.2px}

.opt{width:100%;display:flex;gap:11px;align-items:flex-start;text-align:left;background:var(--card);
  border:1.5px solid var(--line);border-radius:13px;padding:13px;margin-bottom:9px;font-size:14.8px;
  line-height:1.35;color:var(--ink);cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s}
.opt:active{transform:scale(.99)}
.opt .k{flex:none;width:25px;height:25px;border-radius:8px;background:var(--bg);border:1px solid var(--line);
  display:grid;place-items:center;font-size:12.5px;font-weight:750;color:var(--ink2)}
.opt.sel{border-color:var(--teal)}
.opt.sel .k{background:var(--teal);color:#fff;border-color:var(--teal)}
.opt.correct{border-color:var(--green);background:var(--green-l)}
.opt.correct .k{background:var(--green);color:#fff;border-color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-l)}
.opt.wrong .k{background:var(--red);color:#fff;border-color:var(--red)}
.opt[disabled]{cursor:default}

.feed{display:none;border-radius:12px;padding:12px;font-size:13.8px;line-height:1.5;margin-top:4px}
.feed.show{display:block;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.feed.ok{background:var(--green-l);color:var(--ink)}
.feed.no{background:var(--red-l);color:var(--ink)}
.feed .h{display:block;font-weight:750;margin-bottom:4px;font-size:13.5px}
.feed .h.ok{color:var(--green)} .feed .h.no{color:var(--red)}

.res .revlist{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;text-align:left}
.rev-item{border-bottom:1px solid var(--line);padding:10px 0}
.rev-item:last-child{border-bottom:0}
.rev-item .rq{font-size:14px;font-weight:600;margin:0 0 6px}
.rev-item .ra{font-size:13px;margin:0;color:var(--ink2)}
.rev-item .ra b{color:var(--green)}
.rev-item .re{font-size:12.5px;color:var(--ink2);margin:6px 0 0;font-style:italic}
.res{text-align:center}
.res .ring{margin:0 auto 10px}
.res h1{margin-bottom:2px}
.tbreak{display:flex;flex-direction:column;gap:6px;margin-top:12px;text-align:left}
.tbreak .row{display:flex;gap:8px;align-items:center;font-size:12.5px}
.tbreak .row .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbreak .row .sc{font-variant-numeric:tabular-nums;color:var(--ink2)}

.banner{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;
  background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;gap:10px;
  align-items:center;font-size:13.5px;box-shadow:var(--shadow);max-width:576px;margin:0 auto}
.banner button{margin-left:auto;background:var(--teal);color:#fff;border:0;border-radius:9px;
  padding:8px 12px;font-size:13px;font-weight:650;cursor:pointer;font-family:inherit;flex:none}
.foot{text-align:center;font-size:11px;color:var(--ink2);margin-top:16px}
.hint{font-size:11.5px;color:var(--ink2);margin-top:8px;text-align:center}
.hint.kbd{display:none}
@media (min-width:620px){ .hint.kbd{display:block} }
</style>
</head>
<body>
<header><div class="hdr">
  <div class="logo">TC</div>
  <div class="brand">TCAE Pro<small id="hdrSub">Preparación SERGAS</small></div>
  <div class="hdr-r">
    <span id="hdrRight" style="font-size:12px;color:var(--ink2)"></span>
    <button class="iconbtn" id="themeBtn" title="Tema claro/oscuro" onclick="toggleTheme()">◐</button>
  </div>
</div></header>

<div class="wrap"><div id="screen"></div>
  <div class="foot">Hecho con cariño para Cristina · v<span id="verLbl"></span></div>
</div>

const DATA  = [{"sim":"1","tag":"SIMULACRO 1","n":"1","q":"Según el ciclo evaluativo de la calidad asistencial, el enfoque clásico de Donabedian evalúa la calidad a través de:","caso":"","opts":["Eficacia, eficiencia y efectividad","Estructura, proceso y resultado","Planificación, ejecución y control","Accesibilidad, equidad y satisfacción"],"correct":1,"expl":"Donabedian: estructura (recursos), proceso (actividades) y resultado (efectos). Tema esp. 1","tema":"calidad","bloque":"1er EJERCICIO — PARTE 1: TEÓRICA (preguntas 1-50)"},{"sim":"1","tag":"SIMULACRO 1","n":"2","q":"La coordinación entre niveles asistenciales se refiere a la relación entre:","caso":"","opts":["Los distintos servicios de un mismo hospital","Atención primaria y atención hospitalaria (especializada)","El personal sanitario y no sanitario","La sanidad pública y la privada"],"correct":1,"expl":"Niveles asistenciales = atención primaria ↔ atención hospitalaria/especializada. Tema esp. 2","tema":"calidad","bloque":"1er EJERCICIO — PARTE 1: TEÓRICA (preguntas 1-50)"},{"sim":"1","tag":"SIMULACRO 1","n":"3","q":"Los cuatro principios fundamentales de la bioética son:","caso":"","opts":["Beneficencia, no maleficencia, autonomía y justicia","Beneficencia, legalidad, equidad y secreto","Autonomía, confidencialidad, justicia y veracidad","No maleficencia, universalidad, gratuidad y autonomía"],"correct":0,"expl":"Los 4 principios clásicos de la bioética (Beauchamp y Childress): beneficencia, no maleficencia, autonomía y justicia. Tema esp. 3 — cae muchísimo","tema":"calidad","bloque":"1er EJERCICIO — PARTE 1: TEÓRICA (preguntas 1-50)"},{"sim":"1","tag":"SIMULACRO 1","n":"4","q":"La historia clínica es un documento:","caso":"","opts":["No clínico de tipo administrativo","Clínico, único por paciente e institución","Clínico, propiedad exclusiva del médico","No clínico intrahospitalario"],"correct":1,"expl":"La historia clínica es el documento clínico por excelencia, única por paciente e institución. Tema esp. 3","tema":"legislacion","bloque":"1er EJERCICIO — PARTE 1: TEÓRICA (preguntas 1-50)"},{"sim":"1","tag":"SIMULACRO 1","n":"5","q":"Las vacunas deben conservarse habitualmente a una temperatura de:","caso":"","opts":["Entre 0 °C y 4 °C","Entre +2 °C y +8 °C","Por debajo de 0 °C","A temperatura ambiente, protegidas de la luz"],"correct":1,"expl":"Cadena de frío: +2 °C a +8 °C. Pregunta clásica del SERGAS. Tema esp. 4","tema":"muestras","bloque":"1er EJERCICIO — PARTE 1: TEÓRICA (preguntas 1-50)"},{"sim":"1","tag":"SIMULACRO 1","n":"6","q":"En la cadena del frío, el responsable del control diario de la temperatura de la nevera de vacunas debe registrarla:","caso":"","opts":["Una vez por semana","Solo cuando se reciben vacunas nuevas","Al inicio y al final de cada jornada laboral","Una vez al mes"],"correct":2,"expl":"El registro de temperatura de la nevera de vacunas se hace al inicio y al final de cada jornada. Tema esp. 4","tema":"muestras","bloque":"1er EJERCICIO — PARTE 1: TEÓRICA (preguntas 1-50)"},{"sim":"1","tag":"SIMULACRO 1","n":"7","q":"La escucha activa, dentro de las habilidades de comunicación, implica:","caso":"","opts":["Oír al paciente mientras se realizan otras tareas","Atender, comprender y devolver señales de comprensión al paciente","Interrumpir para ahorrar tiempo asistencial","Escuchar únicamente los datos clínicos relevantes"],"correct":1,"expl":"Escucha activa = atender + comprender + retroalimentar. Tema esp. 5","tema":"geriatria","bloque":"1er EJERCICIO — PARTE 1: TEÓRICA (preguntas 1-50)"},{"sim":"1","tag":"SIMULACRO 1","n":"8","q":"Una intranet es:","caso":"","opts":["Una red pública de acceso universal","Una red privada interna de una organización","Un programa procesador de textos","Un tipo de correo electrónico cifrado"],"correct":1,"expl":"Intranet = red privada interna de la organización. Tema esp. 6","tema":"calidad","bloque":"1er EJERCICIO — PARTE 1: TEÓRICA (preguntas 1-50)"},{"sim":"1","tag":"SIMULACRO 1","n":"9","q":"En la higiene ","q":"La posición de Trendelenburg está indicada en caso de:","caso":"","opts":["Insuficiencia respiratoria aguda","Lipotimia o shock hipovolémico","Exploración ginecológica","Sondaje rectal"],"correct":1,"expl":"Trendelenburg (cabeza más baja que pies) favorece el riego cerebral: lipotimias, shock. Tema esp. 9","tema":"urgencias","bloque":"1er EJERCICIO — PARTE 1: TEÓRICA (preguntas 1-50)"},{"sim":"1","tag":"SIMULACRO 1","n":"14","q":"La posición genupectoral se utiliza principalmente para:","caso":"","opts":["Exploraciones rectales","Punción lumbar","Enemas de retención","Exploración de mamas"],"correct":0,"expl":"Genupectoral (rodillas-pecho): exploraciones rectales/proctológicas. Tema esp. 9","tema":"movilizacion","bloque":"1er EJERCICIO — PARTE 1: TEÓRICA (preguntas 1-50)"},{"sim":"1","tag":"SIMULACRO 1","n":"15","q":"En los cambios posturales de un paciente encamado con riesgo de úlceras por presión, la frecuencia recomendada general es cada:","caso":"","opts":["1 hora","2-3 horas","6 horas","8 horas"],"correct":1,"expl":"Cambios posturales: como norma general cada 2-3 horas (individualizando según riesgo). Tema esp. 18","tema":"upp","bloque":"1er EJERCICIO — PARTE 1: TEÓRICA (preguntas 1-50)"},{"sim":"1","tag":"SIMULACRO 1","n":"16","q":"Un drenaje tipo Redón es un drenaje:","caso":"","opts":["Pasivo por gravedad","Activo por vacío (aspirativo)","Pasivo por capilaridad","Mixto irrigación-aspiración"],"correct":1,"expl":"Redón = drenaje activo aspirativo por vacío. Penrose/tejadillo = pasivos. Tema esp. 8","tema":"eliminacion","bloque":"1er EJERCICIO — PARTE 1: TEÓRICA (preguntas 1-50)"},{"sim":"1","tag":"SIMULACRO 1","n":"17","q":"La frecuencia cardíaca normal en un adulto en reposo es de:","caso":"","opts":["40-60 latidos por minuto","60-100 latidos por minuto","100-120 latidos por minuto","120-160 latidos por minuto"],"correct":1,"expl":"FC normal adulto: 60-100 lpm. Tema esp. 10","tema":"constantes","bloque":"1er EJERCICIO — PARTE 1: TEÓRICA (preguntas 1- curar un entorno tranquilo e iluminado","Dejarla sola hasta que se calme","Aplicar contención mecánica de inmediato sin indicación"],"correct":1,"expl":"Demencia con agitación vespertina (sundowning): calma, entorno tranquilo, no confrontar.","tema":"geriatria","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"56","q":"La familia de Dña. Rosa pregunta cómo comunicarse mejor con ella. Usted les recomienda:","caso":"","opts":["Preguntas abiertas y complejas para estimular la memoria","Frases sencillas, de una en una, apoyándose en gestos y contacto visual","Corregir cada error que cometa","Hablar entre varios a la vez para que se sienta acompañada"],"correct":1,"expl":"Comunicación en demencia: frases simples, de una en una, apoyo gestual, no corregir constantemente.","tema":"geriatria","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"57","q":"Tiene que trasladar de la cama al sillón a un paciente con hemiplejia derecha. El sillón debe colocarse:","caso":"","opts":["Del lado derecho (afectado) del paciente","Del lado izquierdo (sano) del paciente","A los pies de la cama, indistintamente","Detrás del cabecero"],"correct":1,"expl":"El traslado se hace hacia el lado sano: el sillón se coloca del lado no afectado (izquierdo).","tema":"movilizacion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"58","q":"Durante la movilización, para proteger su propia espalda, el TCAE debe:","caso":"","opts":["Flexionar las piernas, mantener la espalda recta y acercar la carga al cuerpo","Girar el tronco manteniendo los pies fijos","Trabajar con las piernas rectas y la espalda flexionada","Separar la carga del cuerpo para mejor visibilidad"],"correct":0,"expl":"Mecánica corporal: piernas flexionadas, espalda recta, carga próxima al cuerpo, no girar el tronco.","tema":"movilizacion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"59","q":"Un paciente postoperado de cirugía abdominal porta un drenaje de Penrose. Se trata de un drenaje:","caso":"","opts":["Activo aspirativo","Pasivo por gravedad/capilaridad","De circuito cerrado con vacío","De irrigación continua"],"correct":1,"expl":"Penrose: drenaje pasivo (gravedad/capilaridad). El Redón es el activo.","tema":"eliminacion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"60","q":"Al medir la diuresis de un paciente sondado observa 300 ml de orina en 24 horas. Este hallazgo se denomina:","caso":"","opts":["Poliuria","Oliguria","Anuria","Disuria"],"correct":1,"expl":"Oliguria: diuresis <500 ml/24 h (anuria <100 ml). 300 ml = oliguria.","tema":"eliminacion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"61","q":"D. José, diabético, presenta de forma súbita sudoración fría, temblor, palidez y confusión. Usted sospecha:","caso":"","opts":["Hiperglucemia","Hipoglucemia","Crisis hipertensiva","Reacción alérgica"],"correct":1,"expl":"Sudoración fría + temblor + confusión súbita en diabético = hipoglucemia.","tema":"urgencias","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"62","q":"Ante la sospecha anterior, si D. José está consciente y puede tragar, la actuación correcta (según protocolo y bajo supervisión de enfermería) es:","caso":"","opts":["Administrar insulina rápida","Dar azúcar o líquido azucarado por vía oral","Colocarlo en decúbito y esperar","Darle agua abundante sin azúcar"],"correct":1,"expl":"Hipoglucemia consciente: azúcar por vía oral (regla del 15). La insulina la empeoraría.","tema":"medicacion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"63","q":"En el control de constantes de la Sra. Puri encuentra: TA 190/110 mmHg, FC 92 lpm, Tª 36,8 °C. ¿Qué valor debe comunicar de inmediato a la enfermera?","caso":"","opts":["La frecuencia cardíaca","La tensión arterial","La temperatura","Todos son normales"],"correct":1,"expl":"TA 190/110 = crisis hipertensiva: comunicación inmediata. FC y Tª son normales.","tema":"constantes","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"64","q":"A un paciente se le va a realizar una punción lumbar. ¿En qué posición ayudará a colocarlo?","caso":"","opts":["Decúbito lateral en flexión (posición fetal) o sentado inclinado hacia delante","Decúbito prono con brazos extendidos","Trendelenburg","Posición ginecológica"],"correct":0,"expl":"Punción lumbar: posición fetal (decúbito lateral con máxima flexión) o sentado inclinado.","tema":"movilizacion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"65","q":"Tras la punción lumbar, el paciente debe permanecer:","caso":"","opts":["Sentado en el sillón 2 horas","En decúbito (habitualmente supino sin almohada) el tiempo indicado por protocolo","Deambulando de inmediato para evitar trombosis","En posición de Fowler alta"],"correct":1,"expl":"Tras punción lumbar: decúbito el tiempo protocolizado para evitar cefalea post-punción.","tema":"movilizacion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"66","q":"Una paciente en ayunas para cirugía le pide agua a las 7:00; la intervención es a las 9:00. Usted debe:","caso":"","opts":["Darle solo medio vaso","Explicarle que no puede ingerir nada y comunicarlo a la enfermera si insiste o refiere malestar","Darle agua con azúcar por la hipoglucemia","Darle una infusión caliente, que no cuenta como líquido"],"correct":1,"expl":"Ayuno prequirúrgico estricto: nada por boca; informar y avisar a enfermería si hay problemas.","tema":"urgencias","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"67","q":"En la preparación prequirúrgica inmediata, ¿cuál de las siguientes tareas corresponde al TCAE?","caso":"","opts":["Administrar la premedicación anestésica intravenosa","Higiene del paciente, retirada de prótesis, joyas y esmalte de uñas, y colocación de bata quirúrgica","Firmar el consentimiento informado en nombre del paciente","Realizar la anamnesis médica preoperatoria"],"correct":1,"expl":"Corresponde al TCAE la preparación física: higiene, retirada de prótesis/joyas/esmalte, bata. La premedicación IV es de enfermería; el consentimiento, del paciente con el médico.","tema":"medicacion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"68","q":"Recibe en la unidad a un paciente postoperado somnoliento que comienza a vomitar. Para evitar una broncoaspiración usted debe:","caso":"","opts":["Colocarlo en decúbito supino con almohada","Lateralizar la cabeza/colocarlo en decúbito lateral y avisar a enfermería","Sentarlo bruscamente en el borde de la cama","Darle agua para limpiar la boca"],"correct":1,"expl":"Vómito en paciente con bajo nivel de conciencia: lateralizar para proteger la vía aérea + avisar.","tema":"movilizacion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"69","q":"A la Sra. Carmen le han prescrito una dieta túrmix (triturada) por disfagia. Durante la comida, la postura correcta es:","caso":"","opts":["Decúbito supino con la cabeza extendida hacia atrás","Sentada o Fowler alta, con ligera flexión cervical anterior al tragar","Decúbito lateral izquierdo","Semisentada con el cuello en hiperextensión"],"correct":1,"expl":"Disfagia: sedestación/Fowler alta, flexión cervical anterior (barbilla al pecho) al tragar. La hiperextensión favorece el atragantamiento.","tema":"alimentacion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"70","q":"Para espesar los líquidos de la Sra. Carmen utilizará:","caso":"","opts":["Azúcar común","Espesante comercial hasta la textura prescrita (néctar, miel o pudin)","Harina de trigo cruda","No se pueden espesar los líquidos"],"correct":1,"expl":"Líquidos en disfagia: espesante comercial a la textura pautada.","tema":"alimentacion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"71","q":"Un lactante ingresado debe recibir biberón. Antes de administrarlo, usted comprueba la temperatura de la leche:","caso":"","opts":["Probándola directamente de la tetina","Vertiendo unas gotas en la cara interna de su muñeca/antebrazo","Con la palma de la mano sobre el biberón","No es necesario comprobarla si se calentó en microondas"],"correct":1,"expl":"Temperatura del biberón: gotas en cara interna de muñeca/antebrazo. El microondas calienta de forma desigual.","tema":"alimentacion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"72","q":"Al aspirar secreciones a un paciente traqueostomizado (colaborando con enfermería), la aspiración no debe superar:","caso":"","opts":["10-15 segundos por episodio","30-45 segundos por episodio","1 minuto por episodio","El tiempo es indiferente"],"correct":0,"expl":"Aspiración de secreciones: episodios breves, máx. 10-15 segundos.","tema":"urgencias","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"73","q":"Debe recoger un exudado de una herida para cultivo. El material a utilizar es:","caso":"","opts":["Hisopo/torunda estéril con medio de transporte","Gasa limpia no estéril","Depresor lingual","Jeringa sin aguja no estéril"],"correct":0,"expl":"Cultivo de exudado: torunda/hisopo estéril con medio de transporte.","tema":"infeccion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"74","q":"Mientras prepara la medicación oral, una compañera le pide que le acerque un fármaco de otro paciente ya fuera de su blíster y sin identificar. Usted debe:","caso":"","opts":["Entregarlo, pues lo pide una compañera","Negarse: la medicación no identificada debe desecharse según protocolo y volver a prepararse correctamente","Olerlo para identificarlo","Administrarlo usted directamente"],"correct":1,"expl":"Seguridad del medicamento: fármaco no identificado = se desecha. Nunca administrar medicación sin identificar.","tema":"medicacion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"75","q":"Un paciente en aislamiento de contacto por bacteria multirresistente precisa que le acerquen la cuña. Antes de entrar usted se pondrá:","caso":"","opts":["Solo mascarilla FFP3","Guantes y bata (según protocolo de contacto)","Únicamente calzas y gorro","No se precisa ninguna medida especial"],"correct":1,"expl":"Aislamiento de contacto: guantes + bata. FFP3 es para aislamiento aéreo.","tema":"infeccion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"76","q":"Al salir de la habitación del paciente anterior, el orden correcto de retirada del EPI es:","caso":"","opts":["Primero mascarilla, después guantes","Guantes y bata dentro de la habitación, higiene de manos; la mascarilla (si la hubiera) se retira fuera","Todo el EPI se retira en el pasillo","El orden es indiferente si luego se lavan las manos"],"correct":1,"expl":"EPI de contacto se retira dentro de la habitación + higiene de manos inmediata.","tema":"infeccion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"77","q":"Se produce un derrame de un citostático en la unidad. La actuación inicial correcta es:","caso":"","opts":["Limpiarlo con la fregona de la unidad","Aislar/señalizar la zona y actuar según protocolo con el kit específico de derrames","Diluirlo con abundante agua caliente","Recogerlo con papel y tirarlo a la bolsa negra"],"correct":1,"expl":"Derrame de citostáticos: señalizar y usar el kit específico según protocolo; nunca limpieza convencional.","tema":"muestras","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"78","q":"Mientras retira material de una bandeja sufre un pinchazo accidental con una aguja usada. La primera medida es:","caso":"","opts":["Succionar la herida inmediatamente","Dejar fluir la sangre, lavar con agua y jabón, antiséptico, y comunicar/declarar el accidente según protocolo","Aplicar un vendaje compresivo y seguir trabajando","No hacer nada si la aguja parecía limpia"],"correct":1,"expl":"Pinchazo accidental: dejar sangrar, agua y jabón, antiséptico, declarar el accidente (protocolo de bioseguridad). No succionar.","tema":"muestras","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"79","q":"En el turno de noche encuentra a un paciente inconsciente en el suelo del baño, que no respira con normalidad. Tras pedir ayuda/avisar, la actuación inmediata es:","caso":"","opts":["Colocarlo en la cama y esperar al médico","Iniciar compresiones torácicas (RCP básica) según protocolo","Darle agua fría en la cara","Colocarlo en posición lateral de seguridad y marcharse a buscar ayuda"],"correct":1,"expl":"Inconsciente que no respira normal: pedir ayuda e iniciar RCP básica de inmediato.","tema":"urgencias","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"80","q":"En el carro de parada de su unidad, el TCAE es responsable (junto con enfermería) de:","caso":"","opts":["Prescribir la medicación de urgencia","Colaborar en la reposición, limpieza y comprobación periódica del material según protocolo","Realizar la intubación orotraqueal","Administrar la adrenalina intravenosa"],"correct":1,"expl":"Carro de parada: el TCAE colabora en revisión, limpieza y reposición periódica según protocolo.","tema":"medicacion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"81","q":"Un paciente quemado llega a urgencias con quemaduras en todo el miembro superior derecho y la cara anterior del tronco. Según la \"regla de los 9\" de Wallace, la superficie afectada es aproximadamente:","caso":"","opts":["9 %","18 %","27 %","36 %"],"correct":1,"expl":"Regla de los 9: miembro superior 9 % + cara anterior del tronco 9 % = 18 %.","tema":"urgencias","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"82","q":"Ante un paciente con una crisis convulsiva en curso, usted debe:","caso":"","opts":["Sujetarlo firmemente para detener las convulsiones","Introducir un objeto entre los dientes","Retirar objetos peligrosos del entorno, proteger la cabeza y no introducir nada en la boca","Darle agua en cuanto ceda la crisis"],"correct":2,"expl":"Convulsión: proteger de lesiones, no sujetar, no introducir objetos en la boca.","tema":"urgencias","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"83","q":"D. Antonio, paciente oncológico terminal, le dice llorando: \"Sé que me voy a morir\". La respuesta más adecuada del TCAE es:","caso":"","opts":["\"No diga tonterías, se pondrá bien\"","Escucharle, permanecer a su lado y permitir que exprese sus emociones, mostrando disponibilidad","Cambiar de tema rápidamente","Avisar a seguridad"],"correct":1,"expl":"Paciente terminal: escucha activa, presencia, permitir expresión emocional. Ni falsas esperanzas ni evasivas.","tema":"geriatria","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"84","q":"La esposa de D. Antonio, su cuidadora principal, muestra agotamiento físico y emocional. Esto se conoce como:","caso":"","opts":["Síndrome de Diógenes","Síndrome de sobrecarga del cuidador","Síndrome confusional agudo","Síndrome de Münchhausen"],"correct":1,"expl":"Agotamiento del cuidador principal = síndrome de sobrecarga del cuidador.","tema":"geriatria","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"85","q":"Fallece un paciente en la unidad. Respecto a los cuidados post mortem, señale la opción correcta:","caso":"","opts":["Se realizan sin guantes por respeto al difunto","Se realiza la higiene del cuerpo, se retiran vías/sondas salvo indicación (p. ej., judicial) y se identifica el cadáver según protocolo","La identificación del cadáver es opcional","Se colocan las prótesis dentales siempre después del traslado al mortuorio"],"correct":1,"expl":"Post mortem: higiene + retirada de dispositivos (salvo causa judicial) + identificación correcta del cadáver.","tema":"geriatria","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"86","q":"Un paciente con alcoholismo crónico en abstinencia comienza con temblor, sudoración, agitación y alucinaciones. Usted sospecha:","caso":"","opts":["Delirium tremens — avisar con urgencia a enfermería/médico","Simulación para conseguir el alta","Reacción adversa a la dieta","Crisis de ansiedad banal que cederá sola"],"correct":0,"expl":"Abstinencia alcohólica con alucinaciones = sospecha de delirium tremens: urgencia médica.","tema":"alimentacion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"87","q":"Para aplicar una contención mecánica a un paciente agitado se requiere:","caso":"","opts":["Solo la decisión del TCAE del turno","Prescripción/indicación facultativa, registro y vigilancia periódica según protocolo","Autorización del servicio de limpieza","Que el paciente la firme previamente en todos los casos"],"correct":1,"expl":"Contención mecánica: siempre con indicación facultativa, registro y vigilancia periódica.","tema":"geriatria","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"88","q":"En la unidad de geriatría, la mejor medida para prevenir caídas nocturnas es:","caso":"","opts":["Contención mecánica preventiva de todos los pacientes","Iluminación adecuada, timbre y objetos al alcance, barandillas según protocolo y calzado antideslizante","Administrar sedantes a demanda","Cerrar la puerta de la habitación con llave"],"correct":1,"expl":"Prevención de caídas: medidas ambientales; nunca contención ni sedación \"preventivas\".","tema":"geriatria","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"89","q":"A un paciente con fiebre alta se le prescribe la aplicación de frío local. Usted:","caso":"","opts":["Aplica la bolsa de hielo directamente sobre la piel del tórax","Envuelve la bolsa en un paño y la aplica en las zonas indicadas, vigilando la piel periódicamente","Sumerge al paciente en agua helada","Aplica frío y calor alternos cada minuto"],"correct":1,"expl":"Frío local terapéutico: protegido con paño y con vigilancia periódica de la piel.","tema":"geriatria","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"90","q":"Tiene que hacer la cama quirúrgica (de anestesia) para un paciente que vuelve de quirófano. Su característica principal es:","caso":"","opts":["La ropa superior se dobla en acordeón/paquete hacia un lateral, sin remeter, para facilitar el traslado del paciente","Lleva doble manta remetida firmemente","No lleva sábana bajera","Se hace con el cabecero elevado 90°"],"correct":0,"expl":"Cama quirúrgica: ropa superior en paquete/acordeón lateral sin remeter para transferir al paciente con rapidez.","tema":"higiene","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"91","q":"Un paciente portador de sonda vesical debe ser trasladado en silla de ruedas a radiología. La bolsa de diuresis debe ir:","caso":"","opts":["Sobre el regazo del paciente","Colgada por debajo del nivel de la vejiga, sin tocar el suelo y sin acodaduras","Colgada del asa superior de la silla, por encima del hombro","Pinzada y desconectada de la sonda"],"correct":1,"expl":"Bolsa de diuresis: siempre por debajo de la vejiga, sin tocar el suelo, sin acodaduras y sin desconectar (circuito cerrado).","tema":"eliminacion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"92","q":"Al realizar la higiene genital de una paciente sondada, el lavado se realiza:","caso":"","opts":["De la zona anal hacia el pubis","De arriba hacia abajo (del meato hacia el ano), incluyendo la limpieza de la sonda desde el meato hacia distal","Solo con alcohol de 70°","Retirando previamente la sonda"],"correct":1,"expl":"Higiene genital femenina y de la sonda: siempre de limpio a sucio (de meato/pubis hacia el ano; la sonda, desde el meato hacia fuera).","tema":"calidad","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"93","q":"En el office de la planta detecta que un envase de dieta enteral abierto lleva más de 24 horas en la nevera sin etiquetar. Usted:","caso":"","opts":["Lo utiliza, pues estaba refrigerado","Lo desecha según protocolo de seguridad alimentaria","Lo calienta a 60 °C para eliminar bacterias","Lo mezcla con un envase nuevo"],"correct":1,"expl":"Dieta enteral abierta: caduca en 24 h refrigerada (según protocolo, incluso menos a temperatura ambiente): se desecha.","tema":"alimentacion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"94","q":"Una paciente le confía datos íntimos de su historia personal. Posteriormente, un familiar le pregunta a usted por esos datos. Usted debe:","caso":"","opts":["Contárselo, porque es familia directa","Guardar secreto profesional y derivar la consulta de información clínica al personal facultativo y a los cauces establecidos","Publicarlo en la sesión de la unidad","Contarlo solo si el familiar insiste"],"correct":1,"expl":"Secreto profesional: obliga a todo el personal; la información clínica la facilita el facultativo por los cauces establecidos.","tema":"legislacion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"95","q":"Al pesar diariamente a un paciente con insuficiencia cardíaca, las condiciones correctas son:","caso":"","opts":["A cualquier hora, vestido y calzado","Siempre a la misma hora, en la misma báscula, con ropa similar (idealmente en ayunas y tras orinar)","Después de las comidas para mayor exactitud","Solo cuando el paciente lo solicite"],"correct":1,"expl":"Peso diario comparable: misma hora, misma báscula, misma ropa, tras primera micción.","tema":"eliminacion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"96","q":"Un paciente con EPOC portador de gafas nasales le pide que le suba el oxígeno porque \"se ahoga\". Usted:","caso":"","opts":["Sube el flujo al máximo inmediatamente","No modifica el flujo prescrito y avisa de inmediato a la enfermera valorando el estado del paciente","Le retira el oxígeno para que descanse","Le coloca una mascarilla con reservorio por iniciativa propia"],"correct":1,"expl":"En EPOC no se modifica el flujo de O2 sin prescripción (riesgo de depresión respiratoria): valorar y avisar.","tema":"medicacion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"97","q":"En la recogida de una muestra de heces para parásitos, el recipiente debe:","caso":"","opts":["Contener alcohol","Ser limpio/adecuado, evitando mezclar la muestra con orina, y enviarse según protocolo del laboratorio","Rellenarse hasta el borde","Mantenerse a 37 °C en estufa"],"correct":1,"expl":"Heces para parásitos: recipiente adecuado, sin mezclar con orina, envío según protocolo.","tema":"muestras","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"98","q":"Un compañero le sugiere \"ahorrar tiempo\" usando los mismos guantes para atender a varios pacientes seguidos. Esta práctica:","caso":"","opts":["Es correcta si los guantes no están visiblemente sucios","Es incorrecta: los guantes se cambian entre pacientes y se realiza higiene de manos; los guantes no sustituyen al lavado","Es correcta en turnos con mucha carga de trabajo","Solo es incorrecta en quirófano"],"correct":1,"expl":"Guantes: se cambian entre pacientes + higiene de manos; nunca sustituyen al lavado.","tema":"infeccion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"99","q":"Llega a urgencias una mujer con lesiones que refiere haber sufrido violencia por parte de su pareja. Como TCAE, usted debe:","caso":"","opts":["Interrogarla con detalle delante de su pareja","Garantizar un entorno seguro e íntimo, actitud empática y sin juicios, y comunicar la situación al personal responsable según el protocolo de violencia de género","Restar importancia para tranquilizarla","Indicarle que vuelva otro día con cita previa"],"correct":1,"expl":"Violencia de género: seguridad, intimidad, empatía, no juzgar, activar el protocolo (Ley 11/2007 gallega y LO 1/2004).","tema":"legislacion","bloque":"1er EJERCICIO — PARTE 2: SUPUESTOS PRÁCTICOS (preguntas 51-100)"},{"sim":"1","tag":"SIMULACRO 1","n":"100","q":"En un paciente anciano institucionalizado con inmovilidad, la medida más eficaz para prevenir la neumonía por estasis es:","caso":"","opts":["Mantenerlo siempre en decúbito supino estricto","Movilización precoz, cambios posturales, sedestación e incent os trabajadores en activo","Se limitarán a la atención hospitalaria"],"correct":0,"expl":"LGS art. 3: acceso y prestaciones en condiciones de igualdad efectiva. Tema común 3","tema":"legislacion","bloque":"2º EJERCICIO — PARTE COMÚN (preguntas C1-C10)"},{"sim":"1","tag":"SIMULACRO 1","n":"C5","q":"La Ley de salud de Galicia es la:","caso":"","opts":["Ley 8/2008, de 10 de julio","Ley 44/2003, de 21 de noviembre","Ley 16/2003, de 28 de mayo","Ley 3/2001, de 28 de mayo"],"correct":0,"expl":"Ley 8/2008, de 10 de julio, de salud de Galicia. (La 3/2001 es la del consentimiento informado.) Tema común 4 — memoriza el par 8/2008 ↔ 3/2001","tema":"legislacion","bloque":"2º EJERCICIO — PARTE COMÚN (preguntas C1-C10)"},{"sim":"1","tag":"SIMULACRO 1","n":"C6","q":"Según el Estatuto marco (Ley 55/2003), el personal estatutario se clasifica en:","caso":"","opts":["Funcionario, laboral y eventual","Estatutario sanitario y estatutario de gestión y servicios","De carrera e interino exclusivamente","Directivo y no directivo"],"correct":1,"expl":"Estatuto marco: personal estatutario sanitario y personal estatutario de gestión y servicios. Tema común 5","tema":"legislacion","bloque":"2º EJERCICIO — PARTE COMÚN (preguntas C1-C10)"},{"sim":"1","tag":"SIMULACRO 1","n":"C7","q":"Conforme al Estatuto marco, la duración máxima conjunta de los tiempos de trabajo correspondientes a la jornada complementaria y la jornada ordinaria será de:","caso":"","opts":["40 horas semanales de promedio","48 horas semanales de promedio en cómputo semestral, salvo lo previsto en la norma","35 horas semanales fijas","60 horas semanales en cualquier caso"],"correct":1,"expl":"Estatuto marco (art. 48): máx. 48 h semanales de promedio en cómputo semestral (jornada ordinaria + complementaria), salvo excepciones. Tema común 5","tema":"legislacion","bloque":"2º EJERCICIO — PARTE COMÚN (preguntas C1-C10)"},{"sim":"1","tag":"SIMULACRO 1","n":"C8","q":"La Ley gallega 3/2001 regula:","caso":"","opts":["El consentimiento informado y la historia clínica de los pacientes","La prevención de riesgos laborales","Las retribuciones del personal estatutario","La ordenación farmacéutica de Galicia"],"correct":0,"expl":"Ley 3/2001: consentimiento informado e historia clínica en Galicia. Tema común 7","tema":"legislacion","bloque":"2º EJERCICIO — PARTE COMÚN (preguntas C1-C10)"},{"sim":"1","tag":"SIMULACRO 1","n":"C9","q":"Según la Ley 31/1995 de prevención de riesgos laborales, la vigilancia periódica del estado de salud de los trabajadores en función de los riesgos inherentes al trabajo es:","caso":"","opts":["Una obligación que el empresario debe garantizar, con carácter general voluntaria para el trabajador salvo excepciones legales","Obligatoria siempre para el trabajador en todos los casos","Una opción sin regulación legal","Responsabilidad exclusiva del propio trabajador"],"correct":0,"expl":"LPRL art. 22: el empresario garantiza la vigilancia de la salud; para el trabajador es voluntaria salvo excepciones (riesgo para sí o terceros, disposición legal). Tema común 8","tema":"legislacion","bloque":"2º EJERCICIO — PARTE COMÚN (preguntas C1-C10)"},{"sim":"1","tag":"SIMULACRO 1","n":"C10","q":"La Ley orgánica 1/2004 tiene por objeto actuar contra la violencia que se ejerce sobre las mujeres:","caso":"","opts":["Únicamente en el ámbito laboral","Por parte de quienes sean o hayan sido sus cónyuges o estén o hayan estado ligados a ellas por relaciones similares de afectividad, aun sin convivencia","Solo si existe convivencia acreditada","Exclusivamente en el ámbito digital"],"correct":1,"expl":"LO 1/2004, art. 1: violencia por parte de cónyuges/excónyuges o relaciones análogas de afectividad, aun sin convivencia. Tema común 8","tema":"legislacion","bloque":"2º EJERCICIO — PARTE COMÚN (preguntas C1-C10)"},{"sim":"2","tag":"SIMULACRO 2","n":"1","q":"Respecto a las dimensiones de la calidad asistencial, señale la afirmación INCORRECTA:","caso":"","opts":["La accesibilidad se refiere a la facilidad con que el usuario obtiene la asistencia","La efectividad es el resultado de una intervención en condiciones ideales o experimentales","La eficiencia relaciona los resultados obtenidos con los recursos empleados","La equidad implica prestar atención según la necesidad, sin discriminación"],"correct":1,"expl":"Lo descrito es la eficacia (condiciones ideales). La efectividad es el resultado en condiciones reales/habituales. Ese cambio de palabra es la trampa clásica.","tema":"calidad","bloque":"PARTE ESPECÍFICA — TEÓRICA (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"2","q":"Según la Ley 41/2002, básica reguladora de la autonomía del paciente, el consentimiento informado se prestará por escrito en todos los casos siguientes, EXCEPTO:","caso":"","opts":["Intervención quirúrgica","Procedimientos diagnósticos invasores","Procedimientos que suponen riesgos o inconvenientes de notoria repercusión negativa","Administración de la medicación oral habitual pautada"],"correct":3,"expl":"Ley 41/2002 art. 8: el consentimiento es verbal por regla general; por escrito en cirugía, procedimientos invasores y los de riesgo notorio. La medicación oral pautada no requiere CI escrito.","tema":"legislacion","bloque":"PARTE ESPECÍFICA — TEÓRICA (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"3","q":"En una gasometría arterial, un pH de 7,30 con pCO₂ elevada indica:","caso":"","opts":["Alcalosis respiratoria","Acidosis respiratoria","Acidosis metabólica","Alcalosis metabólica"],"correct":1,"expl":"pH bajo (<7,35) + pCO₂ alta = acidosis respiratoria (el CO₂ es ácido y está retenido).","tema":"muestras","bloque":"PARTE ESPECÍFICA — TEÓRICA (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"4","q":"La conservación de una vacuna que ha sufrido congelación accidental implica que:","caso":"","opts":["Puede utilizarse si se descongela lentamente","Debe desecharse, especialmente las vacunas adsorbidas, pues pierden eficacia","Solo se inutiliza si supera las 24 h congelada","Se puede usar en dosis dobles para compensar"],"correct":1,"expl":"La congelación inutiliza las vacunas, sobre todo las adsorbidas (p. ej. con aluminio): se desechan. La congelación daña más que el calor moderado.","tema":"muestras","bloque":"PARTE ESPECÍFICA — TEÓRICA (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"5","q":"Señale la respuesta CORRECTA sobre la posición de Sims:","caso":"","opts":["Es un decúbito supino con las piernas elevadas","Es un decúbito lateral izquierdo semiprono, con el brazo inferior atrás y la pierna superior flexionada","Es la posición de rodillas y pecho","Es un decúbito prono con la cabeza ladeada"],"correct":1,"expl":"Sims = lateral izquierdo semiprono, brazo inferior hacia atrás, pierna superior flexionada. Se usa para enemas y exploración/administración rectal.","tema":"movilizacion","bloque":"PARTE ESPECÍFICA — TEÓRICA (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"6","q":"En un paciente con presión arterial de 138/88 mmHg, según la clasificación habitual, hablamos de:","caso":"","opts":["Presión arterial óptima","Presión arterial normal-alta","Hipertensión grado 2","Hipertensión grado 3"],"correct":1,"expl":"138/88 = normal-alta (PAS 130-139 o PAD 85-89). No llega a HTA grado 1 (≥140/90).","tema":"constantes","bloque":"PARTE ESPECÍFICA — TEÓRICA (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"7","q":"La escala de Glasgow valora el nivel de conciencia. Su puntuación oscila entre:","caso":"","opts":["0 y 10","3 y 15","1 y 12","5 y 20"],"correct":1,"expl":"Glasgow: 3 (mínimo) a 15 (máximo). Un 3 es coma profundo.","tema":"constantes","bloque":"PARTE ESPECÍFICA — TEÓRICA (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"8","q":"Sobre la esterilización por autoclave, señale la INCORRECTA:","caso":"","opts":["Un ciclo habitual es 121 °C durante 15-20 minutos a 1 atmósfera","Es un método de esterilización por calor húmedo","El control biológico emplea esporas de Geobacillus stearothermophilus","Es el método de elección para material termosensible como plásticos y ópticas"],"correct":3,"expl":"El autoclave es para material termorresistente. El termosensible (plásticos, ópticas) se esteriliza en frío (óxido de etileno, gas plasma).","tema":"infeccion","bloque":"PARTE ESPECÍFICA — TEÓRICA (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"9","q":"Los residuos citotóxicos y citostáticos se clasifican, en la gestión de residuos sanitarios, como:","caso":"","opts":["Grupo I","Grupo II","Grupo III","Grupo IV"],"correct":3,"expl":"Citostáticos/citotóxicos = Grupo IV (residuos de tratamientos, con normativa específica). Grupo III = biosanitarios especiales.","tema":"muestras","bloque":"PARTE ESPECÍFICA — TEÓRICA (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"10","q":"En una úlcera por presión de categoría II, encontramos:","caso":"","opts":["Eritema no blanqueante con piel íntegra","Pérdida parcial del espesor de la dermis: flictena o úlcera superficial (lecho rojo-rosado)","Pérdida total del espesor cutáneo con tejido subcutáneo visible","Exposición de hueso o músculo"],"correct":1,"expl":"Categoría II = pérdida parcial de la dermis: flictena o úlcera superficial, lecho rojo-rosado. (I = eritema; III = tejido subcutáneo; IV = hueso/músculo.)","tema":"upp","bloque":"PARTE ESPECÍFICA — TEÓRICA (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"11","q":"Señale la afirmación FALSA sobre el lavado de manos:","caso":"","opts":["La fricción con solución hidroalcohólica es de elección si las manos no están visiblemente sucias","El lavado quirúrgico incluye antebrazos y dura más que el higiénico","La solución hidroalcohólica es eficaz frente a esporas de Clostridioides difficile","Tras contacto con fluidos corporales debe realizarse higiene de manos"],"correct":2,"expl":"El hidroalcohólico NO elimina esporas (C. difficile): en esos casos hay que lavar con agua y jabón. Las demás son verdaderas.","tema":"infeccion","bloque":"PARTE ESPECÍFICA — TEÓRICA (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"12","q":"Según el Estatuto Marco (Ley 55/2003), un permiso por asuntos particulares NO tiene la consideración de:","caso":"","opts":["Un derecho retribuido en los términos que fije la normativa de desarrollo","Una situación que exima del cómputo de la jornada anual","Un permiso concedido por la dirección conforme a las necesidades del servicio","Un permiso regulado por la normativa autonómica de aplicación"],"correct":1,"expl":"Los asuntos particulares son un permiso regulado y retribuido según normativa, pero NO eximen del cómputo de la jornada anual de forma automática: se disfrutan dentro de las necesidades del servicio.","tema":"legislacion","bloque":"PARTE ESPECÍFICA — TEÓRICA (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"13","q":"La cadena epidemiológica de la infección nosocomial consta de: agente causal, reservorio, puerta de salida, mecanismo de transmisión, puerta de entrada y:","caso":"","opts":["Período de incubación","Huésped susceptible","Vector mecánico","Portador asintomático"],"correct":1,"expl":"El último eslabón es el huésped susceptible. Romper cualquier eslabón corta la transmisión.","tema":"infeccion","bloque":"PARTE ESPECÍFICA — TEÓRICA (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"14","q":"En la administración de oxígeno con mascarilla tipo Venturi, la ventaja principal es que:","caso":"","opts":["Aporta siempre el 100 % de FiO₂","Permite administrar una concentración (FiO₂) conocida y constante","No precisa humidificación en ningún caso","Sustituye a la ventilación mecánica"],"correct":1,"expl":"La Venturi aporta FiO₂ conocida y constante (ideal en EPOC, donde interesa controlar el O₂). No da el 100 %.","tema":"medicacion","bloque":"PARTE ESPECÍFICA — TEÓRICA (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"15","q":"Un paciente con sonda vesical presenta orina turbia, con sedimento y olor fétido. Lo prioritario es:","caso":"","opts":["Pinzar la sonda hasta valorar","Registrar las características, comunicar a enfermería y valorar recogida de urocultivo por técnica adecuada","Retirar la sonda de inmediato","Aumentar la ingesta de líquidos sin más"],"correct":1,"expl":"Registrar, comunicar a enfermería y valorar urocultivo con técnica correcta. Nunca retirar la sonda por iniciativa propia.","tema":"eliminacion","bloque":"PARTE ESPECÍFICA — TEÓRICA (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"16","q":"Señale la CORRECTA sobre la vía intramuscular (colaboración del TCAE en su preparación):","caso":"","opts":["La zona ventroglútea es una localización segura por alejarse del nervio ciático","El deltoides admite grandes volúmenes (>5 ml)","La absorción intramuscular es más lenta que la subcutánea","Nunca debe aspirarse antes de inyectar en ningún músculo"],"correct":0,"expl":"La ventroglútea es segura por alejarse del ciático. El deltoides admite poco volumen; la IM es más rápida que la SC; aspirar depende del punto.","tema":"medicacion","bloque":"PARTE ESPECÍFICA — TEÓRICA (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"17","q":"En un balance hídrico, se contabilizan como pérdidas insensibles:","caso":"","opts":["La diuresis y las deposiciones","La perspiración cutánea y la respiración","Los drenajes y los vómitos","La sudoración profusa medible"],"correct":1,"expl":"Pérdidas insensibles = perspiración cutánea + respiración (no se miden directamente). Diuresis, drenajes, vómitos son sensibles (medibles).","tema":"constantes","bloque":"PARTE ESPECÍFICA — TEÓRICA (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"18","q":"Respecto al aislamiento, señale la correspondencia INCORRECTA:","caso":"","opts":["Tuberculosis pulmonar bacilífera → aislamiento aéreo","Gripe / COVID por gotas → aislamiento por gotas","SARM (S. aureus resistente a meticilina) → aislamiento de contacto","Paciente neutropénico → aislamiento por gotas"],"correct":3,"expl":"El neutropénico necesita aislamiento protector/inverso, no por gotas: se le protege a él del entorno.","tema":"infeccion","bloque":"PARTE ESPECÍFICA — TEÓRICA (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"19","q":"Señale la afirmación CORRECTA sobre el pulso arterial normal del adulto:","caso":"","opts":["Se considera bradicardia por debajo de 60 lpm","El pulso paradójico es un aumento de la frecuencia con la inspiración","La taquicardia se define a partir de 80 lpm","El pulso se mide siempre durante 15 segundos exactos"],"correct":0,"expl":"Bradicardia <60 lpm; taquicardia >100 lpm. El pulso paradójico es un descenso (no aumento) de la TA/pulso en inspiración. La medición idealmente 1 minuto si es irregular.","tema":"constantes","bloque":"PARTE ESPECÍFICA — TEÓRICA (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"20","q":"En la Ley 31/1995 de prevención de riesgos laborales, los equipos de protección individual (EPI):","caso":"","opts":["Son la primera medida preventiva a adoptar frente a un riesgo","Se emplean cuando los riesgos no se pueden evitar o limitar suficientemente por medios técnicos o de organización","Deben ser aportados por el propio trabajador","Solo son obligatorios en quirófano"],"correct":1,"expl":"LPRL: el EPI es la última barrera, cuando no se puede evitar/limitar el riesgo por medios técnicos u organizativos, y lo aporta el empresario.","tema":"legislacion","bloque":"PARTE ESPECÍFICA — TEÓRICA (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"21","q":"D. Andrés, 70 años, EPOC, ingresa con disnea. Enfermería pauta O₂. Como TCAE observa que un familiar ha subido el caudalímetro a 6 L/min con gafas nasales y el paciente está cada vez más somnoliento. Su actuación:","caso":"","opts":["Dejarlo, ya que más oxígeno siempre es mejor","Bajar al flujo prescrito y avisar de inmediato a enfermería por riesgo de narcosis por CO₂","Retirar el oxígeno por completo","Cambiar a mascarilla con reservorio por su cuenta"],"correct":1,"expl":"En EPOC, exceso de O₂ puede provocar narcosis por CO₂ (deprime el estímulo respiratorio). Bajar al flujo pautado y avisar. La somnolencia es señal de alarma.","tema":"medicacion","bloque":"PARTE ESPECÍFICA — SUPUESTOS PRÁCTICOS (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"22","q":"Prepara el material para una cura estéril. Al abrir el paquete de gasas estériles, la esquina interna roza el borde exterior no estéril del envoltorio. Usted:","caso":"","opts":["Usa las gasas, el roce es mínimo","Considera todo el campo contaminado y descarta las gasas","Recorta la esquina afectada","Rocía las gasas con antiséptico y las usa"],"correct":1,"expl":"En técnica estéril, si una parte del campo toca lo no estéril, TODO se considera contaminado. Se descarta.","tema":"infeccion","bloque":"PARTE ESPECÍFICA — SUPUESTOS PRÁCTICOS (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"23","q":"Dña. Elena, encamada, con sonda nasogástrica para alimentación. Antes de la toma, al aspirar comprueba un residuo gástrico de 350 ml. Lo correcto es:","caso":"","opts":["Administrar la toma completa igualmente","No administrar y comunicar a enfermería el residuo elevado (riesgo de intolerancia/broncoaspiración)","Duplicar la toma para compensar","Retirar la sonda"],"correct":1,"expl":"Residuo gástrico elevado (típicamente >200-250 ml según protocolo) = riesgo de intolerancia/broncoaspiración: no administrar y avisar.","tema":"alimentacion","bloque":"PARTE ESPECÍFICA — SUPUESTOS PRÁCTICOS (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"24","q":"Un paciente en decúbito supino con sujeción mecánica prescrita. Respecto a la vigilancia, señale la INCORRECTA:","caso":"","opts":["Se revisa periódicamente el estado de la piel y la circulación de las zonas sujetas","Se realizan cambios posturales y se atienden necesidades básicas","Una vez colocada, no requiere reevaluación hasta el alta","Debe existir prescripción facultativa y registro"],"correct":2,"expl":"La sujeción se reevalúa periódicamente (piel, circulación, necesidad de mantenerla), nunca \"hasta el alta sin revisar\".","tema":"movilizacion","bloque":"PARTE ESPECÍFICA — SUPUESTOS PRÁCTICOS (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"25","q":"Recoge una muestra de esputo para baciloscopia (sospecha de TBC). Señale la CORRECTA:","caso":"","opts":["Basta con saliva recogida en cualquier momento","Debe ser esputo (no saliva), preferentemente matutino, con EPI adecuado por el riesgo de transmisión aérea","Se recoge tras las comidas para mayor volumen","No precisa medidas de protección respiratoria"],"correct":1,"expl":"Esputo (no saliva), matutino, con protección respiratoria (FFP2/FFP3) por riesgo de TBC.","tema":"muestras","bloque":"PARTE ESPECÍFICA — SUPUESTOS PRÁCTICOS (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"26","q":"Dña. Marta, diabética insulinodependiente, está inconsciente y no responde. El glucómetro marca 38 mg/dl. Estando inconsciente, la actuación del TCAE es:","caso":"","opts":["Darle zumo azucarado por la boca","NO administrar nada por vía oral (riesgo de broncoaspiración) y avisar urgentemente a enfermería/médico","Administrar insulina rápida","Colocarla sentada y esperar"],"correct":1,"expl":"Paciente INCONSCIENTE: nada por boca (broncoaspiración). Avisar urgente: la enfermera/médico administrará glucosa IV o glucagón.","tema":"medicacion","bloque":"PARTE ESPECÍFICA — SUPUESTOS PRÁCTICOS (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"27","q":"Paciente con aislamiento de contacto por Clostridioides difficile. Respecto a la higiene de manos, señale la CORRECTA:","caso":"","opts":["Es suficiente la solución hidroalcohólica","Debe realizarse lavado con agua y jabón, porque el alcohol no elimina las esporas","No es necesaria si se usan guantes","Solo al salir de la habitación"],"correct":1,"expl":"C. difficile forma esporas: obligatorio agua y jabón; el alcohol no basta.","tema":"infeccion","bloque":"PARTE ESPECÍFICA — SUPUESTOS PRÁCTICOS (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"28","q":"Al hacer la cama ocupada de un paciente encamado con vía periférica y sonda vesical, señale la INCORRECTA:","caso":"","opts":["Se moviliza al paciente en decúbito lateral protegiendo la vía y la sonda","La bolsa de diuresis se mantiene por debajo de la vejiga durante toda la maniobra","Se aprovecha para pinzar la vía y la sonda \"para mayor comodidad\"","Se realiza preferiblemente entre dos personas"],"correct":2,"expl":"No se debe pinzar la vía ni la sonda \"por comodidad\": pinzar la sonda vesical favorece infección/reflujo y pinzar la vía puede obstruirla.","tema":"eliminacion","bloque":"PARTE ESPECÍFICA — SUPUESTOS PRÁCTICOS (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"29","q":"Un paciente sufre una caída presenciada, refiere dolor intenso en cadera y la pierna aparece acortada y en rotación externa. Antes de que llegue enfermería/médico, usted:","caso":"","opts":["Lo levanta y lo sienta en el sillón","No lo moviliza, lo mantiene cómodo y quieto, y avisa de inmediato (sospecha de fractura de cadera)","Le realiza flexo-extensiones de la pierna para valorar","Le aplica calor local en la cadera"],"correct":1,"expl":"Cadera acortada + rotación externa + dolor = fractura de cadera probable: NO movilizar, mantener cómodo y avisar.","tema":"urgencias","bloque":"PARTE ESPECÍFICA — SUPUESTOS PRÁCTICOS (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"30","q":"En la toma de temperatura, señale la CORRECTA sobre la vía rectal:","caso":"","opts":["Registra valores aproximadamente 0,5 °C inferiores a la axilar","Registra valores aproximadamente 0,5 °C superiores a la axilar","Está indicada de rutina en pacientes con diarrea o cirugía rectal","Es equivalente a la timpánica sin diferencias"],"correct":1,"expl":"La temperatura rectal es ~0,5 °C superior a la axilar; la axilar es la más baja. La rectal está contraindicada en cirugía/patología rectal y diarrea.","tema":"alimentacion","bloque":"PARTE ESPECÍFICA — SUPUESTOS PRÁCTICOS (difícil)"},{"sim":"2","tag":"SIMULACRO 2","n":"31","q":"Traslada en cama a un paciente con drenaje torácico (sello de agua tipo Pleur-evac). Señale la INCORRECTA:","caso":"","opts":["El sistema se mantiene por debajo del nivel del tórax","Se evita que el sistema se vuelque o se or, vómitos y drenajes son salidas.","tema":"constantes","bloque":"BLOQUE D — CONSTANTES VITALES Y BALANCE HÍDRICO (19-24)"},{"sim":"C","tag":"TEST CUIDADOS","n":"24","q":"Una diuresis de 350 ml en 24 horas en un adulto se denomina:","caso":"","opts":["Oliguria (menos de 500 ml/día)","Poliuria","Diuresis normal","Nicturia"],"correct":0,"expl":"Oliguria: <500 ml/día. Anuria: <100 ml/día. Normal: ~1500 ml/día.","tema":"eliminacion","bloque":"BLOQUE D — CONSTANTES VITALES Y BALANCE HÍDRICO (19-24)"},{"sim":"C","tag":"TEST CUIDADOS","n":"25","q":"Para el sondaje vesical de una mujer, se la coloca en posición:","caso":"","opts":["Sims izquierda","Ginecológica (decúbito supino con piernas flexionadas y separadas)","Decúbito prono","Trendelenburg"],"correct":1,"expl":"Sondaje femenino: posición ginecológica. (El enema es en Sims izquierda — no confundir.)","tema":"movilizacion","bloque":"BLOQUE E — ELIMINACIÓN, SONDAJES, OSTOMÍAS Y ENEMAS (25-30)"},{"sim":"C","tag":"TEST CUIDADOS","n":"27","q":"La sonda vesical de tipo Foley se caracteriza por:","caso":"","opts":["Tener un balón que se infla para fijarla en la vejiga (sondaje permanente)","Ser rígida y de un solo uso inmediato","Usarse solo por vía nasogástrica","Carecer de luz interior"],"correct":0,"expl":"Foley: sonda con balón para fijación intravesical, típica del sondaje permanente.","tema":"eliminacion","bloque":"BLOQUE E — ELIMINACIÓN, SONDAJES, OSTOMÍAS Y ENEMAS (25-30)"},{"sim":"C","tag":"TEST CUIDADOS","n":"28","q":"DIFÍCIL — En la administración de un enema de limpieza, señale la INCORRECTA:","caso":"","opts":["La solución se administra templada (aprox. 37-40 °C)","El irrigador se sitúa unos 30-50 cm por encima del plano de la cama","Si aparece dolor intenso, se aumenta la velocidad para acabar antes","Se pide al paciente que retenga la solución unos minutos antes de evacuar"],"correct":2,"expl":"Ante dolor o espasmo se DETIENE o enlentece el flujo, nunca se acelera. El resto es correcto.","tema":"eliminacion","bloque":"BLOQUE E — ELIMINACIÓN, SONDAJES, OSTOMÍAS Y ENEMAS (25-30)"},{"sim":"C","tag":"TEST CUIDADOS","n":"29","q":"La incapacidad de orinar con la vejiga llena y globo vesical palpable se denomina:","caso":"","opts":["Anuria","Incontinencia por rebosamiento fisiológica","Polaquiuria","Retención urinaria"],"correct":3,"expl":"Retención urinaria: vejiga llena sin poder vaciarla (globo vesical). Anuria = no se produce orina.","tema":"eliminacion","bloque":"BLOQUE E — ELIMINACIÓN, SONDAJES, OSTOMÍAS Y ENEMAS (25-30)"},{"sim":"C","tag":"TEST CUIDADOS","n":"30","q":"En el cuidado de una colostomía, el TCAE:","caso":"","opts":["Cambia la dieta del paciente por iniciativa propia","Colabora en la higiene del estoma con agua y jabón neutro, seca sin frotar, observa la piel periestomal y comunica alteraciones","Aplica antisépticos con alcohol directamente sobre el estoma","Recorta la bolsa siempre 3 cm más ancha que el estoma"],"correct":1,"expl":"Higiene suave con agua y jabón, secar sin frotar, vigilar piel periestomal y comunicar. Sin alcohol ni antisépticos agresivos.","tema":"eliminacion","bloque":"BLOQUE E — ELIMINACIÓN, SONDAJES, OSTOMÍAS Y ENEMAS (25-30)"},{"sim":"C","tag":"TEST CUIDADOS","n":"31","q":"Para recoger orina de 24 horas, la primera micción del día de inicio:","caso":"","opts":["Se desecha, y a partir de ahí se recoge toda la orina hasta la primera del día siguiente incluida","Se guarda siempre, es la más concentrada","Se recoge en frasco aparte estéril","Se congela inmediatamente"],"correct":0,"expl":"Orina de 24 h: se desecha la primera micción del inicio y se recoge todo hasta la primera del día siguiente incluida.","tema":"muestras","bloque":"BLOQUE F — MUESTRAS BIOLÓGICAS Y RESIDUOS (31-36)"},{"sim":"C","tag":"TEST CUIDADOS","n":"32","q":"La muestra de esputo para estudio microbiológico se recoge preferentemente:","caso":"","opts":["Después de cenar","Tras enjuague con antiséptico potente","Por la mañana en ayunas, tras enjuagar la boca con agua, con expectoración profunda (no saliva)","En cualquier momento, mezclada con saliva"],"correct":2,"expl":"Esputo: por la mañana, boca enjuagada solo con agua, expectoración profunda. La saliva invalida la muestra.","tema":"muestras","bloque":"BLOQUE F — MUESTRAS BIOLÓGICAS Y RESIDUOS (31-36)"},{"sim":"C","tag":"TEST CUIDADOS","n":"33","q":"DIFÍCIL — Sobre el transporte y conservación de muestras, señale la CORRECTA:","caso":"","opts":["Todas las muestras se congelan por defecto","Las muestras se etiquetan correctamente, se acompañan del volante y se envían al laboratorio lo antes posible en los contenedores adecuados; el urocultivo que no pueda enviarse de inmediato se refrigera","El etiquetado es opcional si el celador conoce al paciente","Los hemocultivos se guardan en la nevera a 4 °C"],"correct":1,"expl":"Etiquetado + volante + envío rápido en contenedor adecuado; urocultivo demorado → nevera. Los hemocultivos NO se refrigeran.","tema":"muestras","bloque":"BLOQUE F — MUESTRAS BIOLÓGICAS Y RESIDUOS (31-36)"},{"sim":"C","tag":"TEST CUIDADOS","n":"34","q":"Una gasa manchada de sangre de la cura de un paciente sin patología infecciosa de riesgo pertenece, en general, al grupo de residuos:","caso":"","opts":["Grupo IV (citostáticos)","Grupo I (asimilable a urbano)","Residuo radiactivo","Grupo II (sanitario no específico)"],"correct":3,"expl":"Material de curas con restos biológicos sin riesgo especial = grupo II (sanitario no específico).","tema":"muestras","bloque":"BLOQUE F — MUESTRAS BIOLÓGICAS Y RESIDUOS (31-36)"},{"sim":"C","tag":"TEST CUIDADOS","n":"35","q":"Los residuos del grupo III (biosanitarios especiales) se recogen en:","caso":"","opts":["Contenedores rígidos o semirrígidos, herméticos, identificados con el pictograma de biorriesgo","Bolsas de basura convencionales bien cerradas","Cajas de cartón recicladas","Cualquier recipiente disponible en la unidad"],"correct":0,"expl":"Grupo III: contenedor rígido/semirrígido hermético con pictograma de biorriesgo.","tema":"muestras","bloque":"BLOQUE F — MUESTRAS BIOLÓGICAS Y RESIDUOS (31-36)"},{"sim":"C","tag":"TEST CUIDADOS","n":"36","q":"Antes de un hemocultivo, la preparación de la piel del paciente exige:","caso":"","opts":["Nada especial, basta agua","Frotar con una toalla seca","Antisepsia rigurosa de la zona de punción para evitar contaminar la muestra","Aplicar vaselina"],"correct":2,"expl":"La antisepsia rigurosa de la piel evita que la flora cutánea contamine el hemocultivo (falsos positivos).","tema":"muestras","bloque":"BLOQUE F — MUESTRAS BIOLÓGICAS Y RESIDUOS (31-36)"},{"sim":"C","tag":"TEST CUIDADOS","n":"37","q":"En un paciente con DISFAGIA a líquidos, es correcto:","caso":"","opts":["Darle agua muy fría a sorbos grandes","Usar pajitas para facilitar la ingesta","Alimentarlo tumbado por comodidad","Usar espesantes y texturas homogéneas, con el paciente incorporado y flexión cervical al tragar"],"correct":3,"expl":"Disfagia a líquidos: espesantes, texturas homogéneas, paciente incorporado, flexión cervical. Las pajitas y los líquidos finos aumentan el riesgo de aspiración.","tema":"alimentacion","bloque":"BLOQUE G — ALIMENTACIÓN Y NUTRICIÓN (37-42)"},{"sim":"C","tag":"TEST CUIDADOS","n":"38","q":"La nutrición PARENTERAL consiste en:","caso":"","opts":["Alimentar por sonda nasogástrica","Administrar los nutrientes directamente por vía venosa","Una dieta triturada por boca","Suplementos orales hiperproteicos"],"correct":1,"expl":"Parenteral = por vía venosa. Enteral = tubo digestivo (oral o sonda).","tema":"alimentacion","bloque":"BLOQUE G — ALIMENTACIÓN Y NUTRICIÓN (37-42)"},{"sim":"C","tag":"TEST CUIDADOS","n":"39","q":"DIFÍCIL — Antes de administrar una toma por SNG se aspira contenido gástrico. Si el residuo es abundante (según protocolo, p. ej. superior a ~150 ml):","caso":"","opts":["Se pospone la toma y se comunica a la enfermera","Se administra la toma completa más deprisa","Se retira la sonda inmediatamente","Se desecha el residuo y se da la toma doble"],
