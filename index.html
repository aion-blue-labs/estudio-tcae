cer, es adecuado:","caso":"","opts":["Retirarles rápidamente de la habitación","Ofrecer un espacio de intimidad para la despedida, respetar sus creencias y ritos y acompañar sin juzgar","Explicarles la causa médica de la muerte","Impedirles ver el cuerpo"],"correct":1,"expl":"Intimidad, respeto a creencias y ritos, escucha y acompañamiento. La información clínica sobre la causa corresponde al facultativo.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"X","tag":"BANCO EXTRA","n":"X128","q":"La aplicación local de CALOR está indicada, entre otros casos, en:","caso":"","opts":["Un esguince en las primeras horas","Contracturas musculares y dolores crónicos, favoreciendo la vasodilatación y la relajación","Una hemorragia activa","Un abdomen agudo"],"correct":1,"expl":"Calor: contracturas, dolor crónico, rigidez. Frío: traumatismo agudo, hemorragia, inflamación reciente. Calor contraindicado en abdomen agudo y hemorragias.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"X","tag":"BANCO EXTRA","n":"X129","q":"Los signos que permiten sospechar un posible maltrato en una persona mayor incluyen:","caso":"","opts":["Buen estado de higiene y nutrición","Lesiones en distintos estadios de evolución, desnutrición, mala higiene, miedo ante el cuidador o explicaciones incoherentes","Que acuda acompañado","Que tenga varias enfermedades crónicas"],"correct":1,"expl":"Lesiones de distinta antigüedad, negligencia en higiene y nutrición, retraso en buscar atención, actitud temerosa y relatos incoherentes son señales de alarma que hay que comunicar.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"X","tag":"BANCO EXTRA","n":"X130","q":"El duelo ANTICIPADO es aquel que:","caso":"","opts":["Aparece años después de la pérdida","Comienza antes del fallecimiento, cuando la familia y el paciente ya conocen el desenlace previsible","Solo lo sufren los profesionales","No existe"],"correct":1,"expl":"El duelo anticipado se inicia antes de la muerte, en la fase de enfermedad avanzada. El duelo patológico es el que se cronifica o incapacita.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"X","tag":"BANCO EXTRA","n":"X131","q":"El desgaste profesional o síndrome de burnout en el personal sanitario se manifiesta con:","caso":"","opts":["Mayor implicación y energía","Agotamiento emocional, despersonalización (trato frío) y baja realización personal","Mejor trato al paciente","Aumento del rendimiento"],"correct":1,"expl":"Las tres dimensiones clásicas de Maslach: agotamiento emocional, despersonalización y baja realización personal.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"X","tag":"BANCO EXTRA","n":"X132","q":"El derecho a la intimidad, que ampara la confidencialidad de los datos del paciente, se recoge en la Constitución en el artículo:","caso":"","opts":["14","18","43","51"],"correct":1,"expl":"Art. 18 CE: derecho al honor, a la intimidad personal y familiar y a la propia imagen (sí es derecho fundamental). El 43 es la protección de la salud (principio rector).","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"X","tag":"BANCO EXTRA","n":"X133","q":"El artículo 14 de la Constitución consagra:","caso":"","opts":["El derecho a la vida","La igualdad ante la ley y la no discriminación","La protección de la salud","La libertad sindical"],"correct":1,"expl":"Art. 14 CE: igualdad ante la ley sin discriminación por nacimiento, raza, sexo, religión, opinión o cualquier otra condición.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"X","tag":"BANCO EXTRA","n":"X134","q":"Según la Ley 41/2002, el acceso a la historia clínica con fines de investigación o docencia exige, como regla general:","caso":"","opts":["Acceso libre para cualquier profesional","Preservar los datos de identificación personal del paciente, separados de los clínico-asistenciales","Autorización del gerente únicamente","Publicación previa en el boletín"],"correct":1,"expl":"Para investigación, docencia o salud pública se accede a datos anonimizados/disociados, separando la identificación de la información clínica.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"X","tag":"BANCO EXTRA","n":"X135","q":"El paciente tiene derecho a obtener copia de su historia clínica. Este derecho puede limitarse:","caso":"","opts":["Siempre que lo decida el centro","Por las anotaciones subjetivas de los profesionales y por el derecho de terceras personas a la confidencialidad","Nunca, es absoluto","Solo si el paciente está ingresado"],"correct":1,"expl":"Ley 41/2002 art. 18: el derecho de acceso no ampara las anotaciones subjetivas de los profesionales ni perjudicar a terceros.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"X","tag":"BANCO EXTRA","n":"X136","q":"Según la Ley 41/2002, la información asistencial al paciente se proporciona:","caso":"","opts":["Siempre por escrito y con firma de dos testigos","Como regla general verbalmente, dejando constancia en la historia clínica, de forma comprensible y adecuada a sus necesidades","Solo a la familia","Únicamente el día del alta"],"correct":1,"expl":"La información es, por regla general, verbal, con constancia en la historia, verdadera, comprensible y adecuada a las necesidades del paciente.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"X","tag":"BANCO EXTRA","n":"X137","q":"El personal estatutario en situación de EXCEDENCIA por cuidado de hijos:","caso":"","opts":["Pierde todos sus derechos","Tiene derecho a la reserva de plaza durante el periodo legalmente establecido y a que ese tiempo compute a efectos de antigüedad","Debe reincorporarse en un mes","Deja de pertenecer al servicio de salud"],"correct":1,"expl":"La excedencia por cuidado de familiares/hijos conserva la reserva de plaza durante el periodo previsto y computa a efectos de antigüedad y carrera.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"X","tag":"BANCO EXTRA","n":"X138","q":"En el Estatuto Marco, las faltas GRAVES prescriben a los:","caso":"","opts":["6 meses","2 años","4 años","10 años"],"correct":1,"expl":"Prescripción: muy graves 4 años, graves 2 años, leves 6 meses. Es una de las preguntas más repetidas.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"X","tag":"BANCO EXTRA","n":"X139","q":"Los delegados de prevención, según la Ley 31/1995, son:","caso":"","opts":["Nombrados libremente por la dirección","Representantes de los trabajadores con funciones específicas en materia de prevención de riesgos laborales","Personal externo contratado","Miembros del comité de dirección"],"correct":1,"expl":"Los delegados de prevención se designan por y entre los representantes del personal; junto con la empresa forman el Comité de Seguridad y Salud.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"X","tag":"BANCO EXTRA","n":"X140","q":"Ante un riesgo grave e inminente en su puesto, el trabajador tiene derecho a:","caso":"","opts":["Seguir trabajando obligatoriamente","Interrumpir su actividad y abandonar el lugar de trabajo, sin poder ser sancionado por ello","Cobrar un plus de peligrosidad y continuar","Denunciar solo al año siguiente"],"correct":1,"expl":"LPRL art. 21: ante riesgo grave e inminente el trabajador puede interrumpir la actividad y abandonar el lugar, sin sanción.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"X","tag":"BANCO EXTRA","n":"X141","q":"La protección de la trabajadora embarazada frente a riesgos laborales implica:","caso":"","opts":["Su despido automático","La adaptación del puesto o el cambio a otro compatible y, si no es posible, la suspensión del contrato por riesgo durante el embarazo","Que asuma el riesgo","Que trabaje siempre en turno de noche"],"correct":1,"expl":"Primero adaptación de condiciones o tiempo de trabajo, después cambio de puesto y, si no es posible, suspensión con prestación por riesgo durante el embarazo o la lactancia.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"X","tag":"BANCO EXTRA","n":"X142","q":"El TCAE que traslada a un paciente y comenta su diagnóstico en el ascensor delante de terceros:","caso":"","opts":["Actúa correctamente si no dice el nombre","Vulnera el deber de confidencialidad, aunque no haya intención de perjudicar","Solo comete falta si le oye un familiar","No tiene ninguna responsabilidad"],"correct":1,"expl":"Comentar información clínica en espacios comunes (ascensores, pasillos, cafetería) es una vulneración habitual y evitable del secreto profesional.","tema":"legislacion","bloque":"Legislación y parte común"},{"sim":"X","tag":"BANCO EXTRA","n":"X143","q":"La categoría profesional de Técnico en Cuidados Auxiliares de Enfermería se encuadra, dentro del personal estatutario, como:","caso":"","opts":["Personal de gestión y servicios","Personal sanitario de formación profesional","Personal sanitario licenciado","Personal laboral temporal"],"correct":1,"expl":"El TCAE es personal estatutario SANITARIO de formación profesional (grado medio), diferenciado del personal de gestión y servicios.","tema":"legislacion","bloque":"Legislación y parte común"}];
const TEMAS = [{"id": "higiene", "label": "Higiene y unidad del paciente"}, {"id": "movilizacion", "label": "Movilización y posiciones"}, {"id": "upp", "label": "Úlceras por presión"}, {"id": "constantes", "label": "Constantes vitales y balance"}, {"id": "eliminacion", "label": "Eliminación, sondajes y ostomías"}, {"id": "alimentacion", "label": "Alimentación y nutrición"}, {"id": "medicacion", "label": "Medicación y oxigenoterapia"}, {"id": "infeccion", "label": "Asepsia, esterilización y aislamientos"}, {"id": "muestras", "label": "Muestras, residuos y seguridad"}, {"id": "urgencias", "label": "Urgencias, RCP y primeros auxilios"}, {"id": "geriatria", "label": "Geriatría, terminal y comunicación"}, {"id": "calidad", "label": "Calidad, organización y documentación"}, {"id": "legislacion", "label": "Legislación y parte común"}];
const VERSION = "20260904-2050";

/* ---------------- identidad estable de cada pregunta ---------------- */
function hid(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return 'q'+(h>>>0);}
DATA.forEach(q => q._id = hid(q.q));
const BY_ID = {}; DATA.forEach(q => BY_ID[q._id] = q);

/* ---------------- progreso persistente (v3, migra de v2) ---------------- */
const KEY = 'tcae_progress_v3', OLDKEY = 'tcae_progress_v2';
const DAY = 86400000;
const INTERVALS = [0, 1, 2, 4, 8, 16, 32];   // días por caja Leitner
const MASTER_BOX = 3;                        // caja a partir de la cual cuenta como dominada

function blankP(){ return {v:3,totalAns:0,totalCorr:0,streak:0,best:0,lastDay:null,q:{},hist:{}}; }
function loadP(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return Object.assign(blankP(), JSON.parse(raw));
  }catch(e){}
  // migración desde v2
  try{
    const old = JSON.parse(localStorage.getItem(OLDKEY) || 'null');
    if(old){
      const p = blankP();
      p.totalAns = old.totalAns||0; p.totalCorr = old.totalCorr||0;
      p.streak = old.streak||0; p.best = old.best||0; p.lastDay = old.lastDay||null;
      Object.keys(old.seen||{}).forEach(id => p.q[id] = {b:0,d:0,n:1,w:0,r:0,m:0});
      Object.keys(old.correct||{}).forEach(id => { p.q[id] = p.q[id]||{b:0,d:0,n:1,w:0,r:0,m:0};
        p.q[id].b = MASTER_BOX; p.q[id].r = 1; p.q[id].d = Date.now() + INTERVALS[MASTER_BOX]*DAY; });
      Object.keys(old.fails||{}).forEach(id => { p.q[id] = p.q[id]||{b:0,d:0,n:1,w:0,r:0,m:0};
        p.q[id].b = 0; p.q[id].w = 1; p.q[id].d = 0; });
      return p;
    }
  }catch(e){}
  return blankP();
}
let P = loadP();
function saveP(){ try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){} }
function rec(id){ if(!P.q[id]) P.q[id] = {b:0,d:0,n:0,w:0,r:0,m:0}; return P.q[id]; }
function today(){ return new Date().toISOString().slice(0,10); }
function touchDay(){
  const t = today(); if(P.lastDay === t) return;
  if(P.lastDay){ const d = Math.round((new Date(t) - new Date(P.lastDay))/DAY);
                 P.streak = d === 1 ? (P.streak||0)+1 : 1; }
  else P.streak = 1;
  P.lastDay = t; saveP();
}

const ids = () => Object.keys(P.q);
const masteredCount = () => ids().filter(id => BY_ID[id] && P.q[id].b >= MASTER_BOX).length;
const weakCount     = () => ids().filter(id => BY_ID[id] && P.q[id].w > 0 && P.q[id].b < MASTER_BOX).length;
const seenCount     = () => ids().filter(id => BY_ID[id]).length;
const markedIds     = () => ids().filter(id => BY_ID[id] && P.q[id].m);
const acc           = () => P.totalAns ? Math.round(P.totalCorr/P.totalAns*100) : 0;
function dueIds(){
  const now = Date.now();
  return DATA.filter(q => { const r = P.q[q._id]; return r && r.d <= now && r.b < INTERVALS.length-1; })
             .map(q => q._id);
}
function temaStats(){
  const s = {}; TEMAS.forEach(t => s[t.id] = {tot:0,mas:0,weak:0,seen:0});
  DATA.forEach(q => { const t = s[q.tema] || (s[q.tema] = {tot:0,mas:0,weak:0,seen:0});
    t.tot++; const r = P.q[q._id]; if(!r) return; t.seen++;
    if(r.b >= MASTER_BOX) t.mas++; else if(r.w > 0) t.weak++; });
  return s;
}

/* ---------------- tema claro / oscuro ---------------- */
function applyTheme(){
  let th = null; try{ th = localStorage.getItem('tcae_theme'); }catch(e){}
  if(th) document.documentElement.setAttribute('data-theme', th);
  else document.documentElement.removeAttribute('data-theme');
}
function toggleTheme(){
  let th = null; try{ th = localStorage.getItem('tcae_theme'); }catch(e){}
  const sysDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  const next = th ? (th === 'dark' ? 'light' : 'dark') : (sysDark ? 'light' : 'dark');
  try{ localStorage.setItem('tcae_theme', next); }catch(e){}
  applyTheme();
}
applyTheme();

/* ---------------- helpers de UI ---------------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ring(pct, label, color){
  const r = 46, c = 2*Math.PI*r, off = c*(1 - Math.max(0, Math.min(100, pct))/100);
  return '<div class="ring"><svg viewBox="0 0 110 110"><circle class="track" cx="55" cy="55" r="'+r+'"/>'+
    '<circle class="val" cx="55" cy="55" r="'+r+'" stroke-dasharray="'+c.toFixed(1)+
    '" stroke-dashoffset="'+off.toFixed(1)+'"'+(color?' style="stroke:'+color+'"':'')+'/></svg>'+
    '<div class="num"><b>'+pct+'%</b><span>'+label+'</span></div></div>';
}
function dateES(){
  const d = new Date();
  const dias = ['dom','lun','mar','mié','jue','vie','sáb'];
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return dias[d.getDay()]+' '+d.getDate()+' '+meses[d.getMonth()];
}
function shuffled(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));
  const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* ---------------- pantalla principal ---------------- */
function home(){
  touchDay();
  $('#hdrRight').textContent = dateES();
  $('#hdrSub').textContent = DATA.length + ' preguntas';
  const total = DATA.length, nm = masteredCount(), nw = weakCount(), ns = seenCount();
  const nu = Math.max(0, total - ns), nd = dueIds().length, nmk = markedIds().length;
  const pm = nm/total*100, pp = nw/total*100, pu = nu/total*100;
  const msg = P.totalAns === 0 ? 'Empieza con una ronda corta. Cada pregunta que falles vuelve sola hasta que la domines.'
            : acc() >= 80 ? 'Vas muy bien. Mantén el ritmo diario y ataca los temas flojos.'
            : acc() >= 60 ? 'Buen progreso. El repaso inteligente es donde más se aprende.'
            : 'Sin prisa. Cada fallo que repasas es un acierto en el examen.';

  const st = temaStats();
  const temaRows = TEMAS.map(t => {
    const d = st[t.id]; if(!d || !d.tot) return '';
    const pct = Math.round(d.mas/d.tot*100);
    const weak = d.seen >= 3 && pct < 50;
    return '<div class="tema'+(weak?' weak':'')+'" onclick="startTema(\''+t.id+'\')">'+
      '<div class="nm">'+esc(t.label)+'<i>'+d.tot+' preguntas · '+d.mas+' dominadas'+(d.weak?' · '+d.weak+' flojas':'')+'</i></div>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div><div class="pc">'+pct+'%</div></div>';
  }).join('');

  // racha de los últimos 14 días
  const dl = ['D','L','M','X','J','V','S']; let strip = '';
  for(let i=13;i>=0;i--){
    const dt = new Date(Date.now() - i*DAY), k = dt.toISOString().slice(0,10);
    strip += '<div class="day'+(P.hist[k]?' on':'')+(i===0?' today':'')+'">'+dl[dt.getDay()]+'</div>';
  }

  screenEl.innerHTML =
    '<div class="card"><h1>Hola, Cristina</h1><p class="sub">Tu preparación de hoy</p>'+
      '<div class="hero" style="margin-top:14px">'+ring(acc(),'aciertos')+
        '<div class="txt"><b>'+(P.totalAns ? P.totalCorr+' de '+P.totalAns+' respondidas' : 'Sin datos todavía')+
        '</b><p>'+msg+'</p></div></div>'+
      '<div class="streakrow" style="margin-top:14px">'+strip+'</div>'+
    '</div>'+

    '<div class="tiles">'+
      '<div class="tile amb"><b>'+(P.streak||0)+'</b><span>días seguidos</span></div>'+
      '<div class="tile teal"><b>'+nm+'</b><span>dominadas</span></div>'+
      '<div class="tile red"><b>'+nw+'</b><span>flojas</span></div>'+
    '</div>'+

    '<div class="card"><h2>Repaso inteligente</h2>'+
      '<p class="sub">Te trae justo lo que toca hoy: lo que fallaste y lo que estás a punto de olvidar. '+
      'Cada acierto la aleja en el tiempo; cada fallo la trae de vuelta.</p>'+
      '<button class="btn" '+(nd?'':'disabled')+' onclick="startSRS()">'+
        (nd ? 'Repasar ahora · '+nd+' pendientes' : 'Nada pendiente por hoy ✓')+'</button>'+
      (nw ? '<button class="btn amber sm" onclick="startWeak()">Solo mis fallos · '+nw+'</button>' : '')+
    '</div>'+

    '<div class="card"><h2>Nueva ronda</h2>'+
      '<p class="sub">Preguntas nuevas y sin dominar, con corrección al momento.</p>'+
      '<div class="chips" style="margin-top:10px">'+
        '<div class="chip" onclick="start(10)"><b>10</b><span>rápida</span></div>'+
        '<div class="chip" onclick="start(20)"><b>20</b><span>normal</span></div>'+
        '<div class="chip" onclick="start(40)"><b>40</b><span>larga</span></div>'+
        '<div class="chip" onclick="start(0)"><b>∞</b><span>todo</span></div>'+
      '</div>'+
    '</div>'+

    '<div class="card"><h2>Simulacro cronometrado</h2>'+
      '<p class="sub">Como el examen real: sin corrección hasta el final, 1 min por pregunta y '+
      'cada fallo resta ¼. Puedes dejar preguntas en blanco.</p>'+
      '<div class="chips" style="margin-top:10px;grid-template-columns:repeat(3,1fr)">'+
        '<div class="chip" onclick="startExam(20)"><b>20</b><span>20 min</span></div>'+
        '<div class="chip" onclick="startExam(40)"><b>40</b><span>40 min</span></div>'+
        '<div class="chip" onclick="startExam(60)"><b>60</b><span>60 min</span></div>'+
      '</div>'+
    '</div>'+

    '<div class="card"><h2>Temario</h2>'+
      '<div class="cov"><i class="m" style="width:'+pm+'%"></i><i class="p" style="width:'+pp+'%"></i>'+
        '<i class="u" style="width:'+pu+'%"></i></div>'+
      '<div class="leg"><span><i style="background:var(--teal)"></i>Dominadas '+nm+'</span>'+
        '<span><i style="background:var(--amber)"></i>Flojas '+nw+'</span>'+
        '<span><i style="background:var(--neutral)"></i>Sin ver '+nu+'</span></div>'+
      '<div class="temas" style="margin-top:12px">'+temaRows+'</div>'+
    '</div>'+

    '<div class="card"><h2>Más</h2>'+
      (nmk ? '<button class="btn ghost sm" onclick="startMarked()">⭐ Mis preguntas marcadas · '+nmk+'</button>' : '')+
      '<button class="btn ghost sm" onclick="exportP()">Guardar copia de mi progreso</button>'+
      '<button class="btn ghost sm" onclick="importP()">Restaurar una copia</button>'+
      (P.totalAns ? '<button class="btn ghost sm" onclick="resetP()">Reiniciar progreso</button>' : '')+
    '</div>';
  window.scrollTo(0,0);
}

function resetP(){ if(confirm('¿Borrar todo tu progreso y empezar de cero?')){ P = blankP(); saveP(); home(); } }
function exportP(){
  const txt = JSON.stringify(P);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(
      () => alert('Copia guardada en el portapapeles. Pégala en una nota o mándatela por WhatsApp: con eso puedes restaurar tu progreso en cualquier móvil.'),
      () => prompt('Copia este texto y guárdalo:', txt));
  } else prompt('Copia este texto y guárdalo:', txt);
}
function importP(){
  const txt = prompt('Pega aquí la copia de tu progreso:');
  if(!txt) return;
  try{ const o = JSON.parse(txt); if(!o || typeof o !== 'object' || !o.q) throw 0;
       P = Object.assign(blankP(), o); saveP(); home(); alert('Progreso restaurado.'); }
  catch(e){ alert('Ese texto no parece una copia válida.'); }
}

/* ---------------- construcción de la sesión ---------------- */
let deck = [], idx = 0, score = 0, streak = 0, best = 0, mode = 'normal';
let sessionLog = [], examEnd = 0, examTimer = null, temaActual = '';

function buildDeck(list){
  return list.map(q => {
    const opts = q.opts.map((t,i) => ({t:t, ok:i === q.correct}));
    for(let i=opts.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));
      const t=opts[i]; opts[i]=opts[j]; opts[j]=t; }
    return {_id:q._id, q:q.q, caso:q.caso, expl:q.expl, tag:q.tag, sim:q.sim, tema:q.tema,
            opts:opts, correct:opts.findIndex(o => o.ok), answered:null};
  });
}
function begin(){ idx=0; score=0; streak=0; best=0; sessionLog=[]; render(); }
function stopTimer(){ if(examTimer){ clearInterval(examTimer); examTimer = null; } }

function start(n){
  mode = 'normal'; stopTimer();
  const nuevas = DATA.filter(q => !P.q[q._id]);
  const flojas = DATA.filter(q => P.q[q._id] && P.q[q._id].b < MASTER_BOX);
  let pool = shuffled(nuevas).concat(shuffled(flojas));
  if(!pool.length) pool = shuffled(DATA);
  deck = buildDeck(n ? pool.slice(0, n) : shuffled(DATA));
  begin();
}
function startSRS(){
  mode = 'srs'; stopTimer();
  const due = shuffled(dueIds()).map(id => BY_ID[id]).filter(Boolean);
  if(!due.length) return home();
  deck = buildDeck(due.slice(0, 30)); begin();
}
function startWeak(){
  mode = 'fallos'; stopTimer();
  const w = DATA.filter(q => P.q[q._id] && P.q[q._id].w > 0 && P.q[q._id].b < MASTER_BOX);
  if(!w.length) return home();
  deck = buildDeck(shuffled(w).slice(0, 30)); begin();
}
function startMarked(){
  mode = 'marcadas'; stopTimer();
  const m = markedIds().map(id => BY_ID[id]).filter(Boolean);
  if(!m.length) return home();
  deck = buildDeck(shuffled(m)); begin();
}
function startTema(t){
  mode = 'tema'; temaActual = t; stopTimer();
  const pool = DATA.filter(q => q.tema === t);
  const sinDominar = pool.filter(q => !P.q[q._id] || P.q[q._id].b < MASTER_BOX);
  const use = sinDominar.length >= 5 ? sinDominar : pool;
  deck = buildDeck(shuffled(use).slice(0, 25)); begin();
}
function startExam(n){
  mode = 'examen'; stopTimer();
  deck = buildDeck(shuffled(DATA).slice(0, n));
  examEnd = Date.now() + n*60000;
  examTimer = setInterval(tick, 1000);
  begin();
}
function tick(){
  const el = document.getElementById('clock'); if(!el) return;
  const left = Math.max(0, examEnd - Date.now());
  const m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
  el.textContent = m+':'+String(s).padStart(2,'0');
  el.className = 'clock' + (left < 120000 ? ' warn' : '');
  if(left <= 0){ stopTimer(); results(); }
}

/* ---------------- pintar pregunta ---------------- */
const MODE_LABEL = {srs:'REPASO INTELIGENTE', fallos:'MIS FALLOS', marcadas:'MARCADAS', examen:'SIMULACRO'};
function render(){
  const q = deck[idx];
  $('#hdrRight').textContent = mode === 'examen' ? 'Simulacro' : 'Sesión';
  const mk = (P.q[q._id] && P.q[q._id].m) ? ' on' : '';
  const pillMode = MODE_LABEL[mode];
  let h = '<div class="qbar"><div class="track"><i style="width:'+(idx/deck.length*100)+'%"></i></div>'+
      '<div class="n">'+(idx+1)+'/'+deck.length+'</div>'+
      (mode === 'examen' ? '<div class="clock" id="clock">--:--</div>'
                         : (streak >= 2 ? '<div class="fire">🔥'+streak+'</div>' : ''))+'</div>'+
    '<div class="card">'+
      '<div class="pills">'+
        (pillMode ? '<span class="pill rev">'+pillMode+'</span>' : '')+
        '<span class="pill">'+esc(TEMA_LABEL[q.tema] || 'General')+'</span>'+
        '<span class="pill src">'+esc(q.tag)+'</span>'+
        '<button class="star'+mk+'" onclick="toggleMark()" title="Marcar para repasar">⭐</button>'+
      '</div>'+
      (q.caso ? '<p class="caso">'+esc(q.caso)+'</p>' : '')+
      '<p class="q">'+esc(q.q)+'</p><div id="opts">';
  q.opts.forEach((o,i) => {
    h += '<button class="opt" onclick="answer('+i+')"><span class="k">'+'ABCD'[i]+'</span><span>'+esc(o.t)+'</span></button>';
  });
  h += '</div><div class="feed" id="feed"></div>'+
       '<button class="btn" id="next" style="display:none" onclick="next()">Siguiente</button>'+
       (mode === 'examen' ? '<button class="btn ghost sm" onclick="answer(-1)">Dejar en blanco</button>' : '')+
     '</div>'+
     '<p class="hint kbd">Atajos: A · B · C · D para responder, Enter para seguir</p>'+
     '<button class="btn ghost sm" onclick="quit()">Salir de la sesión</button>';
  screenEl.innerHTML = h;
  if(mode === 'examen') tick();
  window.scrollTo(0,0);
}
function toggleMark(){
  const r = rec(deck[idx]._id); r.m = r.m ? 0 : 1; saveP();
  const el = document.querySelector('.star'); if(el) el.className = 'star' + (r.m ? ' on' : '');
}
function quit(){
  if(confirm('¿Salir de la sesión? Lo respondido hasta ahora ya está guardado.')){ stopTimer(); home(); }
}

/* ---------------- responder ---------------- */
function grade(q, i){
  const ok = i === q.correct, r = rec(q._id), now = Date.now();
  r.n = (r.n||0) + 1; r.t = now;
  if(i < 0){ r.d = now; }                                    // en blanco: vuelve pronto, no puntúa
  else if(ok){ r.r = (r.r||0)+1; r.b = Math.min((r.b||0)+1, INTERVALS.length-1);
               r.d = now + INTERVALS[r.b]*DAY; }
  else { r.w = (r.w||0)+1; r.b = 0; r.d = now; }
  if(i >= 0){
    P.totalAns++; if(ok) P.totalCorr++;
    const k = today(); P.hist[k] = (P.hist[k]||0) + 1;
  }
  saveP();
  sessionLog.push({q:q, given:i, ok:ok, blank:i < 0});
  return ok;
}
function answer(i){
  const q = deck[idx];
  if(q.answered !== null && q.answered !== undefined) return;
  q.answered = i;
  const btns = document.querySelectorAll('.opt');
  btns.forEach(b => b.disabled = true);
  const ok = grade(q, i);

  if(mode === 'examen'){
    if(i >= 0) btns[i].classList.add('sel');
    return next();                                            // sin feedback: como el examen real
  }
  btns[q.correct].classList.add('correct');
  if(!ok && i >= 0) btns[i].classList.add('wrong');
  const feed = $('#feed');
  if(ok){
    score++; streak++; best = Math.max(best, streak);
    const c = ['Correcto','Muy bien','Exacto','Perfecto','Esa la tienes'];
    feed.className = 'feed ok show';
    feed.innerHTML = '<span class="h ok">✓ '+c[Math.floor(Math.random()*c.length)]+
      (streak >= 3 ? ' · racha de '+streak : '')+'</span>'+esc(q.expl||'');
  } else {
    streak = 0;
    feed.className = 'feed no show';
    feed.innerHTML = '<span class="h no">✕ La correcta era la '+'ABCD'[q.correct]+'</span>'+
      esc(q.expl || 'Repásalo con calma; se aprende fallando.');
  }
  const nx = $('#next'); nx.style.display = 'flex';
  nx.textContent = idx+1 < deck.length ? 'Siguiente' : 'Ver resultado';
  nx.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function next(){ idx++; if(idx >= deck.length) return results(); render(); }

/* ---------------- teclado ---------------- */
document.addEventListener('keydown', e => {
  if(!deck.length) return;
  const q = deck[idx]; if(!q) return;
  const k = e.key.toLowerCase();
  const map = {a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3};
  if(k in map && (q.answered === null || q.answered === undefined)){ e.preventDefault(); answer(map[k]); }
  else if((k === 'enter' || k === ' ') && document.getElementById('next') &&
          $('#next').style.display !== 'none'){ e.preventDefault(); next(); }
});

/* ---------------- resultados ---------------- */
function results(){
  stopTimer();
  const answered = sessionLog.filter(l => !l.blank).length;
  const right = sessionLog.filter(l => l.ok).length;
  const wrong = answered - right;
  const pct = deck.length ? Math.round(right/deck.length*100) : 0;
  P.best = Math.max(P.best||0, pct); saveP();
  $('#hdrRight').textContent = 'Resultado';

  let title, note;
  if(pct >= 90){ title = 'Excelente'; note = 'Nivel de aprobado con mucho margen. Sigue así.'; }
  else if(pct >= 70){ title = 'Muy bien'; note = 'Vas por buen camino. Repasa los fallos y subes más.'; }
  else if(pct >= 50){ title = 'Aprobado'; note = 'Base sólida. El repaso inteligente te lleva más arriba.'; }
  else { title = 'A seguir'; note = 'Cada fallo repasado es un acierto ganado para el examen.'; }

  let neto = '';
  if(mode === 'examen'){
    const n = right - wrong/4;
    const sobre10 = deck.length ? Math.max(0, n/deck.length*10) : 0;
    neto = '<p class="sub" style="margin-top:6px"><b>Nota con penalización ¼:</b> '+
      n.toFixed(2)+' / '+deck.length+' · equivale a un <b>'+sobre10.toFixed(1)+'</b> sobre 10'+
      (sobre10 >= 5 ? ' ✓ aprobado' : '')+'</p>'+
      '<p class="sub">En blanco: '+(deck.length - answered)+'</p>';
  }

  // desglose por tema de esta sesión
  const byT = {};
  sessionLog.forEach(l => { const t = l.q.tema; byT[t] = byT[t] || {n:0,ok:0};
    byT[t].n++; if(l.ok) byT[t].ok++; });
  const rows = Object.keys(byT).sort((a,b) => byT[a].ok/byT[a].n - byT[b].ok/byT[b].n).map(t =>
    '<div class="row"><span class="lb">'+esc(TEMA_LABEL[t]||t)+'</span>'+
    '<span class="bar" style="width:60px;height:6px;border-radius:4px;background:var(--line);overflow:hidden">'+
    '<i style="display:block;height:100%;width:'+Math.round(byT[t].ok/byT[t].n*100)+'%;background:'+
    (byT[t].ok/byT[t].n >= .7 ? 'var(--teal)' : 'var(--amber)')+'"></i></span>'+
    '<span class="sc">'+byT[t].ok+'/'+byT[t].n+'</span></div>').join('');

  const fails = sessionLog.filter(l => !l.ok);
  const revlist = fails.length ? '<div class="revlist"><h3>Repasa estas '+fails.length+'</h3>'+
    fails.map(l => '<div class="rev-item"><p class="rq">'+esc(l.q.q)+'</p>'+
      '<p class="ra">Correcta: <b>'+esc(l.q.opts[l.q.correct].t)+'</b></p>'+
      (l.blank ? '<p class="ra">La dejaste en blanco.</p>'
               : (l.given >= 0 ? '<p class="ra">Marcaste: '+esc(l.q.opts[l.given].t)+'</p>' : ''))+
      (l.q.expl ? '<p class="re">'+esc(l.q.expl)+'</p>' : '')+'</div>').join('')+'</div>' : '';

  screenEl.innerHTML =
    '<div class="card res">'+ring(pct, 'esta sesión', pct >= 70 ? 'var(--teal)' : 'var(--amber)')+
      '<h1>'+title+'</h1>'+
      '<p class="sub">'+right+' de '+deck.length+' correctas'+(mode !== 'examen' ? ' · mejor racha '+best : '')+'</p>'+
      neto+
      '<p class="sub" style="margin-top:8px">'+note+'</p>'+
      (rows ? '<div class="tbreak">'+rows+'</div>' : '')+
      (fails.length ? '<button class="btn amber" onclick="repeatFails()">Repetir estas '+fails.length+' ahora</button>' : '')+
      '<button class="btn" onclick="home()">Volver al inicio</button>'+
      revlist+
    '</div>';
  window.scrollTo(0,0);
}
function repeatFails(){
  const qs = sessionLog.filter(l => !l.ok).map(l => BY_ID[l.q._id]).filter(Boolean);
  if(!qs.length) return home();
  mode = 'fallos'; stopTimer(); deck = buildDeck(shuffled(qs)); begin();
}

home();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      // avisa cuando hay una versión nueva esperando
      function offer(sw){
        if(document.querySelector('.banner')) return;
        var b = document.createElement('div');
        b.className = 'banner';
        b.innerHTML = '<span>Hay una versión nueva de la app.</span>';
        var btn = document.createElement('button');
        btn.textContent = 'Actualizar';
        btn.onclick = function(){ sw.postMessage('skipWaiting'); location.reload(); };
        b.appendChild(btn); document.body.appendChild(b);
      }
      if(reg.waiting) offer(reg.waiting);
      reg.addEventListener('updatefound', function(){
        var sw = reg.installing;
        if(!sw) return;
        sw.addEventListener('statechange', function(){
          if(sw.state === 'installed' && navigator.serviceWorker.controller) offer(sw);
        });
      });
      setInterval(function(){ reg.update(); }, 60*60*1000);
    }).catch(function(e){ console.warn('SW fail', e); });
  });
}
</script>
</body>
</html>
