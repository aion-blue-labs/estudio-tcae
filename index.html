 tamaño, sabor, precio y marca"],"correct":0,"expl":"Los 5 correctos: paciente, fármaco, dosis, vía y hora. (Ampliados: registro, caducidad...)","tema":"medicacion","bloque":"BLOQUE H — MEDICACIÓN Y OXIGENOTERAPIA (43-48)"},{"sim":"C","tag":"TEST CUIDADOS","n":"44","q":"Un comprimido SUBLINGUAL debe:","caso":"","opts":["Tragarse entero con agua","Masticarse bien","Colocarse bajo la lengua hasta su disolución completa, sin tragar ni beber","Disolverse en zumo de fruta"],"correct":2,"expl":"Sublingual: bajo la lengua hasta disolverse, sin tragar ni beber, para absorción directa.","tema":"medicacion","bloque":"BLOQUE H — MEDICACIÓN Y OXIGENOTERAPIA (43-48)"},{"sim":"C","tag":"TEST CUIDADOS","n":"45","q":"DIFÍCIL — Sobre la seguridad con las fuentes de oxígeno, señale la INCORRECTA:","caso":"","opts":["Prohibido fumar y evitar llamas o chispas cerca","No lubricar las conexiones con grasas o aceites","Las balas se mantienen fijadas/aseguradas en posición vertical","Puede aplicarse vaselina en los labios y fosas nasales del paciente con gafas de O2 para hidratarlos"],"correct":3,"expl":"La vaselina es un derivado graso: INCOMPATIBLE con oxígeno (riesgo de ignición). Se usan lubricantes acuosos. El resto son normas correctas.","tema":"medicacion","bloque":"BLOQUE H — MEDICACIÓN Y OXIGENOTERAPIA (43-48)"},{"sim":"C","tag":"TEST CUIDADOS","n":"46","q":"El humidificador del sistema de oxigenoterapia sirve para:","caso":"","opts":["Aumentar la presión de la bala","Evitar la sequedad de las mucosas respiratorias, burbujeando el O2 en agua (destilada/estéril)","Filtrar bacterias del aire ambiente","Medir la saturación del paciente"],"correct":1,"expl":"El humidificador burbujea el O2 en agua para no resecar las mucosas.","tema":"medicacion","bloque":"BLOQUE H — MEDICACIÓN Y OXIGENOTERAPIA (43-48)"},{"sim":"C","tag":"TEST CUIDADOS","n":"47","q":"Con gafas nasales, el flujo de oxígeno habitual se sitúa entre:","caso":"","opts":["1 y 4-5 litros por minuto","10 y 15 litros por minuto","Más de 20 litros por minuto","0,1 litros por minuto exactos"],"correct":0,"expl":"Gafas nasales: 1-4/5 L/min. Flujos mayores resecan y no elevan mucho más la FiO2.","tema":"medicacion","bloque":"BLOQUE H — MEDICACIÓN Y OXIGENOTERAPIA (43-48)"},{"sim":"C","tag":"TEST CUIDADOS","n":"48","q":"Respecto a la caducidad y conservación de los medicamentos en la unidad:","caso":"","opts":["Un fármaco caducado puede usarse hasta 6 meses después","Los termolábiles se guardan a temperatura ambiente junto a la ventana","Se revisan periódicamente las caducidades, se retiran los caducados y los termolábiles se conservan en nevera según ficha","La caducidad solo importa en los jarabes"],"correct":2,"expl":"Revisión periódica de caducidades y cadena de frío para termolábiles. Nada caducado se administra.","tema":"medicacion","bloque":"BLOQUE H — MEDICACIÓN Y OXIGENOTERAPIA (43-48)"},{"sim":"C","tag":"TEST CUIDADOS","n":"49","q":"La higiene de manos con solución hidroalcohólica requiere friccionar durante aproximadamente:","caso":"","opts":["2-3 segundos","20-30 segundos, hasta que la piel esté seca","5 minutos por cara de la mano","El tiempo es indiferente"],"correct":1,"expl":"Fricción con hidroalcohólica: 20-30 segundos hasta secado. (Lavado con agua y jabón: 40-60 s.)","tema":"infeccion","bloque":"BLOQUE I — INFECCIÓN, ESTERILIZACIÓN Y AISLAMIENTOS (49-54)"},{"sim":"C","tag":"TEST CUIDADOS","n":"50","q":"Sobre el uso de guantes, señale la CORRECTA:","caso":"","opts":["Con guantes no hace falta lavarse las manos nunca","Un mismo par sirve para varios pacientes si no se ven sucios","Los guantes estériles se usan para hacer las camas","Los guantes NO sustituyen la higiene de manos: se realiza antes de ponerlos y después de quitarlos"],"correct":3,"expl":"Los guantes complementan, no sustituyen: higiene antes y después, y cambio entre pacientes.","tema":"infeccion","bloque":"BLOQUE I — INFECCIÓN, ESTERILIZACIÓN Y AISLAMIENTOS (49-54)"},{"sim":"C","tag":"TEST CUIDADOS","n":"51","q":"DIFÍCIL — Antes de salir de una habitación de aislamiento de contacto, la retirada del EPI comienza por:","caso":"","opts":["Retirar los guantes (lo más contaminado), después la bata, higiene de manos, y la protección ocular/mascarilla según protocolo","Quitarse primero la mascarilla dentro de la habitación","Salir al pasillo con todo puesto y quitárselo en el control","Retirar la bata por encima de la cabeza con los guantes puestos y guardarla para el turno siguiente"],"correct":0,"expl":"Primero lo más contaminado: guantes → bata → higiene de manos (→ ocular/mascarilla según protocolo). Todo antes de salir.","tema":"infeccion","bloque":"BLOQUE I — INFECCIÓN, ESTERILIZACIÓN Y AISLAMIENTOS (49-54)"},{"sim":"C","tag":"TEST CUIDADOS","n":"52","q":"El material estéril empaquetado se considera NO utilizable cuando:","caso":"","opts":["Lleva menos de 24 horas almacenado","El control químico externo ha virado de color","El envase está húmedo, perforado, abierto o su fecha de caducidad vencida","Ha sido esterilizado en autoclave"],"correct":2,"expl":"Húmedo, roto, abierto o caducado = NO estéril. El viraje del control químico externo indica que PASÓ por el ciclo (eso es lo esperado).","tema":"infeccion","bloque":"BLOQUE I — INFECCIÓN, ESTERILIZACIÓN Y AISLAMIENTOS (49-54)"},{"sim":"C","tag":"TEST CUIDADOS","n":"53","q":"El aislamiento aéreo (tuberculosis pulmonar bacilífera) requiere idealmente:","caso":"","opts":["Solo bata y calzas","Habitación individual con presión negativa, puerta cerrada y mascarilla de alta eficacia (FFP2/FFP3) para el personal","Mascarilla quirúrgica simple para el personal y ventana abierta","Ninguna medida si el paciente toma antibióticos"],"correct":1,"expl":"Aéreo: habitación individual con presión negativa, puerta cerrada, FFP2/FFP3 para el personal; mascarilla quirúrgica al paciente si sale.","tema":"infeccion","bloque":"BLOQUE I — INFECCIÓN, ESTERILIZACIÓN Y AISLAMIENTOS (49-54)"},{"sim":"C","tag":"TEST CUIDADOS","n":"54","q":"La infección CRUZADA es la que se transmite:","caso":"","opts":["Del propio paciente a sí mismo (endógena)","Solo por el agua de la red","Exclusivamente por vía aérea exterior","De un paciente a otro, frecuentemente a través de las manos del personal o material contaminado"],"correct":3,"expl":"Cruzada: de paciente a paciente, típicamente por manos del personal o material — por eso la higiene de manos es LA medida estrella.","tema":"infeccion","bloque":"BLOQUE I — INFECCIÓN, ESTERILIZACIÓN Y AISLAMIENTOS (49-54)"},{"sim":"C","tag":"TEST CUIDADOS","n":"56","q":"Ante una quemadura química en la piel, la actuación inicial correcta es:","caso":"","opts":["Retirar la ropa impregnada y lavar con agua abundante durante un tiempo prolongado","Aplicar pomada grasa inmediatamente","Cubrir con hielo directo","Reventar las ampollas para que drenen"],"correct":0,"expl":"Química: retirar ropa impregnada y arrastre con agua abundante y prolongada. Nunca pomadas ni hielo directo de inicio.","tema":"urgencias","bloque":"BLOQUE J — URGENCIAS, TERMINAL, ANCIANO Y FRÍO/CALOR (55-60)"},{"sim":"C","tag":"TEST CUIDADOS","n":"57","q":"En el paciente TERMINAL, los cuidados van dirigidos principalmente a:","caso":"","opts":["Curar la enfermedad a toda costa","El confort y el alivio de síntomas (paliativos), el apoyo emocional y el acompañamiento del paciente y su familia","Restringir todas las visitas","Suspender la higiene para no molestar"],"correct":1,"expl":"Terminal = paliativo: confort, síntomas, apoyo emocional, familia. La higiene se mantiene (es confort).","tema":"geriatria","bloque":"BLOQUE J — URGENCIAS, TERMINAL, ANCIANO Y FRÍO/CALOR (55-60)"},{"sim":"C","tag":"TEST CUIDADOS","n":"58","q":"DIFÍCIL — Los cuidados post mortem se inician:","caso":"","opts":["En cuanto la familia lo pida, aunque no haya médico","A las 12 horas exactas del fallecimiento","Antes de avisar a nadie, para adelantar trabajo","Tras la certificación del fallecimiento por el médico, y antes de que se instaure la rigidez ","tema":"legislacion","bloque":"T6 — AUTONOMÍA DEL PACIENTE, LEY 41/2002 (31-36)"},{"sim":"L","tag":"TEST LEGISLACIÓN","n":"33","q":"Para otorgar el documento de instrucciones previas (voluntades anticipadas) se requiere ser:","caso":"","opts":["Mayor de 14 años con asistencia de los padres","Cualquier persona, sin requisitos","Mayor de 16 años o menor emancipado","Persona mayor de edad, capaz y libre"],"correct":3,"expl":"Instrucciones previas: MAYOR de edad, capaz y libre. Ojo: los 16 años valen para consentir tratamientos, NO para este documento (trampa frecuente).","tema":"legislacion","bloque":"T6 — AUTONOMÍA DEL PACIENTE, LEY 41/2002 (31-36)"},{"sim":"L","tag":"TEST LEGISLACIÓN","n":"34","q":"Las instrucciones previas:","caso":"","opts":["Son irrevocables una vez inscritas en el registro","Podrán revocarse libremente en cualquier momento, dejando constancia por escrito","Solo pueden modificarse ante el juez","Caducan a los 5 años"],"correct":1,"expl":"Revocables libremente en cualquier momento, dejando constancia por escrito.","tema":"legislacion","bloque":"T6 — AUTONOMÍA DEL PACIENTE, LEY 41/2002 (31-36)"},{"sim":"L","tag":"TEST LEGISLACIÓN","n":"35","q":"La documentación de la historia clínica se conservará, como mínimo:","caso":"","opts":["1 año desde la última consulta","3 años desde la apertura","5 años contados desde la fecha del alta de cada proceso asistencial","25 años en todo caso"],"correct":2,"expl":"Mínimo 5 años desde el alta de cada proceso asistencial (art. 17).","tema":"legislacion","bloque":"T6 — AUTONOMÍA DEL PACIENTE, LEY 41/2002 (31-36)"},{"sim":"L","tag":"TEST LEGISLACIÓN","n":"36","q":"DIFÍCIL — Sobre el derecho a la información, señale la CORRECTA:","caso":"","opts":["El paciente tiene derecho a que se respete su voluntad de NO ser informado, dejando constancia","La información es siempre obligatoria aunque el paciente la rechace","La información se da únicamente por escrito","El titular del derecho a la información es la familia, no e ente, hacer las camas, dar la comida a quien no pueda por sí mismo y la recogida de datos termométricos"],"correct":3,"expl":"Funciones clásicas del estatuto de 1973: aseo, camas, alimentación de quien no puede solo, recogida de datos termométricos, traslados, orden del material.","tema":"alimentacion","bloque":"T10 — FUNCIONES DEL TCAE (55-60)"},{"sim":"L","tag":"TEST LEGISLACIÓN","n":"57","q":"Al TCAE le está expresamente PROHIBIDO:","caso":"","opts":["Administrar medicación por vía parenteral, así como realizar punciones y aplicar tratamientos específicos","Acompañar al paciente en traslados internos","Colaborar en la administración de medicación por vía oral","Comunicar incidencias a enfermería"],"correct":0,"expl":"Prohibido expresamente: medicación por vía parenteral, punciones y tratamientos específicos de enfermería.","tema":"medicacion","bloque":"T10 — FUNCIONES DEL TCAE (55-60)"},{"sim":"L","tag":"TEST LEGISLACIÓN","n":"58","q":"DIFÍCIL — Una enfermera pide a la TCAE que administre una medicación subcutánea \"porque hay mucho trabajo\". La TCAE debe:","caso":"","opts":["Hacerlo, porque la orden viene de su superior funcional","Hacerlo solo si nadie la ve","Negarse con respeto: la vía parenteral excede sus competencias y la delegación no puede amparar funciones legalmente excluidas; comunicarlo si es preciso","Hacerlo y registrarlo con el nombre de la enfermera"],"correct":2,"expl":"La delegación no ampara funciones excluidas por norma. Negarse educadamente y comunicarlo protege al paciente y a la propia TCAE.","tema":"legislacion","bloque":"T10 — FUNCIONES DEL TCAE (55-60)"},{"sim":"L","tag":"TEST LEGISLACIÓN","n":"59","q":"En la administración de medicación, el TCAE SÍ puede, por protocolo y bajo supervisión:","caso":"","opts":["Ajustar dosis de insulina","Colaborar en la administración por vía oral, rectal y tópica","Administrar medicación intravenosa lenta","Cambiar la prescripción si el paciente lo pide"],"correct":1,"expl":"Sí puede colaborar en vía oral, rectal y tópica, por protocolo y bajo supervisión de enfermería.","tema":"medicacion","bloque":"T10 — FUNCIONES DEL TCAE (55-60)"},{"sim":"L","tag":"TEST LEGISLACIÓN","n":"60","q":"DIFÍCIL — Sobre los límites de actuación, señale la CORRECTA:","caso":"","opts":["Realizar tareas fuera de sus funciones puede generar responsabilidad disciplinaria e incluso civil o penal por intrusismo o imprudencia, aunque exista orden verbal de un superior","Si la orden es verbal, la responsabilidad es siempre solo del que la dio","La costumbre del servicio legaliza cualquier práctica","Los límites solo aplican en el turno de mañana"],"correct":0,"expl":"Actuar fuera de competencias genera responsabilidad propia (disciplinaria, civil o penal), aunque hubiera orden verbal: la orden no cubre lo ilegal.","tema":"legislacion","bloque":"T10 — FUNCIONES DEL TCAE (55-60)"},{"sim":"X","tag":"BANCO EXTRA","n":"X1","q":"Un indicador de ESTRUCTURA en el modelo de Donabedian sería:","caso":"","opts":["El porcentaje de pacientes satisfechos con el trato recibido","El número de camas y la dotación de personal por unidad","El tiempo medio de espera para una cura","La tasa de reingresos a los 30 días"],"correct":1,"expl":"Estructura = recursos disponibles (camas, personal, equipamiento). Proceso = lo que se hace. Resultado = lo que se consigue (satisfacción, reingresos, infecciones).","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"X","tag":"BANCO EXTRA","n":"X2","q":"La atención primaria se caracteriza, frente a la especializada, por ser:","caso":"","opts":["El nivel de mayor complejidad tecnológica","El primer nivel de acceso, accesible y de carácter integral y continuado","Un nivel exclusivamente hospitalario","Un servicio solo para urgencias"],"correct":1,"expl":"La atención primaria es la puerta de entrada al sistema: accesible, integral, continuada y comunitaria. La especializada aporta la complejidad tecnológica.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"X","tag":"BANCO EXTRA","n":"X3","q":"El principio bioético de AUTONOMÍA se concreta en la práctica sobre todo en:","caso":"","opts":["Repartir los recursos con equidad","No hacer daño al paciente","Respetar las decisiones informadas del paciente (consentimiento, rechazo de tratamiento)","Buscar siempre el mayor beneficio clínico"],"correct":2,"expl":"Autonomía = respetar la voluntad del paciente capaz. Justicia = equidad en el reparto. No maleficencia = no dañar. Beneficencia = buscar su bien.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"X","tag":"BANCO EXTRA","n":"X4","q":"El consentimiento informado, dentro de los principios bioéticos, es la expresión directa del principio de:","caso":"","opts":["Beneficencia","Autonomía","Justicia","No maleficencia"],"correct":1,"expl":"El consentimiento informado es la traducción jurídica del principio de autonomía del paciente.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"X","tag":"BANCO EXTRA","n":"X5","q":"El informe de alta hospitalaria debe entregarse:","caso":"","opts":["Solo si el paciente lo reclama por escrito","Al paciente o a su representante al finalizar el proceso asistencial","Únicamente al médico de cabecera","A los 30 días del alta por correo"],"correct":1,"expl":"El informe de alta se entrega al paciente (o a su representante) al terminar el proceso asistencial; forma parte de su documentación clínica.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"X","tag":"BANCO EXTRA","n":"X6","q":"En la comunicación terapéutica, la EMPATÍA consiste en:","caso":"","opts":["Sentir lo mismo que el paciente y emocionarse con él","Comprender lo que siente el paciente y transmitírselo, sin perder la perspectiva profesional","Dar consejos rápidos para resolver su problema","Evitar hablar de emociones para no implicarse"],"correct":1,"expl":"Empatía = comprender y devolver la comprensión, manteniendo la distancia terapéutica. Simpatía sería contagiarse del estado emocional.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"X","tag":"BANCO EXTRA","n":"X7","q":"Una barrera de la comunicación con el paciente hospitalizado es:","caso":"","opts":["Ponerse a su altura y mirarle a los ojos","Usar tecnicismos y jerga sanitaria que no entiende","Confirmar que ha comprendido la información","Elegir un momento sin interrupciones"],"correct":1,"expl":"El uso de tecnicismos es una barrera clásica. El resto son facilitadores de la comunicación.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"X","tag":"BANCO EXTRA","n":"X8","q":"El registro de las actuaciones del TCAE en la documentación de enfermería debe ser:","caso":"","opts":["Opcional si el turno ha sido tranquilo","Objetivo, legible, fechado, firmado y realizado lo antes posible tras la actuación","Escrito a lápiz para poder corregirlo","Redactado al final de la semana"],"correct":1,"expl":"Todo registro debe ser objetivo, legible, fechado y firmado, y hacerse cuanto antes. Nunca a lápiz ni con tachaduras que oculten lo escrito.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"X","tag":"BANCO EXTRA","n":"X9","q":"Si se comete un error en una anotación de la historia clínica en papel, lo correcto es:","caso":"","opts":["Tacharlo con corrector blanco","Arrancar la hoja y reescribirla","Trazar una línea que permita seguir leyendo lo anterior, anotar la corrección, fecha y firma","Borrarlo con goma"],"correct":2,"expl":"La historia clínica es un documento legal: los errores se corrigen con una línea que deje leer lo anterior, añadiendo corrección, fecha y firma. Nunca corrector, goma ni arrancar hojas.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"X","tag":"BANCO EXTRA","n":"X10","q":"El triaje en un servicio de urgencias sirve para:","caso":"","opts":["Atender por orden estricto de llegada","Clasificar a los pacientes por gravedad y prioridad de atención","Decidir quién paga la asistencia","Repartir a los pacientes entre las plantas"],"correct":1,"expl":"El triaje clasifica por gravedad/prioridad, no por orden de llegada: primero lo más urgente.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"X","tag":"BANCO EXTRA","n":"X11","q":"Un evento adverso relacionado con la asistencia sanitaria es:","caso":"","opts":["Cualquier queja del paciente sobre la comida","Un daño no intencionado causado por la asistencia y no por la enfermedad de base","Un retraso en una consulta programada","Una reclamación administrativa"],"correct":1,"expl":"Evento adverso = daño causado por la propia asistencia (caída, infección relacionada, error de medicación), no por la evolución de la enfermedad.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"X","tag":"BANCO EXTRA","n":"X12","q":"Ante un error propio detectado en el turno (por ejemplo, una toma de dieta al paciente equivocado), el TCAE debe:","caso":"","opts":["Callarlo si no ha pasado nada grave","Comunicarlo de inmediato a enfermería y registrar el incidente según protocolo","Comentarlo solo con los compañeros","Esperar a que alguien lo detecte"],"correct":1,"expl":"La cultura de seguridad exige notificar sin ocultar: comunicar a enfermería y registrar. Ocultar el error impide corregirlo y puede dañar al paciente.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"X","tag":"BANCO EXTRA","n":"X13","q":"La identificación inequívoca del paciente antes de cualquier procedimiento se hace:","caso":"","opts":["Preguntando por el número de habitación y cama","Con al menos dos identificadores (nombre completo y fecha de nacimiento o nº de historia) y comprobando la pulsera","Por el aspecto físico si se le conoce","Preguntando al compañero de habitación"],"correct":1,"expl":"Nunca se identifica por número de cama o habitación: se usan dos identificadores y la pulsera identificativa.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"X","tag":"BANCO EXTRA","n":"X14","q":"El trabajo en equipo interdisciplinar en la unidad implica que el TCAE:","caso":"","opts":["Actúe siempre por su cuenta para ganar tiempo","Comparta la información relevante del paciente con el equipo y participe en los relevos de turno","Solo hable con otros TCAE","Evite dar su opinión sobre el paciente"],"correct":1,"expl":"El TCAE es parte del equipo: aporta observaciones (piel, ingesta, movilidad, estado de ánimo) en los relevos y sesiones.","tema":"calidad","bloque":"Calidad, organización y documentación"},{"sim":"X","tag":"BANCO EXTRA","n":"X15","q":"El objetivo principal del aseo diario del paciente encamado, además de la limpieza, es:","caso":"","opts":["Ahorrar ropa de cama","Valorar el estado de la piel, activar la circulación y proporcionar bienestar","Cumplir con el horario del turno","Sustituir los cambios posturales"],"correct":1,"expl":"El aseo es un momento clave de valoración de la piel (detección precoz de UPP), estimula la circulación y da confort. No sustituye los cambios posturales.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"X","tag":"BANCO EXTRA","n":"X16","q":"Durante el aseo del paciente encamado, la habitación debe:","caso":"","opts":["Estar con la puerta abierta para ventilar","Estar a temperatura agradable, sin corrientes y preservando la intimidad con biombo o cortina","Tener la ventana abierta de par en par","Permanecer a oscuras"],"correct":1,"expl":"Temperatura confortable, sin corrientes de aire y con la intimidad protegida (puerta cerrada, biombo/cortina, cuerpo cubierto salvo la zona que se lava).","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"X","tag":"BANCO EXTRA","n":"X17","q":"El agua y la esponja/manopla durante el aseo completo se cambian:","caso":"","opts":["Solo si se acaba el jabón","Cuando se enfrían o se ensucian, y siempre antes de la zona genital","Nunca, para no perder tiempo","Una vez por semana"],"correct":1,"expl":"Se renueva el agua cuando se enfría o ensucia y se usa material distinto para la zona genital, respetando el orden de limpio a sucio.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"X","tag":"BANCO EXTRA","n":"X18","q":"En el corte de uñas de los pies de un paciente diabético, el TCAE debe:","caso":"","opts":["Cortarlas muy cortas y redondeadas","No manipularlas y comunicarlo a enfermería, por el riesgo del pie diabético","Usar cuchilla para las durezas","Cortarlas en seco sin lavar antes"],"correct":1,"expl":"En el pie diabético cualquier herida puede ser grave: las uñas las valora enfermería/podología. En general se cortan rectas, nunca en pico, tras el baño.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"X","tag":"BANCO EXTRA","n":"X19","q":"La higiene de los ojos en un paciente con conjuntivitis unilateral se realiza:","caso":"","opts":["Empezando por el ojo infectado","Empezando por el ojo sano y usando gasa distinta para cada ojo","Con la misma gasa para no gastar material","Solo con suero en el ojo enfermo"],"correct":1,"expl":"Se empieza siempre por el ojo sano y se usa una gasa distinta por ojo, para no trasladar la infección.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"X","tag":"BANCO EXTRA","n":"X20","q":"El rasurado de un paciente encamado con tratamiento anticoagulante debe hacerse preferentemente:","caso":"","opts":["Con cuchilla y a contrapelo","Con maquinilla eléctrica, por el riesgo de sangrado ante pequeños cortes","Sin espuma para ver mejor","Solo una vez al mes"],"correct":1,"expl":"En anticoagulados (y en pacientes con alteración de la coagulación) se prefiere la maquinilla eléctrica: un corte pequeño puede sangrar mucho.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"X","tag":"BANCO EXTRA","n":"X21","q":"La cama CERRADA es aquella que:","caso":"","opts":["Está preparada con la ropa superior cubriendo toda la cama, lista para un futuro ingreso","Tiene la ropa doblada en abanico lateral","Está ocupada por el paciente","Se usa solo en aislamiento"],"correct":0,"expl":"Cerrada = unidad libre lista para un ingreso. Abierta = paciente ingresado que puede levantarse. Ocupada = se hace con el paciente dentro. Quirúrgica = ropa en abanico para recibir de quirófano.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"X","tag":"BANCO EXTRA","n":"X22","q":"Al hacer una cama ocupada con el paciente que puede lateralizarse, lo correcto es:","caso":"","opts":["Sentarlo en el borde durante toda la maniobra","Enrollar la ropa sucia hacia el centro contra la espalda del paciente y desplegar la limpia por el lado libre","Retirar toda la ropa a la vez dejándolo destapado","Hacerla siempre en solitario"],"correct":1,"expl":"Se trabaja por mitades: se enrolla lo sucio hacia el centro, se coloca lo limpio en la mitad libre, se lateraliza al paciente al otro lado y se completa. Preferible entre dos personas.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"X","tag":"BANCO EXTRA","n":"X23","q":"El material de aseo (esponja, palangana, toalla) de un paciente:","caso":"","opts":["Puede compartirse entre pacientes de la misma habitación si se enjuaga","Es de uso individual y exclusivo de cada paciente","Se comparte si ambos están estables","Se guarda húmedo en el armario"],"correct":1,"expl":"El material de aseo es estrictamente individual (riesgo de infección cruzada) y debe guardarse limpio y seco.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"X","tag":"BANCO EXTRA","n":"X24","q":"En un paciente con sonda nasogástrica, el cuidado de las fosas nasales incluye:","caso":"","opts":["Dejar el esparadrapo siempre en el mismo punto de la nariz","Limpiar la zona, hidratar la mucosa y cambiar el punto de fijación para evitar úlceras por presión de la sonda","No tocar la nariz en ningún caso","Retirar la sonda cada día para limpiarla"],"correct":1,"expl":"La propia sonda puede producir UPP en el ala nasal: hay que limpiar, hidratar y variar el punto de fijación, vigilando la piel.","tema":"higiene","bloque":"Higiene y unidad del paciente"},{"sim":"X","tag":"BANCO EXTRA","n":"X25","q":"La posición de DECÚBITO SUPINO con las rodillas ligeramente flexionadas sobre una almohada sirve para:","caso":"","opts":["Facilitar la exploración rectal","Relajar la musculatura abdominal y lumbar","Realizar drenaje postural","Facilitar el parto"],"correct":1,"expl":"Flexionar ligeramente las rodillas en supino relaja la pared abdominal y la zona lumbar; se usa tras cirugía abdominal y en lumbalgias.","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"X","tag":"BANCO EXTRA","n":"X26","q":"La posición de DECÚBITO PRONO está contraindicada, con carácter general, en:","caso":"","opts":["Pacientes con úlceras sacras","Pacientes con problemas respiratorios o cardíacos importantes y en el postoperatorio abdominal","Pacientes jóvenes","Pacientes con dolor de espalda"],"correct":1,"expl":"El prono dificulta la expansión torácica: se evita en insuficiencia respiratoria/cardíaca y tras cirugía abdominal. Es útil, en cambio, para descargar el sacro.","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"X","tag":"BANCO EXTRA","n":"X27","q":"El uso de barandillas en la cama:","caso":"","opts":["Es una contención mecánica que exige siempre prescripción","Es una medida de seguridad que se aplica según protocolo y valoración del riesgo de caída","Está prohibido en geriatría","Sustituye a la vigilancia"],"correct":1,"expl":"Las barandillas son medida de seguridad según protocolo y valoración del riesgo; no sustituyen la vigilancia. La contención mecánica con sujeciones sí exige prescripción facultativa.","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"X","tag":"BANCO EXTRA","n":"X28","q":"Para incorporar a un paciente al borde de la cama (sedestación), el TCAE debe:","caso":"","opts":["Tirar de los brazos del paciente hacia arriba","Lateralizarlo, hacer palanca con las piernas fuera del colchón mientras eleva el tronco, y dejarlo sentado unos instantes antes de levantarlo","Levantarlo en bloque desde la espalda","Sentarlo de golpe y ponerlo de pie"],"correct":1,"expl":"Nunca se tira de los brazos (riesgo de luxación de hombro). Tras sentarlo, hay que esperar unos instantes por el riesgo de hipotensión ortostática (mareo).","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"X","tag":"BANCO EXTRA","n":"X29","q":"En un paciente con hemiplejia, el traslado de la cama a la silla se inicia:","caso":"","opts":["Por el lado afectado, que es el que hay que ejercitar","Por el lado sano, colocando la silla en ese lado y frenada","Por los pies de la cama","Indistintamente"],"correct":1,"expl":"La transferencia se hace hacia el lado sano (el que tiene fuerza), con la silla frenada y en ángulo. Al deambular, en cambio, el TCAE se sitúa del lado afectado.","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"X","tag":"BANCO EXTRA","n":"X30","q":"El objetivo de la posición ANTITRENDELENBURG (Morestin) es, entre otros:","caso":"","opts":["Aumentar el riego cerebral","Favorecer la ventilación y reducir el reflujo gastroesofágico","Facilitar el sondaje rectal","Aumentar el retorno venoso desde las piernas"],"correct":1,"expl":"Con la cabeza más alta que los pies mejora la mecánica respiratoria y disminuye el reflujo; se usa también tras cirugía de cabeza y cuello. El aumento del retorno venoso es del Trendelenburg.","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"X","tag":"BANCO EXTRA","n":"X31","q":"Al empujar una cama o una silla de ruedas por un pasillo, es correcto:","caso":"","opts":["Tirar de ella caminando hacia atrás","Empujarla, mirando en el sentido de la marcha y bajando rampas con el paciente de espaldas al descenso","Bloquear las ruedas para frenar con el pie","Ir siempre a la máxima velocidad"],"correct":1,"expl":"Se empuja mirando hacia delante; al bajar una rampa se hace marcha atrás (paciente de espaldas al descenso) para controlar la velocidad y evitar el vuelco.","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"X","tag":"BANCO EXTRA","n":"X32","q":"El objetivo de la fisioterapia respiratoria y los ejercicios de inspiración profunda en el encamado es:","caso":"","opts":["Fortalecer los brazos","Prevenir la acumulación de secreciones y las atelectasias","Reducir el edema de piernas","Mejorar la visión"],"correct":1,"expl":"Los ejercicios respiratorios previenen atelectasias y neumonía por estasis en el paciente inmovilizado.","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"X","tag":"BANCO EXTRA","n":"X33","q":"El uso del cinturón de marcha o cinturón ergonómico durante la deambulación asistida:","caso":"","opts":["Es una sujeción mecánica que requiere prescripción","Da un punto de agarre seguro al profesional y protege su espalda y al paciente","Sustituye al andador","Solo se usa en quirófano"],"correct":1,"expl":"El cinturón de marcha es una ayuda técnica de transferencia: mejora el agarre y protege la espalda del profesional. No es una contención.","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"X","tag":"BANCO EXTRA","n":"X34","q":"Un paciente que lleva varios días encamado se marea al ponerse de pie. Esto se debe habitualmente a:","caso":"","opts":["Hipoglucemia","Hipotensión ortostática por la inmovilidad","Fiebre","Exceso de líquidos"],"correct":1,"expl":"La inmovilidad prolongada favorece la hipotensión ortostática: hay que incorporar por fases (sentado en el borde unos minutos) antes de bipedestar.","tema":"movilizacion","bloque":"Movilización y posiciones"},{"sim":"X","tag":"BANCO EXTRA","n":"X35","q":"La escala de Norton valora el riesgo de UPP mediante cinco parámetros y se interpreta:","caso":"","opts":["A mayor puntuación, mayor riesgo","A menor puntuación, mayor riesgo","Solo con el estado mental","Únicamente en pacientes quirúrgicos"],"correct":1,"expl":"En Norton (5-20 puntos) y en Braden (6-23), a MENOR puntuación MAYOR riesgo. Es la trampa más repetida.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"X","tag":"BANCO EXTRA","n":"X36","q":"Una úlcera por presión cubierta por una escara necrótica negra que impide ver el lecho se clasifica como:","caso":"","opts":["Categoría I","Categoría II","No estadiable / inclasificable","Categoría III siempre"],"correct":2,"expl":"Si el esfacelo o la escara impiden ver la profundidad, la lesión es NO ESTADIABLE hasta que se retire el tejido desvitalizado.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"X","tag":"BANCO EXTRA","n":"X37","q":"El uso de flotadores o rodetes tipo rosquilla bajo el sacro:","caso":"","opts":["Es la mejor medida preventiva","Está desaconsejado: producen isquemia en anillo y edema en la zona de apoyo","Se recomienda en todos los encamados","Sustituye al colchón antiescaras"],"correct":1,"expl":"Los rodetes/flotadores están desaconsejados: concentran la presión en un anillo y provocan isquemia y edema. Se usan superficies especiales de manejo de presión.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"X","tag":"BANCO EXTRA","n":"X38","q":"La posición en decúbito lateral para prevenir UPP se recomienda a:","caso":"","opts":["90 grados, apoyando directamente sobre el trocánter","30 grados, evitando apoyar el peso sobre el trocánter","Totalmente de lado con las piernas juntas","Boca abajo"],"correct":1,"expl":"El lateral a 30° (con cuñas/almohadas) evita cargar el trocánter, que es una prominencia de alto riesgo.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"X","tag":"BANCO EXTRA","n":"X39","q":"La humedad por incontinencia sobre la piel produce:","caso":"","opts":["Solo mal olor","Maceración y lesiones cutáneas asociadas a la humedad, que aumentan el riesgo de UPP","Un efecto protector","Menos riesgo de infección"],"correct":1,"expl":"La humedad macera la piel y la hace más vulnerable a la fricción y la presión. Hay que higienizar, secar bien y usar productos barrera.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"X","tag":"BANCO EXTRA","n":"X40","q":"Los ácidos grasos hiperoxigenados (AGHO) se aplican:","caso":"","opts":["Dentro de la úlcera abierta, frotando","Sobre la piel íntegra de las zonas de riesgo, sin masajear, extendiéndolos suavemente","Solo en úlceras de categoría IV","Mezclados con povidona yodada"],"correct":1,"expl":"Los AGHO son preventivos: piel íntegra de riesgo, extendidos con suavidad y sin masaje sobre prominencias óseas.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"X","tag":"BANCO EXTRA","n":"X41","q":"La FRICCIÓN como factor de UPP se produce sobre todo:","caso":"","opts":["Al arrastrar al paciente sobre las sábanas en vez de levantarlo","Al aplicar crema hidratante","Al usar colchón de aire","Al cambiar de postura cada 2 horas"],"correct":0,"expl":"Arrastrar al paciente genera fricción y cizalla. Hay que levantar con entremetida o grúa, nunca arrastrar.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"X","tag":"BANCO EXTRA","n":"X42","q":"En un paciente sentado, la zona de máximo riesgo de UPP es:","caso":"","opts":["El occipucio","Los isquiones (tuberosidades isquiáticas) y el coxis","Las orejas","Los codos exclusivamente"],"correct":1,"expl":"Sentado, el peso recae sobre isquiones y coxis. Por eso hay que reposicionar cada hora (o cada 15 min si puede hacerlo solo).","tema":"upp","bloque":"Úlceras por presión"},{"sim":"X","tag":"BANCO EXTRA","n":"X43","q":"La nutrición en la prevención y curación de las UPP es:","caso":"","opts":["Irrelevante","Fundamental: un aporte adecuado de proteínas, líquidos, vitamina C y zinc favorece la integridad y la cicatrización","Solo importante si hay obesidad","Perjudicial en encamados"],"correct":1,"expl":"La desnutrición y la deshidratación son factores intrínsecos de primer orden: proteínas, líquidos, vitamina C y zinc son clave.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"X","tag":"BANCO EXTRA","n":"X44","q":"Al detectar una UPP nueva durante el aseo, el TCAE debe:","caso":"","opts":["Curarla él mismo con povidona","Aliviar la presión de la zona, no masajear, y comunicarlo y registrarlo para que enfermería la valore y estadifique","Taparla con esparadrapo","Esperar al día siguiente para ver si mejora"],"correct":1,"expl":"El TCAE detecta, alivia presión, no masajea y comunica/registra. La valoración, estadiaje y cura corresponden a enfermería.","tema":"upp","bloque":"Úlceras por presión"},{"sim":"X","tag":"BANCO EXTRA","n":"X45","q":"Antes de tomar la tensión arterial, el paciente debe:","caso":"","opts":["Haber fumado o tomado café justo antes para estar activo","Estar en reposo unos 5 minutos, sentado, con el brazo apoyado a la altura del corazón y sin hablar","Estar de pie y con el brazo colgando","Haber corrido por el pasillo"],"correct":1,"expl":"Reposo previo de unos 5 minutos, brazo apoyado a la altura del corazón, sin hablar, sin ropa que comprima, sin haber fumado ni tomado cafeína.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"X","tag":"BANCO EXTRA","n":"X46","q":"Usar un manguito demasiado ESTRECHO para el brazo del paciente provoca:","caso":"","opts":["Cifras falsamente bajas","Cifras falsamente altas","No influye","Solo afecta a la frecuencia cardíaca"],"correct":1,"expl":"Manguito estrecho o corto (p. ej. el estándar en un brazo obeso) sobreestima la tensión; uno excesivamente ancho la infravalora.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"X","tag":"BANCO EXTRA","n":"X47","q":"El pulso debe contarse durante un minuto completo cuando:","caso":"","opts":["Siempre, sin excepción","El pulso es irregular, muy rápido o muy lento, o en lactantes","Nunca, bastan 10 segundos","Solo por la mañana"],"correct":1,"expl":"Si el ritmo es irregular o extremo (y en lactantes/niños pequeños) se cuenta el minuto entero para que la cifra sea fiable.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"X","tag":"BANCO EXTRA","n":"X48","q":"Al contar la frecuencia respiratoria conviene:","caso":"","opts":["Avisar al paciente de que se le va a contar la respiración","Hacerlo sin que el paciente se dé cuenta, por ejemplo justo después de tomar el pulso","Pedirle que respire hondo","Contar solo las espiraciones durante 5 segundos"],"correct":1,"expl":"La respiración se modifica voluntariamente: se cuenta discretamente, aprovechando el final de la toma de pulso.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"X","tag":"BANCO EXTRA","n":"X49","q":"La lectura del pulsioxímetro puede ser POCO FIABLE si el paciente:","caso":"","opts":["Tiene el dedo caliente","Lleva esmalte de uñas oscuro, tiene mala perfusión periférica o está muy frío","Está sentado","Respira por la nariz"],"correct":1,"expl":"Esmalte oscuro, uñas postizas, hipoperfusión, frío, movimiento o luz ambiental intensa falsean la SatO2. La intoxicación por CO también da lecturas falsamente altas.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"X","tag":"BANCO EXTRA","n":"X50","q":"Se denomina HIPERPIREXIA a la temperatura corporal:","caso":"","opts":["Entre 37 y 38 °C","Entre 38 y 39 °C","Por encima de 41 °C","Por debajo de 35 °C"],"correct":2,"expl":"Febrícula 37-38 °C; fiebre >38 °C; fiebre alta 39-41 °C; hiperpirexia >41 °C; hipotermia <35 °C.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"X","tag":"BANCO EXTRA","n":"X51","q":"La temperatura TIMPÁNICA se caracteriza por:","caso":"","opts":["Ser la más baja de todas","Ser rápida y aproximarse a la temperatura central, pudiendo alterarse por cerumen o mala técnica","Requerir 10 minutos de espera","Estar contraindicada en niños"],"correct":1,"expl":"La timpánica es rápida y refleja bien la temperatura central, pero el cerumen o una técnica incorrecta la falsean. La axilar es la más baja y la rectal la más alta.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"X","tag":"BANCO EXTRA","n":"X52","q":"En un balance hídrico, el AGUA METABÓLICA (de oxidación) se contabiliza como:","caso":"","opts":["Una pérdida de unos 300 ml/día","Una entrada de unos 300 ml/día","No se contabiliza","Una pérdida de 1000 ml/día"],"correct":1,"expl":"El agua metabólica (~300 ml/día) es una ENTRADA. Las pérdidas insensibles (~700-1000 ml) son salidas.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"X","tag":"BANCO EXTRA","n":"X53","q":"Un balance hídrico POSITIVO mantenido en un paciente con insuficiencia cardíaca sugiere:","caso":"","opts":["Deshidratación","Retención de líquidos, con riesgo de edemas y sobrecarga","Buena evolución siempre","Un error de medición seguro"],"correct":1,"expl":"Balance positivo = entran más líquidos de los que salen: retención, edemas, aumento de peso. Es un dato a comunicar a enfermería.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"X","tag":"BANCO EXTRA","n":"X54","q":"El peso corporal diario en un paciente con insuficiencia cardíaca o renal se controla porque:","caso":"","opts":["Sirve para calcular la dieta","Un aumento brusco de peso en pocos días indica retención de líquidos","Es un requisito administrativo","Determina la talla"],"correct":1,"expl":"El peso diario es el mejor indicador precoz de retención hídrica: 1 kg de más ≈ 1 litro retenido.","tema":"constantes","bloque":"Constantes vitales y balance"},{"sim":"X","tag":"BANCO EXTRA","n":"X55","q":"Para obtener una muestra de orina de un paciente con sonda vesical permanente, se debe:","caso":"","opts":["Desconectar la sonda y recoger de su extremo","Extraer la muestra del punto de punción del tubo, previa desinfección, sin abrir el circuito","Vaciar la bolsa y recoger de ahí","Retirar la sonda y pedir micción espontánea"],"correct":1,"expl":"Nunca se abre el circuito cerrado ni se recoge de la bolsa (orina estancada): se punciona el punto específico del tubo tras desinfectarlo.","tema":"eliminacion","bloque":"Eliminación, sondajes y ostomías"},{"sim":"X","tag":"BANCO EXTRA","n":"X56","q":"Ante una sonda vesical que no drena en un paciente con globo vesical, el TCAE debe:","caso":"","opts":["Tirar de la sonda para desatascarla","Comprobar que no hay acodaduras ni la bolsa por encima de la vejiga y avisar de inmediato a enfermería","Irrigar la sonda por su cuenta","Cortar el tubo"],"correct":1,"expl":"El TCAE comprueba lo mecánico (acodaduras, posición de la bolsa, tubo pinzado) y avisa. La irrigación o el recambio son de enfermería.","tema":"eliminacion","bloque":"Eliminación, sondajes y ostomías"},{"sim":"X","tag":"BANCO EXTRA","n":"X57","q":"El sondaje vesical FEMENINO frente al masculino se caracteriza por:","caso":"","opts":["Requerir mucha más longitud de sonda","Una uretra mucho más corta, lo que aumenta el riesgo de infección urinaria","No necesitar lubricante","Hacerse en decúbito prono"],"correct":1,"expl":"La uretra femenina mide unos 3-4 cm frente a los ~20 cm de la masculina: por eso las mujeres tienen más infecciones urinarias.","tema":"eliminacion","bloque":"Eliminación, sondajes y ostomías"},{"sim":"X","tag":"BANCO EXTRA","n":"X58","q":"El agua para hinchar el balón de una sonda Foley debe ser:","caso":"","opts":["Agua del grifo","Agua estéril o suero fisiológico, en la cantidad indicada en la sonda","Aire a presión","Povidona yodada"],"correct":1,"expl":"Se usa agua estéril (o suero según protocolo) en el volumen que marca la propia sonda. El aire no mantiene el balón hinchado.","tema":"eliminacion","bloque":"Eliminación, sondajes y ostomías"},{"sim":"X","tag":"BANCO EXTRA","n":"X59","q":"Un enema de LIMPIEZA se diferencia de uno de RETENCIÓN en que:","caso":"","opts":["El de limpieza se retiene varias horas","El de limpieza se evacua a los pocos minutos y el de retención debe mantenerse más tiempo para hacer efecto","Son lo mismo","El de retención se administra por vía oral"],"correct":1,"expl":"Limpieza: evacuación en pocos minutos. Retención (oleoso, medicamentoso, alimenticio): se mantiene más tiempo para que actúe.","tema":"eliminacion","bloque":"Eliminación, sondajes y ostomías"},{"sim":"X","tag":"BANCO EXTRA","n":"X60","q":"Durante un enema, si el paciente refiere dolor cólico intenso, lo correcto es:","caso":"","opts":["Acelerar el paso del líquido","Detener o enlentecer el flujo, esperar unos instantes y reanudar despacio; si persiste, avisar","Retirar la sonda bruscamente","Aumentar la altura del irrigador"],"correct":1,"expl":"Ante dolor o espasmo se detiene o enlentece el flujo (bajando el irrigador). Nunca se acelera ni se sube la altura.","tema":"eliminacion","bloque":"Eliminación, sondajes y ostomías"},{"sim":"X","tag":"BANCO EXTRA","n":"X61","q":"El estoma de una colostomía sano presenta un aspecto:","caso":"","opts":["Pálido y seco","Rosado-rojizo, húmedo y brillante","Negruzco","Azulado"],"correct":1,"expl":"Estoma normal: rosado-rojizo, húmedo, brillante. Pálido, oscuro o negruzco indica compromiso vascular: hay que avisar de inmediato.","tema":"eliminacion","bloque":"Eliminación, sondajes y ostomías"},{"sim":"X","tag":"BANCO EXTRA","n":"X62","q":"El orificio de la bolsa de ostomía debe recortarse:","caso":"","opts":["Tres centímetros más ancho que el estoma","Ajustado al tamaño del estoma (1-3 mm de margen) para proteger la piel periestomal","Más pequeño que el estoma para que apriete","No hace falta recortarlo nunca"],"correct":1,"expl":"Un orificio demasiado grande deja piel expuesta al efluente (irritación); demasiado pequeño lesiona el estoma. Se deja 1-3 mm de margen.","tema":"eliminacion","bloque":"Eliminación, sondajes y ostomías"},{"sim":"X","tag":"BANCO EXTRA","n":"X63","q":"En un paciente con drenaje de Redón, el TCAE debe comunicar a enfermería:","caso":"","opts":["Solo si el frasco se llena del todo","Cambios bruscos en la cantidad o el aspecto del débito, pérdida del vacío o salida del punto de fijación","Nada, es un dispositivo autónomo","Únicamente al alta"],"correct":1,"expl":"Se vigila y registra el débito (cantidad y aspecto), la permeabilidad, el vacío y el punto de inserción, comunicando cualquier cambio.","tema":"eliminacion","bloque":"Eliminación, sondajes y ostomías"},{"sim":"X","tag":"BANCO EXTRA","n":"X64","q":"El estreñimiento en el paciente encamado se previene principalmente con:","caso":"","opts":["Dieta astringente y poca agua","Aporte de fibra y líquidos, movilización dentro de lo posible y respeto del hábito intestinal","Enemas diarios de rutina","Reposo absoluto"],"correct":1,"expl":"Fibra, hidratación, movilización e intimidad/horario regular. Los laxantes y enemas de rutina no son la primera medida.","tema":"eliminacion","bloque":"Eliminación, sondajes y ostomías"},{"sim":"X","tag":"BANCO EXTRA","n":"X65","q":"La dieta BASAL o normal de un hospital está indicada en:","caso":"","opts":["Pacientes que no requieren modificaciones dietéticas por su patología","Pacientes diabéticos","Pacientes con insuficiencia renal","Pacientes en preoperatorio inmediato"],"correct":0,"expl":"La basal es la dieta general equilibrada para quien no precisa modificaciones. Las terapéuticas (diabética, hiposódica, renal...) se pautan por patología.","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"X","tag":"BANCO EXTRA","n":"X66","q":"Una dieta HIPERPROTEICA está indicada especialmente en:","caso":"","opts":["Insuficiencia renal avanzada sin diálisis","Pacientes con úlceras por presión, grandes quemados o desnutrición","Hipertensión arterial","Hipercolesterolemia"],"correct":1,"expl":"Las proteínas son necesarias para cicatrizar (UPP, quemaduras) y para revertir la desnutrición. En la insuficiencia renal avanzada, en cambio, se restringen.","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"X","tag":"BANCO EXTRA","n":"X67","q":"En una dieta para paciente diabético, lo fundamental es:","caso":"","opts":["Eliminar totalmente los hidratos de carbono","Repartir los hidratos de carbono a lo largo del día, respetando horarios y cantidades pautadas","Suprimir las proteínas","Comer solo fruta"],"correct":1,"expl":"No se eliminan los hidratos: se controlan cantidad, tipo (preferencia por complejos y fibra) y reparto horario, sobre todo si hay insulina.","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"X","tag":"BANCO EXTRA","n":"X68","q":"La textura tipo NÉCTAR, MIEL y PUDIN se refiere a:","caso":"","opts":["Los grados de espesamiento de los líquidos en la disfagia","Los sabores de los suplementos","Tipos de sonda","Modalidades de nutrición parenteral"],"correct":0,"expl":"Son los tres niveles de viscosidad de los líquidos espesados en disfagia: néctar (menos espeso), miel y pudin (más espeso).","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"X","tag":"BANCO EXTRA","n":"X69","q":"Al dar de comer a un paciente con dificultad para tragar, el TCAE debe:","caso":"","opts":["Meter prisa para que no se enfríe la comida","Dar volúmenes pequeños, comprobar que ha tragado antes de la siguiente cucharada y evitar hablar durante la deglución","Darle agua entre cada bocado","Alimentarlo tumbado"],"correct":1,"expl":"Volúmenes pequeños, ritmo lento, comprobar la deglución antes de continuar, sin distracciones, incorporado y con flexión cervical.","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"X","tag":"BANCO EXTRA","n":"X70","q":"Tras la administración de una toma por sonda nasogástrica, la sonda se lava con:","caso":"","opts":["Zumo de fruta","Agua (unos 30-50 ml según protocolo) para evitar que se obstruya","Suero glucosado al 50 %","Nada, se pinza directamente"],"correct":1,"expl":"El lavado con agua tras cada toma y tras la medicación evita la obstrucción de la sonda por residuos.","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"X","tag":"BANCO EXTRA","n":"X71","q":"Los signos de intolerancia a la nutrición enteral que el TCAE debe comunicar son:","caso":"","opts":["Solo la fiebre","Náuseas, vómitos, distensión abdominal, diarrea y residuo gástrico elevado","Únicamente el estreñimiento","Ninguno, es imposible"],"correct":1,"expl":"Náuseas, vómitos, distensión, diarrea y residuo elevado indican mala tolerancia: hay que detener la toma y avisar.","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"X","tag":"BANCO EXTRA","n":"X72","q":"El paciente que recibe nutrición parenteral total puede presentar como complicación grave:","caso":"","opts":["Caries dental","Infección del catéter central (sepsis) y alteraciones metabólicas como la hiperglucemia","Estreñimiento exclusivamente","Alopecia"],"correct":1,"expl":"La sepsis por catéter y las alteraciones metabólicas (hiper/hipoglucemia) son las complicaciones más temidas de la NPT.","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"X","tag":"BANCO EXTRA","n":"X73","q":"Las bandejas de dieta se reparten comprobando:","caso":"","opts":["Solo el número de habitación","La identificación del paciente y que la dieta corresponde a la pauta, avisando si hay discrepancias","El gusto del paciente","La hora del turno"],"correct":1,"expl":"Se identifica al paciente (no solo por la cama) y se comprueba la dieta pautada; una bandeja equivocada puede ser peligrosa (alergias, diabetes, disfagia, ayuno).","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"X","tag":"BANCO EXTRA","n":"X74","q":"En un paciente con alergia alimentaria conocida, la actuación correcta es:","caso":"","opts":["Retirar solo el alimento del plato","Comprobar la dieta, no administrar nada no pautado y asegurar que la alergia está registrada y visible","Probar pequeñas cantidades","No es competencia del TCAE"],"correct":1,"expl":"Nunca se retira el alérgeno del plato: la bandeja debe ser la correcta. La alergia debe estar registrada, señalizada y en la pulsera.","tema":"alimentacion","bloque":"Alimentación y nutrición"},{"sim":"X","tag":"BANCO EXTRA","n":"X75","q":"El TCAE que colabora en la administración de medicación oral debe:","caso":"","opts":["Machacar todos los comprimidos para facilitar la toma","No machacar comprimidos con cubierta entérica ni de liberación retardada y consultar siempre a enfermería","Mezclar la medicación con la comida siempre","Dejar la medicación en la mesilla"],"correct":1,"expl":"Machacar una cubierta entérica o una forma retardada altera la absorción y puede ser peligroso. Nunca se deja la medicación sin supervisar la toma.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"X","tag":"BANCO EXTRA","n":"X76","q":"La vía RECTAL para administrar medicación está especialmente indicada cuando:","caso":"","opts":["El paciente tiene diarrea","Hay vómitos o imposibilidad de usar la vía oral","Se busca el efecto más rápido posible","Existe cirugía rectal reciente"],"correct":1,"expl":"Útil ante vómitos o intolerancia oral. Contraindicada en diarrea, cirugía o patología rectal y en inmunodeprimidos/neutropénicos.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"X","tag":"BANCO EXTRA","n":"X77","q":"La aplicación de un parche transdérmico exige:","caso":"","opts":["Ponerlo siempre en el mismo sitio","Rotar la zona de aplicación, sobre piel limpia, seca y sin vello, y retirar el anterior","Cortarlo por la mitad si la dosis parece alta","Colocarlo sobre piel irritada"],"correct":1,"expl":"Se rota la zona (evita irritación), se aplica sobre piel íntegra, limpia y seca, y se retira el parche previo. No se cortan los parches de matriz/reservorio.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"X","tag":"BANCO EXTRA","n":"X78","q":"Un colirio se instila:","caso":"","opts":["Directamente sobre la córnea, apoyando el envase en el ojo","En el saco conjuntival inferior, sin tocar el ojo con el envase","En el conducto lagrimal","Mezclado con agua"],"correct":1,"expl":"Se tira suavemente del párpado inferior y se instila en el saco conjuntival, sin contactar con el ojo o las pestañas (contaminaría el envase).","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"X","tag":"BANCO EXTRA","n":"X79","q":"El orden correcto cuando hay que administrar un colirio y una pomada oftálmica es:","caso":"","opts":["Primero la pomada y luego el colirio","Primero el colirio y, unos minutos después, la pomada","Ambos a la vez","Es indiferente"],"correct":1,"expl":"Primero lo líquido (colirio) y después lo graso (pomada); si son varios colirios, se espera unos minutos entre ellos.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"X","tag":"BANCO EXTRA","n":"X80","q":"El almacenamiento de los medicamentos TERMOLÁBILES exige:","caso":"","opts":["Congelador a -18 °C","Nevera entre +2 y +8 °C, con registro de temperatura","Temperatura ambiente junto al radiador","Un armario cerrado sin más"],"correct":1,"expl":"Termolábiles (insulinas, vacunas, algunos colirios): nevera de +2 a +8 °C con control y registro de temperatura, nunca congelados.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"X","tag":"BANCO EXTRA","n":"X81","q":"Un colirio o un jarabe una vez ABIERTOS:","caso":"","opts":["Mantienen la caducidad impresa en el envase","Tienen un periodo de validez tras la apertura mucho más corto, que debe anotarse en el envase","Duran indefinidamente si se refrigeran","Se pueden compartir entre pacientes"],"correct":1,"expl":"Tras la apertura la caducidad es la del periodo de validez en uso (habitualmente semanas para colirios): hay que anotar la fecha de apertura. Son de uso individual.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"X","tag":"BANCO EXTRA","n":"X82","q":"El oxígeno, desde el punto de vista legal y de seguridad, es:","caso":"","opts":["Un gas inerte sin riesgo","Un medicamento y un gas comburente que precisa prescripción y precauciones antiincendio","Un producto de limpieza","Un suplemento dietético"],"correct":1,"expl":"El oxígeno es un medicamento (se prescribe con dosis/flujo) y es comburente: prohibido fumar, evitar grasas y llamas, balas fijadas.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"X","tag":"BANCO EXTRA","n":"X83","q":"La mascarilla con RESERVORIO (alto flujo de O2) se emplea:","caso":"","opts":["Para aportar concentraciones muy bajas de oxígeno","Para aportar concentraciones muy altas de oxígeno en situaciones críticas, manteniendo la bolsa siempre parcialmente inflada","En pacientes que comen","Como sustituto de las gafas nasales en domicilio"],"correct":1,"expl":"El reservorio permite FiO2 muy altas; la bolsa nunca debe colapsarse (indica flujo insuficiente). Se usa en situaciones de gravedad.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"X","tag":"BANCO EXTRA","n":"X84","q":"Un paciente en oxigenoterapia refiere sequedad y molestia nasal. El TCAE debe:","caso":"","opts":["Aplicar vaselina en las fosas nasales","Comprobar el humidificador, ofrecer higiene oral y nasal con productos acuosos y comunicarlo a enfermería","Retirar el oxígeno","Subir el flujo"],"correct":1,"expl":"Con oxígeno están prohibidos los productos grasos (vaselina): se usan lubricantes acuosos y humidificación, y se comunica.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"X","tag":"BANCO EXTRA","n":"X85","q":"Los medicamentos ESTUPEFACIENTES en la unidad exigen:","caso":"","opts":["El mismo manejo que el resto","Almacenamiento bajo llave y un registro específico de cada dosis administrada","Guardarse en la nevera","Dejarlos en el carro abierto"],"correct":1,"expl":"Los estupefacientes se guardan bajo llave con control y registro nominal de cada dosis; su manejo está estrictamente regulado.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"X","tag":"BANCO EXTRA","n":"X86","q":"Antes de colaborar en la administración de cualquier medicación, hay que comprobar:","caso":"","opts":["Solo el nombre del fármaco","Los cinco correctos y, además, las alergias registradas del paciente y la caducidad","Únicamente la hora","Que el envase sea bonito"],"correct":1,"expl":"Cinco correctos (paciente, fármaco, dosis, vía, hora) + alergias + caducidad + registro posterior. La alergia mal comprobada es causa de eventos graves.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"X","tag":"BANCO EXTRA","n":"X87","q":"Si un paciente rechaza tomar su medicación, el TCAE debe:","caso":"","opts":["Disimularla en la comida sin decírselo","Respetar su decisión, no forzarle y comunicarlo a enfermería para que se registre y valore","Insistir hasta que la tome","Anotar que la ha tomado"],"correct":1,"expl":"Ocultar medicación en la comida sin conocimiento del paciente vulnera su autonomía. Se respeta, se comunica y se registra.","tema":"medicacion","bloque":"Medicación y oxigenoterapia"},{"sim":"X","tag":"BANCO EXTRA","n":"X88","q":"La DESINFECCIÓN de alto nivel se diferencia de la esterilización en que:","caso":"","opts":["Elimina también todas las esporas","Destruye todos los microorganismos salvo, en ocasiones, un número elevado de esporas","No elimina virus","Solo se aplica a suelos"],"correct":1,"expl":"La desinfección de alto nivel (p. ej. glutaraldehído) elimina casi todo, pero no garantiza la destrucción de todas las esporas: eso solo lo hace la esterilización.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"X","tag":"BANCO EXTRA","n":"X89","q":"El orden correcto del tratamiento del material reutilizable tras su uso es:","caso":"","opts":["Esterilización, limpieza y secado","Limpieza, secado, empaquetado y esterilización","Empaquetado y esterilización directamente","Desinfección y uso inmediato"],"correct":1,"expl":"Sin limpieza previa no hay esterilización eficaz: la materia orgánica protege a los microorganismos. Limpiar → aclarar → secar → empaquetar → esterilizar.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"X","tag":"BANCO EXTRA","n":"X90","q":"El material clasificado como CRÍTICO (que atraviesa piel o mucosas o accede a tejido estéril) requiere:","caso":"","opts":["Solo limpieza con detergente","Esterilización","Desinfección de bajo nivel","Nada especial"],"correct":1,"expl":"Clasificación de Spaulding: crítico → esterilización; semicrítico (contacta mucosas) → desinfección de alto nivel; no crítico (piel íntegra) → nivel bajo/intermedio.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"X","tag":"BANCO EXTRA","n":"X91","q":"El antiséptico de elección para la piel íntegra antes de una punción, por su acción rápida, es:","caso":"","opts":["Agua oxigenada","Alcohol de 70° o clorhexidina alcohólica","Lejía diluida","Suero fisiológico"],"correct":1,"expl":"Alcohol 70° o clorhexidina alcohólica: acción rápida sobre piel íntegra. El agua oxigenada es poco antiséptica y daña el tejido de granulación.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"X","tag":"BANCO EXTRA","n":"X92","q":"En la técnica estéril, el campo se considera contaminado si:","caso":"","opts":["Está a la altura de la cintura del profesional","Queda por debajo de la cintura, fuera del campo visual, o se moja","El profesional lleva guantes estériles","Está sobre una mesa"],"correct":1,"expl":"Todo lo que queda por debajo de la cintura o fuera del campo visual se considera no estéril, igual que un campo húmedo (la humedad transporta gérmenes).","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"X","tag":"BANCO EXTRA","n":"X93","q":"El lavado de manos QUIRÚRGICO se diferencia del higiénico en que:","caso":"","opts":["Es más corto","Incluye antebrazos hasta el codo, usa antiséptico, dura más y se seca con paño estéril manteniendo las manos por encima de los codos","No usa jabón","Se hace con agua fría solamente"],"correct":1,"expl":"Quirúrgico: antiséptico, manos y antebrazos, mayor duración, cepillado de uñas, secado con paño estéril y manos siempre por encima del codo.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"X","tag":"BANCO EXTRA","n":"X94","q":"En el aislamiento POR GOTAS (gripe, meningococo), la habitación:","caso":"","opts":["Debe tener presión negativa obligatoriamente","Debe ser individual o con separación de al menos 1-2 metros, con mascarilla quirúrgica para el personal","No requiere ninguna medida","Debe estar a oscuras"],"correct":1,"expl":"Gotas: individual o separación de 1-2 m, mascarilla quirúrgica. La presión negativa y las FFP2/FFP3 son del aislamiento aéreo.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"X","tag":"BANCO EXTRA","n":"X95","q":"Al colocarse el EPI para entrar en una habitación de aislamiento, el orden habitual es:","caso":"","opts":["Guantes, bata, mascarilla, gafas","Higiene de manos, bata, mascarilla, protección ocular y por último los guantes","Mascarilla, guantes, bata","Es indiferente"],"correct":1,"expl":"Colocación: higiene de manos → bata → mascarilla → protección ocular → guantes (los últimos, cubriendo el puño de la bata). La retirada es a la inversa, guantes primero.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"X","tag":"BANCO EXTRA","n":"X96","q":"La vajilla de un paciente en aislamiento de contacto:","caso":"","opts":["Debe ser desechable siempre y obligatoriamente","Puede lavarse en el lavavajillas del centro con el proceso habitual, ya que el agua caliente y el detergente son suficientes","Se tira a la basura general con restos","Se lava a mano en la habitación"],"correct":1,"expl":"El lavado mecánico habitual es suficiente; no se precisa vajilla desechable de rutina en la mayoría de aislamientos.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"X","tag":"BANCO EXTRA","n":"X97","q":"Una infección ENDÓGENA es aquella producida por:","caso":"","opts":["Microorganismos del propio paciente que pasan a otra localización","Un paciente vecino","El instrumental quirúrgico","El aire acondicionado"],"correct":0,"expl":"Endógena: flora del propio paciente (p. ej. E. coli intestinal que causa infección urinaria). Exógena/cruzada: del entorno u otros pacientes.","tema":"infeccion","bloque":"Asepsia, esterilización y aislamientos"},{"sim":"X","tag":"BANCO EXTRA","n":"X98","q":"Toda muestra biológica debe llegar al laboratorio acompañada de:","caso":"","opts":["Nada, basta el envase","La petición/volante correspondiente y la identificación completa del paciente","Solo el número de cama","La historia clínica completa"],"correct":1,"expl":"Identificación inequívoca + volante de petición. Una muestra mal identificada se rechaza (o, peor, se atribuye a otro paciente).","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"X","tag":"BANCO EXTRA","n":"X99","q":"El envase para recoger una muestra de heces para coprocultivo debe:","caso":"","opts":["Llenarse hasta el borde","Ser un recipiente limpio y de boca ancha, con una pequeña porción representativa, evitando mezclar con orina","Contener alcohol","Ser una bolsa de plástico común"],"correct":1,"expl":"Recipiente adecuado de boca ancha, cantidad pequeña (nuez), tomando zonas con moco o sangre si las hay, y sin mezclar con orina ni agua del inodoro.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"X","tag":"BANCO EXTRA","n":"X100","q":"Una muestra de orina para sedimento que no puede procesarse de inmediato debe:","caso":"","opts":["Dejarse a temperatura ambiente hasta el día siguiente","Refrigerarse (2-8 °C) y procesarse lo antes posible","Congelarse","Añadírsele lejía"],"correct":1,"expl":"A temperatura ambiente proliferan las bacterias y se alteran los elementos formes: se refrigera y se envía cuanto antes.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"X","tag":"BANCO EXTRA","n":"X101","q":"Los tubos de extracción de sangre con anticoagulante deben:","caso":"","opts":["Agitarse enérgicamente","Invertirse suavemente varias veces para mezclar sin producir hemólisis","No moverse en absoluto","Calentarse antes"],"correct":1,"expl":"La agitación enérgica hemoliza la muestra y la invalida; la falta de mezcla la coagula. Se invierte suavemente el número de veces indicado.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"X","tag":"BANCO EXTRA","n":"X102","q":"El transporte de muestras entre unidades y laboratorio se hace:","caso":"","opts":["En la mano y sin protección","En contenedores rígidos, cerrados y señalizados para riesgo biológico","En los bolsillos del uniforme","Junto a la comida"],"correct":1,"expl":"Contenedor rígido, estanco, cerrado y señalizado; nunca en la mano, en bolsillos, ni junto a alimentos.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"X","tag":"BANCO EXTRA","n":"X103","q":"El contenedor de objetos punzantes debe cerrarse definitivamente cuando:","caso":"","opts":["Esté totalmente lleno hasta el borde","Alcance aproximadamente sus tres cuartas partes o la línea de llenado indicada","Pase un mes desde su apertura","Lo diga el paciente"],"correct":1,"expl":"Se cierra al llegar a ~3/4 o a la marca de llenado; nunca se rellena a presión ni se introducen las manos.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"X","tag":"BANCO EXTRA","n":"X104","q":"Los residuos del GRUPO I (asimilables a urbanos) incluyen:","caso":"","opts":["Agujas usadas","Papel, cartón, restos de cocina y material de oficina","Gasas empapadas en sangre","Restos de citostáticos"],"correct":1,"expl":"Grupo I: residuos generales sin riesgo (papel, cartón, cocina). Grupo II: sanitarios no específicos. Grupo III: biosanitarios especiales. Grupo IV: citotóxicos y de regulación específica.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"X","tag":"BANCO EXTRA","n":"X105","q":"Al manipular medicación citostática, la protección incluye:","caso":"","opts":["Guantes de limpieza domésticos","Guantes específicos, bata impermeable, protección respiratoria y ocular según protocolo, y preparación en cabina de seguridad","Solo mascarilla quirúrgica","Ninguna medida especial"],"correct":1,"expl":"Los citostáticos exigen EPI específico y preparación en cabina de seguridad biológica; sus residuos y excretas siguen circuito propio.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"X","tag":"BANCO EXTRA","n":"X106","q":"Tras una exposición accidental de mucosa ocular a sangre de un paciente, se debe:","caso":"","opts":["Frotarse los ojos con una gasa","Lavar con abundante agua o suero fisiológico durante varios minutos y declarar el accidente","Aplicar alcohol","Esperar a ver si aparecen síntomas"],"correct":1,"expl":"Lavado abundante con agua o suero (sin frotar, sin antisépticos en la mucosa ocular) y declaración inmediata del accidente biológico.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"X","tag":"BANCO EXTRA","n":"X107","q":"El registro diario de temperaturas del frigorífico de medicación/vacunas sirve para:","caso":"","opts":["Cumplir un trámite sin utilidad","Detectar roturas de la cadena de frío y poder decidir si el producto sigue siendo válido","Controlar el consumo eléctrico","Saber cuándo descongelarlo"],"correct":1,"expl":"El registro de máxima y mínima permite detectar una rotura de cadena de frío: entonces se inmovilizan los productos y se notifica antes de usarlos.","tema":"muestras","bloque":"Muestras, residuos y seguridad"},{"sim":"X","tag":"BANCO EXTRA","n":"X108","q":"La secuencia de actuación ante una emergencia en la vía pública o en el centro se resume en:","caso":"","opts":["Actuar, avisar, proteger","Proteger, avisar y socorrer (PAS)","Socorrer siempre primero","Esperar instrucciones"],"correct":1,"expl":"PAS: Proteger (la escena y a uno mismo), Avisar (activar la ayuda) y Socorrer. Sin seguridad de la escena no se actúa.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"X","tag":"BANCO EXTRA","n":"X109","q":"En la RCP básica del adulto, la maniobra frente-mentón sirve para:","caso":"","opts":["Comprobar el pulso","Abrir la vía aérea desplazando la lengua","Iniciar las compresiones","Valorar el nivel de conciencia"],"correct":1,"expl":"La hiperextensión de la cabeza con elevación del mentón abre la vía aérea. Si hay sospecha de lesión cervical se usa la tracción mandibular.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"X","tag":"BANCO EXTRA","n":"X110","q":"El punto de compresión torácica en el adulto se localiza en:","caso":"","opts":["El apéndice xifoides","El centro del tórax, en la mitad inferior del esternón","El lado izquierdo del tórax","Justo bajo la clavícula"],"correct":1,"expl":"Centro del tórax, mitad inferior del esternón. Comprimir sobre el xifoides puede lesionar hígado y estómago.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"X","tag":"BANCO EXTRA","n":"X111","q":"El desfibrilador externo automático (DEA) debe usarse:","caso":"","opts":["Solo por personal médico","En cuanto esté disponible, siguiendo sus instrucciones de voz, sin interrumpir apenas las compresiones","Después de 30 minutos de RCP","Únicamente en el hospital"],"correct":1,"expl":"El DEA está diseñado para uso por cualquier persona formada: cuanto antes se aplique, mayor supervivencia. El aparato analiza y decide si procede la descarga.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"X","tag":"BANCO EXTRA","n":"X112","q":"Ante una obstrucción PARCIAL de la vía aérea en un adulto consciente que tose con fuerza, lo correcto es:","caso":"","opts":["Dar golpes interescapulares inmediatamente","Animarle a seguir tosiendo y vigilarle de cerca","Realizar la maniobra de Heimlich","Darle agua"],"correct":1,"expl":"Si la tos es eficaz, la mejor maniobra es la propia tos. Solo si la obstrucción se hace completa (no tose, no habla) se pasa a golpes y compresiones.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"X","tag":"BANCO EXTRA","n":"X113","q":"Ante una quemadura de segundo grado con ampollas, NO se debe:","caso":"","opts":["Enfriar con agua templada","Reventar las ampollas ni aplicar pomadas, pasta de dientes o remedios caseros","Cubrir con paño limpio","Avisar y valorar la extensión"],"correct":1,"expl":"Las ampollas son una barrera protectora: no se revientan. Nada de grasas ni remedios caseros; enfriar con agua templada y cubrir con apósito limpio.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"X","tag":"BANCO EXTRA","n":"X114","q":"Ante una hemorragia nasal (epistaxis) en un paciente consciente, se debe:","caso":"","opts":["Echar la cabeza hacia atrás","Sentarle con la cabeza ligeramente hacia delante y comprimir las alas nasales unos 10 minutos","Taponar con algodón seco y tumbarle","Aplicar calor local"],"correct":1,"expl":"Cabeza hacia delante (echarla atrás hace tragar sangre y puede provocar vómito o aspiración), compresión digital de las alas nasales y frío local si procede.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"X","tag":"BANCO EXTRA","n":"X115","q":"Ante una lipotimia (desmayo) inminente en un paciente sentado, lo correcto es:","caso":"","opts":["Sentarlo con la cabeza entre las rodillas o tumbarlo con las piernas elevadas, aflojando la ropa","Darle de beber inmediatamente","Levantarle rápidamente","Aplicar frío en el pecho"],"correct":0,"expl":"Se favorece el riego cerebral: tumbado con piernas elevadas (Trendelenburg) o sentado con la cabeza baja, aflojando la ropa y ventilando la zona.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"X","tag":"BANCO EXTRA","n":"X116","q":"Ante un paciente con dolor torácico opresivo, sudoración y malestar, el TCAE debe:","caso":"","opts":["Llevarlo caminando a urgencias","Dejarlo en reposo absoluto, en posición semisentada, no darle nada por boca y avisar de inmediato","Darle agua y esperar","Aplicar calor en el pecho"],"correct":1,"expl":"Sospecha de síndrome coronario: reposo absoluto (no caminar), semisentado, nada por boca y aviso inmediato.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"X","tag":"BANCO EXTRA","n":"X117","q":"En una crisis convulsiva, cuando cede el movimiento (fase postcrítica), lo indicado es:","caso":"","opts":["Levantar al paciente de inmediato","Colocarlo en posición lateral de seguridad, vigilar la respiración y dejarle descansar","Darle de comer","Aplicarle agua fría"],"correct":1,"expl":"Tras la crisis: lateral de seguridad para proteger la vía aérea, vigilar respiración y nivel de conciencia, ambiente tranquilo y registrar duración y características.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"X","tag":"BANCO EXTRA","n":"X118","q":"Ante una caída presenciada de un paciente que dice encontrarse bien, el TCAE debe:","caso":"","opts":["No hacer nada si camina","Valorar antes de moverlo, avisar a enfermería y registrar la caída aunque no haya lesión aparente","Levantarlo rápidamente","Esperar al día siguiente"],"correct":1,"expl":"Toda caída se comunica y registra como incidente de seguridad, aunque no haya lesión visible: puede haber lesiones tardías y sirve para prevenir futuras caídas.","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"X","tag":"BANCO EXTRA","n":"X119","q":"Ante un paciente con sospecha de ictus (habla trabada, desviación de la boca, pérdida de fuerza en un lado), lo prioritario es:","caso":"","opts":["Darle agua para que se aclare la voz","Avisar de forma urgente anotando la HORA DE INICIO de los síntomas y mantenerlo en reposo, sin nada por boca","Acostarlo y esperar unas horas","Ponerlo a caminar"],"correct":1,"expl":"El ictus es tiempo-dependiente: la hora exacta de inicio determina el tratamiento. Aviso urgente, reposo, cabecera algo elevada y nada por boca (riesgo de disfagia).","tema":"urgencias","bloque":"Urgencias, RCP y primeros auxilios"},{"sim":"X","tag":"BANCO EXTRA","n":"X120","q":"El síndrome confusional agudo (delirium) en el anciano hospitalizado se caracteriza por:","caso":"","opts":["Instauración lenta a lo largo de años","Inicio brusco, curso fluctuante y alteración de la atención, con frecuencia reversible","Ser siempre irreversible","No tener causa identificable"],"correct":1,"expl":"El delirium es agudo, fluctuante y suele tener causa tratable (infección, fármacos, dolor, deshidratación, retención urinaria). La demencia es lenta y progresiva.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"X","tag":"BANCO EXTRA","n":"X121","q":"La escala de Lawton y Brody valora:","caso":"","opts":["Las actividades básicas de la vida diaria","Las actividades instrumentales (usar el teléfono, la compra, el dinero, la medicación)","El riesgo de UPP","El nivel de conciencia"],"correct":1,"expl":"Lawton-Brody = instrumentales. Barthel = básicas. Norton/Braden = UPP. Glasgow = conciencia. Pfeiffer/MEC = cognitivo.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"X","tag":"BANCO EXTRA","n":"X122","q":"La presbiacusia del anciano consiste en:","caso":"","opts":["Pérdida de visión de cerca","Pérdida progresiva de audición, sobre todo de tonos agudos","Pérdida del gusto","Pérdida del olfato"],"correct":1,"expl":"Presbiacusia = hipoacusia asociada a la edad (tonos agudos). Presbicia = dificultad de visión cercana.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"X","tag":"BANCO EXTRA","n":"X123","q":"Para comunicarse con un paciente con déficit auditivo importante, es útil:","caso":"","opts":["Gritar desde la puerta","Situarse de frente, a su altura, con buena luz en la cara, vocalizando y sin taparse la boca","Hablar deprisa para no cansarle","Hablar desde detrás"],"correct":1,"expl":"De frente, a su altura, con la cara iluminada, vocalizando sin exagerar, frases cortas y apoyo gestual o escrito. Gritar distorsiona el sonido.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"X","tag":"BANCO EXTRA","n":"X124","q":"La xerostomía (sequedad de boca), frecuente en el anciano y en el paciente terminal, se maneja con:","caso":"","opts":["Restricción de líquidos","Higiene bucal frecuente, humidificación de la mucosa, pequeños sorbos o gasas humedecidas y saliva artificial si está pautada","Colutorios con alcohol","Retirar la prótesis definitivamente"],"correct":1,"expl":"Higiene bucal frecuente y suave, hidratación de la mucosa y labios; se evitan colutorios con alcohol porque resecan más.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"X","tag":"BANCO EXTRA","n":"X125","q":"En los cuidados paliativos, el control del dolor se basa en:","caso":"","opts":["Administrar analgesia solo cuando el dolor es insoportable","Pautar analgesia de forma regular y anticipatoria, valorando el dolor con escalas y comunicando los cambios","Evitar los opioides por miedo a la adicción","Distraer al paciente"],"correct":1,"expl":"En paliativos la analgesia se pauta a horas fijas para evitar picos de dolor; el miedo infundado a los opioides es una barrera clásica al buen control.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"X","tag":"BANCO EXTRA","n":"X126","q":"Ante la agitación de un paciente con demencia, la primera medida debe ser:","caso":"","opts":["La contención mecánica","Buscar la causa (dolor, retención urinaria, estreñimiento, ruido, sed) y aplicar medidas ambientales y de comunicación","Sedación inmediata","Dejarle solo con la puerta cerrada"],"correct":1,"expl":"La agitación suele tener causa: dolor, globo vesical, impactación fecal, ruido, exceso de estímulos. Las medidas no farmacológicas son de primera línea; la contención es el último recurso y con prescripción.","tema":"geriatria","bloque":"Geriatría, terminal y comunicación"},{"sim":"X","tag":"BANCO EXTRA","n":"X127","q":"En la atención a la familia del paciente que acaba de falle
