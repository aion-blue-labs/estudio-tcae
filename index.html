 1, "expl": "Conservación mínima da documentación clínica: 5 anos desde a alta de cada proceso asistencial."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "7", "q": "Con carácter xeral, a idade a partir da cal o menor pode prestar por si mesmo o consentimento informado (fóra dos supostos exceptuados pola lei) é:", "opts": ["12 anos", "14 anos", "16 anos", "18 anos, sen excepción"], "correct": 2, "expl": "Con carácter xeral, aos 16 anos (ou menor emancipado) o paciente consente por si mesmo, con excepcións legalmente previstas."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "8", "q": "Segundo a Lei 31/1995 de Prevención de Riscos Laborais, o Comité de Seguridade e Saúde constituirase nas empresas ou centros de traballo que conten con:", "opts": ["25 ou máis traballadores", "50 ou máis traballadores", "100 ou máis traballadores", "250 ou máis traballadores"], "correct": 1, "expl": "Comité de Seguridade e Saúde: en empresas ou centros con 50 ou máis traballadores."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "9", "q": "A Lei Orgánica 1/2004 de Medidas de Protección Integral contra a Violencia de Xénero aplícase á violencia exercida sobre a muller:", "opts": ["Por calquera persoa, en calquera ámbito", "Por quen sexa ou fose o seu cónxuxe ou estea ou estivese ligado a ela por relación análoga de afectividade, mesmo sen convivencia", "Só se existe convivencia acreditada", "Só no ámbito laboral"], "correct": 1, "expl": "A LO 1/2004 esixe relación de parella actual ou pasada (cónxuxe ou relación análoga), sen necesidade de convivencia."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "10", "q": "Os datos relativos á saúde, no marco da protección de datos persoais, son:", "opts": ["Datos de tratamento libre se o paciente está ingresado", "Datos accesibles a calquera profesional do centro", "Categorías especiais de datos, con garantías reforzadas de tratamento", "Datos que se poden ceder sempre a familiares directos"], "correct": 2, "expl": "Os datos de saúde son \"categoría especial de datos\": tratamento restrinxido e con garantías reforzadas. O acceso é só para quen participa na asistencia."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "11", "q": "No aseo do paciente encamado, a orde correcta de lavado é:", "opts": ["Comezar polos xenitais e rematar pola cara", "Indiferente, o importante é a auga morna", "Comezar polos ollos e a cara e rematar pola rexión xenital-perineal", "Comezar polas extremidades inferiores"], "correct": 2, "expl": "Lávase do máis limpo ao máis sucio: ollos e cara primeiro, rexión xenital-perineal ao final."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "12", "q": "A frecuencia recomendada dos cambios posturais no paciente encamado con risco de UPP é:", "opts": ["Cada 8 horas", "Cada 2-3 horas", "Cada 6 horas se ten colchón antiescaras", "Unha vez por quenda"], "correct": 1, "expl": "Cambios posturais cada 2-3 horas no encamado. O colchón antiescaras COMPLEMENTA, non substitúe os cambios."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "13", "q": "Sobre a escala de Braden, sinale a INCORRECTA:", "opts": ["Valora 6 subescalas, incluíndo nutrición e fricción/cizalla", "A puntuación total vai de 6 a 23 puntos", "Considérase risco a partir de puntuacións baixas (≤16 no adulto)", "A maior puntuación, maior risco de úlceras por presión"], "correct": 3, "expl": "En Braden é ao revés: a MENOR puntuación, MAIOR risco. As outras tres afirmacións son certas."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "14", "q": "Cal dos seguintes parámetros NON forma parte da escala de Norton?", "opts": ["Estado mental", "Incontinencia", "Estado nutricional", "Mobilidade"], "correct": 2, "expl": "Norton valora: estado físico xeral, estado mental, actividade, mobilidade e incontinencia. A nutrición valóraa Braden, non Norton."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "15", "q": "Unha úlcera por presión que se presenta como flictena (ampola) con perda parcial do espesor da pel clasifícase como categoría:", "opts": ["I", "II", "III", "IV"], "correct": 1, "expl": "Flictena/ampola con perda parcial de espesor = categoría II. (I: eritema non branqueable; III: perda total da pel; IV: exposición de óso/músculo.)"}, {"sim": "6", "tag": "SIMULACRO 6", "n": "16", "q": "En decúbito supino, a zona de MAIOR risco de úlcera por presión é:", "opts": ["Sacro e talóns", "Trocánter e orellas", "Omóplatos e xeonllos", "Isquios e maléolo externo"], "correct": 0, "expl": "En supino, o sacro é a zona de maior incidencia, seguido dos talóns."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "17", "q": "A posición de Sims utilizada para a administración de enemas é:", "opts": ["Decúbito lateral esquerdo coa perna dereita flexionada", "Decúbito lateral dereito coas dúas pernas estiradas", "Decúbito prono con cabeza lateralizada", "Decúbito supino con cabeceira a 45°"], "correct": 0, "expl": "Sims: decúbito lateral ESQUERDO coa perna superior (dereita) flexionada — aproveita a anatomía do colon sigmoide."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "18", "q": "Para unha exploración rectal ou sigmoidoscopia, a posición máis indicada é:", "opts": ["Fowler alta", "Trendelenburg", "Xenupeitoral", "Roser"], "correct": 2, "expl": "Xenupeitoral (xeonllos-peito): exploracións rectais e sigmoidoscopias."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "19", "q": "Sobre mecánica corporal na mobilización de pacientes, sinale a INCORRECTA:", "opts": ["Manter a espalda recta e flexionar os xeonllos", "Cargar o peso o máis preto posible do corpo", "Ampliar a base de sustentación separando os pés", "Xirar o tronco mantendo os pés fixos para gañar impulso"], "correct": 3, "expl": "Nunca xirar o tronco cos pés fixos: hai que pivotar cos pés. As outras tres son principios correctos de mecánica corporal."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "20", "q": "A cama preparada para recibir un paciente que volve do quirófano denomínase:", "opts": ["Cama pechada", "Cama cirúrxica ou de anestesia, coa roupa dobrada en abano lateral", "Cama ocupada", "Cama de somier articulado exclusivamente"], "correct": 1, "expl": "Cama cirúrxica ou de anestesia: roupa superior dobrada en abano cara a un lateral para facilitar a transferencia do paciente."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "21", "q": "A respiración profunda e rápida típica da acidose metabólica (por exemplo, cetoacidose diabética) denomínase:", "opts": ["Cheyne-Stokes", "Biot", "Kussmaul", "Eupnea"], "correct": 2, "expl": "Kussmaul: respiración profunda e rápida da acidose metabólica. Cheyne-Stokes: ciclos crecentes-decrecentes con apneas. Biot: irregular con apneas bruscas."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "22", "q": "O pulso pedio pálpase en:", "opts": ["A fosa poplítea", "O dorso do pé", "Detrás do maléolo interno", "A engurra inguinal"], "correct": 1, "expl": "O pulso pedio pálpase no dorso do pé (arteria pedia dorsal)."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "23", "q": "Unha temperatura axilar de 37,5 °C denomínase:", "opts": ["Febrícula", "Hipertermia grave", "Normotermia", "Hipotermia leve"], "correct": 0, "expl": "37,1-37,9 °C = febrícula. A partir de 38 °C fálase de febre."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "24", "q": "As perdas insensibles diarias dun adulto (respiración e perspiración) son aproximadamente:", "opts": ["100-200 ml", "700-1000 ml", "2000-2500 ml", "3500-4000 ml"], "correct": 1, "expl": "Perdas insensibles (respiración + perspiración cutánea): ~700-1000 ml/día. Cóntanse no balance hídrico como saídas."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "25", "q": "Na recollida de ouriños para urocultivo, sinale a INCORRECTA:", "opts": ["Recóllese o primeiro chorro da micción, que é o máis concentrado", "Faise hixiene xenital previa", "Recóllese a porción media da micción", "Utilízase un envase estéril sen tocar o seu interior"], "correct": 0, "expl": "O primeiro chorro DESPRÉZASE (arrastra flora uretral); recóllese a porción media. As outras tres son correctas."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "26", "q": "Na administración dun enema de limpeza ao adulto, a sonda rectal introdúcese aproximadamente:", "opts": ["2-3 cm", "7-10 cm", "15-20 cm", "25-30 cm"], "correct": 1, "expl": "Sonda rectal no adulto: 7-10 cm, lubricada e sen forzar."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "27", "q": "O efluente máis líquido, continuo e irritante para a pel periestomal corresponde a:", "opts": ["Ileostomía", "Colostomía descendente", "Colostomía sigmoide", "Urostomía continente"], "correct": 0, "expl": "A ileostomía verte contido do intestino delgado: líquido, continuo e rico en encimas — o máis agresivo para a pel periestomal."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "28", "q": "Sobre a alimentación por sonda nasogástrica, sinale a INCORRECTA:", "opts": ["Comprobar a colocación e o residuo gástrico antes da toma", "Administrar co paciente en Fowler (30-45°)", "Lavar a sonda con auga ao rematar a toma", "Deitar o paciente en decúbito supino plano inmediatamente despois da toma"], "correct": 3, "expl": "Tras a toma hai que MANTER a posición incorporada 30-60 minutos para evitar refluxo e broncoaspiración. As outras tres son correctas."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "29", "q": "A dieta indicada nun proceso diarreico agudo é:", "opts": ["Rica en fibra insoluble", "Astrinxente (sen residuos)", "Hiperproteica con lácteos enteiros", "Hiposódica estrita"], "correct": 1, "expl": "Diarreia aguda → dieta astrinxente, pobre en residuos (arroz cocido, mazá asada, plátano maduro...)."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "30", "q": "A OMS recomenda a lactación materna EXCLUSIVA ata os:", "opts": ["2 meses", "4 meses", "6 meses", "12 meses"], "correct": 2, "expl": "OMS: lactación materna exclusiva ata os 6 meses; despois, complementada ata os 2 anos ou máis."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "31", "q": "A vía sublingual caracterízase por:", "opts": ["Absorción moi lenta e efecto retardado", "Absorción rápida evitando o primeiro paso hepático", "Ser de elección para fármacos irritantes gástricos exclusivamente", "Requirir sempre inxestión de auga abundante"], "correct": 1, "expl": "A mucosa sublingual é moi vascularizada: absorción rápida directa á circulación, evitando o primeiro paso hepático (ex.: nitroglicerina)."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "32", "q": "O persoal auxiliar (TCAE) pode colaborar na administración de medicación EXCEPTO pola vía:", "opts": ["Oral", "Rectal", "Tópica", "Parenteral"], "correct": 3, "expl": "O TCAE pode colaborar na medicación oral, rectal e tópica segundo protocolo; a vía PARENTERAL está excluída das súas funcións."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "33", "q": "Sobre a cadea de frío das vacinas, sinale a INCORRECTA:", "opts": ["A temperatura de conservación é de +2 a +8 °C", "Debe rexistrarse a temperatura máxima e mínima do frigorífico", "Unha vacina adsorbida conxelada accidentalmente pode administrarse igual, se se desconxela a modo", "Ante unha rotura da cadea de frío hai que inmobilizar as vacinas e notificar"], "correct": 2, "expl": "Unha vacina adsorbida que se conxelou queda INUTILIZADA (perde potencia e pode formar grumos): non se administra nunca. As outras tres son correctas."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "34", "q": "Cando se precisa administrar unha concentración de osíxeno EXACTA e regulable, o dispositivo de elección é:", "opts": ["Gafas nasais", "Máscara tipo Venturi (Ventimask)", "Máscara simple", "Tenda facial"], "correct": 1, "expl": "A máscara Venturi (efecto Venturi) entrega FiO2 exacta e regulable (24-50%): é a de elección cando se precisa precisión."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "35", "q": "A esterilización por calor seco (estufa Poupinel) a 180 °C require manter o material durante aproximadamente:", "opts": ["5 minutos", "15 minutos", "30 minutos", "3 horas"], "correct": 2, "expl": "Poupinel (calor seco): 180 °C ≈ 30 min (ou 160 °C ≈ 2 h). Compárao co autoclave: 121 °C, 15-20 min."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "36", "q": "O control biolóxico de eficacia do autoclave de vapor realízase con esporas de:", "opts": ["Geobacillus stearothermophilus", "Bacillus atrophaeus", "Clostridium perfringens", "Staphylococcus aureus"], "correct": 0, "expl": "Autoclave de vapor → esporas de Geobacillus stearothermophilus. (Bacillus atrophaeus úsase para óxido de etileno e calor seco — pregunta de nivel alto.)"}, {"sim": "6", "tag": "SIMULACRO 6", "n": "37", "q": "Sobre a esterilización por óxido de etileno, sinale a INCORRECTA:", "opts": ["É un método de elección para material termosensible", "O gas é tóxico e inflamable", "Require un período de aireación posterior", "O material pode utilizarse inmediatamente ao saír do esterilizador"], "correct": 3, "expl": "Tras o óxido de etileno o material precisa AIREACIÓN para eliminar residuos tóxicos do gas antes de usarse. As outras tres son correctas."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "38", "q": "Ante un paciente con meninxite meningocócica, o illamento e a protección respiratoria indicados son:", "opts": ["Aéreo, con máscara FFP3 e cuarto de presión negativa", "Por gotículas, con máscara cirúrxica ao traballar a menos de 1-2 metros", "De contacto, só con bata e luvas", "Protector ou inverso"], "correct": 1, "expl": "A meninxite meningocócica transmítese por GOTÍCULAS: máscara cirúrxica a menos de 1-2 m. O illamento aéreo (FFP2/FFP3, presión negativa) é para TB, xarampón, varicela."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "39", "q": "Na hixiene de mans tras atender un paciente con Clostridioides difficile:", "opts": ["É obrigatorio o lavado con auga e xabón, porque o alcohol non elimina as esporas", "Chega coa solución hidroalcohólica", "Abonda con cambiar de luvas", "Non se precisa medida especial ningunha"], "correct": 0, "expl": "O alcohol NON destrúe as esporas de C. difficile: lavado obrigatorio con auga e xabón (arrastre mecánico) + illamento de contacto."}, {"sim": "6", "tag": "SIMULACRO 6", "n": "40", "q": "Na cadea epidemiolóxica, o elo que segue inmediatamente á porta de sa idos, sueroterapia/medicación IV, alimentación por sonda y agua metabólica (~300 ml)", "Los vómitos y drenajes"], "correct": 2, "expl": "Entradas: ingesta líquida, IV, sonda y agua metabólica (~300 ml). Diuresis, sudor, vómitos y drenajes son salidas."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "24", "q": "Una diuresis de 350 ml en 24 horas en un adulto se denomina:", "opts": ["Oliguria (menos de 500 ml/día)", "Poliuria", "Diuresis normal", "Nicturia"], "correct": 0, "expl": "Oliguria: <500 ml/día. Anuria: <100 ml/día. Normal: ~1500 ml/día."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "25", "q": "Para el sondaje vesical de una mujer, se la coloca en posición:", "opts": ["Sims izquierda", "Ginecológica (decúbito supino con piernas flexionadas y separadas)", "Decúbito prono", "Trendelenburg"], "correct": 1, "expl": "Sondaje femenino: posición ginecológica. (El enema es en Sims izquierda — no confundir.)"}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "27", "q": "La sonda vesical de tipo Foley se caracteriza por:", "opts": ["Tener un balón que se infla para fijarla en la vejiga (sondaje permanente)", "Ser rígida y de un solo uso inmediato", "Usarse solo por vía nasogástrica", "Carecer de luz interior"], "correct": 0, "expl": "Foley: sonda con balón para fijación intravesical, típica del sondaje permanente."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "28", "q": "DIFÍCIL — En la administración de un enema de limpieza, señale la INCORRECTA:", "opts": ["La solución se administra templada (aprox. 37-40 °C)", "El irrigador se sitúa unos 30-50 cm por encima del plano de la cama", "Si aparece dolor intenso, se aumenta la velocidad para acabar antes", "Se pide al paciente que retenga la solución unos minutos antes de evacuar"], "correct": 2, "expl": "Ante dolor o espasmo se DETIENE o enlentece el flujo, nunca se acelera. El resto es correcto."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "29", "q": "La incapacidad de orinar con la vejiga llena y globo vesical palpable se denomina:", "opts": ["Anuria", "Incontinencia por rebosamiento fisiológica", "Polaquiuria", "Retención urinaria"], "correct": 3, "expl": "Retención urinaria: vejiga llena sin poder vaciarla (globo vesical). Anuria = no se produce orina."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "30", "q": "En el cuidado de una colostomía, el TCAE:", "opts": ["Cambia la dieta del paciente por iniciativa propia", "Colabora en la higiene del estoma con agua y jabón neutro, seca sin frotar, observa la piel periestomal y comunica alteraciones", "Aplica antisépticos con alcohol directamente sobre el estoma", "Recorta la bolsa siempre 3 cm más ancha que el estoma"], "correct": 1, "expl": "Higiene suave con agua y jabón, secar sin frotar, vigilar piel periestomal y comunicar. Sin alcohol ni antisépticos agresivos."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "31", "q": "Para recoger orina de 24 horas, la primera micción del día de inicio:", "opts": ["Se desecha, y a partir de ahí se recoge toda la orina hasta la primera del día siguiente incluida", "Se guarda siempre, es la más concentrada", "Se recoge en frasco aparte estéril", "Se congela inmediatamente"], "correct": 0, "expl": "Orina de 24 h: se desecha la primera micción del inicio y se recoge todo hasta la primera del día siguiente incluida."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "32", "q": "La muestra de esputo para estudio microbiológico se recoge preferentemente:", "opts": ["Después de cenar", "Tras enjuague con antiséptico potente", "Por la mañana en ayunas, tras enjuagar la boca con agua, con expectoración profunda (no saliva)", "En cualquier momento, mezclada con saliva"], "correct": 2, "expl": "Esputo: por la mañana, boca enjuagada solo con agua, expectoración profunda. La saliva invalida la muestra."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "33", "q": "DIFÍCIL — Sobre el transporte y conservación de muestras, señale la CORRECTA:", "opts": ["Todas las muestras se congelan por defecto", "Las muestras se etiquetan correctamente, se acompañan del volante y se envían al laboratorio lo antes posible en los contenedores adecuados; el urocultivo que no pueda enviarse de inmediato se refrigera", "El etiquetado es opcional si el celador conoce al paciente", "Los hemocultivos se guardan en la nevera a 4 °C"], "correct": 1, "expl": "Etiquetado + volante + envío rápido en contenedor adecuado; urocultivo demorado → nevera. Los hemocultivos NO se refrigeran."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "34", "q": "Una gasa manchada de sangre de la cura de un paciente sin patología infecciosa de riesgo pertenece, en general, al grupo de residuos:", "opts": ["Grupo IV (citostáticos)", "Grupo I (asimilable a urbano)", "Residuo radiactivo", "Grupo II (sanitario no específico)"], "correct": 3, "expl": "Material de curas con restos biológicos sin riesgo especial = grupo II (sanitario no específico)."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "35", "q": "Los residuos del grupo III (biosanitarios especiales) se recogen en:", "opts": ["Contenedores rígidos o semirrígidos, herméticos, identificados con el pictograma de biorriesgo", "Bolsas de basura convencionales bien cerradas", "Cajas de cartón recicladas", "Cualquier recipiente disponible en la unidad"], "correct": 0, "expl": "Grupo III: contenedor rígido/semirrígido hermético con pictograma de biorriesgo."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "36", "q": "Antes de un hemocultivo, la preparación de la piel del paciente exige:", "opts": ["Nada especial, basta agua", "Frotar con una toalla seca", "Antisepsia rigurosa de la zona de punción para evitar contaminar la muestra", "Aplicar vaselina"], "correct": 2, "expl": "La antisepsia rigurosa de la piel evita que la flora cutánea contamine el hemocultivo (falsos positivos)."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "37", "q": "En un paciente con DISFAGIA a líquidos, es correcto:", "opts": ["Darle agua muy fría a sorbos grandes", "Usar pajitas para facilitar la ingesta", "Alimentarlo tumbado por comodidad", "Usar espesantes y texturas homogéneas, con el paciente incorporado y flexión cervical al tragar"], "correct": 3, "expl": "Disfagia a líquidos: espesantes, texturas homogéneas, paciente incorporado, flexión cervical. Las pajitas y los líquidos finos aumentan el riesgo de aspiración."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "38", "q": "La nutrición PARENTERAL consiste en:", "opts": ["Alimentar por sonda nasogástrica", "Administrar los nutrientes directamente por vía venosa", "Una dieta triturada por boca", "Suplementos orales hiperproteicos"], "correct": 1, "expl": "Parenteral = por vía venosa. Enteral = tubo digestivo (oral o sonda)."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "39", "q": "DIFÍCIL — Antes de administrar una toma por SNG se aspira contenido gástrico. Si el residuo es abundante (según protocolo, p. ej. superior a ~150 ml):", "opts": ["Se pospone la toma y se comunica a la enfermera", "Se administra la toma completa más deprisa", "Se retira la sonda inmediatamente", "Se desecha el residuo y se da la toma doble"], "correct": 0, "expl": "Residuo gástrico abundante = mala tolerancia: posponer y avisar a enfermería. El residuo aspirado se reintroduce en general (no se tira) salvo protocolo contrario."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "40", "q": "La dieta ABSOLUTA significa:", "opts": ["Solo líquidos claros", "Solo alimentos blandos", "Nada por boca (ni alimentos ni líquidos), habitual antes de cirugía o pruebas", "Comer únicamente fruta"], "correct": 2, "expl": "Dieta absoluta: nada por boca. Preoperatorio y ciertas pruebas."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "41", "q": "En la alimentación del lactante con biberón:", "opts": ["Se le deja solo con el biberón apoyado en una almohada", "Se comprueba la temperatura de la leche (gotas en la cara interna de la muñeca) y se le incorpora para tomar y expulsar los gases después", "La leche se da siempre recién sacada de la nevera", "La tetina debe estar siempre medio vacía de leche para que trague aire"], "correct": 1, "expl": "Comprobar temperatura en la muñeca, incorporar al lactante, tetina llena de leche (menos aire) y eructo después."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "42", "q": "En la celiaquía debe eliminarse de la dieta:", "opts": ["La lactosa", "El azúcar", "La sal", "El gluten (trigo, cebada, centeno y derivados)"], "correct": 3, "expl": "Celiaquía = intolerancia al gluten: fuera trigo, cebada, centeno y derivados."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "43", "q": "Los \"cinco correctos\" de la administración de medicación son:", "opts": ["Paciente correcto, fármaco correcto, dosis correcta, vía correcta y hora correcta", "Cama, turno, planta, hospital y fecha", "Médico, enfermera, TCAE, celador y farmacia", "Color, tamaño, sabor, precio y marca"], "correct": 0, "expl": "Los 5 correctos: paciente, fármaco, dosis, vía y hora. (Ampliados: registro, caducidad...)"}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "44", "q": "Un comprimido SUBLINGUAL debe:", "opts": ["Tragarse entero con agua", "Masticarse bien", "Colocarse bajo la lengua hasta su disolución completa, sin tragar ni beber", "Disolverse en zumo de fruta"], "correct": 2, "expl": "Sublingual: bajo la lengua hasta disolverse, sin tragar ni beber, para absorción directa."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "45", "q": "DIFÍCIL — Sobre la seguridad con las fuentes de oxígeno, señale la INCORRECTA:", "opts": ["Prohibido fumar y evitar llamas o chispas cerca", "No lubricar las conexiones con grasas o aceites", "Las balas se mantienen fijadas/aseguradas en posición vertical", "Puede aplicarse vaselina en los labios y fosas nasales del paciente con gafas de O2 para hidratarlos"], "correct": 3, "expl": "La vaselina es un derivado graso: INCOMPATIBLE con oxígeno (riesgo de ignición). Se usan lubricantes acuosos. El resto son normas correctas."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "46", "q": "El humidificador del sistema de oxigenoterapia sirve para:", "opts": ["Aumentar la presión de la bala", "Evitar la sequedad de las mucosas respiratorias, burbujeando el O2 en agua (destilada/estéril)", "Filtrar bacterias del aire ambiente", "Medir la saturación del paciente"], "correct": 1, "expl": "El humidificador burbujea el O2 en agua para no resecar las mucosas."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "47", "q": "Con gafas nasales, el flujo de oxígeno habitual se sitúa entre:", "opts": ["1 y 4-5 litros por minuto", "10 y 15 litros por minuto", "Más de 20 litros por minuto", "0,1 litros por minuto exactos"], "correct": 0, "expl": "Gafas nasales: 1-4/5 L/min. Flujos mayores resecan y no elevan mucho más la FiO2."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "48", "q": "Respecto a la caducidad y conservación de los medicamentos en la unidad:", "opts": ["Un fármaco caducado puede usarse hasta 6 meses después", "Los termolábiles se guardan a temperatura ambiente junto a la ventana", "Se revisan periódicamente las caducidades, se retiran los caducados y los termolábiles se conservan en nevera según ficha", "La caducidad solo importa en los jarabes"], "correct": 2, "expl": "Revisión periódica de caducidades y cadena de frío para termolábiles. Nada caducado se administra."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "49", "q": "La higiene de manos con solución hidroalcohólica requiere friccionar durante aproximadamente:", "opts": ["2-3 segundos", "20-30 segundos, hasta que la piel esté seca", "5 minutos por cara de la mano", "El tiempo es indiferente"], "correct": 1, "expl": "Fricción con hidroalcohólica: 20-30 segundos hasta secado. (Lavado con agua y jabón: 40-60 s.)"}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "50", "q": "Sobre el uso de guantes, señale la CORRECTA:", "opts": ["Con guantes no hace falta lavarse las manos nunca", "Un mismo par sirve para varios pacientes si no se ven sucios", "Los guantes estériles se usan para hacer las camas", "Los guantes NO sustituyen la higiene de manos: se realiza antes de ponerlos y después de quitarlos"], "correct": 3, "expl": "Los guantes complementan, no sustituyen: higiene antes y después, y cambio entre pacientes."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "51", "q": "DIFÍCIL — Antes de salir de una habitación de aislamiento de contacto, la retirada del EPI comienza por:", "opts": ["Retirar los guantes (lo más contaminado), después la bata, higiene de manos, y la protección ocular/mascarilla según protocolo", "Quitarse primero la mascarilla dentro de la habitación", "Salir al pasillo con todo puesto y quitárselo en el control", "Retirar la bata por encima de la cabeza con los guantes puestos y guardarla para el turno siguiente"], "correct": 0, "expl": "Primero lo más contaminado: guantes → bata → higiene de manos (→ ocular/mascarilla según protocolo). Todo antes de salir."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "52", "q": "El material estéril empaquetado se considera NO utilizable cuando:", "opts": ["Lleva menos de 24 horas almacenado", "El control químico externo ha virado de color", "El envase está húmedo, perforado, abierto o su fecha de caducidad vencida", "Ha sido esterilizado en autoclave"], "correct": 2, "expl": "Húmedo, roto, abierto o caducado = NO estéril. El viraje del control químico externo indica que PASÓ por el ciclo (eso es lo esperado)."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "53", "q": "El aislamiento aéreo (tuberculosis pulmonar bacilífera) requiere idealmente:", "opts": ["Solo bata y calzas", "Habitación individual con presión negativa, puerta cerrada y mascarilla de alta eficacia (FFP2/FFP3) para el personal", "Mascarilla quirúrgica simple para el personal y ventana abierta", "Ninguna medida si el paciente toma antibióticos"], "correct": 1, "expl": "Aéreo: habitación individual con presión negativa, puerta cerrada, FFP2/FFP3 para el personal; mascarilla quirúrgica al paciente si sale."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "54", "q": "La infección CRUZADA es la que se transmite:", "opts": ["Del propio paciente a sí mismo (endógena)", "Solo por el agua de la red", "Exclusivamente por vía aérea exterior", "De un paciente a otro, frecuentemente a través de las manos del personal o material contaminado"], "correct": 3, "expl": "Cruzada: de paciente a paciente, típicamente por manos del personal o material — por eso la higiene de manos es LA medida estrella."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "56", "q": "Ante una quemadura química en la piel, la actuación inicial correcta es:", "opts": ["Retirar la ropa impregnada y lavar con agua abundante durante un tiempo prolongado", "Aplicar pomada grasa inmediatamente", "Cubrir con hielo directo", "Reventar las ampollas para que drenen"], "correct": 0, "expl": "Química: retirar ropa impregnada y arrastre con agua abundante y prolongada. Nunca pomadas ni hielo directo de inicio."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "57", "q": "En el paciente TERMINAL, los cuidados van dirigidos principalmente a:", "opts": ["Curar la enfermedad a toda costa", "El confort y el alivio de síntomas (paliativos), el apoyo emocional y el acompañamiento del paciente y su familia", "Restringir todas las visitas", "Suspender la higiene para no molestar"], "correct": 1, "expl": "Terminal = paliativo: confort, síntomas, apoyo emocional, familia. La higiene se mantiene (es confort)."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "58", "q": "DIFÍCIL — Los cuidados post mortem se inician:", "opts": ["En cuanto la familia lo pida, aunque no haya médico", "A las 12 horas exactas del fallecimiento", "Antes de avisar a nadie, para adelantar trabajo", "Tras la certificación del fallecimiento por el médico, y antes de que se instaure la rigidez cadavérica (que aparece en torno a las 2-4 horas)"], "correct": 3, "expl": "Tras certificar el médico la muerte, y pronto: la rigidez (2-4 h) dificulta el aseo y la colocación del cuerpo."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "59", "q": "Son cambios NORMALES del envejecimiento (no patológicos):", "opts": ["Presbicia, presbiacusia, disminución de masa muscular y piel más fina y seca", "La demencia y la desorientación", "La incontinencia total obligatoria", "La pérdida completa de memoria reciente y remota"], "correct": 0, "expl": "Presbicia, presbiacusia, sarcopenia y piel fina son envejecimiento normal. La demencia NUNCA es \"normal por la edad\"."}, {"sim": "C", "tag": "TEST CUIDADOS", "n": "60", "q": "La aplicación local de CALOR está CONTRAINDICADA en:", "opts": ["Las contracturas musculares crónicas", "Los dolores menstruales", "El dolor abdominal agudo sin diagnóstico (sospecha de apendicitis) y las hemorragias", "La rigidez articular previa a la movilización"], "correct": 2, "expl": "Calor contraindicado en abdomen agudo (enmascara y agrava, p. ej. apendicitis) y en hemorragias (vasodilata). El frío es el indicado en hemorragia y trauma agudo."}, {"sim": "L", "tag": "TEST LEGISLACIÓN", "n": "1", "q": "El artículo 43 CE (protección de la salud) se encuentra ubicado en:", "opts": ["El título preliminar", "La sección 1ª del capítulo II del título I (derechos fundamentales)", "El capítulo III del título I (principios rectores de la política social y económica)", "El título VIII, junto a la organización territorial"], "correct": 2, "expl": "El art. 43 está en el capítulo III del título I: principios rectores. NO es derecho fundamental."}, {"sim": "L", "tag": "TEST LEGISLACIÓN", "n": "2", "q": "La defensa de los consumidores y usuarios está garantizada en el artículo:", "opts": ["43 CE", "51 CE", "41 CE", "50 CE"], "correct": 1, "expl": "Art. 51 CE: defensa de consumidores y usuarios. Pareja clásica de examen con el 43 (salud)."}, {"sim": "L", "tag": "TEST LEGISLACIÓN", "n": "3", "q": "Según el artículo 43.2 CE, compete a los poderes públicos organizar y tutelar la salud pública a través de:", "opts": ["La sanidad exterior y la legislación farmacéutica", "Un sistema único y centralizado de hospitales", "La colegiación obligatoria de los profesionales", "Medidas preventivas y de las prestaciones y servicios necesarios"], "correct": 3, "expl": "Literal del 43.2: \"medidas preventivas y de las prestaciones y servicios necesarios\"."}, {"sim": "L", "tag": "TEST LEGISLACIÓN", "n": "4", "q": "En materia de sanidad, el artículo 149.1.16ª CE reserva como competencia EXCLUSIVA del Estado:", "opts": ["Sanidad exterior, bases y coordinación general de la sanidad y legislación sobre productos farmacéuticos", "La gestión de todos los hospitales públicos", "La sanidad e higiene, que no puede asumirse por las CCAA", "La ordenación de las profesiones sanitarias autonómicas"], "correct": 0, "expl": "149.1.16ª: sanidad exterior, bases y coordinación general de la sanidad, legislación sobre productos farmacéuticos. Las CCAA pueden asumir sanidad e higiene (148.1.21ª)."}, {"sim": "L", "tag": "TEST LEGISLACIÓN", "n": "5", "q": "El Estado se organiza territorialmente (art. 137 CE) en:", "opts": ["Municipios, comarcas y regiones", "Municipios, provincias y las Comunidades Autónomas que se constituyan", "Provincias, islas y territorios históricos", "Municipios, áreas metropolitanas y CCAA"], "correct": 1, "expl": "Art. 137: municipios, provincias y las CCAA que se constituyan."}, {"sim": "L", "tag": "TEST LEGISLACIÓN", "n": "6", "q": "DIFÍCIL — El derecho a la protección de la salud, por su ubicación constitucional:", "opts": ["Puede invocarse directamente en recurso de amparo ante el Tribunal Constitucional", "Es un derecho fundamental de aplicación directa sin necesidad de desarrollo legal", "Solo podrá ser alegado ante la jurisdicción ordinaria de acuerdo con lo que dispongan las leyes que lo desarrollen (art. 53.3 CE)", "Carece de cualquier valor jurídico por ser una mera declaración"], "correct": 2, "expl": "Art. 53.3 CE: los principios rectores solo son alegables ante la jurisdicción ordinaria conforme a las leyes que los desarrollen. Sin amparo constitucional."}, {"sim": "L", "tag": "TEST LEGISLACIÓN", "n": "7", "q": "El Sistema Nacional de Salud s torales"], "correct": 2, "expl": "Indirecta = criterio aparentemente neutro con efecto desventajoso para un sexo, sin justificación objetiva y razonable."}, {"sim": "L", "tag": "TEST LEGISLACIÓN", "n": "50", "q": "El acoso sexual se define (LO 3/2007) como:", "opts": ["Cualquier comportamiento, verbal o físico, de naturaleza sexual que tenga el propósito o produzca el efecto de atentar contra la dignidad, en particular creando un entorno intimidatorio, degradante u ofensivo", "Solo el contacto físico no consentido con violencia", "Cualquier crítica laboral de un superior a una trabajadora", "Exclusivamente conductas delictivas ya condenadas"], "correct": 0, "expl": "Definición literal de la LO 3/2007 (art. 7). El acoso \"por razón de sexo\" es el ligado al sexo de la persona sin naturaleza sexual — distínguelos."}, {"sim": "L", "tag": "TEST LEGISLACIÓN", "n": "51", "q": "DIFÍCIL — La LO 1/2004 se aplica a la violencia ejercida sobre la mujer:", "opts": ["Por cualquier persona en cualquier contexto", "Solo si hay denuncia previa", "Solo dentro del domicilio conyugal", "Por quien sea o haya sido su cónyuge o esté o haya estado ligado a ella por relación análoga de afectividad, aun sin convivencia"], "correct": 3, "expl": "Ámbito de la LO 1/2004: pareja o expareja, con o sin convivencia. No requiere denuncia previa para la actuación sanitaria."}, {"sim": "L", "tag": "TEST LEGISLACIÓN", "n": "52", "q": "Un profesional sanitario que atiende lesiones compatibles con violencia de género:", "opts": ["Guarda silencio por el secreto profesional, en todo caso", "Debe cumplimentar el parte de lesiones y remitirlo al juzgado, además de activar el protocolo sanitario", "Solo actúa si la paciente firma una autorización", "Llama primero al agresor para contrastar"], "correct": 1, "expl": "El parte de lesiones al juzgado es obligación legal del profesional; el secreto profesional no lo exime. Además se activa el protocolo."}, {"sim": "L", "tag": "TEST LEGISLACIÓN", "n": "53", "q": "La LO 3/2007 entiende por composición equilibrada de mujeres y hombres:", "opts": ["Que ningún sexo supere el 60% ni baje del 40%", "Un 50% exacto para cada sexo", "Un mínimo del 25% de mujeres", "No define porcentajes"], "correct": 0, "expl": "Composición equilibrada: cada sexo entre el 40% y el 60%."}, {"sim": "L", "tag": "TEST LEGISLACIÓN", "n": "54", "q": "En el ámbito sanitario, ante sospecha de violencia de género la actuación del TCAE incluye:", "opts": ["Interrogar a la paciente delante de su acompañante", "Emitir el diagnóstico y el parte judicial por sí mismo", "Comunicar la sospecha al personal sanitario responsable, facilitar un entorno seguro y de intimidad, y registrar/colaborar según protocolo", "No tiene ningún papel"], "correct": 2, "expl": "El TCAE observa, comunica al responsable sanitario, protege la intimidad y colabora con el protocolo; no diagnostica ni emite el parte."}, {"sim": "L", "tag": "TEST LEGISLACIÓN", "n": "55", "q": "El TCAE desarrolla sus funciones:", "opts": ["Con plena autonomía clínica", "Bajo la dependencia y supervisión del personal de enfermería (delegación enfermera)", "A las órdenes directas y exclusivas del médico de guardia", "Según su propio criterio si tiene experiencia"], "correct": 1, "expl": "Dependencia funcional del personal de enfermería: trabaja por delegación y bajo su supervisión."}, {"sim": "L", "tag": "TEST LEGISLACIÓN", "n": "56", "q": "Entre las funciones PROPIAS del TCAE se encuentra:", "opts": ["Prescribir dietas terapéuticas", "Realizar sondajes vesicales", "Interpretar radiografías", "El aseo e higiene del paciente, hacer las camas, dar la comida a quien no pueda por sí mismo y la recogida de datos termométricos"], "correct": 3, "expl": "Funciones clásicas del estatuto de 1973: aseo, camas, alimentación de quien no puede solo, recogida de datos termométricos, traslados, orden del material."}, {"sim": "L", "tag": "TEST LEGISLACIÓN", "n": "57", "q": "Al TCAE le está expresamente PROHIBIDO:", "opts": ["Administrar medicación por vía parenteral, así como realizar punciones y aplicar tratamientos específicos", "Acompañar al paciente en traslados internos", "Colaborar en la administración de medicación por vía oral", "Comunicar incidencias a enfermería"], "correct": 0, "expl": "Prohibido expresamente: medicación por vía parenteral, punciones y tratamientos específicos de enfermería."}, {"sim": "L", "tag": "TEST LEGISLACIÓN", "n": "58", "q": "DIFÍCIL — Una enfermera pide a la TCAE que administre una medicación subcutánea \"porque hay mucho trabajo\". La TCAE debe:", "opts": ["Hacerlo, porque la orden viene de su superior funcional", "Hacerlo solo si nadie la ve", "Negarse con respeto: la vía parenteral excede sus competencias y la delegación no puede amparar funciones legalmente excluidas; comunicarlo si es preciso", "Hacerlo y registrarlo con el nombre de la enfermera"], "correct": 2, "expl": "La delegación no ampara funciones excluidas por norma. Negarse educadamente y comunicarlo protege al paciente y a la propia TCAE."}, {"sim": "L", "tag": "TEST LEGISLACIÓN", "n": "59", "q": "En la administración de medicación, el TCAE SÍ puede, por protocolo y bajo supervisión:", "opts": ["Ajustar dosis de insulina", "Colaborar en la administración por vía oral, rectal y tópica", "Administrar medicación intravenosa lenta", "Cambiar la prescripción si el paciente lo pide"], "correct": 1, "expl": "Sí puede colaborar en vía oral, rectal y tópica, por protocolo y bajo supervisión de enfermería."}, {"sim": "L", "tag": "TEST LEGISLACIÓN", "n": "60", "q": "DIFÍCIL — Sobre los límites de actuación, señale la CORRECTA:", "opts": ["Realizar tareas fuera de sus funciones puede generar responsabilidad disciplinaria e incluso civil o penal por intrusismo o imprudencia, aunque exista orden verbal de un superior", "Si la orden es verbal, la responsabilidad es siempre solo del que la dio", "La costumbre del servicio legaliza cualquier práctica", "Los límites solo aplican en el turno de mañana"], "correct": 0, "expl": "Actuar fuera de competencias genera responsabilidad propia (disciplinaria, civil o penal), aunque hubiera orden verbal: la orden no cubre lo ilegal."}];
const $ = s => document.querySelector(s);
const screen = $('#screen');
let deck=[], idx=0, score=0, streak=0, best=0, mode='normal';

function hid(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return 'q'+(h>>>0);}
DATA.forEach(q=>q._id=hid(q.q));
const BY_ID={}; DATA.forEach(q=>BY_ID[q._id]=q);

const KEY='tcae_progress_v2';
function today(){return new Date().toISOString().slice(0,10);}
function loadP(){try{return JSON.parse(localStorage.getItem(KEY))||null;}catch(e){return null;}}
function blankP(){return {totalAns:0,totalCorr:0,fails:{},correct:{},seen:{},lastDay:null,streak:0,best:0};}
let P=loadP()||blankP();
function saveP(){try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}}
function touchDay(){
  const t=today(); if(P.lastDay===t)return;
  if(P.lastDay){const d=Math.round((new Date(t)-new Date(P.lastDay))/86400000);P.streak=d===1?(P.streak||0)+1:1;}
  else P.streak=1;
  P.lastDay=t; saveP();
}
const failCount=()=>Object.keys(P.fails).length;
const masteredCount=()=>Object.keys(P.correct).filter(id=>!P.fails[id]).length;
const seenCount=()=>Object.keys(P.seen).length;
const acc=()=>P.totalAns?Math.round(P.totalCorr/P.totalAns*100):0;

function ring(pct,label){
  const r=46, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(100,pct))/100);
  return '<div class="ring"><svg viewBox="0 0 110 110"><circle class="track" cx="55" cy="55" r="'+r+'"/>'+
    '<circle class="val" cx="55" cy="55" r="'+r+'" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>'+
    '<div class="num"><b>'+pct+'%</b><span>'+label+'</span></div></div>';
}
function dateES(){
  const d=new Date(); const dias=['dom','lun','mar','mié','jue','vie','sáb'];
  const meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return dias[d.getDay()]+' '+d.getDate()+' '+meses[d.getMonth()];
}

function home(){
  touchDay();
  $('#hdrRight').textContent=dateES();
  const total=DATA.length, nf=failCount(), nm=masteredCount(), ns=seenCount();
  const nu=Math.max(0,total-ns);
  const pm=nm/total*100, pp=nf/total*100, pu=nu/total*100;
  const msg = P.totalAns===0 ? 'Empieza con una ronda corta. Cada pregunta que falles la guardo para repasar.'
            : acc()>=80 ? 'Vas muy bien. Mantén el ritmo y repasa tus fallos.'
            : acc()>=60 ? 'Buen progreso. Los repasos son donde más se aprende.'
            : 'Sin prisa. Cada fallo que repasas es un acierto en el examen.';
  screen.innerHTML=
    '<div class="card"><h1>Hola, Cristina</h1><p class="sub">Tu preparación de hoy</p>'+
      '<div class="hero" style="margin-top:14px">'+ring(acc(),'aciertos')+
        '<div class="txt"><b>'+(P.totalAns?P.totalCorr+' de '+P.totalAns+' respondidas':'Sin datos todavía')+'</b><p>'+msg+'</p></div>'+
      '</div></div>'+
    '<div class="tiles">'+
      '<div class="tile amb"><b>'+(P.streak||0)+'</b><span>días seguidos</span></div>'+
      '<div class="tile teal"><b>'+nm+'</b><span>dominadas</span></div>'+
      '<div class="tile"><b>'+nf+'</b><span>por repasar</span></div>'+
    '</div>'+
    '<div class="card"><h2>Cobertura del temario</h2>'+
      '<div class="cov"><i class="m" style="width:'+pm+'%"></i><i class="p" style="width:'+pp+'%"></i><i class="u" style="width:'+pu+'%"></i></div>'+
      '<div class="leg"><span><i style="background:var(--teal)"></i>Dominadas '+nm+'</span><span><i style="background:var(--amber)"></i>Por repasar '+nf+'</span><span><i style="background:var(--neutral)"></i>Sin ver '+nu+'</span></div>'+
      '<button class="btn amber" '+(nf?'':'disabled')+' onclick="startFails()">Repasar mis fallos'+(nf?' · '+nf:'')+'</button>'+
    '</div>'+
    '<div class="card"><h2>Nueva sesión</h2>'+
      '<div class="chips">'+
        '<div class="chip" onclick="start(10)"><b>10</b><span>rápida</span></div>'+
        '<div class="chip" onclick="start(15)"><b>15</b><span>normal</span></div>'+
        '<div class="chip" onclick="start(25)"><b>25</b><span>larga</span></div>'+
        '<div class="chip" onclick="start('+total+')"><b>'+total+'</b><span>completa</span></div>'+
      '</div>'+
      (P.totalAns?'<button class="btn ghost" onclick="resetP()">Reiniciar progreso</button>':'')+
    '</div>';
}
function resetP(){ if(confirm('¿Borrar todo tu progreso y empezar de cero?')){P=blankP();saveP();home();} }

function buildDeck(list){
  return list.map(function(q){
    var opts=q.opts.map(function(t,i){return {t:t,ok:i===q.correct};});
    for(var i=opts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=opts[i];opts[i]=opts[j];opts[j]=tmp;}
    return {_id:q._id,q:q.q,expl:q.expl,sim:q.sim,opts:opts,correct:opts.findIndex(function(o){return o.ok;})};
  });
}
function shuffled(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function start(n){ mode='normal'; deck=buildDeck(shuffled(DATA).slice(0,n)); begin(); }
function startFails(){ mode='fails'; var qs=Object.keys(P.fails).map(function(id){return BY_ID[id];}).filter(Boolean); deck=buildDeck(shuffled(qs)); begin(); }
function begin(){ idx=0;score=0;streak=0;best=0; render(); }

function render(){
  var q=deck[idx];
  $('#hdrRight').textContent=(mode==='fails'?'Repaso':'Sesión');
  var h='<div class="qbar"><div class="track"><i style="width:'+(idx/deck.length*100)+'%"></i></div>'+
        '<div class="n">'+(idx+1)+'/'+deck.length+'</div>'+(streak>=2?'<div class="fire">🔥'+streak+'</div>':'')+'</div>'+
    '<div class="card"><span class="pill'+(mode==='fails'?' rev':'')+'">'+(mode==='fails'?'REPASO DE FALLOS':(q.tag||('SIMULACRO '+q.sim)))+'</span>'+
    '<p class="q">'+q.q+'</p><div id="opts">';
  q.opts.forEach(function(o,i){h+='<button class="opt" onclick="answer('+i+')"><span class="k">'+'ABCD'[i]+'</span><span>'+o.t+'</span></button>';});
  h+='</div><div class="feed" id="feed"></div>'+
     '<button class="btn" id="next" style="display:none" onclick="next()">Siguiente</button></div>';
  screen.innerHTML=h;
  window.scrollTo(0,0);
}
function answer(i){
  var q=deck[idx];
  var btns=document.querySelectorAll('.opt');
  btns.forEach(function(b){b.disabled=true;});
  var ok=i===q.correct;
  btns[q.correct].classList.add('correct');
  if(!ok) btns[i].classList.add('wrong');
  P.totalAns++; P.seen[q._id]=true;
  if(ok){ P.totalCorr++; P.correct[q._id]=true; delete P.fails[q._id]; } else { P.fails[q._id]=true; }
  saveP();
  var feed=$('#feed');
  if(ok){
    score++; streak++; best=Math.max(best,streak);
    var c=['Correcto','Muy bien','Exacto','Perfecto'];
    feed.className='feed ok show';
    feed.innerHTML='<span class="h ok">✓ '+c[Math.floor(Math.random()*c.length)]+(streak>=3?' · racha de '+streak:'')+(mode==='fails'?' · sale de tus fallos':'')+'</span>'+(q.expl||'');
  }else{
    streak=0;
    feed.className='feed no show';
    feed.innerHTML='<span class="h no">✕ La correcta era la '+'ABCD'[q.correct]+'</span>'+(q.expl||'Repásalo con calma; se aprende fallando.');
  }
  var nx=$('#next'); nx.style.display='flex';
  nx.textContent=idx+1<deck.length?'Siguiente':'Ver resultado';
  nx.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function next(){ idx++; if(idx>=deck.length) return results(); render(); }

function results(){
  var pct=Math.round(score/deck.length*100);
  P.best=Math.max(P.best||0,pct); saveP();
  $('#hdrRight').textContent='Resultado';
  var title,note;
  if(pct>=90){title='Excelente';note='Nivel de aprobado con margen. Sigue así.';}
  else if(pct>=70){title='Muy bien';note='Vas por buen camino. Repasa los fallos y sube.';}
  else if(pct>=50){title='Aprobado';note='Base sólida. Los repasos te llevarán más arriba.';}
  else{title='Sigue practicando';note='Cada fallo repasado es un acierto ganado para el examen.';}
  var nf=failCount();
  screen.innerHTML=
    '<div class="card res">'+ring(pct,'esta sesión')+
      '<h1>'+title+'</h1><p class="sub">'+score+' de '+deck.length+' correctas · mejor racha '+best+'</p>'+
      '<p class="sub" style="margin-top:8px;color:var(--ink2)">'+note+'</p>'+
      (nf?'<button class="btn amber" onclick="startFails()">Repasar mis fallos · '+nf+'</button>':'')+
      '<button class="btn" onclick="home()">Volver al inicio</button>'+
    '</div>';
  window.scrollTo(0,0);
}
home();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function(e){ console.warn('SW fail', e); });
  });
}
</script>
